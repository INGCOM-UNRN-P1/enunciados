id: heap-prio-20
titulo: 'Algoritmo de Huffman: Cola de Prioridad para Nodos de Frecuencia'
tema: colas_prioridad_heaps
bloom: 3
minutos_estimados: 25
pistas:
- Un nodo en el índice i tiene hijos en 2*i + 1 y 2*i + 2.
- El padre de un nodo i está en (i - 1) / 2.
tags:
- heap
- min_heap
- max_heap
- cola_prioridad
- estructuras_datos
verificado: true
funciones:
- nombre: ejecutar_heap_prio_20
  retorno: int
  parametros: int val
  descripcion: 'Procesa el flujo principal de Algoritmo de Huffman: Cola de Prioridad
    para Nodos de Frecuencia'
tests_funciones:
- nombre: test_ejecutar_heap_prio_20_positivo
  funcion: ejecutar_heap_prio_20
  codigo: 'int res = ejecutar_heap_prio_20(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_heap_prio_20_cero
  funcion: ejecutar_heap_prio_20
  codigo: 'int res = ejecutar_heap_prio_20(0);

    assert(res == 0);'
