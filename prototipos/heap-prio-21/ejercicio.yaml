    para Distancias Mínimas'
tests_funciones:
- nombre: test_ejecutar_heap_prio_21_positivo
  funcion: ejecutar_heap_prio_21
  codigo: 'int res = ejecutar_heap_prio_21(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_heap_prio_21_cero
