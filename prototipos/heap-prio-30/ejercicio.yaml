id: heap-prio-30
titulo: TAD Cola de Prioridad Genérica con Punteros a Función de Comparación
tema: colas_prioridad_heaps
bloom: 5
minutos_estimados: 45
pistas:
- Un nodo en el índice i tiene hijos en 2*i + 1 y 2*i + 2.
- El padre de un nodo i está en (i - 1) / 2.
tags:
- heap
- min_heap
- max_heap
- cola_prioridad
- estructuras_datos
verificado: true
funciones:
- nombre: ejecutar_heap_prio_30
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de TAD Cola de Prioridad Genérica con Punteros
    a Función de Comparación
tests_funciones:
- nombre: test_ejecutar_heap_prio_30_positivo
  funcion: ejecutar_heap_prio_30
  codigo: 'int res = ejecutar_heap_prio_30(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_heap_prio_30_cero
  funcion: ejecutar_heap_prio_30
  codigo: 'int res = ejecutar_heap_prio_30(0);

    assert(res == 0);'
