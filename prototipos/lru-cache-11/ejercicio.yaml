id: lru-cache-11
titulo: Caché FIFO First-In First-Out de Reemplazo Secuencial
tema: lru_cache_memorizacion
bloom: 2
minutos_estimados: 15
pistas:
- El elemento más recientemente usado se mueve al frente o final.
- Al exceder la capacidad, desinstalá el elemento menos consultado.
tags:
- lru
- cache
- memorizacion
- tablas_hash
- estructuras_datos
verificado: true
funciones:
- nombre: ejecutar_lru_cache_11
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Caché FIFO First-In First-Out de Reemplazo
    Secuencial
tests_funciones:
- nombre: test_ejecutar_lru_cache_11_positivo
  funcion: ejecutar_lru_cache_11
  codigo: 'int res = ejecutar_lru_cache_11(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_lru_cache_11_cero
  funcion: ejecutar_lru_cache_11
  codigo: 'int res = ejecutar_lru_cache_11(0);

    assert(res == 0);'
