id: skip-list-08
titulo: Cálculo de la Altura Máxima y Promedio de Nodos en Skip List
tema: skip_lists_probabilisticas
bloom: 2
minutos_estimados: 15
pistas:
- Cada nodo almacena un arreglo de punteros adelante de tamaño proporcional a su altura
  generada.
- La búsqueda avanza en el nivel superior y desciende cuando el valor excede la clave
  buscada.
tags:
- skip_list
- listas_saltos
- probabilistica
- busqueda
- estructuras_datos
verificado: true
funciones:
- nombre: ejecutar_skip_list_08
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Cálculo de la Altura Máxima y Promedio
    de Nodos en Skip List
tests_funciones:
- nombre: test_ejecutar_skip_list_08_positivo
  funcion: ejecutar_skip_list_08
  codigo: 'int res = ejecutar_skip_list_08(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_skip_list_08_cero
  funcion: ejecutar_skip_list_08
  codigo: 'int res = ejecutar_skip_list_08(0);

    assert(res == 0);'
