- rotaciones
- factor_balance
- estructuras_datos
verificado: true
funciones:
- nombre: ejecutar_avl_tree_01
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Cálculo de Altura y Factor de Balance
    en Nodos de Árbol
tests_funciones:
- nombre: test_ejecutar_avl_tree_01_positivo
  funcion: ejecutar_avl_tree_01
  codigo: 'int res = ejecutar_avl_tree_01(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_avl_tree_01_cero
  funcion: ejecutar_avl_tree_01
  codigo: 'int res = ejecutar_avl_tree_01(0);

    assert(res == 0);'
