# Temario del banco: lo lee `deckard export myst` para el sitio (títulos, unidades, grafo y rutas).
# `requiere` son los prerrequisitos de cada tema; los ejercicios los declaran con `dep:<tema>`.
# `apunte` son las páginas del apunte (rutas en su repositorio) que explican el tema: el sitio enlaza
# a ellas y `deckard export apunte` escribe en ellas los ejercicios del tema (trazabilidad, Ola 34).

# URL publicadas de los dos sitios, para los enlaces entre ellos.
sitios:
  apunte: https://ingcom-unrn-p1.github.io
  enunciados: https://ingcom-unrn-p1.github.io/enunciados

