id: hilos-conc-09
titulo: Detección de Condiciones de Carrera con Datos Atómicos
tema: concurrencia_hilos
bloom: 2
minutos_estimados: 15
pistas:
- Identificá las variables compartidas y las variables locales a cada hilo.
- Evitá deadlocks garantizando orden de adquisición de bloqueos.
tags:
- concurrencia
- hilos
- mutex
- sincronizacion
- dep:memoria
- dep:funciones
- c11
- inicial
verificado: true
funciones:
- nombre: ejecutar_hilos_conc_09
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Detección de Condiciones de Carrera con
    Datos Atómicos
tests_funciones:
- nombre: test_ejecutar_hilos_conc_09_positivo
  funcion: ejecutar_hilos_conc_09
  codigo: 'int res = ejecutar_hilos_conc_09(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_hilos_conc_09_cero
  funcion: ejecutar_hilos_conc_09
  codigo: 'int res = ejecutar_hilos_conc_09(0);

    assert(res == 0);'
- nombre: test_ejecutar_hilos_conc_09_negativo
  funcion: ejecutar_hilos_conc_09
  codigo: 'int res = ejecutar_hilos_conc_09(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_hilos_conc_09_valor_limite
  funcion: ejecutar_hilos_conc_09
  codigo: 'int res = ejecutar_hilos_conc_09(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_hilos_conc_09_valor_unitario
  funcion: ejecutar_hilos_conc_09
  codigo: 'int res = ejecutar_hilos_conc_09(1);

    assert(res >= 0 || res == 2);'
publicar: true
unidad: 5
modulo: Ingeniería de Software y Calidad en C
