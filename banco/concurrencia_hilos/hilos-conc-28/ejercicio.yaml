id: hilos-conc-28
titulo: Pipeline Multietapa Concurrente con Canales de Paso de Mensajes
tema: concurrencia_hilos
bloom: 5
minutos_estimados: 45
pistas:
- Identificá las variables compartidas y las variables locales a cada hilo.
- Evitá deadlocks garantizando orden de adquisición de bloqueos.
tags:
- concurrencia
- hilos
- mutex
- sincronizacion
- dep:memoria
- dep:funciones
- c11
- avanzada
verificado: true
funciones:
- nombre: ejecutar_hilos_conc_28
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Pipeline Multietapa Concurrente con Canales
    de Paso de Mensajes
tests_funciones:
- nombre: test_ejecutar_hilos_conc_28_positivo
  funcion: ejecutar_hilos_conc_28
  codigo: 'int res = ejecutar_hilos_conc_28(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_hilos_conc_28_cero
  funcion: ejecutar_hilos_conc_28
  codigo: 'int res = ejecutar_hilos_conc_28(0);

    assert(res == 0);'
- nombre: test_ejecutar_hilos_conc_28_negativo
  funcion: ejecutar_hilos_conc_28
  codigo: 'int res = ejecutar_hilos_conc_28(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_hilos_conc_28_valor_limite
  funcion: ejecutar_hilos_conc_28
  codigo: 'int res = ejecutar_hilos_conc_28(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_hilos_conc_28_valor_unitario
  funcion: ejecutar_hilos_conc_28
  codigo: 'int res = ejecutar_hilos_conc_28(1);

    assert(res >= 0 || res == 2);'
publicar: true
unidad: 5
