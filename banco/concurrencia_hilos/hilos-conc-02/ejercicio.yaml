id: hilos-conc-02
titulo: Creación y Espera de Múltiples Hilos con Join
tema: concurrencia_hilos
bloom: 1
minutos_estimados: 10
pistas:
- Identificá las variables compartidas y las variables locales a cada hilo.
- Evitá deadlocks garantizando orden de adquisición de bloqueos.
tags:
- concurrencia
- hilos
- mutex
- sincronizacion
- dep:memoria
- dep:funciones
- c11
- inicial
verificado: true
funciones:
- nombre: ejecutar_hilos_conc_02
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Creación y Espera de Múltiples Hilos
    con Join
tests_funciones:
- nombre: test_ejecutar_hilos_conc_02_positivo
  funcion: ejecutar_hilos_conc_02
  codigo: 'int res = ejecutar_hilos_conc_02(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_hilos_conc_02_cero
  funcion: ejecutar_hilos_conc_02
  codigo: 'int res = ejecutar_hilos_conc_02(0);

    assert(res == 0);'
- nombre: test_ejecutar_hilos_conc_02_negativo
  funcion: ejecutar_hilos_conc_02
  codigo: 'int res = ejecutar_hilos_conc_02(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_hilos_conc_02_valor_limite
  funcion: ejecutar_hilos_conc_02
  codigo: 'int res = ejecutar_hilos_conc_02(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_hilos_conc_02_valor_unitario
  funcion: ejecutar_hilos_conc_02
  codigo: 'int res = ejecutar_hilos_conc_02(1);

    assert(res >= 0 || res == 2);'
publicar: true
unidad: 5
modulo: Ingeniería de Software y Calidad en C
dificultad: inicial
tipo: practica_guiada
prerrequisitos:
- memoria
- funciones
subtema: concurrencia_hilos
