verificado: true
funciones:
- nombre: ejecutar_hilos_conc_20
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Problema de los Filósofos Comensales
    y Prevención de Bloqueo
tests_funciones:
- nombre: test_ejecutar_hilos_conc_20_positivo
  funcion: ejecutar_hilos_conc_20
  codigo: 'int res = ejecutar_hilos_conc_20(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_hilos_conc_20_cero
  funcion: ejecutar_hilos_conc_20
  codigo: 'int res = ejecutar_hilos_conc_20(0);

    assert(res == 0);'
- nombre: test_ejecutar_hilos_conc_20_negativo
  funcion: ejecutar_hilos_conc_20
  codigo: 'int res = ejecutar_hilos_conc_20(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_hilos_conc_20_valor_limite
  funcion: ejecutar_hilos_conc_20
  codigo: 'int res = ejecutar_hilos_conc_20(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_hilos_conc_20_valor_unitario
  funcion: ejecutar_hilos_conc_20
  codigo: 'int res = ejecutar_hilos_conc_20(1);

    assert(res >= 0 || res == 2);'
