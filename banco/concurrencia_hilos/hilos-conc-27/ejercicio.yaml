id: hilos-conc-27
titulo: Contador de Palabras Concurrente sobre Múltiples Archivos
tema: concurrencia_hilos
bloom: 5
minutos_estimados: 45
pistas:
- Identificá las variables compartidas y las variables locales a cada hilo.
- Evitá deadlocks garantizando orden de adquisición de bloqueos.
tags:
- concurrencia
- hilos
- mutex
- sincronizacion
- dep:memoria
- dep:funciones
- c11
- avanzada
verificado: true
funciones:
- nombre: ejecutar_hilos_conc_27
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Contador de Palabras Concurrente sobre
    Múltiples Archivos
tests_funciones:
- nombre: test_ejecutar_hilos_conc_27_positivo
  funcion: ejecutar_hilos_conc_27
  codigo: 'int res = ejecutar_hilos_conc_27(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_hilos_conc_27_cero
  funcion: ejecutar_hilos_conc_27
  codigo: 'int res = ejecutar_hilos_conc_27(0);

    assert(res == 0);'
- nombre: test_ejecutar_hilos_conc_27_negativo
  funcion: ejecutar_hilos_conc_27
  codigo: 'int res = ejecutar_hilos_conc_27(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_hilos_conc_27_valor_limite
  funcion: ejecutar_hilos_conc_27
  codigo: 'int res = ejecutar_hilos_conc_27(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_hilos_conc_27_valor_unitario
  funcion: ejecutar_hilos_conc_27
  codigo: 'int res = ejecutar_hilos_conc_27(1);

    assert(res >= 0 || res == 2);'
publicar: true
unidad: 5
modulo: Ingeniería de Software y Calidad en C
dificultad: avanzada
tipo: ejercicio_individual
prerrequisitos:
