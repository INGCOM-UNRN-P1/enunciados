id: hilos-conc-06
titulo: Variables de Condición para Notificación entre Hilos
tema: concurrencia_hilos
bloom: 1
minutos_estimados: 10
pistas:
- Identificá las variables compartidas y las variables locales a cada hilo.
- Evitá deadlocks garantizando orden de adquisición de bloqueos.
tags:
- concurrencia
- hilos
- mutex
- sincronizacion
- dep:memoria
- dep:funciones
- c11
- inicial
verificado: true
funciones:
- nombre: ejecutar_hilos_conc_06
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Variables de Condición para Notificación
    entre Hilos
tests_funciones:
- nombre: test_ejecutar_hilos_conc_06_positivo
  funcion: ejecutar_hilos_conc_06
  codigo: 'int res = ejecutar_hilos_conc_06(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_hilos_conc_06_cero
  funcion: ejecutar_hilos_conc_06
  codigo: 'int res = ejecutar_hilos_conc_06(0);

    assert(res == 0);'
- nombre: test_ejecutar_hilos_conc_06_negativo
  funcion: ejecutar_hilos_conc_06
  codigo: 'int res = ejecutar_hilos_conc_06(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_hilos_conc_06_valor_limite
  funcion: ejecutar_hilos_conc_06
  codigo: 'int res = ejecutar_hilos_conc_06(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_hilos_conc_06_valor_unitario
  funcion: ejecutar_hilos_conc_06
  codigo: 'int res = ejecutar_hilos_conc_06(1);

    assert(res >= 0 || res == 2);'
publicar: true
unidad: 5
modulo: Ingeniería de Software y Calidad en C
dificultad: inicial
tipo: practica_guiada
prerrequisitos:
- memoria
- funciones
subtema: concurrencia_hilos
