    TLS
tests_funciones:
- nombre: test_ejecutar_hilos_conc_18_positivo
  funcion: ejecutar_hilos_conc_18
  codigo: 'int res = ejecutar_hilos_conc_18(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_hilos_conc_18_cero
  funcion: ejecutar_hilos_conc_18
  codigo: 'int res = ejecutar_hilos_conc_18(0);

    assert(res == 0);'
- nombre: test_ejecutar_hilos_conc_18_negativo
  funcion: ejecutar_hilos_conc_18
  codigo: 'int res = ejecutar_hilos_conc_18(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_hilos_conc_18_valor_limite
  funcion: ejecutar_hilos_conc_18
  codigo: 'int res = ejecutar_hilos_conc_18(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_hilos_conc_18_valor_unitario
  funcion: ejecutar_hilos_conc_18
  codigo: 'int res = ejecutar_hilos_conc_18(1);

    assert(res >= 0 || res == 2);'
