tests_funciones:
- nombre: test_ejecutar_hilos_conc_22_positivo
  funcion: ejecutar_hilos_conc_22
  codigo: 'int res = ejecutar_hilos_conc_22(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_hilos_conc_22_cero
  funcion: ejecutar_hilos_conc_22
  codigo: 'int res = ejecutar_hilos_conc_22(0);

    assert(res == 0);'
- nombre: test_ejecutar_hilos_conc_22_negativo
  funcion: ejecutar_hilos_conc_22
  codigo: 'int res = ejecutar_hilos_conc_22(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_hilos_conc_22_valor_limite
  funcion: ejecutar_hilos_conc_22
  codigo: 'int res = ejecutar_hilos_conc_22(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_hilos_conc_22_valor_unitario
  funcion: ejecutar_hilos_conc_22
  codigo: 'int res = ejecutar_hilos_conc_22(1);

