verificado: true
funciones:
- nombre: ejecutar_hilos_conc_23
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Manejo de Señales en Aplicaciones Multihilo
tests_funciones:
- nombre: test_ejecutar_hilos_conc_23_positivo
  funcion: ejecutar_hilos_conc_23
  codigo: 'int res = ejecutar_hilos_conc_23(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_hilos_conc_23_cero
  funcion: ejecutar_hilos_conc_23
  codigo: 'int res = ejecutar_hilos_conc_23(0);

    assert(res == 0);'
- nombre: test_ejecutar_hilos_conc_23_negativo
  funcion: ejecutar_hilos_conc_23
  codigo: 'int res = ejecutar_hilos_conc_23(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_hilos_conc_23_valor_limite
  funcion: ejecutar_hilos_conc_23
  codigo: 'int res = ejecutar_hilos_conc_23(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_hilos_conc_23_valor_unitario
  funcion: ejecutar_hilos_conc_23
  codigo: 'int res = ejecutar_hilos_conc_23(1);

    assert(res >= 0 || res == 2);'
