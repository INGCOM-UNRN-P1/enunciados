id: hilos-conc-29
titulo: Medición de Rendimiento y Escalabilidad por Número de Hilos
tema: concurrencia_hilos
bloom: 5
minutos_estimados: 45
pistas:
- Identificá las variables compartidas y las variables locales a cada hilo.
- Evitá deadlocks garantizando orden de adquisición de bloqueos.
tags:
- concurrencia
- hilos
- mutex
- sincronizacion
- dep:memoria
- dep:funciones
- c11
- avanzada
verificado: true
funciones:
- nombre: ejecutar_hilos_conc_29
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Medición de Rendimiento y Escalabilidad
    por Número de Hilos
tests_funciones:
- nombre: test_ejecutar_hilos_conc_29_positivo
  funcion: ejecutar_hilos_conc_29
  codigo: 'int res = ejecutar_hilos_conc_29(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_hilos_conc_29_cero
  funcion: ejecutar_hilos_conc_29
  codigo: 'int res = ejecutar_hilos_conc_29(0);

    assert(res == 0);'
- nombre: test_ejecutar_hilos_conc_29_negativo
  funcion: ejecutar_hilos_conc_29
  codigo: 'int res = ejecutar_hilos_conc_29(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_hilos_conc_29_valor_limite
  funcion: ejecutar_hilos_conc_29
  codigo: 'int res = ejecutar_hilos_conc_29(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_hilos_conc_29_valor_unitario
  funcion: ejecutar_hilos_conc_29
  codigo: 'int res = ejecutar_hilos_conc_29(1);

    assert(res >= 0 || res == 2);'
publicar: true
unidad: 5
modulo: Ingeniería de Software y Calidad en C
dificultad: avanzada
tipo: ejercicio_individual
prerrequisitos:
- memoria
- funciones
subtema: concurrencia_hilos
