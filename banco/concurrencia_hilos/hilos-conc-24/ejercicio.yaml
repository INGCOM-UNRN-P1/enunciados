id: hilos-conc-24
titulo: Paralelización de Multiplicación de Matrices por Bloques
tema: concurrencia_hilos
bloom: 4
minutos_estimados: 35
pistas:
- Identificá las variables compartidas y las variables locales a cada hilo.
- Evitá deadlocks garantizando orden de adquisición de bloqueos.
tags:
- concurrencia
- hilos
- mutex
- sincronizacion
- dep:memoria
- dep:funciones
- c11
- intermedia
verificado: true
funciones:
- nombre: ejecutar_hilos_conc_24
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Paralelización de Multiplicación de Matrices
    por Bloques
tests_funciones:
- nombre: test_ejecutar_hilos_conc_24_positivo
  funcion: ejecutar_hilos_conc_24
  codigo: 'int res = ejecutar_hilos_conc_24(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_hilos_conc_24_cero
  funcion: ejecutar_hilos_conc_24
  codigo: 'int res = ejecutar_hilos_conc_24(0);

    assert(res == 0);'
- nombre: test_ejecutar_hilos_conc_24_negativo
  funcion: ejecutar_hilos_conc_24
  codigo: 'int res = ejecutar_hilos_conc_24(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_hilos_conc_24_valor_limite
  funcion: ejecutar_hilos_conc_24
  codigo: 'int res = ejecutar_hilos_conc_24(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_hilos_conc_24_valor_unitario
  funcion: ejecutar_hilos_conc_24
  codigo: 'int res = ejecutar_hilos_conc_24(1);

    assert(res >= 0 || res == 2);'
publicar: true
unidad: 5
modulo: Ingeniería de Software y Calidad en C
dificultad: intermedia
tipo: ejercicio_individual
prerrequisitos:
- memoria
- funciones
subtema: concurrencia_hilos
