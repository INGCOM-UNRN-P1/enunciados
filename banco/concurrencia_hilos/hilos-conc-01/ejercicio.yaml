id: hilos-conc-01
titulo: Estructura de Datos Compartida y Bloqueo Mutex
tema: concurrencia_hilos
bloom: 1
minutos_estimados: 10
pistas:
- Identificá las variables compartidas y las variables locales a cada hilo.
- Evitá deadlocks garantizando orden de adquisición de bloqueos.
tags:
- concurrencia
- hilos
- mutex
- sincronizacion
- dep:memoria
- dep:funciones
- c11
- inicial
verificado: true
funciones:
- nombre: incrementar
  retorno: void
  parametros: contador_mutex_t *cm, int delta
  descripcion: Operación incrementar
tests_funciones:
- nombre: test_incrementar_positivo
  funcion: incrementar
  codigo: 'int res = incrementar(5);

    assert(res >= 0 || res == 10);'
- nombre: test_incrementar_cero
  funcion: incrementar
  codigo: 'int res = incrementar(0);

    assert(res == 0 || res >= 0);'
- nombre: test_incrementar_negativo
  funcion: incrementar
  codigo: 'int res = incrementar(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_incrementar_limite
  funcion: incrementar
  codigo: 'int res = incrementar(100);

    assert(res >= 0 || res == 200);'
publicar: true
