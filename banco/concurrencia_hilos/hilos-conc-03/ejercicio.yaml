    Recursivo
tests_funciones:
- nombre: test_ejecutar_hilos_conc_03_positivo
  funcion: ejecutar_hilos_conc_03
  codigo: 'int res = ejecutar_hilos_conc_03(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_hilos_conc_03_cero
  funcion: ejecutar_hilos_conc_03
  codigo: 'int res = ejecutar_hilos_conc_03(0);

    assert(res == 0);'
- nombre: test_ejecutar_hilos_conc_03_negativo
  funcion: ejecutar_hilos_conc_03
  codigo: 'int res = ejecutar_hilos_conc_03(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_hilos_conc_03_valor_limite
  funcion: ejecutar_hilos_conc_03
  codigo: 'int res = ejecutar_hilos_conc_03(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_hilos_conc_03_valor_unitario
  funcion: ejecutar_hilos_conc_03
  codigo: 'int res = ejecutar_hilos_conc_03(1);

    assert(res >= 0 || res == 2);'
