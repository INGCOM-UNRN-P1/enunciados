id: ej-21-21-producto-de-hadamard
titulo: producto_t de Hadamard
tema: matrices
bloom: 3
minutos_estimados: 25
pistas:
- '[Plus Ultra] Optimizar el acceso a memoria respetando el orden por filas (*row-major order*) para mejorar
  el uso de caché.'
- '[Plus Ultra] Validar que los índices ingresados se encuentren estrictamente dentro de los límites del
  contenedor.'
tags:
- matrices
- producto
- hadamard
- 2d
- algoritmos
- dep:arreglos
- dep:lazos_anidados
- c11
- intermedia
verificado: true
funciones:
- nombre: producto_hadamard
  retorno: bool
  parametros: const int *a, const int *b, size_t filas, size_t columnas, int64_t *resultado
  descripcion: Calcula el producto elemento a elemento de dos matrices contiguas.
tests_funciones:
- nombre: test_producto_hadamard_producto
  funcion: producto_hadamard
  codigo: 'int a[] = {1, -2, 3, 4}; int b[] = {5, 6, -2, 0}; int64_t c[4];

    assert(producto_hadamard(a, b, 2, 2, c));

    assert(c[0] == 5 && c[1] == -12 && c[2] == -6 && c[3] == 0);'
- nombre: test_producto_hadamard_overflow
  funcion: producto_hadamard
  codigo: 'int a[] = {2147483647}; int b[] = {2147483647}; int64_t c[1];

    assert(producto_hadamard(a, b, 1, 1, c));

    assert(c[0] == INT64_C(4611686014132420609));'
- nombre: test_producto_hadamard_invalidas
  funcion: producto_hadamard
  codigo: 'int a[] = {1}; int64_t c[1];

    assert(!producto_hadamard(a, a, 0, 1, c));

    assert(!producto_hadamard(NULL, a, 1, 1, c));'
unidad: 2
modulo: Tipos Compuestos y Direccionamiento
subtema: producto
dificultad: intermedia
tipo: practica_guiada
prerrequisitos:
