funciones:
- nombre: matriz_circulante
  retorno: int **
  parametros: int *primera_fila, int n
  descripcion: Genere una matriz circulante desplazando cada fila una posición a la derecha respecto de
    la anterior. Devuelva NULL ante entrada inválida o falla de reserva. Libere cada fila y luego el vector
    de filas.
tests_funciones:
- nombre: casos_de_comportamiento
  funcion: matriz_circulante
  codigo: int f[]={1,2,3}; int **a=matriz_circulante(f,3); assert(a && a[0][2]==3 && a[1][0]==3 && a[2][1]==3
    && a[2][2]==1); for(int i=0;i<3;i++)free(a[i]); free(a); assert(!matriz_circulante(NULL,3)); assert(!matriz_circulante(f,0));
