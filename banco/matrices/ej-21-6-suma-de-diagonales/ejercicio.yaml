id: ej-21-6-suma-de-diagonales
titulo: Suma de diagonales
tema: matrices
bloom: 3
minutos_estimados: 25
pistas:
- '**Diagonal Principal:** Los elementos de la diagonal principal son aquellos donde el índice de fila
  es igual al índice de columna (`i == j`).'
- '**Diagonal Secundaria:** Los elementos de la diagonal secundaria en una matriz de tamaño `n x n` son
  aquellos donde `i + j == n - 1`.'
- '**Proceso:** Usar un solo lazo de `i=0` a `n-1`. En cada iteración, sumar `matriz[i][i]` a la suma
  principal y `matriz[i][n-1-i]` a la suma secundaria.'
- '[Plus Ultra] Optimizar el acceso a memoria respetando el orden por filas (*row-major order*) para mejorar
  el uso de caché.'
- '[Plus Ultra] Validar que los índices ingresados se encuentren estrictamente dentro de los límites del
  contenedor.'
tags:
- 2d
- algoritmos
- matrices
- diagonales
- dep:arreglos
- dep:lazos_anidados
- c11
- intermedia
verificado: true
funciones:
- nombre: sumar_diagonales
  retorno: int
  parametros: size_t n, const int *matriz, int *principal, int *secundaria
  descripcion: 'Suma de diagonales: sumar_diagonales'
tests_funciones:
- nombre: test_diagonales_3x3
  funcion: sumar_diagonales
  codigo: int m[] = {1,2,3,4,5,6,7,8,9}, p, s; assert(sumar_diagonales(3,m,&p,&s)==0); assert(p==15 &&
    s==15);
- nombre: test_diagonales_centro_se_cuenta_en_ambas
  funcion: sumar_diagonales
  codigo: int m[] = {9,2,3,4,5,6,7,8,1}, p, s; assert(sumar_diagonales(3,m,&p,&s)==0); assert(p==15 &&
    s==15);
- nombre: test_diagonales_matriz_1x1
  funcion: sumar_diagonales
  codigo: int m[] = {-4}, p, s; assert(sumar_diagonales(1,m,&p,&s)==0); assert(p==-4 && s==-4);
- nombre: test_diagonales_argumentos_invalidos
  funcion: sumar_diagonales
  codigo: int m[] = {1}, p, s; assert(sumar_diagonales(0,m,&p,&s)==-1); assert(sumar_diagonales(1,m,NULL,&s)==-1);
- nombre: test_detecta_desborde_y_preserva_salidas
  funcion: sumar_diagonales
  codigo: int m[] = {INT_MAX,0,0,INT_MAX}, p = 17, s = 23; assert(sumar_diagonales(2,m,&p,&s)==-1); assert(p==17
    && s==23);
- nombre: test_rechaza_dimension_que_desborda_size_t
  funcion: sumar_diagonales
  codigo: int m[] = {1}, p, s; assert(sumar_diagonales(SIZE_MAX,m,&p,&s)==-1);
unidad: 2
