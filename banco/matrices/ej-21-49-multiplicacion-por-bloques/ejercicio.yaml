verificado: false
funciones:
- nombre: multiplicar_bloques
  retorno: double **
  parametros: double **A, double **B, int n, int tam_bloque
  descripcion: Devuelve una matriz n×n nueva con filas reservadas individualmente; liberar cada fila y
    luego el arreglo de filas. NULL ante argumentos inválidos, fallo de asignación o desbordamiento numérico
    no finito. A y B permanecen intactas.
tests_funciones:
- nombre: bloques_y_borde_no_multiplo
  funcion: multiplicar_bloques
  codigo: double a0[]={1,2,3},a1[]={4,5,6},a2[]={7,8,9};double*b0[]={a0,a1,a2};double b00[]={1,0,2},b01[]={0,1,0},b02[]={1,0,1};double*b1[]={b00,b01,b02};double**c=multiplicar_bloques(b0,b1,3,2);assert(c&&c[0][0]==4&&c[0][1]==2&&c[0][2]==5&&c[2][0]==16&&c[2][1]==8&&c[2][2]==23);for(int
    i=0;i<3;i++)free(c[i]);free(c);assert(multiplicar_bloques(b0,b1,3,0)==NULL);
