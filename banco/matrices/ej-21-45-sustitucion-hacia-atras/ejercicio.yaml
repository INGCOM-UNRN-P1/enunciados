id: ej-21-45-sustitucion-hacia-atras
titulo: Sustitución hacia atrás
tema: matrices
bloom: 3
minutos_estimados: 25
pistas:
- Calcule primero la última incógnita y use las ya calculadas para resolver cada fila anterior.
tags:
- matrices
- hacia
- atras
- 2d
- algoritmos
- dep:arreglos
- dep:lazos_anidados
- c11
- intermedia
verificado: true
funciones:
- nombre: sustitucion_atras
  retorno: double *
  parametros: double **U, double *b, int n
  descripcion: Resuelve un sistema triangular superior y devuelve un vector reservado.
tests_funciones:
- nombre: sistema_triangular_y_casos_invalidos
  funcion: sustitucion_atras
  codigo: double a[]={2,1,-1}, c[]={0,3,2}, d[]={0,0,4}, b[]={1,12,12}; double *U[]={a,c,d}; double *x=sustitucion_atras(U,b,3);
    assert(x && x[0]==1 && x[1]==2 && x[2]==3); free(x); d[2]=0; assert(!sustitucion_atras(U,b,3)); assert(!sustitucion_atras(NULL,b,3));
    assert(!sustitucion_atras(U,b,0));
unidad: 2
modulo: Tipos Compuestos y Direccionamiento
subtema: hacia
dificultad: intermedia
tipo: practica_guiada
prerrequisitos:
- arreglos
- lazos_anidados
publicar: true
