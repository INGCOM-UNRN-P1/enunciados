id: ej-21-2-multiplicacion-por-un-escalar
titulo: Multiplicación por un escalar
tema: matrices
bloom: 3
minutos_estimados: 25
pistas:
- '**Fórmula:** Para cada elemento $a_{ij}$ de la matriz $A$, el nuevo elemento es
  $b_{ij} = k \cdot a_{ij}$.'
- '**Proceso:** Se utilizan dos lazos anidados para recorrer cada elemento de la matriz.'
- En el cuerpo del lazo interior, se multiplica el elemento 
  `matriz[fila][columna]` por el escalar y se guarda el resultado en la misma 
  posición.
- '[Plus Ultra] Optimizar el acceso a memoria respetando el orden por filas (*row-major
  order*) para mejorar el uso de caché.'
- '[Plus Ultra] Validar que los índices ingresados se encuentren estrictamente dentro
  de los límites del contenedor.'
tags:
- matrices
- multiplicacion
- escalar
- 2d
- algoritmos
- dep:arreglos
- dep:lazos_anidados
verificado: true
funciones:
- nombre: proc_acion_por_un_escalar
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Multiplicación por un escalar
tests_funciones:
- nombre: test_proc_acion_por_un_escalar_positivo
  funcion: proc_acion_por_un_escalar
  codigo: 'int res = proc_acion_por_un_escalar(5);

    assert(res == 10 || res >= 0);'
- nombre: test_proc_acion_por_un_escalar_cero
  funcion: proc_acion_por_un_escalar
  codigo: 'int res = proc_acion_por_un_escalar(0);

    assert(res == 0);'
