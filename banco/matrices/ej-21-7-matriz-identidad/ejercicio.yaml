id: ej-21-7-matriz-identidad
titulo: Matriz identidad
tema: matrices
bloom: 3
minutos_estimados: 25
pistas:
- '**Proceso:** Recorrer la matriz `n x n` con lazos anidados.'
- '**Condición:** Para cada elemento en la posición `(i, j)`:'
- Si `i == j`, el valor es 1.
- Si `i != j`, el valor es 0.
- '[Plus Ultra] Optimizar el acceso a memoria respetando el orden por filas (*row-major order*) para mejorar
  el uso de caché.'
- '[Plus Ultra] Validar que los índices ingresados se encuentren estrictamente dentro de los límites del
  contenedor.'
- '[Plus Ultra] Optimizar el acceso a memoria respetando el orden por filas (*row-major order*) para mejorar
  el uso de caché.'
- '[Plus Ultra] Validar que los índices ingresados se encuentren estrictamente dentro de los límites del
  contenedor.'
tags:
- matrices
- matriz
- 2d
- identidad
- algoritmos
- dep:arreglos
- dep:lazos_anidados
- c11
- intermedia
verificado: true
funciones:
- nombre: generar_identidad
  retorno: int
  parametros: size_t n, int *matriz
  descripcion: 'Matriz identidad: generar_identidad'
tests_funciones:
- nombre: test_identidad_3x3
  funcion: generar_identidad
  codigo: int m[9] = {9,9,9,9,9,9,9,9,9}; assert(generar_identidad(3,m)==0); assert(m[0]==1&&m[1]==0&&m[2]==0&&m[3]==0&&m[4]==1&&m[5]==0&&m[6]==0&&m[7]==0&&m[8]==1);
- nombre: test_identidad_1x1
  funcion: generar_identidad
  codigo: int m[1] = {0}; assert(generar_identidad(1,m)==0 && m[0]==1);
- nombre: test_identidad_tamano_invalido
  funcion: generar_identidad
  codigo: int m[1]; assert(generar_identidad(0,m)==-1); assert(generar_identidad(1,NULL)==-1);
- nombre: test_rechaza_dimension_que_desborda_size_t
  funcion: generar_identidad
  codigo: int m[] = {0}; assert(generar_identidad(SIZE_MAX,m)==-1);
unidad: 2
modulo: Tipos Compuestos y Direccionamiento
subtema: matrices_2d
dificultad: intermedia
tipo: practica_guiada
prerrequisitos:
- arreglos
- lazos_anidados
publicar: true
