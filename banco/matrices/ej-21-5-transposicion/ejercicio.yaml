id: ej-21-5-transposicion
titulo: Transposición
tema: matrices
bloom: 3
minutos_estimados: 25
pistas:
- '**Fórmula:** $(A^T)_{ij} = A_{ji}$.'
- '**Dimensiones:** Si la matriz original es $m \times n$, su transpuesta será $n
  \times m$.'
- '**Proceso:** Recorrer la matriz original `A` con lazos anidados. En cada posición
  `(i, j)`, copiar el elemento `A[i][j]` a la posición `(j, i)` de la nueva matriz
  transpuesta.'
- '[Plus Ultra] Optimizar el acceso a memoria respetando el orden por filas (*row-major
  order*) para mejorar el uso de caché.'
- '[Plus Ultra] Validar que los índices ingresados se encuentren estrictamente dentro
  de los límites del contenedor.'
tags:
- 2d
- transposicion
- algoritmos
- matrices
- dep:arreglos
- dep:lazos_anidados
- c11
- intermedia
verificado: true
funciones:
- nombre: ejecutar_ej_21_5_transposicion
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Transposición
tests_funciones:
- nombre: test_ejecutar_ej_21_5_transposicion_positivo
  funcion: ejecutar_ej_21_5_transposicion
  codigo: 'int res = ejecutar_ej_21_5_transposicion(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_ej_21_5_transposicion_cero
  funcion: ejecutar_ej_21_5_transposicion
  codigo: 'int res = ejecutar_ej_21_5_transposicion(0);

    assert(res == 0);'
- nombre: test_ejecutar_ej_21_5_transposicion_negativo
  funcion: ejecutar_ej_21_5_transposicion
  codigo: 'int res = ejecutar_ej_21_5_transposicion(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_ej_21_5_transposicion_valor_limite
  funcion: ejecutar_ej_21_5_transposicion
  codigo: 'int res = ejecutar_ej_21_5_transposicion(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_ej_21_5_transposicion_valor_unitario
  funcion: ejecutar_ej_21_5_transposicion
  codigo: 'int res = ejecutar_ej_21_5_transposicion(1);

    assert(res >= 0 || res == 2);'
