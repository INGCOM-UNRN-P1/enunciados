id: ej-21-5-transposicion
titulo: Transposición
tema: matrices
bloom: 3
minutos_estimados: 25
pistas:
- '**Fórmula:** $(A^T)_{ij} = A_{ji}$.'
- '**Dimensiones:** Si la matriz original es $m \times n$, su transpuesta será $n \times m$.'
- '**Proceso:** Recorrer la matriz original `A` con lazos anidados. En cada posición `(i, j)`, copiar
  el elemento `A[i][j]` a la posición `(j, i)` de la nueva matriz transpuesta.'
- '[Plus Ultra] Optimizar el acceso a memoria respetando el orden por filas (*row-major order*) para mejorar
  el uso de caché.'
- '[Plus Ultra] Validar que los índices ingresados se encuentren estrictamente dentro de los límites del
  contenedor.'
tags:
- 2d
- transposicion
- algoritmos
- matrices
- dep:arreglos
- dep:lazos_anidados
- c11
- intermedia
verificado: true
funciones:
- nombre: transponer_matriz
  retorno: int
  parametros: size_t filas, size_t columnas, const int *entrada, int *salida
  descripcion: 'Transposición: transponer_matriz'
tests_funciones:
- nombre: test_transpuesta_rectangular
  funcion: transponer_matriz
  codigo: int a[] = {1,2,3,4,5,6}, b[6] = {0}; assert(transponer_matriz(2,3,a,b) == 0); assert(b[0]==1
    && b[1]==4 && b[2]==2 && b[3]==5 && b[4]==3 && b[5]==6);
- nombre: test_transpuesta_un_elemento
  funcion: transponer_matriz
  codigo: int a[] = {7}, b[1] = {0}; assert(transponer_matriz(1,1,a,b) == 0 && b[0] == 7);
- nombre: test_transpuesta_argumentos_invalidos
  funcion: transponer_matriz
  codigo: int a[] = {1}, b[1] = {0}; assert(transponer_matriz(0,1,a,b) == -1); assert(transponer_matriz(1,1,NULL,b)
    == -1);
- nombre: test_rechaza_dimensiones_que_desbordan_size_t
  funcion: transponer_matriz
  codigo: int a[] = {1}; assert(transponer_matriz(2, SIZE_MAX, a, a) == -1);
unidad: 2
modulo: Tipos Compuestos y Direccionamiento
subtema: transposicion
dificultad: intermedia
tipo: practica_guiada
prerrequisitos:
- arreglos
- lazos_anidados
publicar: true
