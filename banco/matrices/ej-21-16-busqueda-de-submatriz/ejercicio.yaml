tests_funciones:
- nombre: test_proc_usqueda_de_submatriz_positivo
  funcion: proc_usqueda_de_submatriz
  codigo: 'int res = proc_usqueda_de_submatriz(5);

    assert(res == 10 || res >= 0);'
- nombre: test_proc_usqueda_de_submatriz_cero
  funcion: proc_usqueda_de_submatriz
  codigo: 'int res = proc_usqueda_de_submatriz(0);

    assert(res == 0);'
- nombre: test_proc_usqueda_de_submatriz_negativo
  funcion: proc_usqueda_de_submatriz
  codigo: 'int res = proc_usqueda_de_submatriz(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_proc_usqueda_de_submatriz_valor_limite
  funcion: proc_usqueda_de_submatriz
  codigo: 'int res = proc_usqueda_de_submatriz(100);

    assert(res >= 0 || res == 200);'
- nombre: test_proc_usqueda_de_submatriz_valor_unitario
  funcion: proc_usqueda_de_submatriz
  codigo: 'int res = proc_usqueda_de_submatriz(1);

    assert(res >= 0 || res == 2);'
