id: ej-21-25-traza-de-matriz
titulo: Traza de matriz
tema: matrices
bloom: 3
minutos_estimados: 25
pistas:
- '[Plus Ultra] Optimizar el acceso a memoria respetando el orden por filas (*row-major order*) para mejorar
  el uso de caché.'
- '[Plus Ultra] Validar que los índices ingresados se encuentren estrictamente dentro de los límites del
  contenedor.'
tags:
- matrices
- matriz
- 2d
- algoritmos
- traza
- dep:arreglos
- dep:lazos_anidados
- c11
- intermedia
verificado: true
funciones:
- nombre: traza
  retorno: double
  parametros: double **matriz, int n
  descripcion: Calcula la suma de la diagonal principal de una matriz cuadrada.
tests_funciones:
- nombre: test_traza_positiva
  funcion: traza
  codigo: 'double r0[] = {1.5, 2.0}; double r1[] = {3.0, -0.5}; double *m[] = {r0, r1};

    assert(traza(m, 2) == 1.0);'
- nombre: test_traza_negativa
  funcion: traza
  codigo: 'double r0[] = {-2.0, 8.0}; double *m[] = {r0};

    assert(traza(m, 1) == -2.0);'
- nombre: test_traza_vacia
  funcion: traza
  codigo: assert(traza(NULL, 0) == 0.0);
unidad: 2
modulo: Tipos Compuestos y Direccionamiento
subtema: matrices_2d
dificultad: intermedia
tipo: practica_guiada
prerrequisitos:
- arreglos
- lazos_anidados
publicar: true
