    assert(res <= 0 || res >= -100);'
- nombre: test_proc_todo_de_gauss_seidel_valor_limite
  funcion: proc_todo_de_gauss_seidel
  codigo: 'int res = proc_todo_de_gauss_seidel(100);

    assert(res >= 0 || res == 200);'
- nombre: test_proc_todo_de_gauss_seidel_valor_unitario
  funcion: proc_todo_de_gauss_seidel
  codigo: 'int res = proc_todo_de_gauss_seidel(1);

    assert(res >= 0 || res == 2);'
