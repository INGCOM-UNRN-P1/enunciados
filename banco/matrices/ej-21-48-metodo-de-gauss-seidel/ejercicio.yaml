id: ej-21-48-metodo-de-gauss-seidel
titulo: Método de Gauss–Seidel
tema: matrices
bloom: 3
minutos_estimados: 25
pistas:
- Reutilizá los valores actualizados durante cada iteración.
tags:
- matrices
- metodo
- 2d
- algoritmos
- gauss-seidel
- dep:arreglos
- dep:lazos_anidados
- c11
- intermedia
verificado: false
funciones:
- nombre: metodo_gauss_seidel
  retorno: double *
  parametros: double **A, double *b, int n, double tolerancia,                             int max_iter
  descripcion: Devuelve vector n reservado con malloc, a liberar por quien llama. NULL ante argumentos
    inválidos, diagonal nula, falta de memoria o falta de convergencia. Converge cuando la norma infinito
    del cambio en una iteración <= tolerancia; diagonal estrictamente dominante es suficiente, pero no
    necesaria.
tests_funciones:
- nombre: converge_con_actualizaciones
  funcion: metodo_gauss_seidel
  codigo: double r0[]={4,1},r1[]={1,3};double*A[]={r0,r1};double b[]={1,2};double*x=metodo_gauss_seidel(A,b,2,1e-9,100);assert(x&&fabs(4*x[0]+x[1]-1)<1e-7&&fabs(x[0]+3*x[1]-2)<1e-7);free(x);
- nombre: diagonal_pequena_no_nula
  funcion: metodo_gauss_seidel
  codigo: double r[]={1e-30}, *A[]={r}, b[]={2e-30}; double *x=metodo_gauss_seidel(A,b,1,1e-12,4); assert(x
    && fabs(x[0]-2.0)<1e-12); free(x);
unidad: 2
modulo: Tipos Compuestos y Direccionamiento
subtema: metodo
dificultad: intermedia
tipo: practica_guiada
prerrequisitos:
- arreglos
- lazos_anidados
publicar: true
