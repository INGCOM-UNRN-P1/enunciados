- inicial
verificado: true
funciones:
- nombre: matriz_hankel
  retorno: double **
  parametros: double *c, double *r, int n
  descripcion: Genere una matriz de Hankel de orden n a partir de la primera columna c y la última fila
    r; c[n-1] y r[0] deben coincidir. Las diagonales i+j son constantes. Devuelva NULL ante entrada inválida
    o falla de reserva. Libere cada fila y luego el vector de filas.
tests_funciones:
- nombre: casos_de_comportamiento
  funcion: matriz_hankel
  codigo: double c[]={1,2,3},r[]={3,4,5}; double **a=matriz_hankel(c,r,3); assert(a && a[0][0]==1 && a[0][2]==3
    && a[1][2]==4 && a[2][2]==5); for(int i=0;i<3;i++)free(a[i]); free(a); r[0]=9; assert(!matriz_hankel(c,r,3));
    assert(!matriz_hankel(c,r,0));
unidad: 2
modulo: Tipos Compuestos y Direccionamiento
subtema: matrices_2d
dificultad: inicial
tipo: practica_guiada
