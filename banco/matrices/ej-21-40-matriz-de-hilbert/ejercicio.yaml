verificado: true
funciones:
- nombre: matriz_hilbert
  retorno: double **
  parametros: int n
  descripcion: Genere la matriz de Hilbert de orden `n`, con H[i][j] = 1/(i+j+1), índices desde cero.
    Devuelva NULL si n no es positivo o falla una reserva. La persona llamadora libera cada fila y luego
    el vector de filas.
tests_funciones:
- nombre: casos_de_comportamiento
  funcion: matriz_hilbert
  codigo: double **m=matriz_hilbert(3); assert(m); assert(m[0][0]==1.0 && m[1][1]==1.0/3.0 && m[2][2]==1.0/5.0);
    for(int i=0;i<3;i++) free(m[i]); free(m); assert(!matriz_hilbert(0)); assert(!matriz_hilbert(-1));
