funciones:
- nombre: matriz_vandermonde
  retorno: double **
  parametros: double *x, int n, int m
  descripcion: 'Genere una matriz de Vandermonde de n filas y m columnas: V[i][j] = x[i] elevado a j.
    Devuelva NULL si las dimensiones no son positivas, x es NULL o falla la reserva. Libere cada fila
    y después el vector de filas.'
tests_funciones:
- nombre: casos_de_comportamiento
  funcion: matriz_vandermonde
  codigo: double x[]={-2,0,3}; double **v=matriz_vandermonde(x,3,4); assert(v && v[0][0]==1 && v[0][3]==-8
    && v[1][1]==0 && v[2][3]==27); for(int i=0;i<3;i++)free(v[i]); free(v); assert(!matriz_vandermonde(NULL,3,4));
    assert(!matriz_vandermonde(x,0,4));
