id: ej-21-38-deteccion-de-bordes-laplaciano
titulo: Detección de bordes (Laplaciano)
tema: matrices
bloom: 3
minutos_estimados: 25
pistas:
- Recorra filas y columnas respetando los límites.
tags:
- matrices
- laplaciano
- deteccion
- bordes
- 2d
- dep:arreglos
- dep:lazos_anidados
- c11
- intermedia
verificado: true
funciones:
- nombre: detectar_bordes_laplaciano
  retorno: void
  parametros: int **imagen, int filas, int cols, int **resultado
  descripcion: 'Calcule el Laplaciano discreto de cuatro vecinos: arriba + abajo + izquierda + derecha
    − 4×centro. Para vecinos fuera de la imagen, repita el píxel del borde más cercano. Escriba el resultado
    en la matriz provista, saturando al rango de int. La salida puede compartir filas con la entrada.
    Parámetros inválidos o falta de memoria no modifican la salida.'
tests_funciones:
- nombre: casos_de_comportamiento
  funcion: detectar_bordes_laplaciano
  codigo: int a[]={0,0,0},b[]={0,10,0},c[]={0,0,0}; int *m[]={a,b,c}; detectar_bordes_laplaciano(m,3,3,m);
    assert(b[1]==-40 && b[0]==10 && a[1]==10 && a[0]==0); int x[]={7}; int *z[]={x}; detectar_bordes_laplaciano(z,1,1,z);
    assert(x[0]==0);
unidad: 2
