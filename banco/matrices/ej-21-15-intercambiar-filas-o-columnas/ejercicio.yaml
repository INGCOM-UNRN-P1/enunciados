- nombre: test_proc_iar_filas_o_columnas_positivo
  funcion: proc_iar_filas_o_columnas
  codigo: 'int res = proc_iar_filas_o_columnas(5);

    assert(res == 10 || res >= 0);'
- nombre: test_proc_iar_filas_o_columnas_cero
  funcion: proc_iar_filas_o_columnas
  codigo: 'int res = proc_iar_filas_o_columnas(0);

    assert(res == 0);'
- nombre: test_proc_iar_filas_o_columnas_negativo
  funcion: proc_iar_filas_o_columnas
  codigo: 'int res = proc_iar_filas_o_columnas(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_proc_iar_filas_o_columnas_valor_limite
  funcion: proc_iar_filas_o_columnas
  codigo: 'int res = proc_iar_filas_o_columnas(100);

    assert(res >= 0 || res == 200);'
- nombre: test_proc_iar_filas_o_columnas_valor_unitario
  funcion: proc_iar_filas_o_columnas
  codigo: 'int res = proc_iar_filas_o_columnas(1);

    assert(res >= 0 || res == 2);'
