id: ej-21-15-intercambiar-filas-o-columnas
titulo: Intercambiar filas o columnas
tema: matrices
bloom: 3
minutos_estimados: 25
pistas:
- '[Plus Ultra] Optimizar el acceso a memoria respetando el orden por filas (*row-major order*) para mejorar
  el uso de caché.'
- '[Plus Ultra] Validar que los índices ingresados se encuentren estrictamente dentro de los límites del
  contenedor.'
tags:
- intercambiar
- matrices
- columnas
- algoritmos
- 2d
- dep:arreglos
- dep:lazos_anidados
- c11
- intermedia
verificado: true
funciones:
- nombre: intercambiar_filas
  retorno: int
  parametros: size_t filas, size_t columnas, int *matriz, size_t f1, size_t f2
  descripcion: Intercambia dos filas de la matriz.
- nombre: intercambiar_columnas
  retorno: int
  parametros: size_t filas, size_t columnas, int *matriz, size_t c1, size_t c2
  descripcion: Intercambia dos columnas de la matriz.
tests_funciones:
- nombre: test_intercambiar_filas
  funcion: intercambiar_filas
  codigo: int m[] = {1,2,3,4,5,6}; assert(intercambiar_filas(2,3,m,0,1)==0); assert(m[0]==4&&m[1]==5&&m[2]==6&&m[3]==1&&m[4]==2&&m[5]==3);
- nombre: test_intercambiar_columnas
  funcion: intercambiar_columnas
  codigo: int m[] = {1,2,3,4,5,6}; assert(intercambiar_columnas(2,3,m,0,2)==0); assert(m[0]==3&&m[1]==2&&m[2]==1&&m[3]==6&&m[4]==5&&m[5]==4);
- nombre: test_intercambio_misma_fila
  funcion: intercambiar_filas
  codigo: int m[] = {1,2}; assert(intercambiar_filas(1,2,m,0,0)==0); assert(m[0]==1&&m[1]==2);
- nombre: test_indices_invalidos
  funcion: intercambiar_filas
  codigo: int m[] = {1,2}; assert(intercambiar_filas(1,2,m,1,0)==-1); assert(intercambiar_columnas(1,2,m,2,0)==-1);
- nombre: test_rechaza_dimensiones_que_desbordan_size_t
  funcion: intercambiar_filas
  codigo: int m[] = {1}; assert(intercambiar_filas(2,SIZE_MAX,m,0,1)==-1);
unidad: 2
modulo: Tipos Compuestos y Direccionamiento
subtema: intercambiar
dificultad: intermedia
tipo: practica_guiada
prerrequisitos:
- arreglos
- lazos_anidados
publicar: true
