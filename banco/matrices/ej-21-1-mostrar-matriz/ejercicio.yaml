id: ej-21-1-mostrar-matriz
titulo: Mostrar matriz
tema: matrices
bloom: 3
minutos_estimados: 25
pistas:
- '**Proceso:** Se necesitan dos lazos `for` anidados para recorrer la matriz.'
- El lazo exterior itera sobre las filas (desde `0` hasta `filas-1`).
- El lazo interior itera sobre las columnas de la fila actual (desde `0` hasta `columnas-1`).
- Dentro del lazo interior, se imprime cada elemento `matriz[fila][columna]`.
- Después de que el lazo interior termina (al final de cada fila), se debe imprimir
  un carácter de nueva línea (`\n`) para pasar a la siguiente fila.
- '[Plus Ultra] Garantizar la terminación con `\0` y prevenir desbordamientos de búfer
  validando la capacidad máxima.'
- '[Plus Ultra] Soportar la lectura de cadenas con espacios y múltiples líneas de
  manera robusta.'
tags:
