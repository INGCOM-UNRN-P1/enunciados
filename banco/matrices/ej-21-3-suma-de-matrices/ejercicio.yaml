id: ej-21-3-suma-de-matrices
titulo: Suma de matrices
tema: matrices
bloom: 3
minutos_estimados: 25
pistas:
- '**Fórmula:** La suma se realiza elemento a elemento: $c_{ij} = a_{ij} + b_{ij}$.'
- '**Precondición:** Las dimensiones de la Matriz A y la Matriz B deben ser idénticas.'
- '**Proceso:** Recorrer las matrices con lazos anidados. En cada posición `(f, c)`,
  calcular `C[f][c] = A[f][c] + B[f][c]`.'
- '[Plus Ultra] Optimizar el acceso a memoria respetando el orden por filas (*row-major
  order*) para mejorar el uso de caché.'
- '[Plus Ultra] Validar que los índices ingresados se encuentren estrictamente dentro
  de los límites del contenedor.'
tags:
