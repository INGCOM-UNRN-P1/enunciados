id: ej-21-51-strassen-para-matrices-grandes
titulo: Multiplicación de Strassen
tema: matrices
bloom: 4
minutos_estimados: 35
pistas:
- Dividí en cuadrantes y combiná los siete productos recursivos.
tags:
- grandes
- matrices
- strassen
- 2d
- algoritmos
- dep:arreglos
- dep:lazos_anidados
- c11
- intermedia
verificado: false
funciones:
- nombre: strassen
  retorno: double **
  parametros: double **A, double **B, int n
  descripcion: Devuelve una matriz n×n nueva, con filas asignadas individualmente; liberar cada fila y
    después el arreglo de filas. NULL ante argumentos inválidos, fallo de asignación o resultado no finito.
    A y B no se modifican.
tests_funciones:
- nombre: strassen_real_dimensiones_no_potencia
  funcion: strassen
  codigo: double a0[]={1,2,3},a1[]={4,5,6},a2[]={7,8,9};double*A[]={a0,a1,a2};double b0[]={9,8,7},b1[]={6,5,4},b2[]={3,2,1};double*B[]={b0,b1,b2};double**C=strassen(A,B,3);assert(C&&C[0][0]==30&&C[0][1]==24&&C[0][2]==18&&C[1][0]==84&&C[2][2]==90);for(int
    i=0;i<3;i++)free(C[i]);free(C);assert(strassen(A,B,0)==NULL);
- nombre: camino_recursivo_orden_64
  funcion: strassen
  codigo: int n=64; double **a=calloc((size_t)n,sizeof(*a)),**b=calloc((size_t)n,sizeof(*b)); assert(a
    && b); for(int i=0;i<n;i++){a[i]=calloc((size_t)n,sizeof(**a));b[i]=calloc((size_t)n,sizeof(**b));assert(a[i]
    && b[i]);for(int j=0;j<n;j++)a[i][j]=(i*3+j*7)%17-8;b[i][i]=1;} double **c=strassen(a,b,n);assert(c);for(int
    i=0;i<n;i++){for(int j=0;j<n;j++)assert(c[i][j]==a[i][j]);free(a[i]);free(b[i]);free(c[i]);}free(a);free(b);free(c);
unidad: 2
modulo: Tipos Compuestos y Direccionamiento
subtema: grandes
dificultad: intermedia
prerrequisitos:
