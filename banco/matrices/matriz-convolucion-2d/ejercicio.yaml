id: matriz-convolucion-2d
titulo: Filtro de Convolución 2D sobre Matrices Dinámicas
tema: matrices
bloom: 3
minutos_estimados: 25
pistas:
- Para un elemento en $(f, c)$, la ventana de $3 \times 3$ comprende $(f+i, 
  c+j)$ con $i, j \in \{-1, 0, 1\}$.
- Manejá los bordes con zero-padding (si $(f+i, c+j)$ está fuera de rango $[0, 
  F-1] \times [0, C-1]$, el valor es 0).
- Guardá los resultados en una matriz de salida nueva para no sobreescribir los 
  valores originales durante el cálculo.
