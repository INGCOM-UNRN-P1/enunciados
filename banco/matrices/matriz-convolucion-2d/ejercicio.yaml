- c11
- intermedia
verificado: true
funciones:
- nombre: obtener_pixel
  retorno: int
  parametros: const int *mat, int f, int c, int fil, int col
  descripcion: Operación obtener_pixel
tests_funciones:
- nombre: test_obtener_pixel_dentro_rango
  funcion: obtener_pixel
  codigo: 'int mat[4] = {10, 20, 30, 40};

    assert(obtener_pixel(mat, 2, 2, 0, 1) == 20);'
- nombre: test_obtener_pixel_origen
  funcion: obtener_pixel
  codigo: 'int mat[4] = {10, 20, 30, 40};

    assert(obtener_pixel(mat, 2, 2, 0, 0) == 10);'
- nombre: test_obtener_pixel_borde_negativo
  funcion: obtener_pixel
  codigo: 'int mat[4] = {10, 20, 30, 40};

    assert(obtener_pixel(mat, 2, 2, -1, 0) == 0);'
- nombre: test_obtener_pixel_fuera_rango_superior
  funcion: obtener_pixel
  codigo: 'int mat[4] = {10, 20, 30, 40};

    assert(obtener_pixel(mat, 2, 2, 2, 2) == 0);'
