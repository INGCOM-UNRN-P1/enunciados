id: ej-21-76-matriz-dispersa-sparse
titulo: Matriz dispersa con mapa de ocupación
tema: matrices
bloom: 3
minutos_estimados: 25
pistas:
- Guardá solo los elementos distintos de cero junto con sus coordenadas.
tags:
- matrices
- dispersa
- sparse
- matriz
- 2d
- dep:arreglos
- dep:lazos_anidados
- c11
- intermedia
verificado: false
funciones:
- nombre: sparse_set
  retorno: int
  parametros: 'double *valores, unsigned char *ocupado, size_t filas, size_t columnas, size_t fila, size_t
    columna, double valor);

    double sparse_get(const double *valores, const unsigned char *ocupado, size_t filas, size_t columnas,
    size_t fila, size_t columna, int *valido'
  descripcion: sparse_set devuelve 1/0; sparse_get devuelve el valor o cero y escribe en valido si la
    consulta fue válida.
tests_funciones:
- nombre: test_sparse_set_funcional
  funcion: sparse_set
  codigo: double v[6]={0};unsigned char o[6]={0};int ok=0;assert(sparse_set(v,o,2,3,1,2,7));assert(sparse_get(v,o,2,3,1,2,&ok)==7&&ok);assert(sparse_set(v,o,2,3,1,2,0));assert(sparse_get(v,o,2,3,1,2,&ok)==0&&ok);assert(!sparse_set(v,o,2,3,2,0,1));
unidad: 2
modulo: Tipos Compuestos y Direccionamiento
subtema: matrices_2d
dificultad: intermedia
tipo: practica_guiada
prerrequisitos:
- arreglos
- lazos_anidados
publicar: true
