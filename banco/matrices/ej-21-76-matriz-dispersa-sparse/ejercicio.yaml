id: ej-21-76-matriz-dispersa-sparse
titulo: Matriz Dispersa (Sparse)
tema: matrices
bloom: 3
minutos_estimados: 25
pistas:
- '[Plus Ultra] Validar punteros `NULL` recibidos como parámetro para evitar fallos
  de segmentación.'
- '[Plus Ultra] Implementar una versión utilizando aritmética de punteros en lugar
  de indexación directa.'
- '**Row-major es más eficiente en C:** Las matrices se almacenan por filas'
- '**Acceso secuencial:** `matriz[i][j++]` es más rápido que `matriz[i++][j]`'
- '**Localidad espacial:** Elementos consecutivos están cerca en memoria ``` c //
  MÁS RÁPIDO (row-major) for (i...) for (j...) matriz[i][j] // MÁS LENTO (column-major)
  for (j...) for (i...) matriz[i][j] ``` <!-- c -->'
