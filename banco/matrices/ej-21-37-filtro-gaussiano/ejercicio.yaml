id: ej-21-37-filtro-gaussiano
titulo: Filtro gaussiano
tema: matrices
bloom: 3
minutos_estimados: 25
pistas:
- Recorra filas y columnas respetando los límites.
tags:
- matrices
- filtro
- gaussiano
- 2d
- algoritmos
- dep:arreglos
- dep:lazos_anidados
- c11
- intermedia
verificado: true
funciones:
- nombre: filtro_gaussiano
  retorno: void
  parametros: double **imagen, int filas, int cols, double sigma
  descripcion: Suavice la imagen in situ con un núcleo gaussiano 3×3 normalizado, de desvío sigma positivo.
    Para vecinos fuera de la imagen, repita el píxel del borde más cercano. Calcule cada resultado usando
    la imagen original. Ante parámetros inválidos o falta de memoria, no modifique la imagen.
tests_funciones:
- nombre: casos_de_comportamiento
  funcion: filtro_gaussiano
  codigo: double a[]={0,0,0},b[]={0,9,0},c[]={0,0,0}; double *m[]={a,b,c}; filtro_gaussiano(m,3,3,1);
    assert(b[1]>b[0] && b[0]>a[0] && a[0]>0); double old=b[1]; filtro_gaussiano(m,3,3,0); assert(b[1]==old);
    double q[]={7}; double *z[]={q}; filtro_gaussiano(z,1,1,2); assert(fabs(q[0]-7)<1e-12);
unidad: 2
modulo: Tipos Compuestos y Direccionamiento
subtema: filtro
dificultad: intermedia
tipo: practica_guiada
prerrequisitos:
- arreglos
- lazos_anidados
publicar: true
