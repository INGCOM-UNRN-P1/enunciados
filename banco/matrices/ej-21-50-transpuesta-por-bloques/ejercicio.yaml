id: ej-21-50-transpuesta-por-bloques
titulo: Transpuesta por bloques
tema: matrices
bloom: 3
minutos_estimados: 25
pistas:
- Intercambiá cada par de posiciones simétricas una sola vez.
tags:
- matrices
- transpuesta
- bloques
- 2d
- algoritmos
- dep:arreglos
- dep:lazos_anidados
- c11
- intermedia
verificado: false
funciones:
- nombre: transponer_bloques
  retorno: void
  parametros: double **matriz, int n, int tam_bloque
  descripcion: La matriz y sus filas son propiedad de quien llama y no se asigna ni libera memoria. Si
    matriz es NULL, n<=0 o tam_bloque<=0, la función no realiza cambios.
tests_funciones:
- nombre: transpuesta_in_situ_teselas
  funcion: transponer_bloques
  codigo: double r0[]={1,2,3},r1[]={4,5,6},r2[]={7,8,9};double*A[]={r0,r1,r2};transponer_bloques(A,3,2);assert(A[0][0]==1&&A[0][1]==4&&A[0][2]==7&&A[1][0]==2&&A[1][2]==8&&A[2][0]==3&&A[2][1]==6);transponer_bloques(A,3,0);assert(A[0][1]==4);
unidad: 2
modulo: Tipos Compuestos y Direccionamiento
subtema: transpuesta
dificultad: intermedia
tipo: practica_guiada
