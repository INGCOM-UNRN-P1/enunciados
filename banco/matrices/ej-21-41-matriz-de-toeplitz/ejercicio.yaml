id: ej-21-41-matriz-de-toeplitz
titulo: Matriz de Toeplitz
tema: matrices
bloom: 1
minutos_estimados: 10
pistas:
- Recorra filas y columnas respetando los límites.
tags:
- toeplitz
- matrices
- matriz
- 2d
- algoritmos
- dep:arreglos
- dep:lazos_anidados
- c11
- inicial
verificado: true
funciones:
- nombre: es_toeplitz
  retorno: bool
  parametros: int **matriz, int filas, int cols
  descripcion: Determine si cada diagonal descendente de izquierda a derecha contiene valores iguales.
    Para dimensiones positivas, la matriz y sus filas deben ser válidas. Una matriz vacía es Toeplitz;
    dimensiones negativas o punteros inválidos devuelven false.
tests_funciones:
- nombre: casos_de_comportamiento
  funcion: es_toeplitz
  codigo: int a[]={1,2,3},b[]={4,1,2},c[]={5,4,1}; int *m[]={a,b,c}; assert(es_toeplitz(m,3,3)); c[2]=9;
    assert(!es_toeplitz(m,3,3)); assert(es_toeplitz(NULL,0,3)); assert(!es_toeplitz(NULL,1,1)); assert(!es_toeplitz(m,-1,3));
unidad: 2
modulo: Tipos Compuestos y Direccionamiento
subtema: matrices_2d
dificultad: inicial
tipo: practica_guiada
prerrequisitos:
- arreglos
- lazos_anidados
publicar: true
