- adelante
- 2d
- algoritmos
- dep:arreglos
- dep:lazos_anidados
- c11
- intermedia
verificado: true
funciones:
- nombre: sustitucion_adelante
  retorno: double *
  parametros: double **L, double *b, int n
  descripcion: Resuelva Lx=b por sustitución hacia adelante para una matriz triangular inferior de orden
    n. Devuelva un vector reservado para la persona llamadora; devuelva NULL si los argumentos son inválidos,
    algún elemento diagonal es cero o falla la reserva.
tests_funciones:
- nombre: casos_de_comportamiento
  funcion: sustitucion_adelante
  codigo: double a[]={2,0,0},c[]={3,1,0},d[]={1,-1,2},b[]={4,7,4}; double *L[]={a,c,d}; double *x=sustitucion_adelante(L,b,3);
    assert(x && x[0]==2 && x[1]==1 && x[2]==1.5); free(x); c[1]=0; assert(!sustitucion_adelante(L,b,3));
    assert(!sustitucion_adelante(NULL,b,3));
unidad: 2
modulo: Tipos Compuestos y Direccionamiento
subtema: hacia
dificultad: intermedia
tipo: practica_guiada
