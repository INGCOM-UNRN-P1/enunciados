id: ej-21-9-matriz-simetrica
titulo: Matriz simétrica
tema: matrices
bloom: 3
minutos_estimados: 25
pistas:
- '**Fórmula:** Una matriz `A` es simétrica si $A_{ij} = A_{ji}$ para todos los `i`, `j`.'
- '**Proceso:**'
- Recorrer solo la mitad superior (o inferior) de la matriz es suficiente. Por ejemplo, con lazos anidados
  donde el lazo interior para `j` comienza en `i+1`.
- En cada paso, comparar `matriz[i][j]` con `matriz[j][i]`.
- Si en algún momento no son iguales, la matriz no es simétrica y la función puede devolver `falso` inmediatamente.
- '**Salida:** Si los lazos se completan sin encontrar diferencias, la matriz es simétrica.'
- '[Plus Ultra] Garantizar la terminación con `\0` y prevenir desbordamientos de búfer validando la capacidad
  máxima.'
- '[Plus Ultra] Soportar la lectura de cadenas con espacios y múltiples líneas de manera robusta.'
tags:
- matrices
- matriz
- simetrica
- 2d
- algoritmos
- dep:arreglos
- dep:lazos_anidados
- c11
- intermedia
verificado: true
funciones:
- nombre: es_simetrica
  retorno: bool
  parametros: size_t n, const int *matriz
  descripcion: 'Matriz simétrica: es_simetrica'
tests_funciones:
- nombre: test_matriz_simetrica
  funcion: es_simetrica
  codigo: int m[] = {1,7,3,7,4,5,3,5,6}; assert(es_simetrica(3,m));
- nombre: test_matriz_no_simetrica
  funcion: es_simetrica
  codigo: int m[] = {1,2,3,0,4,5,3,5,6}; assert(!es_simetrica(3,m));
- nombre: test_simetrica_1x1
  funcion: es_simetrica
  codigo: int m[] = {-2}; assert(es_simetrica(1,m));
- nombre: test_simetrica_argumentos_invalidos
  funcion: es_simetrica
  codigo: int m[] = {1}; assert(!es_simetrica(0,m)); assert(!es_simetrica(1,NULL));
- nombre: test_rechaza_dimension_que_desborda_size_t
  funcion: es_simetrica
  codigo: int m[] = {0}; assert(!es_simetrica(SIZE_MAX,m));
unidad: 2
modulo: Tipos Compuestos y Direccionamiento
subtema: matrices_2d
