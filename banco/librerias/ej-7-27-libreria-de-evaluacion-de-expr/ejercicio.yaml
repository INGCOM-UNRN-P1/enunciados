id: ej-7-27-libreria-de-evaluacion-de-expr
titulo: Librería de Evaluación de Expresiones lógicas
tema: librerias
bloom: 3
minutos_estimados: 25
pistas:
- Expresá las tablas de verdad en funciones puras sin efectos secundarios.
tags:
- expresiones
- fundamentos
- headers
- evaluacion
- libreria
- dep:funciones
- dep:estructuras
- c11
- intermedia
verificado: true
funciones:
- nombre: eval_and_3
  retorno: bool
  parametros: bool a, bool b, bool c
  descripcion: Conjunción de tres valores.
- nombre: eval_or_3
  retorno: bool
  parametros: bool a, bool b, bool c
  descripcion: Disyunción de tres valores.
- nombre: eval_xor
  retorno: bool
  parametros: bool a, bool b
  descripcion: Disyunción exclusiva.
- nombre: eval_implicacion
  retorno: bool
  parametros: bool p, bool q
  descripcion: Implicación lógica.
- nombre: eval_equivalencia
  retorno: bool
  parametros: bool p, bool q
  descripcion: Equivalencia lógica.
tests_funciones:
- nombre: test_eval_and_3
  funcion: eval_and_3
  codigo: for (int a=0;a<2;a++) for (int b=0;b<2;b++) for (int c=0;c<2;c++) assert(eval_and_3(a,b,c)
    == (a && b && c));
- nombre: test_eval_or_3
  funcion: eval_or_3
  codigo: for (int a=0;a<2;a++) for (int b=0;b<2;b++) for (int c=0;c<2;c++) assert(eval_or_3(a,b,c)
    == (a || b || c));
- nombre: test_eval_xor
  funcion: eval_xor
  codigo: assert(!eval_xor(0,0)); assert(eval_xor(0,1)); assert(eval_xor(1,0)); assert(!eval_xor(1,1));
- nombre: test_eval_implicacion
  funcion: eval_implicacion
  codigo: assert(eval_implicacion(0,0)); assert(eval_implicacion(0,1)); assert(!eval_implicacion(1,0));
    assert(eval_implicacion(1,1));
- nombre: test_eval_equivalencia
  funcion: eval_equivalencia
  codigo: assert(eval_equivalencia(0,0)); assert(!eval_equivalencia(0,1)); assert(!eval_equivalencia(1,0));
    assert(eval_equivalencia(1,1));
unidad: 5
modulo: Ingeniería de Software y Calidad en C
subtema: expresiones
dificultad: intermedia
prerrequisitos:
- funciones
- estructuras
publicar: true
