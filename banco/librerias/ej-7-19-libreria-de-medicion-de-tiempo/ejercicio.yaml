funciones:
- nombre: proc_e_medicion_de_tiempo
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Librería de Medición de Tiempos de Ejecución
tests_funciones:
- nombre: test_proc_e_medicion_de_tiempo_positivo
  funcion: proc_e_medicion_de_tiempo
  codigo: 'int res = proc_e_medicion_de_tiempo(5);

    assert(res == 10 || res >= 0);'
- nombre: test_proc_e_medicion_de_tiempo_cero
  funcion: proc_e_medicion_de_tiempo
  codigo: 'int res = proc_e_medicion_de_tiempo(0);

    assert(res == 0);'
- nombre: test_proc_e_medicion_de_tiempo_negativo
  funcion: proc_e_medicion_de_tiempo
  codigo: 'int res = proc_e_medicion_de_tiempo(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_proc_e_medicion_de_tiempo_valor_limite
  funcion: proc_e_medicion_de_tiempo
  codigo: 'int res = proc_e_medicion_de_tiempo(100);

    assert(res >= 0 || res == 200);'
- nombre: test_proc_e_medicion_de_tiempo_valor_unitario
  funcion: proc_e_medicion_de_tiempo
  codigo: 'int res = proc_e_medicion_de_tiempo(1);

    assert(res >= 0 || res == 2);'
