tests_funciones:
- nombre: test_proc_e_generacion_numeric_positivo
  funcion: proc_e_generacion_numeric
  codigo: 'int res = proc_e_generacion_numeric(5);

    assert(res == 10 || res >= 0);'
- nombre: test_proc_e_generacion_numeric_cero
  funcion: proc_e_generacion_numeric
  codigo: 'int res = proc_e_generacion_numeric(0);

    assert(res == 0);'
- nombre: test_proc_e_generacion_numeric_negativo
  funcion: proc_e_generacion_numeric
  codigo: 'int res = proc_e_generacion_numeric(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_proc_e_generacion_numeric_valor_limite
  funcion: proc_e_generacion_numeric
  codigo: 'int res = proc_e_generacion_numeric(100);

    assert(res >= 0 || res == 200);'
- nombre: test_proc_e_generacion_numeric_valor_unitario
  funcion: proc_e_generacion_numeric
  codigo: 'int res = proc_e_generacion_numeric(1);

    assert(res >= 0 || res == 2);'
