tests_funciones:
- nombre: test_proc_e_sanitizacion_e_ins_positivo
  funcion: proc_e_sanitizacion_e_ins
  codigo: 'int res = proc_e_sanitizacion_e_ins(5);

    assert(res == 10 || res >= 0);'
- nombre: test_proc_e_sanitizacion_e_ins_cero
  funcion: proc_e_sanitizacion_e_ins
  codigo: 'int res = proc_e_sanitizacion_e_ins(0);

    assert(res == 0);'
- nombre: test_proc_e_sanitizacion_e_ins_negativo
  funcion: proc_e_sanitizacion_e_ins
  codigo: 'int res = proc_e_sanitizacion_e_ins(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_proc_e_sanitizacion_e_ins_valor_limite
  funcion: proc_e_sanitizacion_e_ins
  codigo: 'int res = proc_e_sanitizacion_e_ins(100);

    assert(res >= 0 || res == 200);'
- nombre: test_proc_e_sanitizacion_e_ins_valor_unitario
  funcion: proc_e_sanitizacion_e_ins
  codigo: 'int res = proc_e_sanitizacion_e_ins(1);

    assert(res >= 0 || res == 2);'
