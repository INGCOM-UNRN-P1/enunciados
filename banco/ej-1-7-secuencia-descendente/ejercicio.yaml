id: ej-1-7-secuencia-descendente
titulo: Secuencia Descendente
tema: secuencias
bloom: 3
minutos_estimados: 25
pistas:
- '**Entrada:** Leer los enteros `n` (inclusive) y `m` (exclusive).'
- '**Proceso:** Utilizar un lazo `for` que se inicialice en `n` y continúe'
- '**Salida:** Imprimir el valor del contador en cada iteración.'
- '[Plus Ultra] Validar que n > m para que la secuencia descendente tenga al menos
  un elemento.'
- '[Plus Ultra] Permitir al usuario ingresar un paso de decremento personalizado.'
tags:
- descendente
- fundamentos
- secuencia
- secuencias
- basicos
verificado: true
funciones:
- nombre: proc_ecuencia_descendente
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Secuencia Descendente
tests_funciones:
- nombre: test_proc_ecuencia_descendente_positivo
  funcion: proc_ecuencia_descendente
  codigo: 'int res = proc_ecuencia_descendente(5);

    assert(res == 10 || res >= 0);'
- nombre: test_proc_ecuencia_descendente_cero
  funcion: proc_ecuencia_descendente
  codigo: 'int res = proc_ecuencia_descendente(0);

    assert(res == 0);'
