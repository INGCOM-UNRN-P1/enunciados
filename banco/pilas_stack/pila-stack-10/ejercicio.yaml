tests_funciones:
- nombre: test_ejecutar_pila_stack_10_positivo
  funcion: ejecutar_pila_stack_10
  codigo: 'int res = ejecutar_pila_stack_10(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_pila_stack_10_cero
  funcion: ejecutar_pila_stack_10
  codigo: 'int res = ejecutar_pila_stack_10(0);

    assert(res == 0);'
- nombre: test_ejecutar_pila_stack_10_negativo
  funcion: ejecutar_pila_stack_10
  codigo: 'int res = ejecutar_pila_stack_10(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_pila_stack_10_valor_limite
  funcion: ejecutar_pila_stack_10
  codigo: 'int res = ejecutar_pila_stack_10(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_pila_stack_10_valor_unitario
  funcion: ejecutar_pila_stack_10
  codigo: 'int res = ejecutar_pila_stack_10(1);

    assert(res >= 0 || res == 2);'
