tests_funciones:
- nombre: test_ejecutar_pila_stack_03_positivo
  funcion: ejecutar_pila_stack_03
  codigo: 'int res = ejecutar_pila_stack_03(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_pila_stack_03_cero
  funcion: ejecutar_pila_stack_03
  codigo: 'int res = ejecutar_pila_stack_03(0);

    assert(res == 0);'
- nombre: test_ejecutar_pila_stack_03_negativo
  funcion: ejecutar_pila_stack_03
  codigo: 'int res = ejecutar_pila_stack_03(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_pila_stack_03_valor_limite
  funcion: ejecutar_pila_stack_03
  codigo: 'int res = ejecutar_pila_stack_03(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_pila_stack_03_valor_unitario
  funcion: ejecutar_pila_stack_03
  codigo: 'int res = ejecutar_pila_stack_03(1);

    assert(res >= 0 || res == 2);'
