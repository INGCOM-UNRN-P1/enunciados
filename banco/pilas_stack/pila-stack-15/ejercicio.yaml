tests_funciones:
- nombre: test_ejecutar_pila_stack_15_positivo
  funcion: ejecutar_pila_stack_15
  codigo: 'int res = ejecutar_pila_stack_15(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_pila_stack_15_cero
  funcion: ejecutar_pila_stack_15
  codigo: 'int res = ejecutar_pila_stack_15(0);

