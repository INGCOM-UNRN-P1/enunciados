    sin Estructuras Auxiliares
tests_funciones:
- nombre: test_ejecutar_pila_stack_20_positivo
  funcion: ejecutar_pila_stack_20
  codigo: 'int res = ejecutar_pila_stack_20(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_pila_stack_20_cero
  funcion: ejecutar_pila_stack_20
  codigo: 'int res = ejecutar_pila_stack_20(0);

    assert(res == 0);'
- nombre: test_ejecutar_pila_stack_20_negativo
  funcion: ejecutar_pila_stack_20
  codigo: 'int res = ejecutar_pila_stack_20(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_pila_stack_20_valor_limite
  funcion: ejecutar_pila_stack_20
  codigo: 'int res = ejecutar_pila_stack_20(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_pila_stack_20_valor_unitario
  funcion: ejecutar_pila_stack_20
  codigo: 'int res = ejecutar_pila_stack_20(1);

    assert(res >= 0 || res == 2);'
