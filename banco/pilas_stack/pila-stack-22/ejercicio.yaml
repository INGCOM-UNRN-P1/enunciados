verificado: true
funciones:
- nombre: ejecutar_pila_stack_22
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Eliminación del Elemento Medio de una
    Pila
tests_funciones:
- nombre: test_ejecutar_pila_stack_22_positivo
  funcion: ejecutar_pila_stack_22
  codigo: 'int res = ejecutar_pila_stack_22(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_pila_stack_22_cero
  funcion: ejecutar_pila_stack_22
  codigo: 'int res = ejecutar_pila_stack_22(0);

    assert(res == 0);'
- nombre: test_ejecutar_pila_stack_22_negativo
  funcion: ejecutar_pila_stack_22
  codigo: 'int res = ejecutar_pila_stack_22(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_pila_stack_22_valor_limite
  funcion: ejecutar_pila_stack_22
  codigo: 'int res = ejecutar_pila_stack_22(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_pila_stack_22_valor_unitario
  funcion: ejecutar_pila_stack_22
  codigo: 'int res = ejecutar_pila_stack_22(1);

    assert(res >= 0 || res == 2);'
