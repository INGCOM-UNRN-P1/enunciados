id: pila-stack-26
titulo: Emulador de Pila de Máquina Virtual de Bytecode
tema: pilas_stack
bloom: 4
minutos_estimados: 35
pistas:
- La pila opera bajo política LIFO (Last-In, First-Out).
- Manejá el subdesbordamiento (underflow) cuando la pila esté vacía.
tags:
- stack
