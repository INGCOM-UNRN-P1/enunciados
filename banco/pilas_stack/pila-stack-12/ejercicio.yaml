tests_funciones:
- nombre: test_ejecutar_pila_stack_12_positivo
  funcion: ejecutar_pila_stack_12
  codigo: 'int res = ejecutar_pila_stack_12(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_pila_stack_12_cero
  funcion: ejecutar_pila_stack_12
  codigo: 'int res = ejecutar_pila_stack_12(0);

    assert(res == 0);'
- nombre: test_ejecutar_pila_stack_12_negativo
  funcion: ejecutar_pila_stack_12
  codigo: 'int res = ejecutar_pila_stack_12(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_pila_stack_12_valor_limite
  funcion: ejecutar_pila_stack_12
  codigo: 'int res = ejecutar_pila_stack_12(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_pila_stack_12_valor_unitario
  funcion: ejecutar_pila_stack_12
  codigo: 'int res = ejecutar_pila_stack_12(1);

    assert(res >= 0 || res == 2);'
