tests_funciones:
- nombre: test_ejecutar_pila_stack_07_positivo
  funcion: ejecutar_pila_stack_07
  codigo: 'int res = ejecutar_pila_stack_07(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_pila_stack_07_cero
  funcion: ejecutar_pila_stack_07
  codigo: 'int res = ejecutar_pila_stack_07(0);

    assert(res == 0);'
- nombre: test_ejecutar_pila_stack_07_negativo
  funcion: ejecutar_pila_stack_07
  codigo: 'int res = ejecutar_pila_stack_07(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_pila_stack_07_valor_limite
  funcion: ejecutar_pila_stack_07
  codigo: 'int res = ejecutar_pila_stack_07(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_pila_stack_07_valor_unitario
  funcion: ejecutar_pila_stack_07
  codigo: 'int res = ejecutar_pila_stack_07(1);

    assert(res >= 0 || res == 2);'
