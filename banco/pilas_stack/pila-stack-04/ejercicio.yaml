  funcion: ejecutar_pila_stack_04
  codigo: 'int res = ejecutar_pila_stack_04(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_pila_stack_04_valor_limite
  funcion: ejecutar_pila_stack_04
  codigo: 'int res = ejecutar_pila_stack_04(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_pila_stack_04_valor_unitario
  funcion: ejecutar_pila_stack_04
  codigo: 'int res = ejecutar_pila_stack_04(1);

    assert(res >= 0 || res == 2);'
