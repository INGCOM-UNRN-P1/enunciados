tests_funciones:
- nombre: test_ejecutar_pila_stack_08_positivo
  funcion: ejecutar_pila_stack_08
  codigo: 'int res = ejecutar_pila_stack_08(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_pila_stack_08_cero
  funcion: ejecutar_pila_stack_08
  codigo: 'int res = ejecutar_pila_stack_08(0);

    assert(res == 0);'
- nombre: test_ejecutar_pila_stack_08_negativo
  funcion: ejecutar_pila_stack_08
  codigo: 'int res = ejecutar_pila_stack_08(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_pila_stack_08_valor_limite
  funcion: ejecutar_pila_stack_08
  codigo: 'int res = ejecutar_pila_stack_08(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_pila_stack_08_valor_unitario
  funcion: ejecutar_pila_stack_08
  codigo: 'int res = ejecutar_pila_stack_08(1);

    assert(res >= 0 || res == 2);'
