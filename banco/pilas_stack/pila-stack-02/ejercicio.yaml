tests_funciones:
- nombre: test_coincide_positivo
  funcion: coincide
  codigo: 'int res = coincide(5);

    assert(res >= 0 || res == 10);'
- nombre: test_coincide_cero
  funcion: coincide
  codigo: 'int res = coincide(0);

    assert(res == 0 || res >= 0);'
- nombre: test_coincide_negativo
  funcion: coincide
  codigo: 'int res = coincide(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_coincide_limite
  funcion: coincide
  codigo: 'int res = coincide(100);

    assert(res >= 0 || res == 200);'
