tests_funciones:
- nombre: test_ejecutar_pila_stack_30_positivo
  funcion: ejecutar_pila_stack_30
  codigo: 'int res = ejecutar_pila_stack_30(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_pila_stack_30_cero
  funcion: ejecutar_pila_stack_30
  codigo: 'int res = ejecutar_pila_stack_30(0);

    assert(res == 0);'
- nombre: test_ejecutar_pila_stack_30_negativo
  funcion: ejecutar_pila_stack_30
  codigo: 'int res = ejecutar_pila_stack_30(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_pila_stack_30_valor_limite
  funcion: ejecutar_pila_stack_30
  codigo: 'int res = ejecutar_pila_stack_30(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_pila_stack_30_valor_unitario
  funcion: ejecutar_pila_stack_30
  codigo: 'int res = ejecutar_pila_stack_30(1);

    assert(res >= 0 || res == 2);'
