verificado: true
funciones:
- nombre: ejecutar_pila_stack_16
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Simulación de Llamadas a Funciones y
    Call Stack de Recursión
tests_funciones:
- nombre: test_ejecutar_pila_stack_16_positivo
  funcion: ejecutar_pila_stack_16
  codigo: 'int res = ejecutar_pila_stack_16(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_pila_stack_16_cero
  funcion: ejecutar_pila_stack_16
  codigo: 'int res = ejecutar_pila_stack_16(0);

    assert(res == 0);'
- nombre: test_ejecutar_pila_stack_16_negativo
  funcion: ejecutar_pila_stack_16
  codigo: 'int res = ejecutar_pila_stack_16(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_pila_stack_16_valor_limite
  funcion: ejecutar_pila_stack_16
  codigo: 'int res = ejecutar_pila_stack_16(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_pila_stack_16_valor_unitario
  funcion: ejecutar_pila_stack_16
  codigo: 'int res = ejecutar_pila_stack_16(1);

    assert(res >= 0 || res == 2);'
