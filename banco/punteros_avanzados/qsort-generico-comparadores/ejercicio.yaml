pistas:
- La firma canónica de comparación es `int comparador(const void *a, const void 
  *b)`.
- Casteá los punteros opacos `const void *` a punteros de la estructura 
  correspondiente.
- Para cadenas usá `strcmp()`, y para valores de punto flotante evaluá 
  diferencias con cuidado de signo.
