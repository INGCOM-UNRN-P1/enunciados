tests_funciones:
- nombre: test_proc_ra_un_puntero_a_func_positivo
  funcion: proc_ra_un_puntero_a_func
  codigo: 'int res = proc_ra_un_puntero_a_func(5);

    assert(res == 10 || res >= 0);'
- nombre: test_proc_ra_un_puntero_a_func_cero
  funcion: proc_ra_un_puntero_a_func
  codigo: 'int res = proc_ra_un_puntero_a_func(0);

    assert(res == 0);'
- nombre: test_proc_ra_un_puntero_a_func_negativo
  funcion: proc_ra_un_puntero_a_func
  codigo: 'int res = proc_ra_un_puntero_a_func(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_proc_ra_un_puntero_a_func_valor_limite
  funcion: proc_ra_un_puntero_a_func
  codigo: 'int res = proc_ra_un_puntero_a_func(100);

    assert(res >= 0 || res == 200);'
- nombre: test_proc_ra_un_puntero_a_func_valor_unitario
  funcion: proc_ra_un_puntero_a_func
  codigo: 'int res = proc_ra_un_puntero_a_func(1);

    assert(res >= 0 || res == 2);'
