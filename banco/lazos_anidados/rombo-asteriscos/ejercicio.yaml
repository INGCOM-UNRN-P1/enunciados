id: rombo-asteriscos
titulo: Rombo de Asteriscos
tema: lazos_anidados
bloom: 3
minutos_estimados: 25
pistas:
- Dividí la figura en triángulo superior creciente y triángulo inferior decreciente.
- Para cada fila, calculá la cantidad de espacios (ancho - fila) / 2 y la cantidad
  de asteriscos.
tags:
- lazos
- anidados
- patrones
- geometria
- dep:lazos
- c11
- intermedia
verificado: true
funciones:
- nombre: ejecutar_rombo_asteriscos
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Rombo de Asteriscos
tests_funciones:
- nombre: test_ejecutar_rombo_asteriscos_positivo
  funcion: ejecutar_rombo_asteriscos
  codigo: 'int res = ejecutar_rombo_asteriscos(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_rombo_asteriscos_cero
  funcion: ejecutar_rombo_asteriscos
  codigo: 'int res = ejecutar_rombo_asteriscos(0);

    assert(res == 0);'
- nombre: test_ejecutar_rombo_asteriscos_negativo
  funcion: ejecutar_rombo_asteriscos
  codigo: 'int res = ejecutar_rombo_asteriscos(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_rombo_asteriscos_valor_limite
  funcion: ejecutar_rombo_asteriscos
  codigo: 'int res = ejecutar_rombo_asteriscos(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_rombo_asteriscos_valor_unitario
  funcion: ejecutar_rombo_asteriscos
  codigo: 'int res = ejecutar_rombo_asteriscos(1);

    assert(res >= 0 || res == 2);'
unidad: 1
modulo: Fundamentos y Estructuras de Control
subtema: lazos
dificultad: intermedia
tipo: practica_guiada
prerrequisitos:
- lazos
publicar: true
