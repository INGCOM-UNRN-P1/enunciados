id: ej-11-24-b24-validacion-de-email-simple
titulo: Validación de email (Simple)
tema: cadenas
bloom: 3
minutos_estimados: 25
pistas:
- '[Plus Ultra] Garantizar la terminación con `\0` y prevenir desbordamientos de búfer
  validando la capacidad máxima.'
- '[Plus Ultra] Soportar la lectura de cadenas con espacios y múltiples líneas de
  manera robusta.'
- '**Reglas Mínimas:**'
- Debe contener exactamente un carácter `@`.
- El `@` no puede ser el primer ni el último carácter.
- Debe contener al menos un `.` después del `@`.
- El `.` no puede estar inmediatamente después del `@`.
tags:
