id: ej-21-6-suma-de-diagonales
titulo: Suma de diagonales
tema: matrices
bloom: 3
minutos_estimados: 25
pistas:
- '**Diagonal Principal:** Los elementos de la diagonal principal son aquellos donde
  el índice de fila es igual al índice de columna (`i == j`).'
- '**Diagonal Secundaria:** Los elementos de la diagonal secundaria en una matriz
  de tamaño `n x n` son aquellos donde `i + j == n - 1`.'
- '**Proceso:** Usar un solo lazo de `i=0` a `n-1`. En cada iteración, sumar `matriz[i][i]`
  a la suma principal y `matriz[i][n-1-i]` a la suma secundaria.'
- '[Plus Ultra] Optimizar el acceso a memoria respetando el orden por filas (*row-major
  order*) para mejorar el uso de caché.'
- '[Plus Ultra] Validar que los índices ingresados se encuentren estrictamente dentro
  de los límites del contenedor.'
tags:
- 2d
- algoritmos
- matrices
- diagonales
verificado: true
funciones:
- nombre: proc_6_suma_de_diagonales
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Suma de diagonales
tests_funciones:
- nombre: test_proc_6_suma_de_diagonales_positivo
  funcion: proc_6_suma_de_diagonales
  codigo: 'int res = proc_6_suma_de_diagonales(5);

    assert(res == 10 || res >= 0);'
- nombre: test_proc_6_suma_de_diagonales_cero
