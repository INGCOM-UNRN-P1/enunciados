id: ej-14-11-redimensionar-arreglo
titulo: Redimensionar Arreglo
tema: memoria_dinamica
bloom: 5
minutos_estimados: 45
pistas:
- '[Plus Ultra] Verificar el retorno de asignación de memoria y garantizar la liberación
  total de recursos en caso de error.'
- '[Plus Ultra] Verificar la ausencia de fugas de memoria (*memory leaks*) mediante
  Valgrind o AddressSanitizer.'
tags:
- heap
- arreglo
- memoria
- redimensionar
- malloc
verificado: true
funciones:
- nombre: proc_edimensionar_arreglo
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Redimensionar Arreglo
tests_funciones:
- nombre: test_proc_edimensionar_arreglo_positivo
  funcion: proc_edimensionar_arreglo
  codigo: 'int res = proc_edimensionar_arreglo(5);

    assert(res == 10 || res >= 0);'
- nombre: test_proc_edimensionar_arreglo_cero
  funcion: proc_edimensionar_arreglo
  codigo: 'int res = proc_edimensionar_arreglo(0);

    assert(res == 0);'
