id: ej-11-18-b18-invertir-orden-de-las-pala
titulo: Invertir orden de las palabras
tema: cadenas
bloom: 1
minutos_estimados: 10
pistas:
- '[Plus Ultra] Garantizar la terminación con `\0` y prevenir desbordamientos de búfer
  validando la capacidad máxima.'
- '[Plus Ultra] Soportar la lectura de cadenas con espacios y múltiples líneas de
  manera robusta.'
- '**Proceso (dos pasos):**'
- Invertir la cadena de caracteres completa. ("Hola Mundo desde C" -> "C edsed 
  odnuM aloH").
- Recorrer la nueva cadena e invertir cada palabra individualmente (usando la 
  lógica del ejercicio 5.1). ("C" -> "C", "edsed" -> "desde", etc.).
