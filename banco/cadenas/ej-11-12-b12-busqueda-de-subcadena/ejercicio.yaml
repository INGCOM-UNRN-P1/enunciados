id: ej-11-12-b12-busqueda-de-subcadena
titulo: Búsqueda de subcadena
tema: cadenas
bloom: 3
minutos_estimados: 25
pistas:
- '[Plus Ultra] Validar punteros `NULL` recibidos como parámetro para evitar fallos
  de segmentación.'
- '[Plus Ultra] Implementar una versión utilizando aritmética de punteros en lugar
  de indexación directa.'
- '**Proceso (Fuerza Bruta):**'
- Usar un lazo exterior para recorrer la cadena `haystack` con un índice `i`.
- En cada posición `i`, usar un lazo interior para comparar la subcadena de 
  `haystack` que empieza en `i` con la cadena `needle`.
- Si todos los caracteres de `needle` coinciden, devolver la posición `i` (o un 
  puntero a `haystack[i]`).
- Si el lazo exterior termina, la subcadena no se encontró.
