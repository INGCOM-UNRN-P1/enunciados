id: ej-11-22-b22-recorte-de-cadena-trim
titulo: Recorte de cadena (Trim)
tema: cadenas
bloom: 3
minutos_estimados: 25
pistas:
- '[Plus Ultra] Validar punteros `NULL` recibidos como parámetro para evitar fallos
  de segmentación.'
- '[Plus Ultra] Implementar una versión utilizando aritmética de punteros en lugar
  de indexación directa.'
- '**Proceso (dos etapas):**'
- '**Eliminar espacios del final:** Recorrer la cadena desde el final hacia el principio.
  Mientras se encuentren espacios, reemplazarlos por el carácter nulo `\0`.'
- '**Eliminar espacios del principio:** Encontrar el puntero al primer carácter que
  no sea un espacio. Luego, mover todo el bloque de la cadena (incluyendo el terminador
  nulo) a la posición inicial usando `memmove`.'
- '**Funciones de Biblioteca:** `isspace()` de `ctype.h` es útil para detectar cualquier
  tipo de carácter de espaciado.'
tags:
- cadenas
- strings
- recorte
- memoria
- cadena
- dep:arreglos
- dep:caracteres
- c11
- intermedia
verificado: true
funciones:
- nombre: trim
  retorno: char *
  parametros: char *cadena
  descripcion: Elimina in-place whitespace inicial y final; conserva el contenido intermedio y devuelve cadena, o NULL si recibe NULL.
tests_funciones:
- nombre: test_trim_espacios_en_extremos
  funcion: trim
  codigo: |-
    char texto[] = "  Hola mundo  ";
    assert(trim(texto) == texto);
    assert(strcmp(texto, "Hola mundo") == 0);
- nombre: test_trim_tab_y_nueva_linea
  funcion: trim
  codigo: |-
    char texto[] = "\t\ntexto\r\n";
    assert(trim(texto) == texto);
    assert(strcmp(texto, "texto") == 0);
- nombre: test_trim_contenido_interno
  funcion: trim
  codigo: |-
    char texto[] = "  dos  palabras  ";
    trim(texto);
    assert(strcmp(texto, "dos  palabras") == 0);
- nombre: test_trim_cadena_vacia
  funcion: trim
  codigo: |-
    char texto[] = "";
    assert(trim(texto) == texto);
    assert(strcmp(texto, "") == 0);
- nombre: test_trim_solo_whitespace
  funcion: trim
  codigo: |-
    char texto[] = " \t\n";
    assert(trim(texto) == texto);
    assert(strcmp(texto, "") == 0);
- nombre: test_trim_null
  funcion: trim
  codigo: |-
    assert(trim(NULL) == NULL);
unidad: 2
modulo: Tipos Compuestos y Direccionamiento
subtema: procesamiento_texto
dificultad: intermedia
tipo: practica_guiada
prerrequisitos:
- arreglos
- caracteres
publicar: true
