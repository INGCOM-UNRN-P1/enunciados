id: ej-11-21-b21-eliminar-espacios-extra
titulo: Eliminar espacios extra
tema: cadenas
bloom: 3
minutos_estimados: 25
pistas:
- '[Plus Ultra] Validar punteros `NULL` recibidos como parámetro para evitar fallos
  de segmentación.'
- '[Plus Ultra] Implementar una versión utilizando aritmética de punteros en lugar
  de indexación directa.'
- '**Proceso (in-place con dos punteros):**'
- Usar un `puntero_lectura` y un `puntero_escritura`.
- Recorrer la cadena con `puntero_lectura`.
- 'Copiar un carácter de lectura a escritura solo si no es un espacio redundante.
  La condición para copiar podría ser: `si el carácter actual no es un espacio, O
  si el carácter anterior copiado no fue un espacio`.'
- Manejar los espacios al principio como un caso especial.
