id: ej-11-8-b8-tokenizacion
titulo: Tokenización
tema: cadenas
bloom: 3
minutos_estimados: 25
pistas:
- '[Plus Ultra] Validar punteros `NULL` recibidos como parámetro para evitar fallos
  de segmentación.'
- '[Plus Ultra] Implementar una versión utilizando aritmética de punteros en lugar
  de indexación directa.'
- '**Modificación _in-place_:** `strtok` funciona modificando la cadena original.
  Reemplaza el delimitador encontrado por un carácter nulo (`\0`), terminando así
  el token actual, y guarda un puntero interno para saber dónde continuar la próxima
  vez.'
- '**Proceso (simplificado):**'
- En la primera llamada, se pasa la cadena. La función busca el primer 
  delimitador.
- Reemplaza el delimitador por `\0`.
- Guarda la posición siguiente al `\0` en un puntero estático.
- Devuelve el puntero al inicio del token.
- En llamadas subsiguientes con `NULL`, la función usa el puntero estático para 
  continuar desde donde se quedó.
