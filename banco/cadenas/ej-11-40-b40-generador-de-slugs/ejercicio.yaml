id: ej-11-40-b40-generador-de-slugs
titulo: Generador de "Slugs"
tema: cadenas
bloom: 3
minutos_estimados: 25
pistas:
- '[Plus Ultra] Garantizar la terminación con `\0` y prevenir desbordamientos de búfer
  validando la capacidad máxima.'
- '[Plus Ultra] Soportar la lectura de cadenas con espacios y múltiples líneas de
  manera robusta.'
- '**Proceso:**'
- Recorrer la cadena de entrada.
- Para cada carácter, convertirlo a minúscula.
- Si es una letra o un número, añadirlo a la cadena de resultado.
- Si es un espacio, y el último carácter añadido al resultado no fue un guion, 
  añadir un guion.
- Ignorar todos los demás caracteres.
