id: ej-11-27-b27-encontrar-el-caracter-mas
titulo: Encontrar el carácter más frecuente
tema: cadenas
bloom: 3
minutos_estimados: 25
pistas:
- '[Plus Ultra] Garantizar la terminación con `\0` y prevenir desbordamientos de búfer
  validando la capacidad máxima.'
- '[Plus Ultra] Soportar la lectura de cadenas con espacios y múltiples líneas de
  manera robusta.'
- '**Proceso:**'
- Usar un arreglo de frecuencias de 256 enteros, como en el ejercicio 1.2.
- Llenar el arreglo de frecuencias recorriendo la cadena.
- Recorrer el arreglo de frecuencias para encontrar el índice que tiene el valor
  más alto. Ese índice es el código ASCII del carácter más frecuente.
tags:
