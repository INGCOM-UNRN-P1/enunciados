id: ej-11-31-b31-acronimo
titulo: Acrónimo
tema: cadenas
bloom: 3
minutos_estimados: 25
pistas:
- '[Plus Ultra] Garantizar la terminación con `\0` y prevenir desbordamientos de búfer validando la capacidad
  máxima.'
- '[Plus Ultra] Soportar la lectura de cadenas con espacios y múltiples líneas de manera robusta.'
- '**Proceso:**'
- Recorrer la cadena.
- Usar una bandera o estado para saber si el carácter actual es el inicio de una nueva palabra.
- Si es el inicio de una palabra y es una letra, añadirla (en mayúscula) a la cadena de resultado.
tags:
- acronimo
- cadenas
- strings
- memoria
- dep:arreglos
- dep:caracteres
- c11
- intermedia
verificado: true
funciones:
- nombre: generar_acronimo
  retorno: int
  parametros: const char *frase, char *salida, size_t capacidad
  descripcion: Escribe en salida la primera letra de cada palabra en mayúscula; devuelve 0 si tuvo éxito
    y -1 si los argumentos o la capacidad no son válidos.
tests_funciones:
- nombre: acronimo_frase_conocida
  funcion: generar_acronimo
  codigo: char salida[8]; assert(generar_acronimo("Universidad Nacional de Rio Negro", salida, sizeof
    salida) == 0); assert(strcmp(salida, "UNDRN") == 0);
- nombre: acronimo_espacios_repetidos
  funcion: generar_acronimo
  codigo: char salida[8]; assert(generar_acronimo("  programming   in C ", salida, sizeof salida) == 0);
    assert(strcmp(salida, "PIC") == 0);
- nombre: acronimo_sin_letras
  funcion: generar_acronimo
  codigo: char salida[2] = "x"; assert(generar_acronimo("123 !", salida, sizeof salida) == 0); assert(strcmp(salida,
    "") == 0);
- nombre: acronimo_sin_capacidad
  funcion: generar_acronimo
  codigo: char salida[2]; assert(generar_acronimo("Very Long", salida, sizeof salida) == -1);
- nombre: acronimo_argumentos_nulos
  funcion: generar_acronimo
  codigo: char salida[2]; assert(generar_acronimo(NULL, salida, sizeof salida) == -1); assert(generar_acronimo("abc",
    salida, 0) == -1);
unidad: 2
modulo: Tipos Compuestos y Direccionamiento
subtema: procesamiento_texto
dificultad: intermedia
tipo: practica_guiada
prerrequisitos:
- arreglos
- caracteres
publicar: true
