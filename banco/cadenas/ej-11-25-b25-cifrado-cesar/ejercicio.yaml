id: ej-11-25-b25-cifrado-cesar
titulo: Cifrado César
tema: cadenas
bloom: 3
minutos_estimados: 25
pistas:
- '[Plus Ultra] Garantizar la terminación con `\0` y prevenir desbordamientos de búfer
  validando la capacidad máxima.'
- '[Plus Ultra] Soportar la lectura de cadenas con espacios y múltiples líneas de
  manera robusta.'
- '**Proceso:**'
- Recorrer la cadena de entrada.
- Para cada carácter, si es una letra, aplicar el desplazamiento.
- El desplazamiento es circular. Si al desplazar 'y' 3 posiciones se pasa de 
  'z', se debe volver al principio del alfabeto. Esto se logra con el operador 
  módulo (`%`).
- 'Ejemplo para una letra minúscula `c`: `''a'' + (c - ''a'' + desplazamiento) % 26`.'
