id: ej-11-29-b29-extraer-subcadena
titulo: Extraer subcadena
tema: cadenas
bloom: 5
minutos_estimados: 45
pistas:
- '[Plus Ultra] Verificar el retorno de asignación de memoria y garantizar la liberación
  total de recursos en caso de error.'
- '[Plus Ultra] Verificar la ausencia de fugas de memoria (*memory leaks*) mediante
  Valgrind o AddressSanitizer.'
- '**Memoria:** La función debe reservar memoria para la nueva cadena.'
- '**Proceso:**'
- Calcular la longitud de la subcadena y reservar memoria (longitud + 1 para el 
  `\0`).
- Copiar los caracteres desde la posición de inicio de la cadena original a la 
  nueva cadena.
- Añadir el terminador nulo `\0` al final de la nueva cadena.
