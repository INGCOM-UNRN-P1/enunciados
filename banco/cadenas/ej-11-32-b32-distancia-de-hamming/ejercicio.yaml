id: ej-11-32-b32-distancia-de-hamming
titulo: Distancia de Hamming
tema: cadenas
bloom: 3
minutos_estimados: 25
pistas:
- '[Plus Ultra] Garantizar la terminación con `\0` y prevenir desbordamientos de búfer validando la capacidad
  máxima.'
- '[Plus Ultra] Soportar la lectura de cadenas con espacios y múltiples líneas de manera robusta.'
- '**Precondición:** Las cadenas deben tener la misma longitud.'
- '**Proceso:**'
- Inicializar un `contador` en 0.
- Recorrer ambas cadenas simultáneamente con un lazo `for`.
- En cada posición `i`, si `cadena1[i] != cadena2[i]`, incrementar el `contador`.
tags:
- cadenas
- strings
- hamming
- distancia
- memoria
- dep:arreglos
- dep:caracteres
- c11
- intermedia
verificado: true
funciones:
- nombre: distancia_hamming
  retorno: int
  parametros: const char *cadena1, const char *cadena2
  descripcion: Cuenta las posiciones diferentes entre cadenas de igual longitud; retorna -1 ante argumentos
    inválidos.
tests_funciones:
- nombre: hamming_cadenas_iguales
  funcion: distancia_hamming
  codigo: assert(distancia_hamming("gato", "gato") == 0);
- nombre: hamming_cuenta_diferencias
  funcion: distancia_hamming
  codigo: assert(distancia_hamming("karolin", "kathrin") == 3);
- nombre: hamming_diferencia_en_ultima_posicion
  funcion: distancia_hamming
  codigo: assert(distancia_hamming("1011101", "1001001") == 2);
- nombre: hamming_cadenas_vacias
  funcion: distancia_hamming
  codigo: assert(distancia_hamming("", "") == 0);
- nombre: hamming_longitudes_distintas
  funcion: distancia_hamming
  codigo: assert(distancia_hamming("abc", "ab") == -1);
- nombre: hamming_puntero_nulo
  funcion: distancia_hamming
  codigo: assert(distancia_hamming(NULL, "") == -1);
unidad: 2
modulo: Tipos Compuestos y Direccionamiento
subtema: procesamiento_texto
dificultad: intermedia
tipo: practica_guiada
prerrequisitos:
- arreglos
- caracteres
publicar: true
