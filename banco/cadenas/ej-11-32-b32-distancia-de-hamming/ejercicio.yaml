id: ej-11-32-b32-distancia-de-hamming
titulo: Distancia de Hamming
tema: cadenas
bloom: 3
minutos_estimados: 25
pistas:
- '[Plus Ultra] Garantizar la terminación con `\0` y prevenir desbordamientos de búfer
  validando la capacidad máxima.'
- '[Plus Ultra] Soportar la lectura de cadenas con espacios y múltiples líneas de
  manera robusta.'
- '**Precondición:** Las cadenas deben tener la misma longitud.'
- '**Proceso:**'
- Inicializar un `contador` en 0.
- Recorrer ambas cadenas simultáneamente con un lazo `for`.
- En cada posición `i`, si `cadena1[i] != cadena2[i]`, incrementar el 
  `contador`.
tags:
