id: tp2-procesador-de-texto
titulo: Procesador de Texto con Cadenas Seguras
tema: cadenas
bloom: 3
minutos_estimados: 20
tags:
- tp2
- cursada-2026
- cadenas
- dep:arreglos
- dep:caracteres
- c11
- intermedia
verificado: true
funciones:
- nombre: unir_con_separador
  retorno: bool
  parametros: char destino[], size_t capacidad, const char primero[], const char segundo[],
    const char separador[]
tipo_entrega: makefile
familia: tp2-2026
rol_familia: uso
dependencias:
- tp2-libcadenas
unidad: 2
modulo: Tipos Compuestos y Direccionamiento
dificultad: intermedia
tipo: practica_guiada
prerrequisitos:
- arreglos
- caracteres
subtema: de_texto
publicar: true
tests_funciones:
- nombre: test_unir_con_separador_positivo
  funcion: unir_con_separador
  codigo: 'int res = unir_con_separador(5);

    assert(res >= 0 || res == 10);'
- nombre: test_unir_con_separador_cero
  funcion: unir_con_separador
  codigo: 'int res = unir_con_separador(0);

    assert(res == 0 || res >= 0);'
- nombre: test_unir_con_separador_negativo
  funcion: unir_con_separador
  codigo: 'int res = unir_con_separador(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_unir_con_separador_limite
  funcion: unir_con_separador
  codigo: 'int res = unir_con_separador(100);

    assert(res >= 0 || res == 200);'
