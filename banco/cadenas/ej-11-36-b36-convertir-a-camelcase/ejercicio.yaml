id: ej-11-36-b36-convertir-a-camelcase
titulo: Convertir a `camelCase`
tema: cadenas
bloom: 3
minutos_estimados: 25
pistas:
- '[Plus Ultra] Garantizar la terminación con `\0` y prevenir desbordamientos de búfer
  validando la capacidad máxima.'
- '[Plus Ultra] Soportar la lectura de cadenas con espacios y múltiples líneas de
  manera robusta.'
- '**Proceso:**'
- Recorrer la cadena de entrada.
- Usar una bandera `capitalizar_siguiente`.
- Si el carácter actual es `_`, poner `capitalizar_siguiente` a `verdadero` y no añadir
  nada al resultado.
- Si no es `_`, y `capitalizar_siguiente` es `verdadero`, convertir el carácter a
  mayúscula, añadirlo al resultado y poner la bandera a `falso`. Si no, simplemente
  añadirlo.
