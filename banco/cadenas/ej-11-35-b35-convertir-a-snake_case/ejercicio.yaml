id: ej-11-35-b35-convertir-a-snake_case
titulo: Convertir a `snake_case`
tema: cadenas
bloom: 3
minutos_estimados: 25
pistas:
- '[Plus Ultra] Garantizar la terminación con `\0` y prevenir desbordamientos de búfer
  validando la capacidad máxima.'
- '[Plus Ultra] Soportar la lectura de cadenas con espacios y múltiples líneas de
  manera robusta.'
- '**Proceso:**'
- Recorrer la cadena de entrada.
- Si se encuentra una letra mayúscula (y no es el primer carácter), añadir un 
  `_` a la cadena de resultado antes de añadir la letra.
- Convertir cada carácter a minúscula antes de añadirlo a la cadena de 
  resultado.
