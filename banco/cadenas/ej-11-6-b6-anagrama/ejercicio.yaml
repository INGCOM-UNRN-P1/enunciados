id: ej-11-6-b6-anagrama
titulo: Anagrama
tema: cadenas
bloom: 3
minutos_estimados: 25
pistas:
- '[Plus Ultra] Garantizar la terminación con `\0` y prevenir desbordamientos de búfer
  validando la capacidad máxima.'
- '[Plus Ultra] Soportar la lectura de cadenas con espacios y múltiples líneas de
  manera robusta.'
- '**Proceso (Arreglo de Frecuencias):**'
- Crear un arreglo de contadores de 26 posiciones (para el alfabeto), 
  inicializado en cero.
- Recorrer la primera cadena. Para cada carácter alfabético, incrementar el 
  contador correspondiente (ej. para 'c', `contadores[2]++`).
- Recorrer la segunda cadena. Para cada carácter alfabético, decrementar el 
  contador correspondiente.
- Finalmente, recorrer el arreglo de contadores. Si todos los contadores son 
  cero, las cadenas son anagramas.
tags:
