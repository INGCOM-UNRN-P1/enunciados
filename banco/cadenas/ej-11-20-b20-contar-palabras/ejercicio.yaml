id: ej-11-20-b20-contar-palabras
titulo: Contar palabras
tema: cadenas
bloom: 3
minutos_estimados: 25
pistas:
- '[Plus Ultra] Garantizar la terminación con `\0` y prevenir desbordamientos de búfer
  validando la capacidad máxima.'
- '[Plus Ultra] Soportar la lectura de cadenas con espacios y múltiples líneas de
  manera robusta.'
- '**Máquina de Estados:** Una forma robusta de hacerlo es con una máquina de estados
  simple con dos estados: `DENTRO_DE_PALABRA` y `FUERA_DE_PALABRA`.'
- '**Proceso:**'
- Inicializar `contador_palabras = 0` y `estado = FUERA_DE_PALABRA`.
- Recorrer la cadena. Si se está `FUERA_DE_PALABRA` y se encuentra un carácter que
  no es un espacio, se ha encontrado el inicio de una nueva palabra. Incrementar `contador_palabras`
  y cambiar a `estado = DENTRO_DE_PALABRA`.
- Si se está `DENTRO_DE_PALABRA` y se encuentra un espacio, cambiar a `estado = FUERA_DE_PALABRA`.
tags:
- contar
- cadenas
- strings
- memoria
- palabras
- dep:arreglos
- dep:caracteres
- c11
- intermedia
verificado: true
funciones:
- nombre: contar_palabras
  retorno: size_t
  parametros: const char *cadena
  descripcion: Cuenta las palabras separadas por uno o más espacios; NULL equivale a cadena vacía.
tests_funciones:
- nombre: test_contar_palabras_frase
  funcion: contar_palabras
  codigo: |-
    assert(contar_palabras("Hola mundo desde C") == 4);
- nombre: test_contar_palabras_espacios_repetidos
  funcion: contar_palabras
  codigo: |-
    assert(contar_palabras("  Hola   mundo  ") == 2);
- nombre: test_contar_palabras_cadena_vacia
  funcion: contar_palabras
  codigo: |-
    assert(contar_palabras("") == 0);
- nombre: test_contar_palabras_solo_espacios
  funcion: contar_palabras
  codigo: |-
    assert(contar_palabras("   ") == 0);
- nombre: test_contar_palabras_whitespace
  funcion: contar_palabras
  codigo: |-
    assert(contar_palabras("uno\tdos\ntres") == 3);
- nombre: test_contar_palabras_null
  funcion: contar_palabras
  codigo: |-
    assert(contar_palabras(NULL) == 0);
unidad: 2
modulo: Tipos Compuestos y Direccionamiento
subtema: procesamiento_texto
dificultad: intermedia
tipo: practica_guiada
prerrequisitos:
- arreglos
- caracteres
publicar: true
