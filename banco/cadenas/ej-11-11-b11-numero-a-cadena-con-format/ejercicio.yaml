id: ej-11-11-b11-numero-a-cadena-con-format
titulo: Número a cadena con formato
tema: cadenas
bloom: 5
minutos_estimados: 45
pistas:
- '[Plus Ultra] Verificar el retorno de asignación de memoria y garantizar la liberación
  total de recursos en caso de error.'
- '[Plus Ultra] Verificar la ausencia de fugas de memoria (*memory leaks*) mediante
  Valgrind o AddressSanitizer.'
- '**Proceso:**'
- Convertir el número a una cadena simple primero (usando `sprintf` o un 
  algoritmo manual).
- Calcular cuántos separadores se necesitan.
- Crear una nueva cadena con el tamaño suficiente para albergar los dígitos y 
  los separadores.
- Copiar los dígitos de la cadena original a la nueva, insertando los 
  separadores en las posiciones correctas. Es más fácil hacerlo de derecha a 
  izquierda.
