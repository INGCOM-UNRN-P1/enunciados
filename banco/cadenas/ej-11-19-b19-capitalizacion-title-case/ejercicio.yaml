id: ej-11-19-b19-capitalizacion-title-case
titulo: Capitalización (Title Case)
tema: cadenas
bloom: 3
minutos_estimados: 25
pistas:
- '[Plus Ultra] Garantizar la terminación con `\0` y prevenir desbordamientos de búfer
  validando la capacidad máxima.'
- '[Plus Ultra] Soportar la lectura de cadenas con espacios y múltiples líneas de
  manera robusta.'
- '**Proceso:**'
- Convertir toda la cadena a minúsculas para empezar desde un estado base 
  consistente.
- Capitalizar el primer carácter de la cadena (si es una letra).
- Recorrer la cadena. Si se encuentra un espacio (u otro delimitador de 
  palabra), capitalizar el siguiente carácter si es una letra.
tags:
