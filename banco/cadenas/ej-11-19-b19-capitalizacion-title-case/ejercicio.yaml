tests_funciones:
- nombre: test_proc_alizacion_title_case_positivo
  funcion: proc_alizacion_title_case
  codigo: 'int res = proc_alizacion_title_case(5);

    assert(res == 10 || res >= 0);'
- nombre: test_proc_alizacion_title_case_cero
  funcion: proc_alizacion_title_case
