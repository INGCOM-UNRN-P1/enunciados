id: suma-n-numeros
titulo: Suma de N Números
tema: lazos
bloom: 3
minutos_estimados: 25
pistas:
- Verificá que N sea un número positivo (N > 0).
- Acumulá la suma de 1 hasta N mediante un lazo for.
tags:
- lazos
- for
- acumulador
- dep:condicionales
verificado: true
funciones:
- nombre: ejecutar_suma_n_numeros
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Suma de N Números
tests_funciones:
- nombre: test_ejecutar_suma_n_numeros_positivo
  funcion: ejecutar_suma_n_numeros
  codigo: 'int res = ejecutar_suma_n_numeros(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_suma_n_numeros_cero
  funcion: ejecutar_suma_n_numeros
  codigo: 'int res = ejecutar_suma_n_numeros(0);

    assert(res == 0);'
unidad: 1
modulo: Fundamentos y Estructuras de Control
