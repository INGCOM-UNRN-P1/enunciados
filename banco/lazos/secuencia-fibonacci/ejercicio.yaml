  funcion: ejecutar_secuencia_fibonacci
  codigo: 'int res = ejecutar_secuencia_fibonacci(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_secuencia_fibonacci_cero
  funcion: ejecutar_secuencia_fibonacci
  codigo: 'int res = ejecutar_secuencia_fibonacci(0);

    assert(res == 0);'
