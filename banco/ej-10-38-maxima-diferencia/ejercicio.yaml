id: ej-10-38-maxima-diferencia
titulo: Máxima diferencia
tema: arreglos
bloom: 3
minutos_estimados: 25
pistas:
- '**Proceso (un solo recorrido):**'
- 'Mantener dos variables: `max_diferencia` y `min_elemento`.'
- Inicializar `max_diferencia` a un valor muy bajo y `min_elemento` con el primer
  elemento.
- 'Recorrer el arreglo desde el segundo elemento. En cada paso: a. Actualizar `max_diferencia`
  si `elemento_actual - min_elemento` es mayor. b. Actualizar `min_elemento` si `elemento_actual`
  es menor.'
- '[Plus Ultra] Optimizar el acceso a memoria respetando el orden por filas (*row-major
  order*) para mejorar el uso de caché.'
- '[Plus Ultra] Validar que los índices ingresados se encuentren estrictamente dentro
  de los límites del contenedor.'
tags:
- arreglos
- diferencia
- memoria
- maxima
- vectores
verificado: true
funciones:
- nombre: proc_38_maxima_diferencia
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Máxima diferencia
tests_funciones:
- nombre: test_proc_38_maxima_diferencia_positivo
  funcion: proc_38_maxima_diferencia
  codigo: 'int res = proc_38_maxima_diferencia(5);

    assert(res == 10 || res >= 0);'
- nombre: test_proc_38_maxima_diferencia_cero
  funcion: proc_38_maxima_diferencia
  codigo: 'int res = proc_38_maxima_diferencia(0);

    assert(res == 0);'
