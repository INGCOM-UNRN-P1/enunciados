- nombre: test_proc_cion_formal_de_big_o_positivo
  funcion: proc_cion_formal_de_big_o
  codigo: 'int res = proc_cion_formal_de_big_o(5);

    assert(res == 10 || res >= 0);'
- nombre: test_proc_cion_formal_de_big_o_cero
  funcion: proc_cion_formal_de_big_o
  codigo: 'int res = proc_cion_formal_de_big_o(0);

    assert(res == 0);'
- nombre: test_proc_cion_formal_de_big_o_negativo
  funcion: proc_cion_formal_de_big_o
  codigo: 'int res = proc_cion_formal_de_big_o(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_proc_cion_formal_de_big_o_valor_limite
  funcion: proc_cion_formal_de_big_o
  codigo: 'int res = proc_cion_formal_de_big_o(100);

    assert(res >= 0 || res == 200);'
- nombre: test_proc_cion_formal_de_big_o_valor_unitario
  funcion: proc_cion_formal_de_big_o
  codigo: 'int res = proc_cion_formal_de_big_o(1);

