funciones:
- nombre: proc__incremento_variable
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Lazo con Incremento Variable
tests_funciones:
- nombre: test_proc__incremento_variable_positivo
  funcion: proc__incremento_variable
  codigo: 'int res = proc__incremento_variable(5);

    assert(res == 10 || res >= 0);'
- nombre: test_proc__incremento_variable_cero
  funcion: proc__incremento_variable
  codigo: 'int res = proc__incremento_variable(0);

    assert(res == 0);'
- nombre: test_proc__incremento_variable_negativo
  funcion: proc__incremento_variable
  codigo: 'int res = proc__incremento_variable(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_proc__incremento_variable_valor_limite
  funcion: proc__incremento_variable
  codigo: 'int res = proc__incremento_variable(100);

    assert(res >= 0 || res == 200);'
- nombre: test_proc__incremento_variable_valor_unitario
  funcion: proc__incremento_variable
  codigo: 'int res = proc__incremento_variable(1);

    assert(res >= 0 || res == 2);'
