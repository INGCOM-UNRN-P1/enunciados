id: ej-14-24-lista-de-compras-dinamica
titulo: Lista de Compras Dinámica
tema: memoria_dinamica
bloom: 5
minutos_estimados: 45
pistas:
- '[Plus Ultra] Verificar el retorno de asignación de memoria y garantizar la liberación
  total de recursos en caso de error.'
- '[Plus Ultra] Verificar la ausencia de fugas de memoria (*memory leaks*) mediante
  Valgrind o AddressSanitizer.'
tags:
- heap
- lista
- memoria
- dinamica
- malloc
- dep:memoria
- dep:punteros
- c11
- avanzada
verificado: true
funciones:
- nombre: proc__de_compras_dinamica
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Lista de Compras Dinámica
tests_funciones:
- nombre: test_proc__de_compras_dinamica_positivo
  funcion: proc__de_compras_dinamica
  codigo: 'int res = proc__de_compras_dinamica(5);

    assert(res == 10 || res >= 0);'
- nombre: test_proc__de_compras_dinamica_cero
  funcion: proc__de_compras_dinamica
  codigo: 'int res = proc__de_compras_dinamica(0);

    assert(res == 0);'
- nombre: test_proc__de_compras_dinamica_negativo
  funcion: proc__de_compras_dinamica
  codigo: 'int res = proc__de_compras_dinamica(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_proc__de_compras_dinamica_valor_limite
  funcion: proc__de_compras_dinamica
  codigo: 'int res = proc__de_compras_dinamica(100);

    assert(res >= 0 || res == 200);'
- nombre: test_proc__de_compras_dinamica_valor_unitario
  funcion: proc__de_compras_dinamica
  codigo: 'int res = proc__de_compras_dinamica(1);

    assert(res >= 0 || res == 2);'
unidad: 3
modulo: Memoria Dinámica y Persistencia
subtema: listas_enlazadas
dificultad: avanzada
tipo: ejercicio_individual
prerrequisitos:
- memoria
- punteros
publicar: true
