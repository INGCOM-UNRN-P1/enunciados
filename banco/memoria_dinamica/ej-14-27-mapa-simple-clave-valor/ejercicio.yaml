id: ej-14-27-mapa-simple-clave-valor
titulo: Mapa Simple (Clave-Valor)
tema: memoria_dinamica
bloom: 5
minutos_estimados: 45
pistas:
- '[Plus Ultra] Verificar el retorno de asignación de memoria y garantizar la liberación total de recursos
  en caso de error.'
- '[Plus Ultra] Verificar la ausencia de fugas de memoria (*memory leaks*) mediante Valgrind o AddressSanitizer.'
tags:
- heap
- simple
- memoria
- malloc
- free
- dep:memoria
- dep:punteros
- c11
- avanzada
verificado: false
funciones:
- nombre: mapa_poner
  retorno: bool
  parametros: mapa_t *m, const char *clave, const char *valor
  descripcion: 'mapa_poner: operación principal del ejercicio'
tests_funciones:
- nombre: test_mapa_poner_inserta_busca
  funcion: mapa_poner
  codigo: mapa_t m;mapa_iniciar(&m);assert(mapa_poner(&m,"color","azul"));assert(strcmp(mapa_obtener(&m,"color"),"azul")==0);mapa_liberar(&m);
- nombre: test_mapa_poner_actualiza
  funcion: mapa_poner
  codigo: mapa_t m;mapa_iniciar(&m);assert(mapa_poner(&m,"k","uno"));assert(mapa_poner(&m,"k","dos"));assert(m.cantidad==1&&strcmp(mapa_obtener(&m,"k"),"dos")==0);mapa_liberar(&m);
- nombre: test_mapa_poner_ausente
  funcion: mapa_poner
  codigo: mapa_t m;mapa_iniciar(&m);assert(mapa_obtener(&m,"x")==NULL);mapa_liberar(&m);
unidad: 3
modulo: Memoria Dinámica y Persistencia
subtema: gestion_heap
dificultad: avanzada
prerrequisitos:
- memoria
- punteros
publicar: true
