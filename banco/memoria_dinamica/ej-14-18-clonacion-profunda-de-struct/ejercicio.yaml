id: ej-14-18-clonacion-profunda-de-struct
titulo: Clonación Profunda de Struct
tema: memoria_dinamica
bloom: 3
minutos_estimados: 25
pistas:
- '[Plus Ultra] Validar punteros `NULL` recibidos como parámetro para evitar fallos de segmentación.'
- '[Plus Ultra] Implementar una versión utilizando aritmética de punteros en lugar de indexación directa.'
tags:
- heap
- clonacion
- memoria
- struct
- profunda
- dep:memoria
- dep:punteros
- c11
- intermedia
verificado: false
funciones:
- nombre: ficha_clonar
  retorno: ficha_t *
  parametros: const ficha_t *original
  descripcion: 'ficha_clonar: operación principal del ejercicio'
tests_funciones:
- nombre: test_ficha_clonar_copia_independiente
  funcion: ficha_clonar
  codigo: ficha_t o={0}; int notas[]={6,8}; o.nombre="Ada"; o.notas=notas; o.cantidad_notas=2; ficha_t
    *c=ficha_clonar(&o); assert(c && c!=&o && c->nombre!=o.nombre && c->notas!=notas); assert(strcmp(c->nombre,"Ada")==0
    && c->notas[1]==8); c->notas[0]=1; assert(notas[0]==6); ficha_liberar(c);
- nombre: test_ficha_clonar_sin_notas
  funcion: ficha_clonar
  codigo: ficha_t o={.nombre="",.notas=NULL,.cantidad_notas=0}; ficha_t *c=ficha_clonar(&o); assert(c
    && c->nombre && c->cantidad_notas==0); ficha_liberar(c);
- nombre: test_ficha_clonar_null
  funcion: ficha_clonar
  codigo: assert(ficha_clonar(NULL)==NULL);
unidad: 3
modulo: Memoria Dinámica y Persistencia
subtema: heap
dificultad: intermedia
tipo: practica_guiada
prerrequisitos:
- memoria
- punteros
publicar: true
