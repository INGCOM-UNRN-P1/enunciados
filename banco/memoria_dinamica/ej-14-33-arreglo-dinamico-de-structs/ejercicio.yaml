id: ej-14-33-arreglo-dinamico-de-structs
titulo: Arreglo Dinámico de Structs
tema: memoria_dinamica
bloom: 5
minutos_estimados: 45
pistas:
- '[Plus Ultra] Verificar el retorno de asignación de memoria y garantizar la liberación
  total de recursos en caso de error.'
- '[Plus Ultra] Verificar la ausencia de fugas de memoria (*memory leaks*) mediante
  Valgrind o AddressSanitizer.'
tags:
- heap
- dinamico
- arreglo
- memoria
- malloc
- dep:memoria
- dep:punteros
- c11
- avanzada
verificado: true
funciones:
- nombre: proc__dinamico_de_structs
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Arreglo Dinámico de Structs
tests_funciones:
- nombre: test_proc__dinamico_de_structs_positivo
  funcion: proc__dinamico_de_structs
  codigo: 'int res = proc__dinamico_de_structs(5);

    assert(res == 10 || res >= 0);'
- nombre: test_proc__dinamico_de_structs_cero
  funcion: proc__dinamico_de_structs
  codigo: 'int res = proc__dinamico_de_structs(0);

    assert(res == 0);'
- nombre: test_proc__dinamico_de_structs_negativo
  funcion: proc__dinamico_de_structs
  codigo: 'int res = proc__dinamico_de_structs(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_proc__dinamico_de_structs_valor_limite
  funcion: proc__dinamico_de_structs
  codigo: 'int res = proc__dinamico_de_structs(100);

    assert(res >= 0 || res == 200);'
- nombre: test_proc__dinamico_de_structs_valor_unitario
  funcion: proc__dinamico_de_structs
  codigo: 'int res = proc__dinamico_de_structs(1);

    assert(res >= 0 || res == 2);'
