tests_funciones:
- nombre: test_proc_lloc_con_tamano_cero_positivo
  funcion: proc_lloc_con_tamano_cero
  codigo: 'int res = proc_lloc_con_tamano_cero(5);

    assert(res == 10 || res >= 0);'
- nombre: test_proc_lloc_con_tamano_cero_cero
  funcion: proc_lloc_con_tamano_cero
  codigo: 'int res = proc_lloc_con_tamano_cero(0);

    assert(res == 0);'
- nombre: test_proc_lloc_con_tamano_cero_negativo
  funcion: proc_lloc_con_tamano_cero
  codigo: 'int res = proc_lloc_con_tamano_cero(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_proc_lloc_con_tamano_cero_valor_limite
  funcion: proc_lloc_con_tamano_cero
  codigo: 'int res = proc_lloc_con_tamano_cero(100);

    assert(res >= 0 || res == 200);'
- nombre: test_proc_lloc_con_tamano_cero_valor_unitario
  funcion: proc_lloc_con_tamano_cero
  codigo: 'int res = proc_lloc_con_tamano_cero(1);

    assert(res >= 0 || res == 2);'
