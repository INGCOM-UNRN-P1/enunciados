id: ej-14-23-buffer-de-lectura-dinamico
titulo: Buffer de Lectura Dinámico
tema: memoria_dinamica
bloom: 5
minutos_estimados: 45
pistas:
- '[Plus Ultra] Verificar el retorno de asignación de memoria y garantizar la liberación total de recursos
  en caso de error.'
- '[Plus Ultra] Verificar la ausencia de fugas de memoria (*memory leaks*) mediante Valgrind o AddressSanitizer.'
tags:
- heap
- dinamico
- buffer
- memoria
- malloc
- dep:memoria
- dep:punteros
- c11
- avanzada
verificado: false
funciones:
- nombre: leer_linea_dinamica
  retorno: char *
  parametros: FILE *entrada
  descripcion: 'leer_linea_dinamica: operación principal del ejercicio'
tests_funciones:
- nombre: test_leer_linea_dinamica_linea_larga
  funcion: leer_linea_dinamica
  codigo: FILE *f=tmpfile(); assert(f); for(int i=0;i<300;i++)fputc('a',f); fputc('\n',f); rewind(f);
    char *s=leer_linea_dinamica(f); assert(s && strlen(s)==300); free(s); fclose(f);
- nombre: test_leer_linea_dinamica_linea_vacia
  funcion: leer_linea_dinamica
  codigo: FILE *f=tmpfile(); assert(f); fputc('\n',f); rewind(f); char *s=leer_linea_dinamica(f); assert(s
    && s[0]=='\0'); free(s); fclose(f);
- nombre: test_leer_linea_dinamica_eof
  funcion: leer_linea_dinamica
  codigo: FILE *f=tmpfile(); assert(f); assert(leer_linea_dinamica(f)==NULL); fclose(f);
unidad: 3
modulo: Memoria Dinámica y Persistencia
subtema: gestion_heap
dificultad: avanzada
prerrequisitos:
- memoria
- punteros
publicar: true
