id: ej-14-7-fraccionador-tokenizer
titulo: Fraccionador (Tokenizer)
tema: memoria_dinamica
bloom: 3
minutos_estimados: 25
pistas:
- '[Plus Ultra] Validar punteros `NULL` recibidos como parámetro para evitar fallos
  de segmentación.'
- '[Plus Ultra] Implementar una versión utilizando aritmética de punteros en lugar
  de indexación directa.'
tags:
- heap
- memoria
- fraccionador
- malloc
- free
- dep:memoria
- dep:punteros
- c11
- intermedia
verificado: true
funciones:
- nombre: proc_accionador_tokenizer
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Fraccionador (Tokenizer)
tests_funciones:
- nombre: test_proc_accionador_tokenizer_positivo
  funcion: proc_accionador_tokenizer
  codigo: 'int res = proc_accionador_tokenizer(5);

    assert(res == 10 || res >= 0);'
- nombre: test_proc_accionador_tokenizer_cero
  funcion: proc_accionador_tokenizer
  codigo: 'int res = proc_accionador_tokenizer(0);

    assert(res == 0);'
- nombre: test_proc_accionador_tokenizer_negativo
  funcion: proc_accionador_tokenizer
  codigo: 'int res = proc_accionador_tokenizer(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_proc_accionador_tokenizer_valor_limite
  funcion: proc_accionador_tokenizer
  codigo: 'int res = proc_accionador_tokenizer(100);

    assert(res >= 0 || res == 200);'
- nombre: test_proc_accionador_tokenizer_valor_unitario
  funcion: proc_accionador_tokenizer
  codigo: 'int res = proc_accionador_tokenizer(1);

    assert(res >= 0 || res == 2);'
unidad: 3
modulo: Memoria Dinámica y Persistencia
subtema: gestion_heap
dificultad: intermedia
tipo: practica_guiada
prerrequisitos:
- memoria
- punteros
publicar: true
