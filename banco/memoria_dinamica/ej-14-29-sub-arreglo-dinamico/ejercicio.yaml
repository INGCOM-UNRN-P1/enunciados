id: ej-14-29-sub-arreglo-dinamico
titulo: Sub-arreglo Dinámico
tema: memoria_dinamica
bloom: 3
minutos_estimados: 25
pistas:
- '[Plus Ultra] Optimizar el acceso a memoria respetando el orden por filas (*row-major order*) para mejorar
  el uso de caché.'
- '[Plus Ultra] Validar que los índices ingresados se encuentren estrictamente dentro de los límites del
  contenedor.'
tags:
- heap
- dinamico
- sub-arreglo
- memoria
- malloc
- dep:memoria
- dep:punteros
- c11
- intermedia
verificado: false
funciones:
- nombre: copiar_subarreglo
  retorno: int *
  parametros: const int *datos, size_t total, size_t inicio, size_t longitud
  descripcion: 'copiar_subarreglo: operación principal del ejercicio'
tests_funciones:
- nombre: test_copiar_subarreglo_copia_rango
  funcion: copiar_subarreglo
  codigo: int a[]={4,8,15,16,23,42};int*r=copiar_subarreglo(a,6,2,3);assert(r&&r[0]==15&&r[1]==16&&r[2]==23);r[0]=0;assert(a[2]==15);free(r);
- nombre: test_copiar_subarreglo_subarreglo_vacio
  funcion: copiar_subarreglo
  codigo: int a[]={1};assert(copiar_subarreglo(a,1,0,0)==NULL);
- nombre: test_copiar_subarreglo_fuera_de_rango
  funcion: copiar_subarreglo
  codigo: int a[]={1,2};assert(copiar_subarreglo(a,2,1,2)==NULL);
