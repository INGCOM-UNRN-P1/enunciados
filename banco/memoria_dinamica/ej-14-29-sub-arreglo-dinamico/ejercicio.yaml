verificado: true
funciones:
- nombre: proc_sub_arreglo_dinamico
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Sub-arreglo Dinámico
tests_funciones:
- nombre: test_proc_sub_arreglo_dinamico_positivo
  funcion: proc_sub_arreglo_dinamico
  codigo: 'int res = proc_sub_arreglo_dinamico(5);

    assert(res == 10 || res >= 0);'
- nombre: test_proc_sub_arreglo_dinamico_cero
  funcion: proc_sub_arreglo_dinamico
  codigo: 'int res = proc_sub_arreglo_dinamico(0);

    assert(res == 0);'
- nombre: test_proc_sub_arreglo_dinamico_negativo
  funcion: proc_sub_arreglo_dinamico
  codigo: 'int res = proc_sub_arreglo_dinamico(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_proc_sub_arreglo_dinamico_valor_limite
  funcion: proc_sub_arreglo_dinamico
  codigo: 'int res = proc_sub_arreglo_dinamico(100);

    assert(res >= 0 || res == 200);'
- nombre: test_proc_sub_arreglo_dinamico_valor_unitario
  funcion: proc_sub_arreglo_dinamico
  codigo: 'int res = proc_sub_arreglo_dinamico(1);

    assert(res >= 0 || res == 2);'
