id: ej-14-25-manejo-de-errores-de-malloc
titulo: Manejo de Errores de malloc
tema: memoria_dinamica
bloom: 3
minutos_estimados: 25
pistas:
- '[Plus Ultra] Validar punteros `NULL` recibidos como parámetro para evitar fallos
  de segmentación.'
- '[Plus Ultra] Implementar una versión utilizando aritmética de punteros en lugar
  de indexación directa.'
tags:
- heap
- errores
- memoria
- malloc
- free
- dep:memoria
- dep:punteros
- c11
- intermedia
verificado: true
funciones:
- nombre: proc_de_errores_de_malloc
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Manejo de Errores de malloc
tests_funciones:
- nombre: test_proc_de_errores_de_malloc_positivo
  funcion: proc_de_errores_de_malloc
  codigo: 'int res = proc_de_errores_de_malloc(5);

    assert(res == 10 || res >= 0);'
- nombre: test_proc_de_errores_de_malloc_cero
  funcion: proc_de_errores_de_malloc
  codigo: 'int res = proc_de_errores_de_malloc(0);

    assert(res == 0);'
- nombre: test_proc_de_errores_de_malloc_negativo
  funcion: proc_de_errores_de_malloc
  codigo: 'int res = proc_de_errores_de_malloc(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_proc_de_errores_de_malloc_valor_limite
  funcion: proc_de_errores_de_malloc
  codigo: 'int res = proc_de_errores_de_malloc(100);

    assert(res >= 0 || res == 200);'
- nombre: test_proc_de_errores_de_malloc_valor_unitario
  funcion: proc_de_errores_de_malloc
  codigo: 'int res = proc_de_errores_de_malloc(1);

    assert(res >= 0 || res == 2);'
unidad: 3
modulo: Memoria Dinámica y Persistencia
subtema: gestion_heap
dificultad: intermedia
tipo: practica_guiada
prerrequisitos:
- memoria
- punteros
publicar: true
