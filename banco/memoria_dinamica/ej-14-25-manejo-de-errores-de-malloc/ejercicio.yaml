id: ej-14-25-manejo-de-errores-de-malloc
titulo: Manejo de Errores de malloc
tema: memoria_dinamica
bloom: 3
minutos_estimados: 25
pistas:
- '[Plus Ultra] Validar punteros `NULL` recibidos como parámetro para evitar fallos de segmentación.'
- '[Plus Ultra] Implementar una versión utilizando aritmética de punteros en lugar de indexación directa.'
tags:
- heap
- errores
- memoria
- malloc
- free
- dep:memoria
- dep:punteros
- c11
- intermedia
verificado: false
funciones:
- nombre: reservar_arreglo
  retorno: void *
  parametros: size_t cantidad, size_t tamano
  descripcion: 'reservar_arreglo: operación principal del ejercicio'
tests_funciones:
- nombre: test_reservar_arreglo_reserva_tamano
  funcion: reservar_arreglo
  codigo: int*p=reservar_arreglo(4,sizeof *p); assert(p); for(int i=0;i<4;i++)p[i]=i; assert(p[3]==3);
    free(p);
- nombre: test_reservar_arreglo_rechaza_cero
  funcion: reservar_arreglo
  codigo: assert(reservar_arreglo(0,sizeof(int))==NULL); assert(reservar_arreglo(3,0)==NULL);
- nombre: test_reservar_arreglo_evita_overflow
  funcion: reservar_arreglo
  codigo: assert(reservar_arreglo(SIZE_MAX,2)==NULL);
unidad: 3
modulo: Memoria Dinámica y Persistencia
subtema: gestion_heap
dificultad: intermedia
tipo: practica_guiada
prerrequisitos:
- memoria
- punteros
publicar: true
