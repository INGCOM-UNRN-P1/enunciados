id: ej-14-11-redimensionar-arreglo
titulo: Redimensionar Arreglo
tema: memoria_dinamica
bloom: 5
minutos_estimados: 45
pistas:
- '[Plus Ultra] Verificar el retorno de asignación de memoria y garantizar la liberación
  total de recursos en caso de error.'
- '[Plus Ultra] Verificar la ausencia de fugas de memoria (*memory leaks*) mediante
  Valgrind o AddressSanitizer.'
tags:
- heap
- arreglo
- memoria
- redimensionar
- malloc
- dep:memoria
- dep:punteros
- c11
- avanzada
verificado: true
funciones:
- nombre: redimensionar_arreglo
  retorno: int*
  parametros: int *arr, size_t nuevo_tamano
  descripcion: Cambia el tamaño de un arreglo dinámico conservando sus datos
tests_funciones:
- nombre: test_redimensionar_arreglo_expande
  funcion: redimensionar_arreglo
  codigo: |
    int *a = malloc(2 * sizeof(*a));
    assert(a != NULL);
    a[0] = 12; a[1] = -7;
    int *b = redimensionar_arreglo(a, 5);
    assert(b != NULL && b[0] == 12 && b[1] == -7);
    b[2] = 42;
    free(b);
- nombre: test_redimensionar_arreglo_contrae
  funcion: redimensionar_arreglo
  codigo: |
    int *a = malloc(4 * sizeof(*a));
    assert(a != NULL);
    for (size_t i = 0; i < 4; i++) a[i] = (int)i + 3;
    int *b = redimensionar_arreglo(a, 2);
    assert(b != NULL && b[0] == 3 && b[1] == 4);
    free(b);
- nombre: test_redimensionar_arreglo_cero_libera
  funcion: redimensionar_arreglo
  codigo: |
    int *a = malloc(sizeof(*a));
    assert(a != NULL);
    a[0] = 9;
    assert(redimensionar_arreglo(a, 0) == NULL);
- nombre: test_redimensionar_arreglo_puntero_nulo
  funcion: redimensionar_arreglo
  codigo: |
    int *a = redimensionar_arreglo(NULL, 3);
    assert(a != NULL);
    a[0] = 5;
    free(a);
- nombre: test_redimensionar_arreglo_overflow_conserva_bloque
  funcion: redimensionar_arreglo
  codigo: |
    int *a = malloc(sizeof(*a));
    assert(a != NULL);
    a[0] = 31;
    int *b = redimensionar_arreglo(a, SIZE_MAX);
    assert(b == NULL && a[0] == 31);
    free(a);
unidad: 3
modulo: Memoria Dinámica y Persistencia
subtema: gestion_heap
dificultad: avanzada
prerrequisitos:
- memoria
- punteros
publicar: true
