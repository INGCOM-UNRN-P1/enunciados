tests_funciones:
- nombre: test_proc_e_arreglos_ordenados_positivo
  funcion: proc_e_arreglos_ordenados
  codigo: 'int res = proc_e_arreglos_ordenados(5);

    assert(res == 10 || res >= 0);'
- nombre: test_proc_e_arreglos_ordenados_cero
  funcion: proc_e_arreglos_ordenados
  codigo: 'int res = proc_e_arreglos_ordenados(0);

    assert(res == 0);'
- nombre: test_proc_e_arreglos_ordenados_negativo
  funcion: proc_e_arreglos_ordenados
  codigo: 'int res = proc_e_arreglos_ordenados(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_proc_e_arreglos_ordenados_valor_limite
  funcion: proc_e_arreglos_ordenados
  codigo: 'int res = proc_e_arreglos_ordenados(100);

    assert(res >= 0 || res == 200);'
- nombre: test_proc_e_arreglos_ordenados_valor_unitario
  funcion: proc_e_arreglos_ordenados
  codigo: 'int res = proc_e_arreglos_ordenados(1);

    assert(res >= 0 || res == 2);'
