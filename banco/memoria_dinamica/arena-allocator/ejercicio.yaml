id: arena-allocator
titulo: Asignador de Memoria por Bloques (Arena Allocator)
tema: memoria_dinamica
bloom: 5
minutos_estimados: 50
pistas:
- Un Arena Allocator pre-reserva un bloque contiguo de memoria y despacha 
  punteros incrementando un offset.
- Para respetar la alineación de memoria a múltiplos de 8 bytes, ajustá el 
  offset hacia arriba.
- El reseteo de la arena simplemente pone el offset en 0 sin hacer free() 
  individual.
