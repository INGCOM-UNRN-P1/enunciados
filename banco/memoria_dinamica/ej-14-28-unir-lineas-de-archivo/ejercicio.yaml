id: ej-14-28-unir-lineas-de-archivo
titulo: Unir Líneas de Archivo
tema: memoria_dinamica
bloom: 5
minutos_estimados: 45
pistas:
- '[Plus Ultra] Verificar el retorno de asignación de memoria y garantizar la liberación total de recursos
  en caso de error.'
- '[Plus Ultra] Verificar la ausencia de fugas de memoria (*memory leaks*) mediante Valgrind o AddressSanitizer.'
tags:
- heap
- lineas
- archivo
- memoria
- malloc
- dep:memoria
- dep:punteros
- c11
- avanzada
verificado: false
funciones:
- nombre: unir_lineas
  retorno: char *
  parametros: FILE *entrada, const char *separador
  descripcion: 'unir_lineas: operación principal del ejercicio'
tests_funciones:
- nombre: test_unir_lineas_une_con_separador
  funcion: unir_lineas
  codigo: FILE*f=tmpfile();assert(f);fputs("uno\ndos\n",f);rewind(f);char*s=unir_lineas(f," / ");assert(s&&strcmp(s,"uno
    / dos")==0);free(s);fclose(f);
- nombre: test_unir_lineas_archivo_vacio
  funcion: unir_lineas
  codigo: FILE*f=tmpfile();assert(f);char*s=unir_lineas(f,"-");assert(s&&strcmp(s,"")==0);free(s);fclose(f);
- nombre: test_unir_lineas_lineas_vacias
  funcion: unir_lineas
  codigo: FILE*f=tmpfile();assert(f);fputs("\nX\n",f);rewind(f);char*s=unir_lineas(f,"|");assert(s&&strcmp(s,"|X")==0);free(s);fclose(f);
unidad: 3
modulo: Memoria Dinámica y Persistencia
subtema: gestion_heap
dificultad: avanzada
prerrequisitos:
