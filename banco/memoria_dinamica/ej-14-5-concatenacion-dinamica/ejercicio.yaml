id: ej-14-5-concatenacion-dinamica
titulo: Concatenación dinámica
tema: memoria_dinamica
bloom: 5
minutos_estimados: 45
pistas:
- '[Plus Ultra] Verificar el retorno de asignación de memoria y garantizar la liberación
  total de recursos en caso de error.'
- '[Plus Ultra] Verificar la ausencia de fugas de memoria (*memory leaks*) mediante
  Valgrind o AddressSanitizer.'
tags:
- heap
- memoria
- dinamica
- concatenacion
- malloc
- dep:memoria
- dep:punteros
- c11
- avanzada
verificado: true
funciones:
- nombre: proc_ncatenacion_dinamica
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Concatenación dinámica
tests_funciones:
- nombre: test_proc_ncatenacion_dinamica_positivo
  funcion: proc_ncatenacion_dinamica
  codigo: 'int res = proc_ncatenacion_dinamica(5);

    assert(res == 10 || res >= 0);'
- nombre: test_proc_ncatenacion_dinamica_cero
  funcion: proc_ncatenacion_dinamica
  codigo: 'int res = proc_ncatenacion_dinamica(0);

    assert(res == 0);'
- nombre: test_proc_ncatenacion_dinamica_negativo
  funcion: proc_ncatenacion_dinamica
  codigo: 'int res = proc_ncatenacion_dinamica(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_proc_ncatenacion_dinamica_valor_limite
  funcion: proc_ncatenacion_dinamica
  codigo: 'int res = proc_ncatenacion_dinamica(100);

    assert(res >= 0 || res == 200);'
- nombre: test_proc_ncatenacion_dinamica_valor_unitario
  funcion: proc_ncatenacion_dinamica
  codigo: 'int res = proc_ncatenacion_dinamica(1);

    assert(res >= 0 || res == 2);'
unidad: 3
modulo: Memoria Dinámica y Persistencia
subtema: gestion_heap
dificultad: avanzada
tipo: ejercicio_individual
prerrequisitos:
- memoria
- punteros
publicar: true
