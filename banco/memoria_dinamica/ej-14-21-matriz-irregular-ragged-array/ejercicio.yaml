id: ej-14-21-matriz-irregular-ragged-array
titulo: Matriz Irregular (Ragged Array)
tema: memoria_dinamica
bloom: 5
minutos_estimados: 45
pistas:
- '[Plus Ultra] Verificar el retorno de asignación de memoria y garantizar la liberación
  total de recursos en caso de error.'
- '[Plus Ultra] Verificar la ausencia de fugas de memoria (*memory leaks*) mediante
  Valgrind o AddressSanitizer.'
tags:
- heap
- irregular
- array
- ragged
- memoria
- dep:memoria
- dep:punteros
- c11
- avanzada
verificado: true
funciones:
- nombre: proc_regular_ragged_array
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Matriz Irregular (Ragged Array)
tests_funciones:
- nombre: test_proc_regular_ragged_array_positivo
  funcion: proc_regular_ragged_array
  codigo: 'int res = proc_regular_ragged_array(5);

    assert(res == 10 || res >= 0);'
- nombre: test_proc_regular_ragged_array_cero
  funcion: proc_regular_ragged_array
  codigo: 'int res = proc_regular_ragged_array(0);

    assert(res == 0);'
- nombre: test_proc_regular_ragged_array_negativo
  funcion: proc_regular_ragged_array
  codigo: 'int res = proc_regular_ragged_array(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_proc_regular_ragged_array_valor_limite
  funcion: proc_regular_ragged_array
  codigo: 'int res = proc_regular_ragged_array(100);

    assert(res >= 0 || res == 200);'
- nombre: test_proc_regular_ragged_array_valor_unitario
  funcion: proc_regular_ragged_array
  codigo: 'int res = proc_regular_ragged_array(1);

    assert(res >= 0 || res == 2);'
unidad: 3
modulo: Memoria Dinámica y Persistencia
subtema: matrices_2d
dificultad: avanzada
tipo: ejercicio_individual
prerrequisitos:
- memoria
- punteros
publicar: true
