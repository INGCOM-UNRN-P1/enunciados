id: ej-14-21-matriz-irregular-ragged-array
titulo: Matriz Irregular (Ragged Array)
tema: memoria_dinamica
bloom: 5
minutos_estimados: 45
pistas:
- '[Plus Ultra] Verificar el retorno de asignación de memoria y garantizar la liberación total de recursos
  en caso de error.'
- '[Plus Ultra] Verificar la ausencia de fugas de memoria (*memory leaks*) mediante Valgrind o AddressSanitizer.'
tags:
- heap
- irregular
- array
- ragged
- memoria
- dep:memoria
- dep:punteros
- c11
- avanzada
verificado: false
funciones:
- nombre: matriz_irregular_crear
  retorno: bool
  parametros: matriz_irregular_t *m, const size_t *columnas, size_t filas
  descripcion: 'matriz_irregular_crear: operación principal del ejercicio'
tests_funciones:
- nombre: test_matriz_irregular_crear_filas_distintas
  funcion: matriz_irregular_crear
  codigo: size_t c[]={2,0,3}; matriz_irregular_t m; assert(matriz_irregular_crear(&m,c,3)); assert(m.filas==3
    && m.columnas[0]==2 && m.columnas[1]==0 && m.columnas[2]==3); m.datos[0][1]=7; m.datos[2][2]=9; assert(m.datos[0][1]==7
    && m.datos[2][2]==9); matriz_irregular_liberar(&m); assert(m.datos==NULL);
- nombre: test_matriz_irregular_crear_vacia
  funcion: matriz_irregular_crear
  codigo: matriz_irregular_t m; assert(matriz_irregular_crear(&m,NULL,0)); assert(m.filas==0); matriz_irregular_liberar(&m);
- nombre: test_matriz_irregular_crear_argumentos
  funcion: matriz_irregular_crear
  codigo: size_t c=1; assert(!matriz_irregular_crear(NULL,&c,1)); matriz_irregular_t m; assert(!matriz_irregular_crear(&m,NULL,1));
unidad: 3
modulo: Memoria Dinámica y Persistencia
subtema: matrices_2d
dificultad: avanzada
prerrequisitos:
- memoria
- punteros
publicar: true
