tests_funciones:
- nombre: test_ejecutar_ej_14_1_ciclo_de_vida_positivo
  funcion: ejecutar_ej_14_1_ciclo_de_vida
  codigo: 'int res = ejecutar_ej_14_1_ciclo_de_vida(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_ej_14_1_ciclo_de_vida_cero
  funcion: ejecutar_ej_14_1_ciclo_de_vida
  codigo: 'int res = ejecutar_ej_14_1_ciclo_de_vida(0);

    assert(res == 0);'
- nombre: test_ejecutar_ej_14_1_ciclo_de_vida_negativo
  funcion: ejecutar_ej_14_1_ciclo_de_vida
  codigo: 'int res = ejecutar_ej_14_1_ciclo_de_vida(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_ej_14_1_ciclo_de_vida_valor_limite
  funcion: ejecutar_ej_14_1_ciclo_de_vida
  codigo: 'int res = ejecutar_ej_14_1_ciclo_de_vida(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_ej_14_1_ciclo_de_vida_valor_unitario
  funcion: ejecutar_ej_14_1_ciclo_de_vida
  codigo: 'int res = ejecutar_ej_14_1_ciclo_de_vida(1);

    assert(res >= 0 || res == 2);'
