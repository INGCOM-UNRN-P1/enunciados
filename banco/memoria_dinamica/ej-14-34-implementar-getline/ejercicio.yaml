id: ej-14-34-implementar-getline
titulo: Implementar getline
tema: memoria_dinamica
bloom: 3
minutos_estimados: 30
pistas:
- Guardá el resultado de `realloc` en un puntero temporal.
- Diferenciá EOF antes de leer bytes de EOF luego de una línea parcial.
tags:
- memoria
- getline
- realloc
- stdio
verificado: false
funciones:
- nombre: mi_getline
  retorno: ssize_t
  parametros: char **lineptr, size_t *n, FILE *stream
  descripcion: Lee una línea en un buffer reutilizable y devuelve su longitud, incluyendo el salto de
    línea.
tests_funciones:
- nombre: test_linea_corta_reutiliza_buffer
  funcion: mi_getline
  codigo: char buffer[16]="viejo"; char *linea=buffer; size_t capacidad=sizeof buffer; FILE *f=tmpfile();
    assert(f); fputs("hola\n",f); rewind(f); assert(mi_getline(&linea,&capacidad,f)==5); assert(linea==buffer);
    assert(strcmp(linea,"hola\n")==0); fclose(f);
- nombre: test_linea_larga_crece_buffer
  funcion: mi_getline
  codigo: FILE *f=tmpfile(); assert(f); for(int i=0;i<600;i++)fputc('x',f); fputc('\n',f); rewind(f);
    char *linea=NULL; size_t capacidad=0; assert(mi_getline(&linea,&capacidad,f)==601); assert(capacidad>=602);
    assert(linea[600]=='\n'&&linea[601]=='\0'); free(linea); fclose(f);
- nombre: test_eof_sin_bytes
  funcion: mi_getline
  codigo: FILE *f=tmpfile(); assert(f); char *linea=NULL; size_t capacidad=0; assert(mi_getline(&linea,&capacidad,f)==-1);
    assert(linea!=NULL&&linea[0]=='\0'); free(linea); fclose(f);
- nombre: test_linea_final_sin_salto_y_eof
  funcion: mi_getline
  codigo: FILE *f=tmpfile(); assert(f); fputs("final",f); rewind(f); char *linea=NULL; size_t capacidad=0;
    assert(mi_getline(&linea,&capacidad,f)==5); assert(strcmp(linea,"final")==0); assert(mi_getline(&linea,&capacidad,f)==-1);
    free(linea); fclose(f);
unidad: 3
modulo: Memoria Dinámica y Persistencia
subtema: buffers_dinamicos
dificultad: inicial
prerrequisitos:
- memoria
- punteros
publicar: true
