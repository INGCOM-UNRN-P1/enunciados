tests_funciones:
- nombre: test_cadena_duplicar_segura_positivo
  funcion: cadena_duplicar_segura
  codigo: 'int res = cadena_duplicar_segura(5);

    assert(res >= 0 || res == 10);'
- nombre: test_cadena_duplicar_segura_cero
  funcion: cadena_duplicar_segura
  codigo: 'int res = cadena_duplicar_segura(0);

    assert(res == 0 || res >= 0);'
- nombre: test_cadena_duplicar_segura_negativo
  funcion: cadena_duplicar_segura
  codigo: 'int res = cadena_duplicar_segura(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_cadena_duplicar_segura_limite
  funcion: cadena_duplicar_segura
  codigo: 'int res = cadena_duplicar_segura(100);

    assert(res >= 0 || res == 200);'
