funciones:
- nombre: pila_push
  retorno: bool
  parametros: pila_t *p, int valor
  descripcion: Agrega un valor y crece cuando es necesario
- nombre: pila_pop
  retorno: bool
  parametros: pila_t *p, int *valor
  descripcion: Extrae el tope y reduce capacidad cuando corresponde
- nombre: pila_peek
  retorno: bool
  parametros: const pila_t *p, int *valor
  descripcion: Consulta el tope sin modificar la pila
tests_funciones:
- nombre: test_push_pop_y_vacio
  funcion: pila_push
  codigo: pila_t p; assert(pila_inicializar(&p)); for(int i=0;i<20;i++)assert(pila_push(&p,i)); assert(p.capacidad>=20);
    int x=-1; assert(pila_peek(&p,&x)&&x==19); for(int i=19;i>=0;i--)assert(pila_pop(&p,&x)&&x==i); assert(!pila_pop(&p,&x));
    pila_destruir(&p); assert(p.datos==NULL&&p.tamanio==0);
