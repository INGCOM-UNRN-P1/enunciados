id: ej-14-31-realloc-con-null
titulo: realloc con NULL
tema: memoria_dinamica
bloom: 5
minutos_estimados: 45
pistas:
- '[Plus Ultra] Verificar el retorno de asignación de memoria y garantizar la liberación
  total de recursos en caso de error.'
- '[Plus Ultra] Verificar la ausencia de fugas de memoria (*memory leaks*) mediante
  Valgrind o AddressSanitizer.'
tags:
- heap
- memoria
- malloc
- realloc
- free
- dep:memoria
- dep:punteros
- c11
- avanzada
verificado: true
funciones:
- nombre: proc__31_realloc_con_null
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de realloc con NULL
tests_funciones:
- nombre: test_proc__31_realloc_con_null_positivo
  funcion: proc__31_realloc_con_null
  codigo: 'int res = proc__31_realloc_con_null(5);

    assert(res == 10 || res >= 0);'
- nombre: test_proc__31_realloc_con_null_cero
  funcion: proc__31_realloc_con_null
  codigo: 'int res = proc__31_realloc_con_null(0);

    assert(res == 0);'
- nombre: test_proc__31_realloc_con_null_negativo
  funcion: proc__31_realloc_con_null
  codigo: 'int res = proc__31_realloc_con_null(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_proc__31_realloc_con_null_valor_limite
  funcion: proc__31_realloc_con_null
  codigo: 'int res = proc__31_realloc_con_null(100);

    assert(res >= 0 || res == 200);'
- nombre: test_proc__31_realloc_con_null_valor_unitario
  funcion: proc__31_realloc_con_null
  codigo: 'int res = proc__31_realloc_con_null(1);

    assert(res >= 0 || res == 2);'
