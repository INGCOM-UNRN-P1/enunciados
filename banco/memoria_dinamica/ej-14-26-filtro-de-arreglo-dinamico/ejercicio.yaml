tests_funciones:
- nombre: test_proc__de_arreglo_dinamico_positivo
  funcion: proc__de_arreglo_dinamico
  codigo: 'int res = proc__de_arreglo_dinamico(5);

    assert(res == 10 || res >= 0);'
- nombre: test_proc__de_arreglo_dinamico_cero
  funcion: proc__de_arreglo_dinamico
  codigo: 'int res = proc__de_arreglo_dinamico(0);

    assert(res == 0);'
- nombre: test_proc__de_arreglo_dinamico_negativo
  funcion: proc__de_arreglo_dinamico
  codigo: 'int res = proc__de_arreglo_dinamico(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_proc__de_arreglo_dinamico_valor_limite
  funcion: proc__de_arreglo_dinamico
  codigo: 'int res = proc__de_arreglo_dinamico(100);

    assert(res >= 0 || res == 200);'
- nombre: test_proc__de_arreglo_dinamico_valor_unitario
  funcion: proc__de_arreglo_dinamico
  codigo: 'int res = proc__de_arreglo_dinamico(1);

    assert(res >= 0 || res == 2);'
