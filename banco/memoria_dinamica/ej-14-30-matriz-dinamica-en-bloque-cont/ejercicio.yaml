id: ej-14-30-matriz-dinamica-en-bloque-cont
titulo: Matriz Dinámica en Bloque Contiguo
tema: memoria_dinamica
bloom: 4
minutos_estimados: 35
pistas:
- '[Plus Ultra] Validar punteros `NULL` recibidos como parámetro para evitar fallos
  de segmentación.'
- '[Plus Ultra] Implementar una versión utilizando aritmética de punteros en lugar
  de indexación directa.'
tags:
- heap
- memoria
- contiguo
- dinamica
- bloque
- dep:memoria
- dep:punteros
- c11
- intermedia
verificado: true
funciones:
- nombre: proc_amica_en_bloque_cont
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Matriz Dinámica en Bloque Contiguo
tests_funciones:
- nombre: test_proc_amica_en_bloque_cont_positivo
  funcion: proc_amica_en_bloque_cont
  codigo: 'int res = proc_amica_en_bloque_cont(5);

    assert(res == 10 || res >= 0);'
- nombre: test_proc_amica_en_bloque_cont_cero
  funcion: proc_amica_en_bloque_cont
  codigo: 'int res = proc_amica_en_bloque_cont(0);

    assert(res == 0);'
- nombre: test_proc_amica_en_bloque_cont_negativo
  funcion: proc_amica_en_bloque_cont
  codigo: 'int res = proc_amica_en_bloque_cont(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_proc_amica_en_bloque_cont_valor_limite
  funcion: proc_amica_en_bloque_cont
  codigo: 'int res = proc_amica_en_bloque_cont(100);

    assert(res >= 0 || res == 200);'
- nombre: test_proc_amica_en_bloque_cont_valor_unitario
  funcion: proc_amica_en_bloque_cont
  codigo: 'int res = proc_amica_en_bloque_cont(1);

    assert(res >= 0 || res == 2);'
unidad: 3
modulo: Memoria Dinámica y Persistencia
subtema: matrices_2d
dificultad: intermedia
tipo: ejercicio_individual
prerrequisitos:
- memoria
- punteros
publicar: true
