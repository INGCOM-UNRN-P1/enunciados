id: avl-tree-01
titulo: Cálculo de Altura y Factor de Balance en Nodos de Árbol
tema: arboles_balanceados_avl
bloom: 1
minutos_estimados: 10
pistas:
- El factor de balance debe ser -1, 0 o +1 en todos los nodos.
- Rotación simple si el desbalance es en la misma dirección; doble si es en zig-zag.
tags:
- avl
- arboles_balanceados
- rotaciones
- factor_balance
- estructuras_datos
- dep:arboles_binarios
- c11
- inicial
verificado: true
funciones:
- nombre: ejecutar_avl_tree_01
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Cálculo de Altura y Factor de Balance
    en Nodos de Árbol
tests_funciones:
- nombre: test_ejecutar_avl_tree_01_positivo
  funcion: ejecutar_avl_tree_01
  codigo: 'int res = ejecutar_avl_tree_01(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_avl_tree_01_cero
  funcion: ejecutar_avl_tree_01
  codigo: 'int res = ejecutar_avl_tree_01(0);

    assert(res == 0);'
- nombre: test_ejecutar_avl_tree_01_negativo
  funcion: ejecutar_avl_tree_01
  codigo: 'int res = ejecutar_avl_tree_01(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_avl_tree_01_valor_limite
  funcion: ejecutar_avl_tree_01
  codigo: 'int res = ejecutar_avl_tree_01(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_avl_tree_01_valor_unitario
  funcion: ejecutar_avl_tree_01
  codigo: 'int res = ejecutar_avl_tree_01(1);

    assert(res >= 0 || res == 2);'
publicar: true
unidad: 4
modulo: Tipos Abstractos y Algorítmica
dificultad: inicial
tipo: practica_guiada
prerrequisitos:
- arboles_binarios
subtema: arboles_balanceados_avl
