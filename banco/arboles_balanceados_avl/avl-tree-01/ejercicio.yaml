id: avl-tree-01
titulo: Cálculo de Altura y Factor de Balance en Nodos de Árbol
tema: arboles_balanceados_avl
bloom: 1
minutos_estimados: 10
pistas:
- Para cada nodo, el factor de balance es altura del subárbol izquierdo menos altura del derecho.
tags:
- avl
- arboles_balanceados
- calculo_altura
- factor_balance
- estructuras_datos
- dep:arboles_binarios
- c11
- inicial
verificado: true
funciones:
- nombre: ejecutar_avl_tree_01
  retorno: int
  parametros: const avl_node_t *raiz, int *altura, int *factor_balance
  descripcion: 'Calcula altura y factor de balance de la raíz (factor = altura izquierda menos derecha).
    Devuelve 1 si las salidas se escribieron, 0 si falta un puntero. Árbol vacío: altura y factor 0.'
tests_funciones:
- nombre: test_avl_tree_01_comportamiento
  funcion: ejecutar_avl_tree_01
  codigo: avl_node_t a={.key=1,.height=1}, b={.key=2,.height=1,.left=&a}; int h,fb; assert(ejecutar_avl_tree_01(&b,&h,&fb)&&h==2&&fb==1);
    assert(ejecutar_avl_tree_01(NULL,&h,&fb)&&h==0&&fb==0); assert(!ejecutar_avl_tree_01(&b,NULL,&fb));
