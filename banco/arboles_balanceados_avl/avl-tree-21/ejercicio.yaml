id: avl-tree-21
titulo: Serialización de Árbol AVL a Representación en Arreglo
tema: arboles_balanceados_avl
bloom: 4
minutos_estimados: 35
pistas:
- El factor de balance debe ser -1, 0 o +1 en todos los nodos.
- Rotación simple si el desbalance es en la misma dirección; doble si es en zig-zag.
tags:
- avl
- arboles_balanceados
- rotaciones
- factor_balance
- estructuras_datos
- dep:arboles_binarios
- c11
- intermedia
verificado: true
funciones:
- nombre: ejecutar_avl_tree_21
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Serialización de Árbol AVL a Representación
    en Arreglo
tests_funciones:
- nombre: test_ejecutar_avl_tree_21_positivo
  funcion: ejecutar_avl_tree_21
  codigo: 'int res = ejecutar_avl_tree_21(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_avl_tree_21_cero
  funcion: ejecutar_avl_tree_21
  codigo: 'int res = ejecutar_avl_tree_21(0);

    assert(res == 0);'
- nombre: test_ejecutar_avl_tree_21_negativo
  funcion: ejecutar_avl_tree_21
  codigo: 'int res = ejecutar_avl_tree_21(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_avl_tree_21_valor_limite
  funcion: ejecutar_avl_tree_21
  codigo: 'int res = ejecutar_avl_tree_21(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_avl_tree_21_valor_unitario
  funcion: ejecutar_avl_tree_21
  codigo: 'int res = ejecutar_avl_tree_21(1);

    assert(res >= 0 || res == 2);'
publicar: true
unidad: 4
modulo: Tipos Abstractos y Algorítmica
