id: avl-tree-19
titulo: Árbol AVL con Conteo de Tamaño de Subárbol para Selección por Rango
tema: arboles_balanceados_avl
bloom: 3
minutos_estimados: 25
pistas:
- El rango es 1-based en recorrido inorder.
- El tamaño de un subárbol vacío es 0; el tamaño de un nodo incluye ambos hijos.
tags:
- avl
- tamano_subarbol
- seleccion_por_rango
- ordenamiento
- c11
verificado: true
funciones:
- nombre: avl_subtree_size
  retorno: size_t
  parametros: const avl_node_t *root
  descripcion: Operación avl_subtree_size según el contrato de la consigna.
- nombre: avl_select_rank
  retorno: int
  parametros: const avl_node_t *root, size_t rank, int *key
  descripcion: Operación avl_select_rank según el contrato de la consigna.
tests_funciones:
- nombre: test_operacion_principal
  funcion: avl_subtree_size
  codigo: 'avl_node_t*r=NULL; int a[]={4,2,6,1,3}; for(int i=0;i<5;i++)r=avl_insert(r,a[i]); int k=0;
    assert(avl_subtree_size(r)==5); assert(avl_select_rank(r,3,&k)&&k==3); assert(!avl_select_rank(r,0,&k));
    avl_destroy(r);

    '
publicar: true
unidad: 4
modulo: Tipos Abstractos y Algorítmica
dificultad: intermedia
tipo: practica_guiada
prerrequisitos:
- arboles_binarios
subtema: arboles_balanceados_avl
