tests_funciones:
- nombre: test_comportamiento_principal
  funcion: avl_generic_put
  codigo: 'int k1=1,k2=2,v1=10,v2=20;avl_generic_node_t*r=NULL;assert(avl_generic_put(&r,&k1,&v1,avl_compare_int_keys));assert(avl_generic_put(&r,&k2,&v2,avl_compare_int_keys));assert(*(int*)avl_generic_get(r,&k2,avl_compare_int_keys)==20);assert(avl_generic_get(r,&v1,avl_compare_int_keys)==NULL);avl_generic_destroy(&r,NULL,NULL);assert(!r);

    '
