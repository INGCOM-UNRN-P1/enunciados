id: avl-tree-30
titulo: TAD Completo de Árbol AVL Genérico con Tipo de Clave Parametrizado
tema: arboles_balanceados_avl
bloom: 5
minutos_estimados: 45
pistas:
- El factor de balance debe ser -1, 0 o +1 en todos los nodos.
- Rotación simple si el desbalance es en la misma dirección; doble si es en zig-zag.
tags:
- avl
- arboles_balanceados
- rotaciones
- factor_balance
- estructuras_datos
- dep:arboles_binarios
- c11
- avanzada
verificado: true
funciones:
- nombre: ejecutar_avl_tree_30
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de TAD Completo de Árbol AVL Genérico con
    Tipo de Clave Parametrizado
tests_funciones:
- nombre: test_ejecutar_avl_tree_30_positivo
  funcion: ejecutar_avl_tree_30
  codigo: 'int res = ejecutar_avl_tree_30(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_avl_tree_30_cero
  funcion: ejecutar_avl_tree_30
  codigo: 'int res = ejecutar_avl_tree_30(0);

    assert(res == 0);'
- nombre: test_ejecutar_avl_tree_30_negativo
  funcion: ejecutar_avl_tree_30
  codigo: 'int res = ejecutar_avl_tree_30(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_avl_tree_30_valor_limite
  funcion: ejecutar_avl_tree_30
  codigo: 'int res = ejecutar_avl_tree_30(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_avl_tree_30_valor_unitario
  funcion: ejecutar_avl_tree_30
  codigo: 'int res = ejecutar_avl_tree_30(1);

    assert(res >= 0 || res == 2);'
publicar: true
unidad: 4
modulo: Tipos Abstractos y Algorítmica
