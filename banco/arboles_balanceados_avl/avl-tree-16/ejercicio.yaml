id: avl-tree-16
titulo: Conversión de Árbol Binario de Búsqueda Desbalanceado a AVL
tema: arboles_balanceados_avl
bloom: 3
minutos_estimados: 25
pistas:
- El factor de balance debe ser -1, 0 o +1 en todos los nodos.
- Rotación simple si el desbalance es en la misma dirección; doble si es en zig-zag.
tags:
- avl
- arboles_balanceados
- rotaciones
- factor_balance
- estructuras_datos
- dep:arboles_binarios
- c11
- intermedia
verificado: true
funciones:
- nombre: ejecutar_avl_tree_16
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Conversión de Árbol Binario de Búsqueda
    Desbalanceado a AVL
tests_funciones:
- nombre: test_ejecutar_avl_tree_16_positivo
  funcion: ejecutar_avl_tree_16
  codigo: 'int res = ejecutar_avl_tree_16(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_avl_tree_16_cero
  funcion: ejecutar_avl_tree_16
  codigo: 'int res = ejecutar_avl_tree_16(0);

    assert(res == 0);'
- nombre: test_ejecutar_avl_tree_16_negativo
  funcion: ejecutar_avl_tree_16
  codigo: 'int res = ejecutar_avl_tree_16(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_avl_tree_16_valor_limite
  funcion: ejecutar_avl_tree_16
  codigo: 'int res = ejecutar_avl_tree_16(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_avl_tree_16_valor_unitario
  funcion: ejecutar_avl_tree_16
  codigo: 'int res = ejecutar_avl_tree_16(1);

    assert(res >= 0 || res == 2);'
