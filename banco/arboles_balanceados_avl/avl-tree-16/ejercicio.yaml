  parametros: avl_node_t *raiz
  descripcion: Convierte en AVL un BST desbalanceado de claves distintas, reordenando enlaces de los mismos
    nodos y actualizando alturas. No reserva ni libera nodos.
tests_funciones:
- nombre: test_avl_tree_16_comportamiento
  funcion: ejecutar_avl_tree_16
  codigo: avl_node_t*r=NULL; for(int i=1;i<=7;i++){avl_node_t*n=avl_new(i); assert(n); if(!r)r=n; else{avl_node_t*t=r;while(t->right)t=t->right;t->right=n;}}
    r=ejecutar_avl_tree_16(r); int h; assert(avl_valid(r,0,8,&h)&&h==3); avl_destroy(r);
