id: avl-tree-28
titulo: Verificación de Invariante de Búsqueda Binaria y Balance
tema: arboles_balanceados_avl
bloom: 5
minutos_estimados: 45
pistas:
- El factor de balance debe ser -1, 0 o +1 en todos los nodos.
- Rotación simple si el desbalance es en la misma dirección; doble si es en zig-zag.
tags:
- avl
- arboles_balanceados
- rotaciones
- factor_balance
- estructuras_datos
- dep:arboles_binarios
- c11
- avanzada
verificado: true
funciones:
- nombre: ejecutar_avl_tree_28
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Verificación de Invariante de Búsqueda
    Binaria y Balance
tests_funciones:
- nombre: test_ejecutar_avl_tree_28_positivo
  funcion: ejecutar_avl_tree_28
  codigo: 'int res = ejecutar_avl_tree_28(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_avl_tree_28_cero
  funcion: ejecutar_avl_tree_28
  codigo: 'int res = ejecutar_avl_tree_28(0);

    assert(res == 0);'
- nombre: test_ejecutar_avl_tree_28_negativo
  funcion: ejecutar_avl_tree_28
  codigo: 'int res = ejecutar_avl_tree_28(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_avl_tree_28_valor_limite
  funcion: ejecutar_avl_tree_28
  codigo: 'int res = ejecutar_avl_tree_28(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_avl_tree_28_valor_unitario
  funcion: ejecutar_avl_tree_28
  codigo: 'int res = ejecutar_avl_tree_28(1);

    assert(res >= 0 || res == 2);'
publicar: true
unidad: 4
modulo: Tipos Abstractos y Algorítmica
dificultad: avanzada
tipo: ejercicio_individual
