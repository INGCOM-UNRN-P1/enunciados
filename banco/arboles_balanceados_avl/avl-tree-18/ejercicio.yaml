  descripcion: Operación avl_split según el contrato de la consigna.
tests_funciones:
- nombre: test_operacion_principal
  funcion: avl_split
  codigo: 'avl_node_t *r=NULL,*a=NULL,*b=NULL; int x[]={2,1,3,5}; for(int i=0;i<4;i++)r=avl_insert(r,x[i]);
    avl_split(r,3,&a,&b); int h=0; assert(avl_valid(a,-2147483649L,2147483648L,&h)); assert(avl_contains(a,1)&&avl_contains(a,2)&&!avl_contains(a,3));
    assert(avl_contains(b,3)&&avl_contains(b,5)); avl_destroy(r);avl_destroy(a);avl_destroy(b);

    '
