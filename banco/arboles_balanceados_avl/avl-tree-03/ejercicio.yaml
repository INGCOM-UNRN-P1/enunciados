id: avl-tree-03
titulo: Rotación Simple a la Derecha en Árbol AVL
tema: arboles_balanceados_avl
bloom: 1
minutos_estimados: 10
pistas:
- Recalcule las alturas de los nodos afectados después de la rotación.
tags:
- avl
- arboles_balanceados
- rotaciones
- rotacion_derecha
- estructuras_datos
- dep:arboles_binarios
- c11
- inicial
verificado: true
funciones:
- nombre: ejecutar_avl_tree_03
  retorno: avl_node_t *
  parametros: avl_node_t *raiz
  descripcion: 'Aplica una rotación simple derecha en la raíz y devuelve la nueva raíz. Precondición:
    la raíz y su hijo izquierdo existen.'
tests_funciones:
- nombre: test_avl_tree_03_comportamiento
  funcion: ejecutar_avl_tree_03
  codigo: avl_node_t a={.key=1,.height=1}, b={.key=2,.height=2,.left=&a}, d={.key=4,.height=1}, r={.key=3,.height=3,.left=&b,.right=&d};
    avl_node_t*n=ejecutar_avl_tree_03(&r); assert(n==&b&&b.right==&r&&r.right==&d&&r.height==2&&b.height==3);
    assert(ejecutar_avl_tree_03(NULL)==NULL);
publicar: true
unidad: 4
modulo: Tipos Abstractos y Algorítmica
dificultad: inicial
tipo: practica_guiada
