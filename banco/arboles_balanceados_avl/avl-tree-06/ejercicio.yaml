id: avl-tree-06
titulo: Inserción Balanceada en Árbol AVL con Actualización de Alturas
tema: arboles_balanceados_avl
bloom: 1
minutos_estimados: 10
pistas:
- El factor de balance debe ser -1, 0 o +1 en todos los nodos.
- Rotación simple si el desbalance es en la misma dirección; doble si es en zig-zag.
tags:
- avl
- arboles_balanceados
- rotaciones
- factor_balance
- estructuras_datos
- dep:arboles_binarios
- c11
- inicial
verificado: true
funciones:
- nombre: ejecutar_avl_tree_06
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Inserción Balanceada en Árbol AVL con
    Actualización de Alturas
tests_funciones:
- nombre: test_ejecutar_avl_tree_06_positivo
  funcion: ejecutar_avl_tree_06
  codigo: 'int res = ejecutar_avl_tree_06(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_avl_tree_06_cero
  funcion: ejecutar_avl_tree_06
  codigo: 'int res = ejecutar_avl_tree_06(0);

    assert(res == 0);'
- nombre: test_ejecutar_avl_tree_06_negativo
  funcion: ejecutar_avl_tree_06
  codigo: 'int res = ejecutar_avl_tree_06(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_avl_tree_06_valor_limite
  funcion: ejecutar_avl_tree_06
  codigo: 'int res = ejecutar_avl_tree_06(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_avl_tree_06_valor_unitario
  funcion: ejecutar_avl_tree_06
  codigo: 'int res = ejecutar_avl_tree_06(1);

    assert(res >= 0 || res == 2);'
