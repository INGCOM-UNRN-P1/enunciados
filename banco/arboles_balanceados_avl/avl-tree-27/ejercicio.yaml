id: avl-tree-27
titulo: Impresión Visual de Estructura de Árbol AVL con Indentación
tema: arboles_balanceados_avl
bloom: 5
minutos_estimados: 45
pistas:
- Imprime primero el subárbol derecho, luego la raíz y finalmente el izquierdo.
- Aumenta la indentación en dos espacios por nivel.
tags:
- avl
- impresion
- indentacion
- recursividad
- c11
verificado: true
funciones:
- nombre: avl_print_indented
  retorno: void
  parametros: const avl_node_t *root, FILE *out
  descripcion: Operación avl_print_indented según el contrato de la consigna.
tests_funciones:
- nombre: test_arbol_multinivel_imprime_orden_y_sangria_completos
  funcion: avl_print_indented
  codigo: avl_node_t *root = NULL; int keys[] = {4, 2, 6, 1, 3, 5, 7}; for (size_t i=0; i<7; ++i) root=avl_insert(root,keys[i]);
    FILE *out=tmpfile(); assert(out); avl_print_indented(root,out); rewind(out); char actual[128]={0};
    const char expected[]="    7\n  6\n    5\n4\n    3\n  2\n    1\n"; size_t n=fread(actual,1,sizeof
    actual,out); assert(n==sizeof expected-1); for(size_t i=0;i<n;i++) assert(actual[i]==expected[i]);
    fclose(out); avl_destroy(root);
publicar: true
unidad: 4
modulo: Tipos Abstractos y Algorítmica
dificultad: avanzada
prerrequisitos:
- arboles_binarios
subtema: arboles_balanceados_avl
