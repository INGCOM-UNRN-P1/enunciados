funciones:
- nombre: avl_dict_put
  retorno: int
  parametros: avl_dict_node_t **root,int key,int value
  descripcion: Operación avl_dict_put según el contrato de la consigna.
- nombre: avl_dict_get
  retorno: int
  parametros: const avl_dict_node_t *root,int key,int *value
  descripcion: Operación avl_dict_get según el contrato de la consigna.
- nombre: avl_dict_destroy
  retorno: void
  parametros: avl_dict_node_t **root
  descripcion: Operación avl_dict_destroy según el contrato de la consigna.
tests_funciones:
- nombre: test_comportamiento_principal
  funcion: avl_dict_put
  codigo: 'avl_dict_node_t*r=NULL;int v=0;assert(avl_dict_put(&r,2,20));assert(avl_dict_put(&r,1,10));assert(avl_dict_put(&r,3,30));assert(avl_dict_get(r,1,&v)&&v==10);assert(avl_dict_put(&r,1,11));assert(avl_dict_get(r,1,&v)&&v==11);assert(!avl_dict_get(r,9,&v));avl_dict_destroy(&r);assert(!r);

    '
