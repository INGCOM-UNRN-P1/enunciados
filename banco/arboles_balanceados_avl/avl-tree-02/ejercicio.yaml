id: avl-tree-02
titulo: Rotación Simple a la Izquierda en Árbol AVL
tema: arboles_balanceados_avl
bloom: 1
minutos_estimados: 10
pistas:
- Recalcule las alturas de los nodos afectados después de la rotación.
tags:
- avl
- arboles_balanceados
- rotaciones
- rotacion_izquierda
- estructuras_datos
- dep:arboles_binarios
- c11
- inicial
verificado: true
funciones:
- nombre: ejecutar_avl_tree_02
  retorno: avl_node_t *
  parametros: avl_node_t *raiz
  descripcion: 'Aplica una rotación simple izquierda en la raíz y devuelve la nueva raíz. Precondición:
    la raíz y su hijo derecho existen.'
tests_funciones:
- nombre: test_avl_tree_02_comportamiento
  funcion: ejecutar_avl_tree_02
  codigo: avl_node_t a={.key=1,.height=1}, d={.key=4,.height=1}, b={.key=3,.height=2,.right=&d}, r={.key=2,.height=3,.left=&a,.right=&b};
    avl_node_t*n=ejecutar_avl_tree_02(&r); assert(n==&b&&b.left==&r&&r.left==&a&&r.height==2&&b.height==3);
    assert(ejecutar_avl_tree_02(NULL)==NULL);
publicar: true
unidad: 4
modulo: Tipos Abstractos y Algorítmica
dificultad: inicial
tipo: practica_guiada
