id: dsu-union-01
titulo: Disjoint Set Union DSU con Compresión de Caminos y Rango
tema: conjuntos_disjuntos_union_find
bloom: 1
minutos_estimados: 10
pistas:
- Aplicá compresión de caminos en find para aplanar el árbol.
- Uní por rango o tamaño para mantener los árboles balanceados.
tags:
- dsu
- union_find
- conjuntos_disjuntos
- grafos
- estructuras_datos
- dep:arreglos
- dep:tad
- c11
- inicial
verificado: true
funciones:
- nombre: dsu_init
  retorno: void
  parametros: dsu_t *d, int n
  descripcion: Inicializa n elementos aislados.
- nombre: dsu_find
  retorno: int
  parametros: dsu_t *d, int u
  descripcion: Busca raíz con compresión de caminos.
- nombre: dsu_union
  retorno: void
  parametros: dsu_t *d, int u, int v
  descripcion: Une dos elementos válidos por rango.
- nombre: dsu_destroy
  retorno: void
  parametros: dsu_t *d
  descripcion: Libera y vacía la estructura.
tests_funciones:
- nombre: contrato_01_1
  funcion: dsu_init
  codigo: dsu_t d;dsu_init(&d,4);assert(dsu_find(&d,2)==2);dsu_union(&d,0,1);dsu_union(&d,1,2);assert(dsu_find(&d,0)==dsu_find(&d,2));assert(dsu_find(&d,4)==-1);dsu_destroy(&d);assert(d.n==0);
- nombre: contrato_01_2
  funcion: dsu_init
  codigo: dsu_t d;dsu_init(&d,0);assert(d.n==0);dsu_destroy(&d);
publicar: true
unidad: 4
modulo: Tipos Abstractos y Algorítmica
dificultad: inicial
tipo: practica_guiada
prerrequisitos:
- arreglos
- tad
subtema: conjuntos_disjuntos_union_find
