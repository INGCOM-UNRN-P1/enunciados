id: dsu-union-02
titulo: Inicialización de Conjuntos Disjuntos de N Elementos
tema: conjuntos_disjuntos_union_find
bloom: 1
minutos_estimados: 10
pistas:
- Aplicá compresión de caminos en find para aplanar el árbol.
- Uní por rango o tamaño para mantener los árboles balanceados.
tags:
- dsu
- union_find
- conjuntos_disjuntos
- grafos
- estructuras_datos
- dep:arreglos
- dep:tad
- c11
- inicial
verificado: true
funciones:
- nombre: dsu02_init
  retorno: bool
  parametros: dsu02_t *d, size_t n
  descripcion: Inicializa n conjuntos unitarios.
- nombre: dsu02_destroy
  retorno: void
  parametros: dsu02_t *d
  descripcion: Libera el arreglo de padres.
tests_funciones:
- nombre: contrato_02_1
  funcion: dsu02_init
  codigo: dsu02_t d;assert(dsu02_init(&d,4));for(size_t i=0;i<4;i++)assert(d.parent[i]==i);dsu02_destroy(&d);assert(d.n==0&&!d.parent);
- nombre: contrato_02_2
  funcion: dsu02_init
  codigo: dsu02_t d;assert(!dsu02_init(&d,0));assert(d.n==0&&!d.parent);
