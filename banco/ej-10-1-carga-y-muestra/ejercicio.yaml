id: ej-10-1-carga-y-muestra
titulo: Carga y muestra
tema: arreglos
bloom: 3
minutos_estimados: 25
pistas:
- '**`cargar_arreglo`:**'
- '**Entrada:** Un arreglo y su tamaño.'
- '**Proceso:** Usar un lazo `for` que itere desde 0 hasta `tamaño-1`. En cada iteración,
  solicitar al usuario un número y almacenarlo en la posición correspondiente del
  arreglo (`arreglo[i]`).'
- '**`mostrar_arreglo`:**'
- '**Entrada:** Un arreglo y su tamaño.'
- '**Proceso:** Usar un lazo `for` para recorrer el arreglo.'
- '**Salida:** Imprimir los elementos de una forma legible, por ejemplo, entre corchetes
  y separados por comas.'
- '[Plus Ultra] Garantizar la terminación con `\0` y prevenir desbordamientos de búfer
  validando la capacidad máxima.'
- '[Plus Ultra] Soportar la lectura de cadenas con espacios y múltiples líneas de
  manera robusta.'
tags:
