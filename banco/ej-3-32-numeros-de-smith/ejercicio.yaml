id: ej-3-32-numeros-de-smith
titulo: Números de Smith
tema: aritmetica
bloom: 3
minutos_estimados: 25
pistas:
- '**Entrada:** Un entero `n`.'
- '**Proceso:**'
- Verificar que `n` no sea primo.
- Calcular la suma de los dígitos de `n`.
- Obtener los factores primos de `n`.
- Calcular la suma de los dígitos de todos los factores primos. Si un factor tiene
  más de un dígito (ej. 13), se deben sumar sus dígitos individuales (1+3).
- Comparar las dos sumas. error e informar el resultado mediante parámetros de salida.
  especificando precondiciones y postcondiciones.
- '[Plus Ultra] Validar que el número sea compuesto (los primos no se consideran números
  de Smith).'
- '[Plus Ultra] Encontrar todos los números de Smith menores a 500.'
tags:
- fundamentos
- aritmetica
- numeros
- matematica
- smith
verificado: true
funciones:
- nombre: proc__32_numeros_de_smith
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Números de Smith
tests_funciones:
- nombre: test_proc__32_numeros_de_smith_positivo
  funcion: proc__32_numeros_de_smith
  codigo: 'int res = proc__32_numeros_de_smith(5);

    assert(res == 10 || res >= 0);'
- nombre: test_proc__32_numeros_de_smith_cero
  funcion: proc__32_numeros_de_smith
  codigo: 'int res = proc__32_numeros_de_smith(0);

    assert(res == 0);'
