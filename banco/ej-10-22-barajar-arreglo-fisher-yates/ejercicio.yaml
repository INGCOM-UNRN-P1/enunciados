id: ej-10-22-barajar-arreglo-fisher-yates
titulo: Barajar arreglo (Fisher-Yates)
tema: arreglos
bloom: 3
minutos_estimados: 25
pistas:
- '**Proceso:**'
- Recorrer el arreglo desde el último elemento hasta el segundo (`i` desde `n-1` hasta
  1).
- En cada iteración, generar un índice aleatorio `j` entre 0 e `i` (inclusive).
- Intercambiar el elemento en la posición `i` con el elemento en la posición `j`.
- '**Aleatoriedad:** Requiere `srand()` y `rand()`.'
- '[Plus Ultra] Optimizar el acceso a memoria respetando el orden por filas (*row-major
  order*) para mejorar el uso de caché.'
- '[Plus Ultra] Validar que los índices ingresados se encuentren estrictamente dentro
  de los límites del contenedor.'
tags:
- arreglo
- arreglos
- fisher-yates
- memoria
- vectores
verificado: true
funciones:
- nombre: proc_arreglo_fisher_yates
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Barajar arreglo (Fisher-Yates)
tests_funciones:
- nombre: test_proc_arreglo_fisher_yates_positivo
  funcion: proc_arreglo_fisher_yates
  codigo: 'int res = proc_arreglo_fisher_yates(5);

    assert(res == 10 || res >= 0);'
- nombre: test_proc_arreglo_fisher_yates_cero
  funcion: proc_arreglo_fisher_yates
  codigo: 'int res = proc_arreglo_fisher_yates(0);

    assert(res == 0);'
