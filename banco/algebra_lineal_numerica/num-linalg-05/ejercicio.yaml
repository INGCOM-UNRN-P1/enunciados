id: num-linalg-05
titulo: Eliminación gaussiana con pivoteo parcial
tema: algebra_lineal_numerica
bloom: 1
minutos_estimados: 10
pistas:
- Verificá divisiones por cero en el denominador de convergencia.
- Controlá el criterio de parada del método iterativo.
tags:
- algebra_lineal
- metodos_numericos
- newton_raphson
- matrices
- dep:matrices
- dep:algoritmos_ordenamiento
- c11
- inicial
verificado: false
funciones:
- nombre: gauss_pivoteo_parcial
  retorno: int
  parametros: const double *A, const double *b, size_t n, double *x
  descripcion: 1 si resuelve; 0 ante argumentos inválidos, matriz singular o falta de memoria.
tests_funciones:
- nombre: test_gauss_pivoteo_parcial_funcional
  funcion: gauss_pivoteo_parcial
  codigo: double A[]={0,1,1,1},b[]={2,3},x[2];assert(gauss_pivoteo_parcial(A,b,2,x));assert(fabs(x[0]-1)<1e-9&&fabs(x[1]-2)<1e-9);
- nombre: pivote_pequeno_no_nulo
  funcion: gauss_pivoteo_parcial
  codigo: double A[]={1e-30},b[]={2e-30},x[1]; assert(gauss_pivoteo_parcial(A,b,1,x)); assert(fabs(x[0]-2.0)<1e-12);
