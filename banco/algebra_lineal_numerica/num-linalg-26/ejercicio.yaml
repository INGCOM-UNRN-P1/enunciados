id: num-linalg-26
titulo: Transformada Rápida de Fourier FFT de Radix-2
tema: algebra_lineal_numerica
bloom: 4
minutos_estimados: 35
pistas:
- Permutá primero los elementos por inversión de bits.
- Usá mariposas de longitudes crecientes y exponente con signo negativo.
tags:
- algebra_lineal
- metodos_numericos
- fft
- numeros_complejos
- c11
- intermedia
verificado: true
funciones:
- nombre: fft_radix2
  retorno: int
  parametros: double *real, double *imag, size_t n
  descripcion: Calcula in situ la FFT compleja directa con radix 2.
tests_funciones:
- nombre: constante
  funcion: fft_radix2
  codigo: double r[]={1,1,1,1},i[]={0,0,0,0};assert(fft_radix2(r,i,4));assert(r[0]==4&&r[1]==0&&r[2]==0&&r[3]==0);
- nombre: tamano_invalido
  funcion: fft_radix2
  codigo: double r[]={1,2,3},i[]={0,0,0};assert(!fft_radix2(r,i,3));assert(r[0]==1&&r[1]==2&&r[2]==3);
