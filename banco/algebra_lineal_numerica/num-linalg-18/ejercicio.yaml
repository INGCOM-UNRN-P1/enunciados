id: num-linalg-18
titulo: Integración Numérica por Regla de Simpson Tres Octavos
tema: algebra_lineal_numerica
bloom: 3
minutos_estimados: 25
pistas:
- Respeta las dimensiones y el dominio indicado por la regla numérica.
- Comprueba finitud de entradas y resultados intermedios.
tags:
- algebra_lineal
- metodos_numericos
- c11
- integracion_numerica
- intermedia
verificado: true
funciones:
- nombre: integrar_simpson_tres_octavos
  retorno: double
  parametros: double (*f)(double), double a, double b, int intervalos
  descripcion: Simpson compuesto 3/8; intervalos debe ser positivo y múltiplo de 3. NAN ante contrato inválido o evaluación no finita.
tests_funciones:
- nombre: test_integrar_simpson_tres_octavos
  funcion: integrar_simpson_tres_octavos
  codigo: >-
    assert(fabs(integrar_simpson_tres_octavos(sin,0.0,3.14159265358979323846,1200)-2.0)<1e-9); assert(isnan(integrar_simpson_tres_octavos(sin,0,1,2)));
publicar: true
unidad: 4
modulo: Métodos Numéricos
dificultad: intermedia
tipo: practica_guiada
prerrequisitos: []
subtema: '18'
