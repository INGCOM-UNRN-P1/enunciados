id: num-linalg-04
titulo: Eliminación gaussiana sin pivoteo
tema: algebra_lineal_numerica
bloom: 1
minutos_estimados: 10
pistas:
- Verificá divisiones por cero en el denominador de convergencia.
- Controlá el criterio de parada del método iterativo.
tags:
- algebra_lineal
- metodos_numericos
- newton_raphson
- matrices
- dep:matrices
- dep:algoritmos_ordenamiento
- c11
- inicial
verificado: false
funciones:
- nombre: gauss_simple
  retorno: int
  parametros: const double *A, const double *b, size_t n, double *x
  descripcion: 1 si existe solución única y se escribe en x; 0 ante argumentos inválidos, pivote nulo
    o falta de memoria.
tests_funciones:
- nombre: test_gauss_simple_funcional
  funcion: gauss_simple
  codigo: double A[]={2,1,1,3},b[]={5,7},x[2];assert(gauss_simple(A,b,2,x));assert(fabs(x[0]-1.6)<1e-9&&fabs(x[1]-1.8)<1e-9);
- nombre: pivote_pequeno_no_nulo
  funcion: gauss_simple
  codigo: double A[]={1e-30},b[]={2e-30},x[1]; assert(gauss_simple(A,b,1,x)); assert(fabs(x[0]-2.0)<1e-12);
publicar: true
unidad: 4
modulo: Tipos Abstractos y Algorítmica
dificultad: inicial
tipo: practica_guiada
prerrequisitos:
- matrices
- algoritmos_ordenamiento
subtema: '04'
