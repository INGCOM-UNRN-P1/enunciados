verificado: true
funciones:
- nombre: rk4_edo
  retorno: double
  parametros: double (*f)(double, double), double x0, double y0, double x1, int pasos
  descripcion: Integra y'=f(x,y) mediante Runge-Kutta clásico de orden 4; pasos positivos. NAN ante entradas o cálculos
    no finitos.
tests_funciones:
- nombre: edo_callback_hypot
  funcion: rk4_edo
  codigo: assert(fabs(rk4_edo(hypot,0,1,1,1)-2.818220555818728)<1e-12); assert(isnan(rk4_edo(hypot,0,1,1,0)));
