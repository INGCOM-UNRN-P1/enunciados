id: num-linalg-29
titulo: Optimización Unidimensional por Búsqueda de la Sección Áurea
tema: algebra_lineal_numerica
bloom: 5
minutos_estimados: 45
pistas:
- Mantén dos puntos interiores y reutiliza una evaluación por iteración.
- El ancho del intervalo decrece por el inverso de la razón áurea.
tags:
- optimizacion
- metodos_numericos
- seccion_aurea
- c11
- avanzada
verificado: true
funciones:
- nombre: minimizar_seccion_aurea
  retorno: double
  parametros: funcion_objetivo_t f, double a, double b, double tolerancia, size_t max_iter
  descripcion: Busca el mínimo de una función unimodal en un intervalo mediante sección áurea.
tests_funciones:
- nombre: minimo_de_seno_en_intervalo
  funcion: minimizar_seccion_aurea
  codigo: double m=minimizar_seccion_aurea(sin,4,5,1e-8,200);assert(isfinite(m)&&fabs(sin(m)+1)<1e-8);
- nombre: intervalo_degenerado
  funcion: minimizar_seccion_aurea
  codigo: assert(isnan(minimizar_seccion_aurea(sin,1,1,1e-4,50)));
publicar: true
unidad: 4
modulo: Tipos Abstractos y Algorítmica
dificultad: avanzada
prerrequisitos:
- funciones
- metodos_numericos
subtema: '29'
