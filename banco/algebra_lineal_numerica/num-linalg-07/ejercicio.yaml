id: num-linalg-07
titulo: Inversión de Matrices por Método de Gauss-Jordan
tema: algebra_lineal_numerica
bloom: 2
minutos_estimados: 15
pistas:
- Usa pivoteo parcial para reducir los errores de redondeo.
- Detecta singularidad con pivote exactamente cero, sin epsilon absoluto.
tags:
