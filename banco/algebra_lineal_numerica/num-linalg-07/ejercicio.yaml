verificado: true
funciones:
- nombre: invertir_gauss_jordan
  retorno: int
  parametros: double **A, int n
  descripcion: Invierte in situ una matriz cuadrada mediante Gauss-Jordan; devuelve 1 al éxito y 0 ante entrada inválida, singularidad o falta de memoria.
tests_funciones:
- nombre: test_invertir_gauss_jordan
  funcion: invertir_gauss_jordan
  codigo: >-
    double r0[]={4,7},r1[]={2,6}; double *a[]={r0,r1}; assert(invertir_gauss_jordan(a,2)); assert(fabs(r0[0]-.6)<1e-12 && fabs(r0[1]+.7)<1e-12); double s0[]={1,2},s1[]={2,4}; double *s[]={s0,s1}; assert(!invertir_gauss_jordan(s,2));
