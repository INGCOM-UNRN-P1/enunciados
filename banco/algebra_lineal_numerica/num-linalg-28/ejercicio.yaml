id: num-linalg-28
titulo: Cálculo de Raíces Polinómicas por Método de Bairstow
tema: algebra_lineal_numerica
bloom: 5
minutos_estimados: 45
pistas:
- La división sintética produce dos residuos que deben anularse.
- La actualización de u y v requiere resolver el Jacobiano 2×2 de esos residuos.
tags:
- algebra_lineal
- metodos_numericos
- polinomios
- bairstow
- c11
- avanzada
verificado: true
funciones:
- nombre: bairstow_par_raices
  retorno: int
  parametros: const double *coeficientes, size_t grado, double u_inicial, double v_inicial, double tolerancia, size_t
    max_iter, double *r1_real, double *r1_imag, double *r2_real, double *r2_imag
  descripcion: Extrae un factor cuadrático mediante Bairstow y calcula sus dos raíces.
tests_funciones:
- nombre: raices_reales
  funcion: bairstow_par_raices
  codigo: double p[]={1,0,-5,0,4},a,b,c,d;assert(bairstow_par_raices(p,4,0,-1,1e-10,100,&a,&b,&c,&d));assert(fabs(a*a-1)<1e-8&&fabs(c*c-1)<1e-8);
- nombre: raices_complejas
  funcion: bairstow_par_raices
  codigo: double p[]={1,0,1},a,b,c,d;assert(bairstow_par_raices(p,2,0,1,1e-12,10,&a,&b,&c,&d));assert(fabs(a)<1e-10&&fabs(c)<1e-10&&fabs(fabs(b)-1)<1e-10);
- nombre: limites_y_salidas_alias
  funcion: bairstow_par_raices
  codigo: double a[]={1,0,-1},x,y,z,w; assert(!bairstow_par_raices(a,SIZE_MAX,0,-1,1e-9,10,&x,&y,&z,&w)); assert(!bairstow_par_raices(a,2,0,-1,1e-9,10,&x,&x,&z,&w));
publicar: true
unidad: 4
modulo: Tipos Abstractos y Algorítmica
dificultad: avanzada
prerrequisitos:
- arreglos
- metodos_numericos
subtema: '28'
