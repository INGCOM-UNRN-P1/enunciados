id: num-linalg-19
titulo: Diferenciación Numérica por Diferencias Finitas Centrales
tema: algebra_lineal_numerica
bloom: 3
minutos_estimados: 25
pistas:
- Respeta las dimensiones y el dominio indicado por la regla numérica.
- Comprueba finitud de entradas y resultados intermedios.
tags:
- algebra_lineal
- metodos_numericos
- c11
- intermedia
verificado: true
funciones:
- nombre: derivada_central
  retorno: double
  parametros: double (*f)(double), double x, double h
  descripcion: Aproxima f'(x) por (f(x+h)-f(x-h))/(2h). Requiere h distinto de cero y evaluaciones finitas.
tests_funciones:
- nombre: test_derivada_central
  funcion: derivada_central
  codigo: >-
    assert(fabs(derivada_central(sin,0.7853981633974483,0.0001)-0.7071067811865476)<1e-8); assert(isnan(derivada_central(cos,1,0)));
publicar: true
unidad: 4
modulo: Métodos Numéricos
dificultad: intermedia
tipo: practica_guiada
prerrequisitos: []
subtema: '19'
