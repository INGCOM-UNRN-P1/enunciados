id: num-linalg-21
titulo: Resolución de EDOs por Método de Heun
tema: algebra_lineal_numerica
bloom: 4
minutos_estimados: 35
pistas:
- Respeta las dimensiones y el dominio indicado por la regla numérica.
- Comprueba finitud de entradas y resultados intermedios.
tags:
- algebra_lineal
- metodos_numericos
- c11
- edo
- intermedia
verificado: true
funciones:
- nombre: heun_edo
  retorno: double
  parametros: double (*f)(double, double), double x0, double y0, double x1, int pasos
  descripcion: Integra y'=f(x,y) mediante Heun explícito de segundo orden; pasos positivos, dirección creciente
    o decreciente. NAN ante datos/cálculo no finitos.
tests_funciones:
- nombre: edo_callback_hypot
  funcion: heun_edo
  codigo: assert(fabs(heun_edo(hypot,0,1,1,1)-2.618033988749895)<1e-12); assert(isnan(heun_edo(hypot,0,1,1,0)));
publicar: true
unidad: 4
modulo: Métodos Numéricos
dificultad: intermedia
prerrequisitos: []
subtema: '21'
