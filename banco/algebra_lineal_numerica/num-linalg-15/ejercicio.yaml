id: num-linalg-15
titulo: Ajuste de Curvas por Mínimos Cuadrados Lineales
tema: algebra_lineal_numerica
bloom: 3
minutos_estimados: 25
pistas:
- Respeta las dimensiones y el dominio indicado por la regla numérica.
- Comprueba finitud de entradas y resultados intermedios.
tags:
- algebra_lineal
- metodos_numericos
- c11
- intermedia
verificado: true
funciones:
- nombre: minimos_cuadrados_lineales
  retorno: int
  parametros: const double *x, const double *y, int n, double *pendiente, double *ordenada
  descripcion: Ajusta y=a*x+b por mínimos cuadrados. Devuelve 1 al éxito; 0 ante datos inválidos o abscisas sin variación.
tests_funciones:
- nombre: test_minimos_cuadrados_lineales
  funcion: minimos_cuadrados_lineales
  codigo: >-
    double x[]={0,1,2},y[]={1,3,5},a=0,b=0; assert(minimos_cuadrados_lineales(x,y,3,&a,&b)); assert(fabs(a-2)<1e-12&&fabs(b-1)<1e-12); double c[]={2,2}; assert(!minimos_cuadrados_lineales(c,y,2,&a,&b));
publicar: true
unidad: 4
modulo: Métodos Numéricos
dificultad: intermedia
tipo: practica_guiada
prerrequisitos: []
subtema: '15'
