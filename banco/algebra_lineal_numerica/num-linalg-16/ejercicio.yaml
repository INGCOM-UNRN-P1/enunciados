id: num-linalg-16
titulo: Integración Numérica por Regla del Trapecio
tema: algebra_lineal_numerica
bloom: 3
minutos_estimados: 25
pistas:
- Respeta las dimensiones y el dominio indicado por la regla numérica.
- Comprueba finitud de entradas y resultados intermedios.
tags:
- algebra_lineal
- metodos_numericos
- c11
- integracion_numerica
- intermedia
verificado: true
funciones:
- nombre: integrar_trapecio
  retorno: double
  parametros: double (*f)(double), double a, double b, int intervalos
  descripcion: Regla compuesta del trapecio en [a,b] con intervalos > 0. NAN para entradas o evaluaciones no finitas.
tests_funciones:
- nombre: test_integrar_trapecio
  funcion: integrar_trapecio
  codigo: >-
    assert(fabs(integrar_trapecio(sin,0.0,3.14159265358979323846,100000)-2.0)<1e-8); assert(isnan(integrar_trapecio(sin,0,1,0)));
publicar: true
