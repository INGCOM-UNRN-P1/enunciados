  descripcion: Calcula el determinante por eliminación con pivoteo parcial; NAN indica entrada inválida o error de recursos.
tests_funciones:
- nombre: test_determinante_triangularizacion
  funcion: determinante_triangularizacion
  codigo: >-
    double r0[]={0,2},r1[]={3,4}; double *a[]={r0,r1}; assert(fabs(determinante_triangularizacion(a,2)+6)<1e-12); double s0[]={1,2},s1[]={2,4}; double *s[]={s0,s1}; assert(determinante_triangularizacion(s,2)==0.0);
