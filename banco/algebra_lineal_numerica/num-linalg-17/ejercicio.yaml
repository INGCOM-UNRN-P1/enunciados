verificado: true
funciones:
- nombre: integrar_simpson_tercio
  retorno: double
  parametros: double (*f)(double), double a, double b, int intervalos
  descripcion: Simpson compuesto 1/3; intervalos debe ser positivo y par. NAN ante contrato inválido o evaluación no finita.
tests_funciones:
- nombre: test_integrar_simpson_tercio
  funcion: integrar_simpson_tercio
  codigo: >-
    assert(fabs(integrar_simpson_tercio(sin,0.0,3.14159265358979323846,1000)-2.0)<1e-9); assert(isnan(integrar_simpson_tercio(sin,0,1,3)));
