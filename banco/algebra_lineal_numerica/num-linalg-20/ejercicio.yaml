id: num-linalg-20
titulo: Resolución de EDOs por Método de Euler
tema: algebra_lineal_numerica
bloom: 3
minutos_estimados: 25
pistas:
- Respeta las dimensiones y el dominio indicado por la regla numérica.
- Comprueba finitud de entradas y resultados intermedios.
tags:
- algebra_lineal
- metodos_numericos
- c11
- edo
- intermedia
verificado: true
funciones:
- nombre: euler_edo
  retorno: double
  parametros: double (*f)(double, double), double x0, double y0, double x1, int pasos
  descripcion: Integra y'=f(x,y) desde x0,y0 hasta x1 con pasos positivos; admite x1<x0. NAN si entrada/cálculo
    no finito.
tests_funciones:
- nombre: edo_callback_hypot
  funcion: euler_edo
  codigo: assert(fabs(euler_edo(hypot,0,1,1,1)-2.0)<1e-12); assert(isnan(euler_edo(hypot,0,1,1,0)));
publicar: true
unidad: 4
modulo: Métodos Numéricos
dificultad: intermedia
tipo: practica_guiada
prerrequisitos: []
subtema: '20'
