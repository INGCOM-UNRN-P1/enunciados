id: num-linalg-06
titulo: Descomposición LU de Doolittle
tema: algebra_lineal_numerica
bloom: 1
minutos_estimados: 10
pistas:
- Verificá divisiones por cero en el denominador de convergencia.
- Controlá el criterio de parada del método iterativo.
tags:
- algebra_lineal
- metodos_numericos
- newton_raphson
- matrices
- dep:matrices
- dep:algoritmos_ordenamiento
- c11
- inicial
verificado: false
funciones:
- nombre: descomponer_lu
  retorno: int
  parametros: const double *A, size_t n, double *L, double *U
  descripcion: 1 si la factorización existe; 0 ante argumentos inválidos, pivote nulo o matriz que requiere
    pivoteo.
tests_funciones:
- nombre: test_descomponer_lu_funcional
  funcion: descomponer_lu
  codigo: double A[]={4,3,6,3,3,1,2,1,4},L[9],U[9];assert(descomponer_lu(A,3,L,U));for(size_t i=0;i<3;i++)for(size_t
    j=0;j<3;j++){double s=0;for(size_t k=0;k<3;k++)s+=L[i*3+k]*U[k*3+j];assert(fabs(s-A[i*3+j])<1e-9);}
- nombre: pivote_pequeno_no_nulo
  funcion: descomponer_lu
  codigo: double A[]={1e-30},L[1],U[1]; assert(descomponer_lu(A,1,L,U)); assert(L[0]==1.0 && U[0]==A[0]);
publicar: true
unidad: 4
modulo: Tipos Abstractos y Algorítmica
dificultad: inicial
tipo: practica_guiada
prerrequisitos:
- matrices
- algoritmos_ordenamiento
subtema: '06'
