id: num-linalg-23
titulo: Generación de Números con Distribución Normal Box-Muller
tema: algebra_lineal_numerica
bloom: 4
minutos_estimados: 35
pistas:
- Respeta las dimensiones y el dominio indicado por la regla numérica.
- Comprueba finitud de entradas y resultados intermedios.
tags:
- algebra_lineal
- metodos_numericos
- c11
- estadistica
- intermedia
verificado: true
funciones:
- nombre: box_muller
  retorno: int
  parametros: double u1, double u2, double *z0, double *z1
  descripcion: Transforma dos uniformes independientes [0,1) en dos normales estándar. Devuelve 1 al éxito; 0 si punteros/dominio inválidos. u1=0 no está permitido.
tests_funciones:
- nombre: test_box_muller
  funcion: box_muller
  codigo: >-
    double z0=0,z1=0; assert(box_muller(exp(-.5),0,&z0,&z1)); assert(fabs(z0-1)<1e-12&&fabs(z1)<1e-12); assert(!box_muller(0,0,&z0,&z1)); assert(!box_muller(.5,.5,&z0,&z0));
publicar: true
unidad: 4
modulo: Métodos Numéricos
dificultad: intermedia
prerrequisitos: []
subtema: '23'
