id: num-linalg-11
titulo: Cálculo de Autovalor Dominante por Método de las Potencias
tema: algebra_lineal_numerica
bloom: 2
minutos_estimados: 15
pistas:
- Respeta las dimensiones y el dominio indicado por la regla numérica.
- Comprueba finitud de entradas y resultados intermedios.
tags:
- algebra_lineal
- metodos_numericos
- c11
- matrices
- inicial
verificado: true
funciones:
- nombre: potencias_autovalor
  retorno: double
  parametros: double **A, double *vector_inicial, int n, double tolerancia, int max_iter
  descripcion: Autovalor dominante por potencias; devuelve NAN con argumentos inválidos, vector nulo, no convergencia o autovalor no realizable.
tests_funciones:
- nombre: test_potencias_autovalor
  funcion: potencias_autovalor
  codigo: >-
    double a0[]={5,0},a1[]={0,2}; double *a[]={a0,a1}; double v[]={1,1}; assert(fabs(potencias_autovalor(a,v,2,1e-10,100)-5)<1e-8); double z[]={0,0}; assert(isnan(potencias_autovalor(a,z,2,1e-8,20)));
publicar: true
unidad: 4
modulo: Métodos Numéricos
dificultad: inicial
tipo: practica_guiada
prerrequisitos:
- matrices
- algoritmos_ordenamiento
subtema: '11'
