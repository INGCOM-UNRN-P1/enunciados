pistas:
- Rastreá cada asignación dinámica (malloc/calloc) y asegurate de que exista un free
  correspondiente.
- Comprobá que no se utilicen punteros después de haber sido liberados (dangling pointers).
- Verificá la inicialización de todas las estructuras y sus campos antes de su primer
  uso.
