id: ej-11-1-b1-contar-vocales
titulo: Contar vocales
tema: cadenas
bloom: 3
minutos_estimados: 25
pistas:
- '[Plus Ultra] Garantizar la terminación con `\0` y prevenir desbordamientos de búfer
  validando la capacidad máxima.'
- '[Plus Ultra] Soportar la lectura de cadenas con espacios y múltiples líneas de
  manera robusta.'
- '**Entrada:** Una cadena de caracteres.'
- '**Proceso:**'
- Inicializar un `contador` en 0.
- Recorrer la cadena carácter por carácter con un lazo hasta encontrar el terminador
  nulo `\0`.
- Para cada carácter, es conveniente convertirlo a minúscula para simplificar la comparación
  (usando `tolower()` de `ctype.h`).
- Verificar si el carácter es una de las cinco vocales (`'a'`, `'e'`, `'i'`, `'o'`,
  `'u'`).
- Si es una vocal, incrementar el `contador`.
- '**Salida:** Devolver el valor final del `contador`.'
tags:
- contar
- cadenas
- strings
- memoria
- vocales
verificado: true
funciones:
- nombre: proc__1_b1_contar_vocales
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Contar vocales
tests_funciones:
- nombre: test_proc__1_b1_contar_vocales_positivo
  funcion: proc__1_b1_contar_vocales
  codigo: 'int res = proc__1_b1_contar_vocales(5);

    assert(res == 10 || res >= 0);'
- nombre: test_proc__1_b1_contar_vocales_cero
  funcion: proc__1_b1_contar_vocales
  codigo: 'int res = proc__1_b1_contar_vocales(0);

    assert(res == 0);'
