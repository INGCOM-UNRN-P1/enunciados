id: grafo-red-01
titulo: Representación de Grafo por Matriz de Adyacencia
tema: grafos_y_redes
bloom: 1
minutos_estimados: 10
pistas:
- Modelá las conexiones como matriz o lista de adyacencia.
- Controlá los límites de índices de vértices.
tags:
- grafos
- redes
- adyacencia
- vertices
- dep:estructuras_datos
- dep:matrices
- c11
- inicial
verificado: false
funciones:
- nombre: cargar_grafo_no_dirigido
  retorno: int
  parametros: size_t n, size_t m, const size_t (*aristas)[2], int matriz[50][50]
  descripcion: carga de aristas en matriz de adyacencia
- nombre: grafo_adyacente
  retorno: bool
  parametros: size_t n, const int matriz[50][50], size_t origen, size_t destino
  descripcion: consulta de adyacencia
tests_funciones:
- nombre: test_01_casos_representativos
  funcion: grafo_adyacente
  codigo: size_t e[2500][2]={{0}}; int m[50][50]={{0}}; e[0][0]=0;e[0][1]=1;e[1][0]=1;e[1][1]=2; assert(cargar_grafo_no_dirigido(3,2,e,m)==0);
    assert(grafo_adyacente(3,m,0,1)); assert(!grafo_adyacente(3,m,0,2)); size_t e50[2500][2]={{0}};e50[0][0]=48;e50[0][1]=49;assert(cargar_grafo_no_dirigido(50,1,e50,m)==0);assert(grafo_adyacente(50,m,48,49));
- nombre: permite_mas_de_2500_aristas_y_vacio
  funcion: cargar_grafo_no_dirigido
  codigo: size_t (*aristas)[2]=calloc(2501,sizeof(*aristas)); int m[50][50]; assert(aristas); for(size_t i=0;i<2501;i++){aristas[i][0]=0;aristas[i][1]=1;}
    assert(cargar_grafo_no_dirigido(2,2501,(const size_t (*)[2])aristas,m)==0 && m[0][1]); free(aristas); assert(cargar_grafo_no_dirigido(0,0,NULL,m)==0);
publicar: true
unidad: 4
modulo: Tipos Abstractos y Algorítmica
dificultad: inicial
tipo: practica_guiada
prerrequisitos:
- estructuras_datos
- matrices
subtema: grafos_y_redes
