funciones:
- nombre: kruskal_mst
  retorno: int
  parametros: size_t n,arista_kruskal_t *e,size_t m,arista_kruskal_t *sel,size_t cap,size_t *count
  descripcion: Árbol de Expansión Mínima MST por Algoritmo de Kruskal
tests_funciones:
- nombre: test_kruskal_mst_aristas_mst
  funcion: kruskal_mst
  codigo: arista_kruskal_t e[]={{0,1,2},{0,2,3},{1,2,1},{1,3,4},{2,3,5}},s[3];size_t c=0;assert(kruskal_mst(4,e,5,s,3,&c)==7&&c==3);assert(s[0].u==1&&s[0].v==2&&s[1].u==0&&s[1].v==1&&s[2].u==1&&s[2].v==3);
- nombre: test_kruskal_mst_desconectado
  funcion: kruskal_mst
  codigo: arista_kruskal_t e[]={{0,1,2}},s[2];size_t c=0;assert(kruskal_mst(3,e,1,s,2,&c)==-1&&c==1);
- nombre: test_kruskal_mst_peso_invalido
  funcion: kruskal_mst
  codigo: arista_kruskal_t e[]={{0,1,-1}},s[1];size_t c=0;assert(kruskal_mst(2,e,1,s,1,&c)==-1);
- nombre: test_kruskal_mst_capacidad
  funcion: kruskal_mst
  codigo: arista_kruskal_t e[]={{0,1,1}},s[1];size_t c=0;assert(kruskal_mst(2,e,1,s,0,&c)==-1);
