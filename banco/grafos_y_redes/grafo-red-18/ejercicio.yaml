id: grafo-red-18
titulo: Algoritmo de Floyd-Warshall para Todos los Pares de Caminos Mínimos
tema: grafos_y_redes
bloom: 3
minutos_estimados: 25
pistas:
- Modelá las conexiones como matriz o lista de adyacencia.
- Controlá los límites de índices de vértices.
tags:
- grafos
- redes
- adyacencia
- vertices
- dep:estructuras_datos
- dep:matrices
- c11
- intermedia
verificado: true
funciones:
- nombre: floyd_warshall
  retorno: int
  parametros: size_t n,long long *distancias
  descripcion: Algoritmo de Floyd-Warshall para Todos los Pares de Caminos Mínimos
tests_funciones:
- nombre: test_floyd_warshall_caminos
  funcion: floyd_warshall
  codigo: long long inf=LLONG_MAX/4;long long d[]={0,3,inf,inf,0,-2,4,inf,0};assert(floyd_warshall(3,d)==0&&d[2]==1&&d[6]==4);
- nombre: test_floyd_warshall_inalcanzable
  funcion: floyd_warshall
  codigo: long long inf=LLONG_MAX/4;long long d[]={0,inf,inf,inf,0,2,inf,inf,0};assert(floyd_warshall(3,d)==0&&d[2]==inf);
- nombre: test_floyd_warshall_limite
  funcion: floyd_warshall
  codigo: long long inf=LLONG_MAX/4;long long d[]={0,inf,inf,0};assert(floyd_warshall(2,d)==0&&d[1]==inf);
- nombre: test_floyd_warshall_invalido
  funcion: floyd_warshall
  codigo: assert(floyd_warshall(0,NULL)==-1);
- nombre: ciclo_negativo
  funcion: floyd_warshall
  codigo: long long d[]={0,-2,1,0};assert(floyd_warshall(2,d)==1);
- nombre: overflow_sin_ub
  funcion: floyd_warshall
  codigo: long long inf=LLONG_MAX/4; long long d[]={0,inf-1,inf,inf,0,2,inf,inf,0}; assert(floyd_warshall(3,d)==-2); long long invalido[]={0,LLONG_MAX,inf,0}; assert(floyd_warshall(2,invalido)==-1);
