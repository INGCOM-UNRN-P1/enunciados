  codigo: int r[]={0,0,0,0};assert(ford_fulkerson(2,r,0,1)==0);
- nombre: test_ford_fulkerson_residual_limite
  funcion: ford_fulkerson
  codigo: int r[]={0,2147483647,0,0};assert(ford_fulkerson(2,r,0,1)==2147483647);
- nombre: test_ford_fulkerson_invalido
  funcion: ford_fulkerson
  codigo: assert(ford_fulkerson(2,NULL,0,1)==-1);
- nombre: rechaza_overflow_residual_inverso
