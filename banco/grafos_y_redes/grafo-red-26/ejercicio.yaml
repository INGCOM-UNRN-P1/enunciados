- nombre: test_edmonds_karp_residual_overflow
  funcion: edmonds_karp
  codigo: int r[]={0,2147483647,0,0};assert(edmonds_karp(2,r,0,1)==2147483647);
- nombre: test_edmonds_karp_invalido
  funcion: edmonds_karp
  codigo: assert(edmonds_karp(2,NULL,0,1)==-1);
- nombre: rechaza_overflow_residual_inverso
  funcion: edmonds_karp
  codigo: int r[]={0,1,2147483647,0};assert(edmonds_karp(2,r,0,1)==-1&&r[1]==1&&r[2]==2147483647);
