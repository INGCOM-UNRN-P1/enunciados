id: grafo-red-30
titulo: Simulador de Ruteo de Paquetes en Redes de Topología de Malla
tema: grafos_y_redes
bloom: 5
minutos_estimados: 45
pistas:
- Modelá las conexiones como matriz o lista de adyacencia.
- Controlá los límites de índices de vértices.
tags:
- grafos
- redes
- adyacencia
- vertices
- dep:estructuras_datos
- dep:matrices
- c11
- avanzada
verificado: true
funciones:
- nombre: ruta_malla
  retorno: int
  parametros: size_t filas,size_t cols,const unsigned char *bloqueada,size_t inicio,size_t destino,size_t *ruta,size_t
    capacidad,size_t *longitud
  descripcion: Simulador de Ruteo de Paquetes en Redes de Topología de Malla
tests_funciones:
- nombre: test_ruta_malla_ruta
  funcion: ruta_malla
  codigo: unsigned char b[]={0,0,0,0,1,0,0,0,0};size_t r[9],l;assert(ruta_malla(3,3,b,0,8,r,9,&l)==1&&r[0]==0&&r[l-1]==8&&l==5);
- nombre: test_ruta_malla_bloqueada
  funcion: ruta_malla
  codigo: unsigned char b[]={0,1,0};size_t r[3],l;assert(ruta_malla(1,3,b,0,2,r,3,&l)==0);
- nombre: test_ruta_malla_inicio_fin
  funcion: ruta_malla
  codigo: unsigned char b[]={0};size_t r[1],l;assert(ruta_malla(1,1,b,0,0,r,1,&l)==1&&l==1);
- nombre: test_ruta_malla_indice
  funcion: ruta_malla
  codigo: unsigned char b[]={0};size_t r[1],l;assert(ruta_malla(1,1,b,2,0,r,1,&l)==-1);
- nombre: capacidad_insuficiente
  funcion: ruta_malla
  codigo: unsigned char b[]={0,0,0,0};size_t r[1],l;assert(ruta_malla(2,2,b,0,3,r,1,&l)==-1);
publicar: true
unidad: 4
