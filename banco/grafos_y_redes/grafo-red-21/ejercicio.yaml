verificado: true
funciones:
- nombre: puentes_articulaciones
  retorno: int
  parametros: size_t n,const unsigned char *a,unsigned char *art,unsigned char *br
  descripcion: Detección de Puentes y Puntos de Articulación en Grafos
tests_funciones:
- nombre: test_puentes_articulaciones_cadena
  funcion: puentes_articulaciones
  codigo: unsigned char a[]={0,1,0,1,0,1,0,1,0},art[3],br[9];assert(puentes_articulaciones(3,a,art,br)==2&&art[1]&&br[1]&&br[5]);
- nombre: test_puentes_articulaciones_ciclo
  funcion: puentes_articulaciones
  codigo: unsigned char a[]={0,1,1,1,0,1,1,1,0},art[3],br[9];assert(puentes_articulaciones(3,a,art,br)==0&&!art[0]&&!art[1]&&!art[2]);
- nombre: test_puentes_articulaciones_aislados
  funcion: puentes_articulaciones
  codigo: unsigned char a[]={0,0,0,0},art[2],br[4];assert(puentes_articulaciones(2,a,art,br)==0);
- nombre: test_puentes_articulaciones_nulo
  funcion: puentes_articulaciones
  codigo: assert(puentes_articulaciones(0,NULL,NULL,NULL)==-1);
