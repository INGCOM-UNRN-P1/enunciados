- nombre: test_bellman_ford_ciclo_negativo_inalcanzable
  funcion: bellman_ford_ciclo_negativo
  codigo: arista_t e[]={{1,2,-2},{2,1,1}};long long d[3];assert(bellman_ford_ciclo_negativo(3,e,2,0,d)==0);
- nombre: test_bellman_ford_ciclo_negativo_indice_invalido
  funcion: bellman_ford_ciclo_negativo
  codigo: long long d[1];assert(bellman_ford_ciclo_negativo(1,NULL,0,1,d)==-1);
