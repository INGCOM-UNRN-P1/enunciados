tests_funciones:
- nombre: test_bellman_ford_ciclo_negativo_ciclo_negativo
  funcion: bellman_ford_ciclo_negativo
  codigo: arista_t e[]={{0,1,1},{1,2,-3},{2,1,1}};long long d[3];assert(bellman_ford_ciclo_negativo(3,e,3,0,d)==1);
- nombre: test_bellman_ford_ciclo_negativo_sin_ciclo
  funcion: bellman_ford_ciclo_negativo
