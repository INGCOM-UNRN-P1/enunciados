tests_funciones:
- nombre: test_10_colores_validos_desconectado_y_ciclo_impar
  funcion: dos_colorear
  codigo: int a[20][20]={{0}},c[20];for(int i=0;i<20;i++)c[i]=7;a[0][1]=a[1][0]=1;a[1][2]=a[2][1]=1;a[3][4]=a[4][3]=1;assert(dos_colorear(6,a,c));for(int
    i=0;i<6;i++)assert(c[i]==0||c[i]==1);for(int i=0;i<6;i++)for(int j=0;j<6;j++)if(a[i][j])assert(c[i]!=c[j]);assert(c[5]==0);int
    impar[20][20]={{0}},salida[20];for(int i=0;i<20;i++)salida[i]=9;impar[0][1]=impar[1][0]=1;impar[1][2]=impar[2][1]=1;impar[2][0]=impar[0][2]=1;assert(!dos_colorear(3,impar,salida));for(int
    i=0;i<20;i++)assert(salida[i]==9);assert(es_bipartito(6,a));assert(!es_bipartito(3,impar));
