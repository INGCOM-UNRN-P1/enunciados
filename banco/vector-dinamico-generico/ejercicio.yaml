id: vector-dinamico-generico
titulo: Vector Dinámico con Crecimiento Amortizado
tema: memoria_dinamica
bloom: 3
minutos_estimados: 25
pistas:
- Iniciá con una capacidad inicial pequeña (ej. 4 elementos).
- 'Cuando `longitud == capacidad`, duplicá la capacidad: `nueva_capacidad = capacidad
  * 2` y usá `realloc()`.'
- Si la longitud cae por debajo de `capacidad / 4`, podés reducir la capacidad.
