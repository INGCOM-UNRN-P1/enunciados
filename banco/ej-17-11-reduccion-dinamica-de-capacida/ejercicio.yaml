tests_funciones:
- nombre: test_proc_dinamica_de_capacida_positivo
  funcion: proc_dinamica_de_capacida
  codigo: 'int res = proc_dinamica_de_capacida(5);

    assert(res == 10 || res >= 0);'
- nombre: test_proc_dinamica_de_capacida_cero
  funcion: proc_dinamica_de_capacida
