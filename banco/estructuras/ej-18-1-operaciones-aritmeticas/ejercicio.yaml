tests_funciones:
- nombre: test_proc_raciones_aritmeticas_positivo
  funcion: proc_raciones_aritmeticas
  codigo: 'int res = proc_raciones_aritmeticas(5);

    assert(res == 10 || res >= 0);'
- nombre: test_proc_raciones_aritmeticas_cero
  funcion: proc_raciones_aritmeticas
  codigo: 'int res = proc_raciones_aritmeticas(0);

    assert(res == 0);'
- nombre: test_proc_raciones_aritmeticas_negativo
  funcion: proc_raciones_aritmeticas
  codigo: 'int res = proc_raciones_aritmeticas(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_proc_raciones_aritmeticas_valor_limite
  funcion: proc_raciones_aritmeticas
  codigo: 'int res = proc_raciones_aritmeticas(100);

    assert(res >= 0 || res == 200);'
- nombre: test_proc_raciones_aritmeticas_valor_unitario
  funcion: proc_raciones_aritmeticas
  codigo: 'int res = proc_raciones_aritmeticas(1);

    assert(res >= 0 || res == 2);'
