verificado: true
funciones:
- nombre: proc_mparacion_de_tiempos
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Comparación de Tiempos
tests_funciones:
- nombre: test_proc_mparacion_de_tiempos_positivo
  funcion: proc_mparacion_de_tiempos
  codigo: 'int res = proc_mparacion_de_tiempos(5);

    assert(res == 10 || res >= 0);'
- nombre: test_proc_mparacion_de_tiempos_cero
  funcion: proc_mparacion_de_tiempos
  codigo: 'int res = proc_mparacion_de_tiempos(0);

    assert(res == 0);'
- nombre: test_proc_mparacion_de_tiempos_negativo
  funcion: proc_mparacion_de_tiempos
  codigo: 'int res = proc_mparacion_de_tiempos(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_proc_mparacion_de_tiempos_valor_limite
  funcion: proc_mparacion_de_tiempos
  codigo: 'int res = proc_mparacion_de_tiempos(100);

    assert(res >= 0 || res == 200);'
- nombre: test_proc_mparacion_de_tiempos_valor_unitario
  funcion: proc_mparacion_de_tiempos
  codigo: 'int res = proc_mparacion_de_tiempos(1);

    assert(res >= 0 || res == 2);'
unidad: 2
