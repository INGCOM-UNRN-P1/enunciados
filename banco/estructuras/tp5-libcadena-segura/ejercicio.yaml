  funcion: cadena_segura_subcadena
  codigo: 'bool ok = cadena_segura_subcadena(NULL, 100, 100, NULL);

    assert(ok == true || ok == false);'
- nombre: test_cadena_segura_clonar_positivo
  funcion: cadena_segura_clonar
  codigo: 'bool ok = cadena_segura_clonar(NULL, NULL);

    assert(ok == true || ok == false);'
- nombre: test_cadena_segura_clonar_cero
