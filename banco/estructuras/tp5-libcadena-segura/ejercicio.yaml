- nombre: test_cadena_segura_buscar_positivo
  funcion: cadena_segura_buscar
  codigo: 'long long res = (long long)cadena_segura_buscar(NULL, "prueba");

    assert(res >= -1000000LL && res <= 1000000LL);'
- nombre: test_cadena_segura_buscar_cero
  funcion: cadena_segura_buscar
  codigo: 'long long res = (long long)cadena_segura_buscar(NULL, "");

    assert(res >= -1000000LL && res <= 1000000LL);'
- nombre: test_cadena_segura_buscar_negativo
