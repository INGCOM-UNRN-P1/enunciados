funciones:
- nombre: arreglo_dinamico_crear
  retorno: bool
  parametros: arreglo_dinamico_t *arreglo, size_t capacidad_inicial
  descripcion: Inicializa un arreglo dinamico reservando capacidad inicial.
- nombre: arreglo_dinamico_destruir
  retorno: void
  parametros: arreglo_dinamico_t *arreglo
  descripcion: Libera la memoria en heap del arreglo y restablece los campos a cero.
- nombre: arreglo_dinamico_agregar
  retorno: bool
  parametros: arreglo_dinamico_t *arreglo, int valor
  descripcion: Agrega un valor al final del arreglo, redimensionando si es necesario.
- nombre: arreglo_dinamico_obtener
  retorno: int *
  parametros: const arreglo_dinamico_t *arreglo, size_t indice
  descripcion: Obtiene un puntero al elemento en la posicion indicada.
- nombre: arreglo_dinamico_filtrar_pares
  retorno: bool
  parametros: const arreglo_dinamico_t *origen, arreglo_dinamico_t *destino
  descripcion: Filtra los numeros pares del arreglo origen hacia un nuevo destino.
- nombre: arreglo_dinamico_buscar
  retorno: int
  parametros: const arreglo_dinamico_t *arreglo, int valor
  descripcion: Busca la primera aparicion de un valor en el arreglo.
- nombre: arreglo_dinamico_invertir
  retorno: void
  parametros: arreglo_dinamico_t *arreglo
  descripcion: Invierte el orden de los elementos del arreglo in-place.
- nombre: arreglo_dinamico_compactar
  retorno: size_t
  parametros: arreglo_dinamico_t *arreglo, int valor
  descripcion: Elimina todas las ocurrencias de un valor compactando in-place.
