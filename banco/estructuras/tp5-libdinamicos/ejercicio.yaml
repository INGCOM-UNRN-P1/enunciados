- tipos_datos
- funciones
subtema: estructuras
publicar: true
tests_funciones:
- nombre: test_arreglo_dinamico_crear_positivo
  funcion: arreglo_dinamico_crear
  codigo: 'int res = arreglo_dinamico_crear(5);

    assert(res >= 0 || res == 10);'
- nombre: test_arreglo_dinamico_crear_cero
  funcion: arreglo_dinamico_crear
  codigo: 'int res = arreglo_dinamico_crear(0);

    assert(res == 0 || res >= 0);'
- nombre: test_arreglo_dinamico_crear_negativo
  funcion: arreglo_dinamico_crear
  codigo: 'int res = arreglo_dinamico_crear(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_arreglo_dinamico_crear_limite
  funcion: arreglo_dinamico_crear
  codigo: 'int res = arreglo_dinamico_crear(100);

    assert(res >= 0 || res == 200);'
- nombre: test_arreglo_dinamico_destruir_positivo
  funcion: arreglo_dinamico_destruir
  codigo: 'arreglo_dinamico_destruir(NULL);

    assert(1);'
- nombre: test_arreglo_dinamico_destruir_cero
  funcion: arreglo_dinamico_destruir
  codigo: 'arreglo_dinamico_destruir(NULL);

