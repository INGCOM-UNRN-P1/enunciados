id: ej-3-16-numeros-felices
titulo: Números Felices
tema: aritmetica
bloom: 3
minutos_estimados: 25
pistas:
- '**Entrada:** Un entero positivo `n`.'
- '**Proceso:** Usar un lazo `while`. En cada iteración, calcular la suma de los cuadrados
  de los dígitos del número actual. El lazo debe terminar si el número se convierte
  en 1 (feliz) o si se detecta un ciclo (no feliz). Para detectar ciclos, se puede
  guardar los números ya vistos en un arreglo o simplemente detectar si se llega al
  número 4. filas (*row-major order*) para mejorar el uso de caché. estrictamente
  dentro de los límites del contenedor.'
- '[Plus Ultra] Detectar ciclos usando un límite de iteraciones para números que no
  son felices.'
- '[Plus Ultra] Listar todos los números felices comprendidos entre 1 y 100.'
tags:
- fundamentos
- aritmetica
- felices
- numeros
- matematica
verificado: true
funciones:
- nombre: proc_3_16_numeros_felices
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Números Felices
tests_funciones:
- nombre: test_proc_3_16_numeros_felices_positivo
  funcion: proc_3_16_numeros_felices
  codigo: 'int res = proc_3_16_numeros_felices(5);

    assert(res == 10 || res >= 0);'
- nombre: test_proc_3_16_numeros_felices_cero
  funcion: proc_3_16_numeros_felices
  codigo: 'int res = proc_3_16_numeros_felices(0);

    assert(res == 0);'
