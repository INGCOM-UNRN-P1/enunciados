id: ej-10-6-casi-maximo
titulo: Casi máximo
tema: arreglos
bloom: 3
minutos_estimados: 25
pistas:
- '**Entrada:** Un arreglo y su tamaño.'
- '**Variables:** Se necesitan dos variables: `maximo` y `segundo_maximo`. Inicializarlas
  con el menor valor posible o con los dos primeros elementos del arreglo de forma
  ordenada.'
- '**Proceso:**'
- Recorrer el arreglo.
- 'Si el elemento actual `x` es mayor que `maximo`: a. `segundo_maximo` toma el valor
  de `maximo`. b. `maximo` toma el valor de `x`.'
- Si no, si `x` es mayor que `segundo_maximo` y diferente de `maximo`, se 
  actualiza `segundo_maximo` a `x`.
- '[Plus Ultra] Optimizar el acceso a memoria respetando el orden por filas (*row-major
  order*) para mejorar el uso de caché.'
- '[Plus Ultra] Validar que los índices ingresados se encuentren estrictamente dentro
  de los límites del contenedor.'
