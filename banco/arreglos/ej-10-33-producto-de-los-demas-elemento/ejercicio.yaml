id: ej-10-33-producto-de-los-demas-elemento
titulo: Producto de los demás elementos
tema: arreglos
bloom: 3
minutos_estimados: 25
pistas:
- '**Proceso (dos pasadas):**'
- Crear un arreglo `resultado`.
- '**Primera pasada (izquierda a derecha):** Recorrer el arreglo. Para cada `i`, `resultado[i]`
  será el producto de todos los elementos a su izquierda. Mantener un acumulador `izquierda_prod`.'
- '**Segunda pasada (derecha a izquierda):** Recorrer el arreglo al revés. Mantener
  un acumulador `derecha_prod`. Multiplicar `resultado[i]` por `derecha_prod` para
  incorporar los productos de la derecha.'
- '[Plus Ultra] Optimizar el acceso a memoria respetando el orden por filas (*row-major
  order*) para mejorar el uso de caché.'
- '[Plus Ultra] Validar que los índices ingresados se encuentren estrictamente dentro
  de los límites del contenedor.'
tags:
- producto
- arreglos
- memoria
- elementos
- vectores
- dep:funciones
- dep:lazos
verificado: true
funciones:
