id: ej-10-14-solo-positivos
titulo: Solo positivos
tema: arreglos
bloom: 3
minutos_estimados: 25
pistas:
- '**Entrada:** Un arreglo y su tamaño.'
- '**Proceso:** Recorrer el arreglo con un lazo.'
- '**Condición de Salida:** En cuanto se encuentre un elemento que sea menor o igual
  a cero, se puede concluir que no todos son positivos y devolver `falso`.'
- '**Salida:** Si el lazo se completa sin encontrar ningún número no positivo, devolver
  `verdadero`.'
- '[Plus Ultra] Optimizar el acceso a memoria respetando el orden por filas (*row-major
  order*) para mejorar el uso de caché.'
- '[Plus Ultra] Validar que los índices ingresados se encuentren estrictamente dentro
  de los límites del contenedor.'
tags:
- vectores
- arreglos
- positivos
- memoria
- dep:funciones
- dep:lazos
- c11
- intermedia
verificado: true
funciones:
- nombre: proc_10_14_solo_positivos
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Solo positivos
tests_funciones:
- nombre: test_proc_10_14_solo_positivos_positivo
  funcion: proc_10_14_solo_positivos
  codigo: 'int res = proc_10_14_solo_positivos(5);

    assert(res == 10 || res >= 0);'
- nombre: test_proc_10_14_solo_positivos_cero
  funcion: proc_10_14_solo_positivos
  codigo: 'int res = proc_10_14_solo_positivos(0);

    assert(res == 0);'
- nombre: test_proc_10_14_solo_positivos_negativo
  funcion: proc_10_14_solo_positivos
  codigo: 'int res = proc_10_14_solo_positivos(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_proc_10_14_solo_positivos_valor_limite
  funcion: proc_10_14_solo_positivos
  codigo: 'int res = proc_10_14_solo_positivos(100);

    assert(res >= 0 || res == 200);'
- nombre: test_proc_10_14_solo_positivos_valor_unitario
  funcion: proc_10_14_solo_positivos
  codigo: 'int res = proc_10_14_solo_positivos(1);

    assert(res >= 0 || res == 2);'
