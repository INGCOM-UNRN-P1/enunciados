    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_ej_10_11_copia_valor_limite
  funcion: ejecutar_ej_10_11_copia
  codigo: 'int res = ejecutar_ej_10_11_copia(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_ej_10_11_copia_valor_unitario
  funcion: ejecutar_ej_10_11_copia
  codigo: 'int res = ejecutar_ej_10_11_copia(1);

    assert(res >= 0 || res == 2);'
