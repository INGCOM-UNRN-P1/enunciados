id: ej-10-11-copia
titulo: Copia
tema: arreglos
bloom: 3
minutos_estimados: 25
pistas:
- '**Entrada:** Un arreglo de origen, un arreglo de destino y el tamaño.'
- '**Precondición:** El arreglo de destino debe tener suficiente capacidad para albergar
  todos los elementos del arreglo de origen.'
- '**Proceso:** Recorrer el arreglo de origen con un lazo `for` y, en cada iteración,
  asignar el elemento de origen al elemento correspondiente en el arreglo de destino:
  `destino[i] = origen[i]`.'
- '[Plus Ultra] Optimizar el acceso a memoria respetando el orden por filas (*row-major
  order*) para mejorar el uso de caché.'
- '[Plus Ultra] Validar que los índices ingresados se encuentren estrictamente dentro
  de los límites del contenedor.'
tags:
