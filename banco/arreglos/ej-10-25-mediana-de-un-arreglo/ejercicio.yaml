id: ej-10-25-mediana-de-un-arreglo
titulo: Mediana de un arreglo
tema: arreglos
bloom: 3
minutos_estimados: 25
pistas:
- '**Proceso:**'
- Ordenar el arreglo.
- 'Determinar el índice del medio: `medio = tamano / 2`.'
- Si el tamaño es impar, la mediana es `arreglo[medio]`.
- Si el tamaño es par, la mediana es `(arreglo[medio - 1] + arreglo[medio]) / 
  2.0`.
- '[Plus Ultra] Optimizar el acceso a memoria respetando el orden por filas (*row-major
  order*) para mejorar el uso de caché.'
- '[Plus Ultra] Validar que los índices ingresados se encuentren estrictamente dentro
  de los límites del contenedor.'
