id: ej-10-16-fusion-de-arreglos
titulo: Fusión de arreglos
tema: arreglos
bloom: 3
minutos_estimados: 25
pistas:
- '**Entrada:** Dos arreglos (`a1`, `a2`) con sus respectivos tamaños (`n1`, `n2`).'
- '**Salida:** Un nuevo arreglo de tamaño `n1 + n2`.'
- '**Proceso (desordenado):** Simplemente copiar todos los elementos de `a1` al nuevo
  arreglo, y luego todos los elementos de `a2` a continuación.'
- '**Proceso (ordenado):** Usar el algoritmo de mezcla de Merge Sort. Con tres punteros
  (`i` para `a1`, `j` para `a2`, `k` para el resultado), comparar `a1[i]` y `a2[j]`,
  copiar el menor al resultado y avanzar el puntero correspondiente.'
- '[Plus Ultra] Validar punteros `NULL` recibidos como parámetro para evitar fallos
  de segmentación.'
- '[Plus Ultra] Implementar una versión utilizando aritmética de punteros en lugar
  de indexación directa.'
