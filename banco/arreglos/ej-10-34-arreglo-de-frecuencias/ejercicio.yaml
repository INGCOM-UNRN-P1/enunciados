id: ej-10-34-arreglo-de-frecuencias
titulo: Arreglo de frecuencias
tema: arreglos
bloom: 3
minutos_estimados: 25
pistas:
- '**Proceso:**'
- Crear un nuevo arreglo `frecuencias` del tamaño del rango (ej. 100), 
  inicializado todo en 0.
- 'Recorrer el arreglo de entrada. Para cada número `x`, usarlo como índice en el
  arreglo de frecuencias e incrementar la cuenta: `frecuencias[x]++`.'
- '[Plus Ultra] Optimizar el acceso a memoria respetando el orden por filas (*row-major
  order*) para mejorar el uso de caché.'
- '[Plus Ultra] Validar que los índices ingresados se encuentren estrictamente dentro
  de los límites del contenedor.'
