id: ej-10-5-maximo-y-minimo
titulo: Máximo y mínimo
tema: arreglos
bloom: 3
minutos_estimados: 25
pistas:
- '**Entrada:** Un arreglo y su tamaño.'
- '**Proceso:**'
- Inicializar dos variables, `maximo` y `minimo`, con el valor del primer elemento
  del arreglo (`arreglo[0]`).
- Recorrer el arreglo con un lazo `for` comenzando desde el segundo elemento (`i=1`).
- En cada iteración, comparar el elemento actual `arreglo[i]` con `maximo`. Si `arreglo[i]`
  es mayor, actualizar `maximo`.
- Hacer lo mismo para `minimo`, actualizándolo si `arreglo[i]` es menor.
- '**Salida:** Devolver los valores de `maximo` y `minimo` (por ejemplo, usando punteros).'
- '[Plus Ultra] Validar punteros `NULL` recibidos como parámetro para evitar fallos
  de segmentación.'
- '[Plus Ultra] Implementar una versión utilizando aritmética de punteros en lugar
  de indexación directa.'
