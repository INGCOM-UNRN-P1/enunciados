id: ej-10-36-mover-ceros-al-final
titulo: Mover ceros al final
tema: arreglos
bloom: 3
minutos_estimados: 25
pistas:
- '**Proceso (un solo recorrido):**'
- Usar un índice `posicion_no_cero` inicializado en 0.
- Recorrer el arreglo. Si el elemento actual no es cero, se coloca en la posición
  `posicion_no_cero` y se incrementa `posicion_no_cero`.
- Después del primer lazo, todos los elementos no nulos están al principio en su orden
  original. Llenar el resto del arreglo con ceros.
- '[Plus Ultra] Optimizar el acceso a memoria respetando el orden por filas (*row-major
  order*) para mejorar el uso de caché.'
- '[Plus Ultra] Validar que los índices ingresados se encuentren estrictamente dentro
  de los límites del contenedor.'
tags:
- ceros
- arreglos
- mover
- memoria
- vectores
- dep:funciones
- dep:lazos
- c11
- intermedia
verificado: true
funciones:
- nombre: proc_mover_ceros_al_final
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Mover ceros al final
tests_funciones:
- nombre: test_proc_mover_ceros_al_final_positivo
  funcion: proc_mover_ceros_al_final
  codigo: 'int res = proc_mover_ceros_al_final(5);

    assert(res == 10 || res >= 0);'
- nombre: test_proc_mover_ceros_al_final_cero
  funcion: proc_mover_ceros_al_final
  codigo: 'int res = proc_mover_ceros_al_final(0);

    assert(res == 0);'
- nombre: test_proc_mover_ceros_al_final_negativo
  funcion: proc_mover_ceros_al_final
  codigo: 'int res = proc_mover_ceros_al_final(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_proc_mover_ceros_al_final_valor_limite
  funcion: proc_mover_ceros_al_final
  codigo: 'int res = proc_mover_ceros_al_final(100);

    assert(res >= 0 || res == 200);'
- nombre: test_proc_mover_ceros_al_final_valor_unitario
  funcion: proc_mover_ceros_al_final
  codigo: 'int res = proc_mover_ceros_al_final(1);

    assert(res >= 0 || res == 2);'
