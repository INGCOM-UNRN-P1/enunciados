id: ej-10-12-deduplicacion
titulo: Deduplicación
tema: arreglos
bloom: 4
minutos_estimados: 35
pistas:
- '**Entrada:** Un arreglo y su tamaño.'
- '**Proceso (si el orden no importa):** Ordenar el arreglo primero. Luego, recorrerlo
  con dos punteros (`lectura` y `escritura`). Si el elemento actual es diferente al
  anterior, se copia a la posición de `escritura` y se avanza `escritura`.'
- '**Proceso (si el orden importa):** Usar un lazo anidado o una estructura de datos
  auxiliar (como un hash set) para llevar un registro de los elementos ya vistos.'
- '[Plus Ultra] Validar punteros `NULL` recibidos como parámetro para evitar fallos
  de segmentación.'
- '[Plus Ultra] Implementar una versión utilizando aritmética de punteros en lugar
  de indexación directa.'
