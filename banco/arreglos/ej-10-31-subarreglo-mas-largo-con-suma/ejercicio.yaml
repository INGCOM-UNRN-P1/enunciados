id: ej-10-31-subarreglo-mas-largo-con-suma
titulo: Subarreglo más largo con suma cero
tema: arreglos
bloom: 4
minutos_estimados: 35
pistas:
- '**Proceso (Tabla Hash):**'
- Usar una tabla hash para almacenar las sumas acumuladas y sus primeros índices
  de aparición.
- Recorrer el arreglo, manteniendo una `suma_actual`.
- Si `suma_actual` ya se ha visto antes en el índice `j`, entonces el subarreglo
  desde `j+1` hasta la posición actual tiene suma cero. Calcular su longitud y 
  actualizar la longitud máxima.
- '[Plus Ultra] Optimizar el acceso a memoria respetando el orden por filas (*row-major
  order*) para mejorar el uso de caché.'
- '[Plus Ultra] Validar que los índices ingresados se encuentren estrictamente dentro
  de los límites del contenedor.'
tags:
