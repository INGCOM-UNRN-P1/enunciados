id: ej-10-7-busqueda-de-elemento
titulo: Búsqueda de elemento
tema: arreglos
bloom: 3
minutos_estimados: 25
pistas:
- '**Entrada:** Un arreglo, su tamaño y el elemento a buscar.'
- '**Proceso:** Recorrer el arreglo con un lazo `for` desde el índice 0.'
- '**Condición:** En cada iteración, comparar el elemento actual del arreglo con el
  elemento buscado. Si son iguales, se ha encontrado.'
- '**Salida:** Si se encuentra el elemento, la función debe devolver el índice actual.
  Si el lazo termina sin encontrar el elemento, se debe devolver un valor especial
  que indique que no se encontró, como `-1`.'
- '[Plus Ultra] Optimizar el acceso a memoria respetando el orden por filas (*row-major
  order*) para mejorar el uso de caché.'
- '[Plus Ultra] Validar que los índices ingresados se encuentren estrictamente dentro
  de los límites del contenedor.'
tags:
- busqueda
- arreglos
- memoria
- vectores
- elemento
- dep:funciones
- dep:lazos
verificado: true
funciones:
- nombre: proc_busqueda_de_elemento
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Búsqueda de elemento
tests_funciones:
- nombre: test_proc_busqueda_de_elemento_positivo
  funcion: proc_busqueda_de_elemento
  codigo: 'int res = proc_busqueda_de_elemento(5);

    assert(res == 10 || res >= 0);'
- nombre: test_proc_busqueda_de_elemento_cero
  funcion: proc_busqueda_de_elemento
  codigo: 'int res = proc_busqueda_de_elemento(0);

    assert(res == 0);'
unidad: 2
modulo: Tipos Compuestos y Direccionamiento
subtema: busqueda
dificultad: intermedia
tipo: practica_guiada
prerrequisitos:
