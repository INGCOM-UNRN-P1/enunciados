id: ej-10-15-rotacion-de-arreglo
titulo: Rotación de arreglo
tema: arreglos
bloom: 3
minutos_estimados: 25
pistas:
- '**Entrada:** Un arreglo, su tamaño `n`, y el número de posiciones a rotar `k`.'
- '**Proceso (con arreglo auxiliar):**'
- Crear un arreglo temporal del mismo tamaño.
- Recorrer el arreglo original. Para cada elemento en la posición `i`, su nueva posición
  en el arreglo temporal será `(i + k) % n`.
- Copiar el contenido del arreglo temporal de vuelta al original.
- '**Proceso (in-place, más avanzado):**'
- Invertir todo el arreglo.
- Invertir los primeros `k` elementos.
- Invertir los `n-k` elementos restantes.
- '**Módulo:** Es útil calcular `k = k % n` al principio, por si `k` es mayor que
  `n`.'
- '[Plus Ultra] Optimizar el acceso a memoria respetando el orden por filas (*row-major
  order*) para mejorar el uso de caché.'
- '[Plus Ultra] Validar que los índices ingresados se encuentren estrictamente dentro
  de los límites del contenedor.'
tags:
- arreglo
- arreglos
- rotacion
- memoria
- vectores
- dep:funciones
- dep:lazos
- c11
- intermedia
verificado: false
funciones:
- nombre: rotar_derecha
  retorno: void
  parametros: int *arreglo, size_t n, size_t k
  descripcion: Rota el arreglo k posiciones hacia la derecha.
tests_funciones:
- nombre: test_rotacion_dos
  funcion: rotar_derecha
  codigo: int a[] = {1,2,3,4,5}; rotar_derecha(a,5,2); assert(a[0]==4 && a[1]==5 &&
    a[2]==1 && a[3]==2 && a[4]==3);
- nombre: test_rotacion_mayor
  funcion: rotar_derecha
  codigo: int a[] = {1,2,3,4,5}; rotar_derecha(a,5,7); assert(a[0]==4 && a[1]==5 &&
    a[2]==1 && a[3]==2 && a[4]==3);
- nombre: test_rotacion_sin_cambio
  funcion: rotar_derecha
  codigo: int a[] = {1,2,3}; rotar_derecha(a,3,0); assert(a[0]==1 && a[1]==2 && a[2]==3);
    rotar_derecha(a,3,3); assert(a[0]==1 && a[1]==2 && a[2]==3);
- nombre: test_rotacion_vacio
  funcion: rotar_derecha
  codigo: rotar_derecha(NULL,0,3);
- nombre: test_rotacion_unitario
  funcion: rotar_derecha
  codigo: int a[] = {8}; rotar_derecha(a,1,42); assert(a[0]==8);
unidad: 2
modulo: Tipos Compuestos y Direccionamiento
subtema: arreglo
dificultad: intermedia
tipo: practica_guiada
prerrequisitos:
