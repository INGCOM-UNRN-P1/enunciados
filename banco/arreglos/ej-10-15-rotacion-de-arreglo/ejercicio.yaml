id: ej-10-15-rotacion-de-arreglo
titulo: Rotación de arreglo
tema: arreglos
bloom: 3
minutos_estimados: 25
pistas:
- '**Entrada:** Un arreglo, su tamaño `n`, y el número de posiciones a rotar `k`.'
- '**Proceso (con arreglo auxiliar):**'
- Crear un arreglo temporal del mismo tamaño.
- Recorrer el arreglo original. Para cada elemento en la posición `i`, su nueva 
  posición en el arreglo temporal será `(i + k) % n`.
- Copiar el contenido del arreglo temporal de vuelta al original.
- '**Proceso (in-place, más avanzado):**'
- Invertir todo el arreglo.
- Invertir los primeros `k` elementos.
- Invertir los `n-k` elementos restantes.
- '**Módulo:** Es útil calcular `k = k % n` al principio, por si `k` es mayor que
  `n`.'
- '[Plus Ultra] Optimizar el acceso a memoria respetando el orden por filas (*row-major
  order*) para mejorar el uso de caché.'
- '[Plus Ultra] Validar que los índices ingresados se encuentren estrictamente dentro
  de los límites del contenedor.'
