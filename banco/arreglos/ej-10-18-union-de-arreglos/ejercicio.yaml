id: ej-10-18-union-de-arreglos
titulo: Unión de arreglos
tema: arreglos
bloom: 4
minutos_estimados: 35
pistas:
- '**Proceso:**'
- Copiar el primer arreglo a un arreglo de resultado temporal.
- Recorrer el segundo arreglo. Para cada elemento, verificar si ya existe en el 
  resultado temporal.
- Si no existe, añadirlo.
- '**Optimización:** Usar una tabla hash para llevar un registro de los elementos
  ya añadidos mejora la eficiencia de la búsqueda.'
- '[Plus Ultra] Garantizar la terminación con `\0` y prevenir desbordamientos de búfer
  validando la capacidad máxima.'
- '[Plus Ultra] Soportar la lectura de cadenas con espacios y múltiples líneas de
  manera robusta.'
