id: ej-10-3-promedio
titulo: Promedio
tema: arreglos
bloom: 3
minutos_estimados: 25
pistas:
- '**Entrada:** Un arreglo y su tamaño.'
- '**Reutilización:** Se puede reutilizar la función `sumar_arreglo` del ejercicio
  anterior.'
- '**Proceso:**'
- Calcular la suma total de los elementos.
- Dividir la suma por el número de elementos (tamaño del arreglo).
- '**Tipos de Datos:** Si la suma y el tamaño son enteros, la división puede ser entera.
  Para un promedio preciso, es importante convertir al menos uno de los operandos
  a un tipo de punto flotante antes de la división.'
- '[Plus Ultra] Optimizar el acceso a memoria respetando el orden por filas (*row-major
  order*) para mejorar el uso de caché.'
- '[Plus Ultra] Validar que los índices ingresados se encuentren estrictamente dentro
  de los límites del contenedor.'
tags:
