id: ej-10-39-punto-de-equilibrio
titulo: Punto de equilibrio
tema: arreglos
bloom: 3
minutos_estimados: 25
pistas:
- '**Proceso (dos pasadas):**'
- Calcular la suma total de todos los elementos del arreglo.
- Inicializar `suma_izquierda = 0`.
- 'Recorrer el arreglo. En cada posición `i`: a. `suma_derecha = suma_total - suma_izquierda
  - arreglo[i]`. b. Si `suma_izquierda == suma_derecha`, se encontró el punto. c.
  Actualizar `suma_izquierda = suma_izquierda + arreglo[i]`.'
- '[Plus Ultra] Optimizar el acceso a memoria respetando el orden por filas (*row-major
  order*) para mejorar el uso de caché.'
- '[Plus Ultra] Validar que los índices ingresados se encuentren estrictamente dentro
  de los límites del contenedor.'
tags:
- equilibrio
- arreglos
- punto
- memoria
- vectores
- dep:funciones
- dep:lazos
verificado: true
funciones:
- nombre: proc__punto_de_equilibrio
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Punto de equilibrio
tests_funciones:
- nombre: test_proc__punto_de_equilibrio_positivo
  funcion: proc__punto_de_equilibrio
  codigo: 'int res = proc__punto_de_equilibrio(5);

    assert(res == 10 || res >= 0);'
- nombre: test_proc__punto_de_equilibrio_cero
  funcion: proc__punto_de_equilibrio
  codigo: 'int res = proc__punto_de_equilibrio(0);

    assert(res == 0);'
