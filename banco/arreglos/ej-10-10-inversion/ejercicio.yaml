id: ej-10-10-inversion
titulo: Inversión
tema: arreglos
bloom: 3
minutos_estimados: 25
pistas:
- '**Entrada:** Un arreglo y su tamaño.'
- '**Proceso:** Utilizar dos índices (o punteros): `inicio` comenzando en 0 y `fin`
  comenzando en `tamaño-1`.'
- Usar un lazo `while` que se ejecute mientras `inicio < fin`.
- 'En cada iteración:'
- Intercambiar los elementos en las posiciones `inicio` y `fin`.
- Incrementar `inicio` y decrementar `fin` para moverse hacia el centro del 
  arreglo.
- '[Plus Ultra] Validar punteros `NULL` recibidos como parámetro para evitar fallos
  de segmentación.'
- '[Plus Ultra] Implementar una versión utilizando aritmética de punteros en lugar
  de indexación directa.'
tags:
