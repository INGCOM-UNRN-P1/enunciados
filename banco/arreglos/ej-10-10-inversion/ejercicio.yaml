  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Inversión
tests_funciones:
- nombre: test_ejecutar_ej_10_10_inversion_positivo
  funcion: ejecutar_ej_10_10_inversion
  codigo: 'int res = ejecutar_ej_10_10_inversion(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_ej_10_10_inversion_cero
  funcion: ejecutar_ej_10_10_inversion
  codigo: 'int res = ejecutar_ej_10_10_inversion(0);

    assert(res == 0);'
