id: ej-10-8-contar-repeticiones
titulo: Contar repeticiones
tema: arreglos
bloom: 3
minutos_estimados: 25
pistas:
- '**Entrada:** Un arreglo, su tamaño y el elemento a contar.'
- '**Variables:** Un `contador` inicializado en 0.'
- '**Proceso:** Recorrer el arreglo con un lazo. En cada iteración, si el elemento
  actual es igual al elemento buscado, incrementar el `contador`.'
- '**Salida:** Devolver el valor final del `contador`.'
- '[Plus Ultra] Optimizar el acceso a memoria respetando el orden por filas (*row-major
  order*) para mejorar el uso de caché.'
- '[Plus Ultra] Validar que los índices ingresados se encuentren estrictamente dentro
  de los límites del contenedor.'
tags:
