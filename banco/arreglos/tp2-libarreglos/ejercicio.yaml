tests_funciones:
- nombre: test_arreglo_sumar_positivo
  funcion: arreglo_sumar
  codigo: 'int res = arreglo_sumar(5);

    assert(res >= 0 || res == 10);'
- nombre: test_arreglo_sumar_cero
  funcion: arreglo_sumar
  codigo: 'int res = arreglo_sumar(0);

    assert(res == 0 || res >= 0);'
