id: ej-10-2-suma
titulo: Suma
tema: arreglos
bloom: 3
minutos_estimados: 25
pistas:
- '**Entrada:** Un arreglo y su tamaño.'
- '**Variables:** Se necesita una variable `acumulador` (o `suma`) inicializada en
  0.'
- '**Proceso:** Recorrer el arreglo con un lazo `for`. En cada iteración, sumar el
  elemento actual al `acumulador`.'
- '**Salida:** La función debe devolver el valor final del `acumulador`.'
- '[Plus Ultra] Optimizar el acceso a memoria respetando el orden por filas (*row-major
  order*) para mejorar el uso de caché.'
- '[Plus Ultra] Validar que los índices ingresados se encuentren estrictamente dentro
  de los límites del contenedor.'
tags:
