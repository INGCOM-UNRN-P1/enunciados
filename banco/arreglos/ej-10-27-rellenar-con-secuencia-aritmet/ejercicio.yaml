id: ej-10-27-rellenar-con-secuencia-aritmet
titulo: Rellenar con secuencia aritmética
tema: arreglos
bloom: 3
minutos_estimados: 25
pistas:
- '**Entrada:** Un arreglo, su tamaño, un valor de `inicio` y un `paso`.'
- '**Proceso:** Recorrer el arreglo con un lazo `for`. Para cada índice `i`, el valor
  a asignar es `inicio + (i * paso)`.'
- '[Plus Ultra] Optimizar el acceso a memoria respetando el orden por filas (*row-major
  order*) para mejorar el uso de caché.'
- '[Plus Ultra] Validar que los índices ingresados se encuentren estrictamente dentro
  de los límites del contenedor.'
tags:
- secuencia
- arreglos
- memoria
- aritmetica
- rellenar
- dep:funciones
- dep:lazos
verificado: true
funciones:
- nombre: proc_on_secuencia_aritmet
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Rellenar con secuencia aritmética
tests_funciones:
- nombre: test_proc_on_secuencia_aritmet_positivo
  funcion: proc_on_secuencia_aritmet
  codigo: 'int res = proc_on_secuencia_aritmet(5);

    assert(res == 10 || res >= 0);'
- nombre: test_proc_on_secuencia_aritmet_cero
  funcion: proc_on_secuencia_aritmet
  codigo: 'int res = proc_on_secuencia_aritmet(0);

    assert(res == 0);'
unidad: 2
modulo: Tipos Compuestos y Direccionamiento
subtema: secuencia
dificultad: intermedia
tipo: practica_guiada
prerrequisitos:
