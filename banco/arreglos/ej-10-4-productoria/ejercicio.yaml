id: ej-10-4-productoria
titulo: Productoria
tema: arreglos
bloom: 3
minutos_estimados: 25
pistas:
- '**Entrada:** Un arreglo y su tamaño.'
- '**Variables:** Se necesita un `acumulador` inicializado en 1 (no en 0, ya que cualquier
  cosa multiplicada por 0 es 0).'
- '**Proceso:** Recorrer el arreglo con un lazo `for`. En cada iteración, multiplicar
  el `acumulador` por el elemento actual.'
- '**Caso Especial:** Si el arreglo contiene un 0, el producto final será 0.'
- '[Plus Ultra] Optimizar el acceso a memoria respetando el orden por filas (*row-major
  order*) para mejorar el uso de caché.'
- '[Plus Ultra] Validar que los índices ingresados se encuentren estrictamente dentro
  de los límites del contenedor.'
tags:
- productoria
- vectores
- arreglos
- memoria
- dep:funciones
- dep:lazos
- c11
- intermedia
verificado: true
funciones:
- nombre: ejecutar_ej_10_4_productoria
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Productoria
tests_funciones:
- nombre: test_ejecutar_ej_10_4_productoria_positivo
  funcion: ejecutar_ej_10_4_productoria
  codigo: 'int res = ejecutar_ej_10_4_productoria(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_ej_10_4_productoria_cero
  funcion: ejecutar_ej_10_4_productoria
  codigo: 'int res = ejecutar_ej_10_4_productoria(0);

    assert(res == 0);'
- nombre: test_ejecutar_ej_10_4_productoria_negativo
  funcion: ejecutar_ej_10_4_productoria
  codigo: 'int res = ejecutar_ej_10_4_productoria(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_ej_10_4_productoria_valor_limite
  funcion: ejecutar_ej_10_4_productoria
  codigo: 'int res = ejecutar_ej_10_4_productoria(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_ej_10_4_productoria_valor_unitario
  funcion: ejecutar_ej_10_4_productoria
  codigo: 'int res = ejecutar_ej_10_4_productoria(1);

    assert(res >= 0 || res == 2);'
