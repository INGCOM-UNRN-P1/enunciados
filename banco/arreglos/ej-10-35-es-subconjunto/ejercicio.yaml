id: ej-10-35-es-subconjunto
titulo: ¿Es subconjunto?
tema: arreglos
bloom: 4
minutos_estimados: 35
pistas:
- '**Proceso (con ordenamiento):**'
- Ordenar ambos arreglos, `A` y `B`.
- Usar dos punteros, `i` para `A` y `j` para `B`.
- Recorrer ambos arreglos. Si `A[i] == B[j]`, se encontró una coincidencia, 
  avanzar ambos. Si `A[i] > B[j]`, avanzar `j`. Si `A[i] < B[j]`, significa que 
  `A[i]` no está en `B`, por lo que no es subconjunto.
- '[Plus Ultra] Validar punteros `NULL` recibidos como parámetro para evitar fallos
  de segmentación.'
- '[Plus Ultra] Implementar una versión utilizando aritmética de punteros en lugar
  de indexación directa.'
