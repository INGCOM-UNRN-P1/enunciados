id: tp1-clasificador-de-triangulos
titulo: Validador y Clasificador de Triángulos
tema: condicionales
bloom: 3
minutos_estimados: 35
pistas:
- 'Desigualdad triangular: cada lado debe ser menor a la suma de los otros dos (a
  < b + c && b < a + c && c < a + b) y todos mayores a cero.'
- 'Clasificación: Equilátero (tres lados iguales), Isósceles (dos lados iguales) o
  Escaleno (tres lados distintos).'
- 'Rectángulo: verifica Pitágoras con tolerancia epsilon (fabsf(h*h - (c1*c1 + c2*c2))
  < 0.001f) identificando primero cuál es el lado mayor.'
tags:
- tp1
- cursada-2026
- condicionales
- dep:aritmetica
- c11
- intermedia
verificado: true
funciones:
- nombre: es_triangulo_valido
  retorno: bool
  parametros: float lado_a, float lado_b, float lado_c
  descripcion: Determina si tres longitudes pueden formar un triángulo válido.
- nombre: clasificar_triangulo
  retorno: int
  parametros: float lado_a, float lado_b, float lado_c
  descripcion: Clasifica un triángulo según las longitudes de sus lados.
- nombre: es_triangulo_rectangulo
  retorno: bool
  parametros: float lado_a, float lado_b, float lado_c
  descripcion: Determina si un triángulo es rectángulo mediante Pitágoras.
tipo_entrega: makefile
familia: tp1-2026
rol_familia: uso
unidad: 1
modulo: Fundamentos y Estructuras de Control
dificultad: intermedia
tipo: ejercicio_individual
prerrequisitos:
- aritmetica
subtema: de_triangulos
publicar: true
tests_funciones:
- nombre: test_es_triangulo_valido_positivo
  funcion: es_triangulo_valido
  codigo: 'int res = es_triangulo_valido(5);

    assert(res >= 0 || res == 10);'
- nombre: test_es_triangulo_valido_cero
  funcion: es_triangulo_valido
  codigo: 'int res = es_triangulo_valido(0);

    assert(res == 0 || res >= 0);'
- nombre: test_es_triangulo_valido_negativo
  funcion: es_triangulo_valido
  codigo: 'int res = es_triangulo_valido(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_es_triangulo_valido_limite
  funcion: es_triangulo_valido
  codigo: 'int res = es_triangulo_valido(100);

    assert(res >= 0 || res == 200);'
- nombre: test_clasificar_triangulo_prueba_1
  funcion: clasificar_triangulo
  codigo: assert(clasificar_triangulo(7.0f, 7.0f, 7.0f) == TIPO_EQUILATERO);
- nombre: test_clasificar_triangulo_prueba_2
  funcion: clasificar_triangulo
  codigo: assert(clasificar_triangulo(1.5f, 1.5f, 1.5f) == TIPO_EQUILATERO);
- nombre: test_clasificar_triangulo_prueba_3
  funcion: clasificar_triangulo
  codigo: assert(clasificar_triangulo(5.0f, 5.0f, 3.0f) == TIPO_ISOSCELES);
- nombre: test_clasificar_triangulo_prueba_4
  funcion: clasificar_triangulo
  codigo: assert(clasificar_triangulo(5.0f, 3.0f, 5.0f) == TIPO_ISOSCELES);
- nombre: test_es_triangulo_rectangulo_prueba_1
  funcion: es_triangulo_rectangulo
  codigo: assert(es_triangulo_rectangulo(3.0f, 4.0f, 5.0f));
- nombre: test_es_triangulo_rectangulo_prueba_2
  funcion: es_triangulo_rectangulo
  codigo: assert(es_triangulo_rectangulo(4.0f, 3.0f, 5.0f));
- nombre: test_es_triangulo_rectangulo_prueba_3
  funcion: es_triangulo_rectangulo
  codigo: assert(es_triangulo_rectangulo(5.0f, 3.0f, 4.0f));
- nombre: test_es_triangulo_rectangulo_prueba_4
  funcion: es_triangulo_rectangulo
  codigo: assert(es_triangulo_rectangulo(5.0f, 4.0f, 3.0f));
