id: ej-1-44-numero-de-la-suerte
titulo: Número de la Suerte
tema: secuencias
bloom: 1
minutos_estimados: 10
pistas:
- '**Entrada:** Leer un número entero.'
- '**Proceso:**'
- '[Plus Ultra] Validar que la fecha contenga valores válidos de día, mes y año.'
- '[Plus Ultra] Modularizar la suma sucesiva de dígitos en una función auxiliar pura.'
- '[Plus Ultra] Validar que el nombre ingresado contenga caracteres legibles y no
  esté vacío.'
- '[Plus Ultra] Dar formato especial a la salida con marcos en la terminal.'
- '[Plus Ultra] Validar que el segundo número no sea cero antes de calcular el cociente.'
- '[Plus Ultra] Modularizar cada operación aritmética en su propia función.'
- '[Plus Ultra] Validar que las temperaturas no estén por debajo del cero absoluto.'
- '[Plus Ultra] Modularizar las fórmulas en funciones con contratos y pruebas unitarias.'
- '[Plus Ultra] Validar que ancho y alto sean positivos antes de calcular.'
- '[Plus Ultra] Modularizar el cálculo en funciones independientes para área y perímetro.'
- '[Plus Ultra] Validar los datos ingresados verificando el retorno de scanf.'
- '[Plus Ultra] Modularizar el promedio en una función double calcular_promedio(double
  a, double b, double c).'
- '[Plus Ultra] Implementar una función que reciba dos variables y muestre sus valores
  antes y después de operar.'
- '[Plus Ultra] Verificar que el intercambio funcione correctamente para números negativos
  y cero.'
- '[Plus Ultra] Modularizar cada conversión en funciones puras independientes.'
- '[Plus Ultra] Formatear las unidades en una tabla comparativa alineada.'
- '[Plus Ultra] Validar que peso y altura sean mayores a cero y clasificar según la
  tabla oficial de la OMS.'
- '[Plus Ultra] Modularizar el cálculo en una función libre de operaciones de E/S.'
- '[Plus Ultra] Validar que el monto sea un número entero no negativo.'
- '[Plus Ultra] Permitir configurar las denominaciones de billetes en orden decreciente.'
- '[Plus Ultra] Validar que la cantidad de segundos no sea negativa.'
- '[Plus Ultra] Permitir incluir días si los segundos superan las 24 horas.'
- '[Plus Ultra] Validar que el número ingresado esté exactamente en el rango [100,
  999].'
- '[Plus Ultra] Extender el algoritmo para números de cantidad variable de dígitos
  usando un lazo.'
- '[Plus Ultra] Validar que el porcentaje de descuento esté en el rango [0, 100].'
- '[Plus Ultra] Mostrar el desglose del ahorro total obtenido junto con el precio
  final.'
- '[Plus Ultra] Validar que el divisor sea distinto de cero informando un mensaje
  de error descriptivo por consola.'
- '[Plus Ultra] Modularizar el cálculo en una función pura que retorne el cociente
  y verifique la validez matemática.'
- '[Plus Ultra] Validar que el número decimal ingresado sea no negativo.'
- '[Plus Ultra] Modularizar la conversión a binario mediante divisiones sucesivas
  por 2 en un lazo.'
- '[Plus Ultra] Validar la desigualdad triangular antes de aplicar la raíz cuadrada.'
- '[Plus Ultra] Modularizar el cálculo del semiperímetro y del área en funciones separadas.'
- '[Plus Ultra] Manejar los tres casos del discriminante (dos raíces reales, una raíz
  doble, raíces complejas).'
- '[Plus Ultra] Validar que el coeficiente principal a no sea cero (en cuyo caso es
  una ecuación lineal).'
- '[Plus Ultra] Validar que el capital, tasa de interés, frecuencia y tiempo sean
  positivos.'
- '[Plus Ultra] Mostrar una tabla período por período con la evolución del capital
  acumulado.'
- '[Plus Ultra] Validar que cada componente RGB esté en el rango [0, 255].'
- '[Plus Ultra] Formatear la salida con ceros a la izquierda para asegurar siempre
  6 dígitos hexadecimales (#RRGGBB).'
- '[Plus Ultra] Manejar el caso especial de exponente 0 (resultado 1) y base 0 con
  exponente positivo.'
- '[Plus Ultra] Extender la función para aceptar exponentes negativos retornando un
  double.'
- '[Plus Ultra] Validar operaciones inválidas como división por cero, logaritmo de
  no positivos o raíz de negativos.'
- '[Plus Ultra] Implementar un menú con lazo que permita realizar cálculos consecutivos
  hasta salir.'
- '**Validación:** Siempre verificá entradas inválidas (divisiones por cero, valores
  fuera de rango)'
- '**Formato:** Usá `printf()` con especificadores apropiados (`%d`, `%f`, `%c`, etc.)'
- '**Constantes:** Definí valores fijos con `#define` o `const`'
- '**Comentarios:** Documentá qué hace cada sección del código'
- '**Testing:** Probá con diferentes entradas, incluyendo casos extremos'
tags:
- fundamentos
- secuencias
- numero
- basicos
