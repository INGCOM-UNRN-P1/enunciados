id: ej-25-6-mostrar-arreglo
titulo: Mostrar arreglo recursivamente
tema: recursividad
bloom: 3
minutos_estimados: 25
tags:
  - recursividad
  - arreglo
  - induccion
  - c11
verificado: true
funciones:
  - nombre: proc_25_6_mostrar_arreglo
    retorno: void
    parametros: FILE *salida, const int *arreglo, size_t longitud
    descripcion: Imprime recursivamente los elementos separados por espacios.
tipo_entrega: makefile
unidad: 4
modulo: Tipos Abstractos y Algorítmica
dificultad: intermedia
tipo: practica_guiada
prerrequisitos:
  - funciones
  - punteros
subtema: arreglo
publicar: true
tests_funciones:
  - nombre: test_mostrar_arreglo_orden_y_formato
    funcion: proc_25_6_mostrar_arreglo
    codigo: |
      FILE *salida = tmpfile();
      assert(salida != NULL);
      const int valores[] = {4, -2, 9};
      proc_25_6_mostrar_arreglo(salida, valores, 3);
      fflush(salida);
      rewind(salida);
      assert(fgetc(salida) == '4');
      assert(fgetc(salida) == ' ');
      assert(fgetc(salida) == '-');
      assert(fgetc(salida) == '2');
      assert(fgetc(salida) == ' ');
      assert(fgetc(salida) == '9');
      assert(fgetc(salida) == EOF);
      fclose(salida);
  - nombre: test_mostrar_arreglo_vacio
    funcion: proc_25_6_mostrar_arreglo
    codigo: |
      FILE *salida = tmpfile();
      assert(salida != NULL);
      proc_25_6_mostrar_arreglo(salida, NULL, 0);
      assert(ftell(salida) == 0);
      fclose(salida);
