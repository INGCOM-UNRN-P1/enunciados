funciones:
- nombre: fibonacci
  retorno: int
  parametros: int posicion
  descripcion: Calcula el n-ésimo término de la sucesión de Fibonacci (F0 = 0, F1
    = 1).
- nombre: suma_fibonacci
  retorno: int
  parametros: int hasta_posicion
  descripcion: Calcula la suma acumulada de los primeros n términos de Fibonacci (de
    F0 hasta Fn).
