id: ej-3-29-test-de-primalidad-de-miller-r
titulo: Test de Primalidad de Miller-Rabin
tema: aritmetica
bloom: 3
minutos_estimados: 25
pistas:
- '**Teorema:** Se basa en propiedades de los números primos relacionadas con el Pequeño
  Teorema de Fermat. Es más complejo que los algoritmos anteriores.'
- '**Proceso Simplificado:**'
- Dado un número `n` a probar, se eligen varias bases aleatorias `a` < `n`.
- Para cada base `a`, se comprueba si satisface ciertas congruencias. Si para alguna
  base no las satisface, `n` es compuesto. Si las satisface para todas las bases,
  es "probablemente primo".
- '**Nota:** La implementación completa es avanzada. Un ejercicio más simple puede
  ser implementarlo para una sola base fija. error e informar el resultado mediante
  parámetros de salida. especificando precondiciones y postcondiciones.'
- '[Plus Ultra] Modularizar la exponenciación modular (base^exp % mod) en una función
  pura.'
- '[Plus Ultra] Probar la primalidad con varias bases distintas para aumentar la certeza.'
tags:
- fundamentos
- aritmetica
- primalidad
- miller-rabin
- matematica
verificado: true
funciones:
- nombre: proc_imalidad_de_miller_r
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Test de Primalidad de Miller-Rabin
tests_funciones:
- nombre: test_proc_imalidad_de_miller_r_positivo
  funcion: proc_imalidad_de_miller_r
  codigo: 'int res = proc_imalidad_de_miller_r(5);

    assert(res == 10 || res >= 0);'
- nombre: test_proc_imalidad_de_miller_r_cero
  funcion: proc_imalidad_de_miller_r
  codigo: 'int res = proc_imalidad_de_miller_r(0);

    assert(res == 0);'
