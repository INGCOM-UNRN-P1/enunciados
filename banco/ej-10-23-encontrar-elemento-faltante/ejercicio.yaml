id: ej-10-23-encontrar-elemento-faltante
titulo: Encontrar elemento faltante
tema: arreglos
bloom: 3
minutos_estimados: 25
pistas:
- '**Proceso (Suma):**'
- 'Calcular la suma esperada de todos los números de 1 a `n` usando la fórmula de
  la progresión aritmética: `suma_esperada = n * (n + 1) / 2`.'
- Calcular la suma real de los elementos en el arreglo dado.
- 'El número faltante es la diferencia: `suma_esperada - suma_real`.'
- '**Proceso (XOR):** El XOR de todos los números del rango con todos los números
  del arreglo dará como resultado el número faltante.'
- '[Plus Ultra] Optimizar el acceso a memoria respetando el orden por filas (*row-major
  order*) para mejorar el uso de caché.'
- '[Plus Ultra] Validar que los índices ingresados se encuentren estrictamente dentro
  de los límites del contenedor.'
tags:
- encontrar
- arreglos
- memoria
- vectores
- faltante
verificado: true
funciones:
- nombre: proc_ar_elemento_faltante
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Encontrar elemento faltante
tests_funciones:
- nombre: test_proc_ar_elemento_faltante_positivo
  funcion: proc_ar_elemento_faltante
  codigo: 'int res = proc_ar_elemento_faltante(5);

    assert(res == 10 || res >= 0);'
- nombre: test_proc_ar_elemento_faltante_cero
  funcion: proc_ar_elemento_faltante
  codigo: 'int res = proc_ar_elemento_faltante(0);

    assert(res == 0);'
