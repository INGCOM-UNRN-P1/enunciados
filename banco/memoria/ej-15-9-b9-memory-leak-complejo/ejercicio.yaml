id: ej-15-9-b9-memory-leak-complejo
titulo: Memory Leak Complejo
tema: memoria
bloom: 5
minutos_estimados: 45
pistas:
- '[Plus Ultra] Verificar el retorno de asignación de memoria y garantizar la liberación
  total de recursos en caso de error.'
- '[Plus Ultra] Verificar la ausencia de fugas de memoria (*memory leaks*) mediante
  Valgrind o AddressSanitizer.'
tags:
- stack
- layout
- memory
- memoria
- complejo
- dep:punteros
- dep:estructuras
- c11
- avanzada
verificado: true
funciones:
- nombre: agregar_nodo
  retorno: void
  parametros: struct nodo_t **cabeza, int valor
  descripcion: Operación agregar_nodo
tests_funciones:
- nombre: test_agregar_nodo_cabeza_vacia
  funcion: agregar_nodo
  codigo: 'struct nodo_t *c = NULL;

    agregar_nodo(&c, 10);

    assert(c != NULL && c->dato == 10);

    free(c);'
- nombre: test_agregar_nodo_multiples
  funcion: agregar_nodo
  codigo: 'struct nodo_t *c = NULL;

    agregar_nodo(&c, 1);

    agregar_nodo(&c, 2);

    assert(c->dato == 2 && c->siguiente->dato == 1);

    free(c->siguiente);

    free(c);'
- nombre: test_agregar_nodo_negativo
  funcion: agregar_nodo
  codigo: 'struct nodo_t *c = NULL;

    agregar_nodo(&c, -5);

    assert(c->dato == -5);

    free(c);'
- nombre: test_agregar_nodo_cero
  funcion: agregar_nodo
  codigo: 'struct nodo_t *c = NULL;

    agregar_nodo(&c, 0);

    assert(c->dato == 0);

    free(c);'
unidad: 3
modulo: Memoria Dinámica y Persistencia
subtema: pilas_y_colas
dificultad: avanzada
prerrequisitos:
- punteros
- estructuras
publicar: true
