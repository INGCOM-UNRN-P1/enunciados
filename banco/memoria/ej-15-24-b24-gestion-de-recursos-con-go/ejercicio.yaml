id: ej-15-24-b24-gestion-de-recursos-con-go
titulo: Gestión de Recursos con goto
tema: memoria
bloom: 5
minutos_estimados: 45
pistas:
- '[Plus Ultra] Verificar el retorno de asignación de memoria y garantizar la liberación
  total de recursos en caso de error.'
- '[Plus Ultra] Verificar la ausencia de fugas de memoria (*memory leaks*) mediante
  Valgrind o AddressSanitizer.'
- '[Plus Ultra] Validar estrictamente los datos de entrada para manejar valores fuera
  de rango o tipos inválidos.'
- '[Plus Ultra] Permitir el procesamiento interactivo continuo mediante un lazo hasta
  que el usuario elija finalizar.'
tags:
- stack
- layout
- memoria
- gestion
- recursos
- dep:punteros
- dep:estructuras
- c11
- avanzada
verificado: true
funciones:
- nombre: procesar_archivo
  retorno: int
  parametros: const char *ruta
  descripcion: Operación procesar_archivo
tests_funciones:
- nombre: test_procesar_archivo_inexistente
  funcion: procesar_archivo
  codigo: 'int res = procesar_archivo("no_existe.txt");

    assert(res == -1);'
- nombre: test_procesar_archivo_nulo
  funcion: procesar_archivo
  codigo: 'int res = procesar_archivo("");

    assert(res == -1);'
- nombre: test_procesar_archivo_dev_null
  funcion: procesar_archivo
  codigo: 'int res = procesar_archivo("/dev/null");

    assert(res == 0);'
- nombre: test_procesar_archivo_ruta_falsa
  funcion: procesar_archivo
  codigo: 'int res = procesar_archivo("/ruta/falsa/123");

    assert(res == -1);'
unidad: 3
modulo: Memoria Dinámica y Persistencia
subtema: pilas_y_colas
dificultad: avanzada
tipo: ejercicio_individual
prerrequisitos:
- punteros
- estructuras
publicar: true
