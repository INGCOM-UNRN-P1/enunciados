id: ej-15-23-b23-retorno-de-estructuras-con
titulo: Retorno de Estructuras con Memoria Dinámica
tema: memoria
bloom: 1
minutos_estimados: 10
pistas:
- '[Plus Ultra] Validar punteros `NULL` recibidos como parámetro para evitar fallos
  de segmentación.'
- '[Plus Ultra] Implementar una versión utilizando aritmética de punteros en lugar
  de indexación directa.'
tags:
- stack
- estructuras
- layout
- memoria
- dinamica
- dep:punteros
- dep:estructuras
- c11
- inicial
verificado: true
funciones:
- nombre: procesar_numeros
  retorno: struct resultado_t
  parametros: int *entrada, size_t n
  descripcion: Operación procesar_numeros
tests_funciones:
- nombre: test_procesar_numeros_multiplica_por_dos
  funcion: procesar_numeros
  codigo: 'int a[] = {1, 2, 3};

    struct resultado_t r = procesar_numeros(a, 3);

    assert(r.tamano == 3 && r.datos[0] == 2 && r.datos[2] == 6);

    free(r.datos);'
- nombre: test_procesar_numeros_negativos
  funcion: procesar_numeros
  codigo: 'int a[] = {-2, -5};

    struct resultado_t r = procesar_numeros(a, 2);

    assert(r.tamano == 2 && r.datos[0] == -4 && r.datos[1] == -10);

    free(r.datos);'
- nombre: test_procesar_numeros_unitario
  funcion: procesar_numeros
  codigo: 'int a[] = {10};

    struct resultado_t r = procesar_numeros(a, 1);

    assert(r.tamano == 1 && r.datos[0] == 20);

    free(r.datos);'
- nombre: test_procesar_numeros_cero
  funcion: procesar_numeros
  codigo: 'int a[] = {0};

    struct resultado_t r = procesar_numeros(a, 1);

    assert(r.tamano == 1 && r.datos[0] == 0);

    free(r.datos);'
unidad: 3
modulo: Memoria Dinámica y Persistencia
subtema: pilas_y_colas
dificultad: inicial
tipo: practica_guiada
prerrequisitos:
- punteros
- estructuras
publicar: true
