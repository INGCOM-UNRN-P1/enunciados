funciones:
- nombre: construir_mensaje
  retorno: char *
  parametros: const char *usuario
  descripcion: Reserva y devuelve un saludo para usuario; quien llama debe liberarlo.
tests_funciones:
- nombre: test_mensaje_normal
  funcion: construir_mensaje
  codigo: char *p = construir_mensaje("Alumno"); assert(p != NULL); assert(strcmp(p,
    "Hola, Alumno") == 0); free(p);
- nombre: test_mensaje_vacio
  funcion: construir_mensaje
  codigo: char *p = construir_mensaje(""); assert(p != NULL); assert(strcmp(p, "Hola,
    ") == 0); free(p);
- nombre: test_mensajes_independientes
  funcion: construir_mensaje
  codigo: char *a = construir_mensaje("Ana"); char *b = construir_mensaje("Ana");
    assert(a != NULL && b != NULL && a != b); a[0] = 'h'; assert(strcmp(b, "Hola,
    Ana") == 0); free(a); free(b);
- nombre: test_usuario_nulo
  funcion: construir_mensaje
  codigo: assert(construir_mensaje(NULL) == NULL);
unidad: 3
modulo: Memoria Dinámica y Persistencia
