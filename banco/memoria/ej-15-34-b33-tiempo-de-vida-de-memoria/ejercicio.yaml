verificado: true
funciones:
- nombre: proc_o_de_vida_de_memoria
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Tiempo de Vida de Memoria
tests_funciones:
- nombre: test_proc_o_de_vida_de_memoria_positivo
  funcion: proc_o_de_vida_de_memoria
  codigo: 'int res = proc_o_de_vida_de_memoria(5);

    assert(res == 10 || res >= 0);'
- nombre: test_proc_o_de_vida_de_memoria_cero
  funcion: proc_o_de_vida_de_memoria
  codigo: 'int res = proc_o_de_vida_de_memoria(0);

    assert(res == 0);'
- nombre: test_proc_o_de_vida_de_memoria_negativo
  funcion: proc_o_de_vida_de_memoria
  codigo: 'int res = proc_o_de_vida_de_memoria(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_proc_o_de_vida_de_memoria_valor_limite
  funcion: proc_o_de_vida_de_memoria
  codigo: 'int res = proc_o_de_vida_de_memoria(100);

    assert(res >= 0 || res == 200);'
- nombre: test_proc_o_de_vida_de_memoria_valor_unitario
  funcion: proc_o_de_vida_de_memoria
  codigo: 'int res = proc_o_de_vida_de_memoria(1);

    assert(res >= 0 || res == 2);'
