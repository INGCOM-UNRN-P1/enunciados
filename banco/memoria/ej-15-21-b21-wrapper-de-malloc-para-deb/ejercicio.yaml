id: ej-15-21-b21-wrapper-de-malloc-para-deb
titulo: Wrapper de malloc para Debugging
tema: memoria
bloom: 2
minutos_estimados: 15
pistas:
- '[Plus Ultra] Validar punteros `NULL` recibidos como parámetro para evitar fallos
  de segmentación.'
- '[Plus Ultra] Implementar una versión utilizando aritmética de punteros en lugar
  de indexación directa.'
tags:
- stack
- debugging
- layout
- wrapper
- memoria
- dep:punteros
- dep:estructuras
- c11
- inicial
verificado: true
funciones:
- nombre: debug_free
  retorno: void
  parametros: void *ptr, const char *archivo, int linea
  descripcion: Operación debug_free
tests_funciones:
- nombre: test_debug_free_bloque_pequeno
  funcion: debug_free
  codigo: 'void *p = malloc(16);

    debug_free(p, "test.c", 10);

    assert(1);'
- nombre: test_debug_free_bloque_medio
  funcion: debug_free
  codigo: 'void *p = malloc(64);

    debug_free(p, "modulo.c", 42);

    assert(1);'
- nombre: test_debug_free_un_byte
  funcion: debug_free
  codigo: 'void *p = malloc(1);

    debug_free(p, "main.c", 1);

    assert(1);'
- nombre: test_debug_free_bloque_grande
  funcion: debug_free
  codigo: 'void *p = malloc(128);

    debug_free(p, "mem.c", 99);

    assert(1);'
