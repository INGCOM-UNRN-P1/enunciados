- nombre: test_ejecutar_ej_11_5_b5_palindromo_cero
  funcion: ejecutar_ej_11_5_b5_palindromo
  codigo: 'int res = ejecutar_ej_11_5_b5_palindromo(0);

    assert(res == 0);'
