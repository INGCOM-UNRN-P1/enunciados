id: ej-11-5-b5-palindromo
titulo: Palíndromo
tema: cadenas
bloom: 1
minutos_estimados: 10
pistas:
- '[Plus Ultra] Validar punteros `NULL` recibidos como parámetro para evitar fallos
  de segmentación.'
- '[Plus Ultra] Implementar una versión utilizando aritmética de punteros en lugar
  de indexación directa.'
- '**Entrada:** Una cadena de caracteres.'
- '**Proceso (dos punteros/índices):**'
- 'Usar dos índices: `izquierda` al inicio de la cadena y `derecha` al final.'
- 'En un lazo `while (izquierda < derecha)`: a. Mover `izquierda` hacia la derecha
  hasta que apunte a un carácter alfabético. b. Mover `derecha` hacia la izquierda
  hasta que apunte a un carácter alfabético. c. Comparar los caracteres en `izquierda`
  y `derecha` (convertidos a minúsculas). Si son diferentes, la cadena no es un palíndromo
  y se puede retornar `falso`. d. Si son iguales, mover ambos punteros hacia el centro
  (`izquierda++`, `derecha--`).'
- '**Salida:** Si el lazo termina, significa que todos los caracteres coincidieron,
  por lo que es un palíndromo y se retorna `verdadero`.'
tags:
- cadenas
- palindromo
- strings
- memoria
verificado: true
funciones:
- nombre: ejecutar_ej_11_5_b5_palindromo
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Palíndromo
tests_funciones:
