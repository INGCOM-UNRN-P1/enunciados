id: skip-list-10
titulo: Obtención del Mínimo y Máximo Elemento en O(1) en Skip List
tema: skip_lists_probabilisticas
bloom: 2
minutos_estimados: 15
pistas:
- Cada nodo almacena un arreglo de punteros adelante de tamaño proporcional a su altura generada.
- La búsqueda avanza en el nivel superior y desciende cuando el valor excede la clave buscada.
tags:
- skip_list
- listas_saltos
- probabilistica
- busqueda
- estructuras_datos
- dep:listas_enlazadas
- dep:punteros
- c11
- inicial
verificado: true
funciones:
- nombre: skip_list_10_extremes
  retorno: bool
  parametros: const skip_list_t *list, int *minimum, int *maximum
  descripcion: skip list 10 extremes
tests_funciones:
- nombre: test_skip_list_10_principal
  funcion: skip_list_10_extremes
  codigo: skip_list_t l; skip_list_init(&l, 1u); assert(l.head != NULL); int lo = 0, hi = 0; assert(!skip_list_10_extremes(&l,
    &lo, &hi)); assert(skip_list_insert_height(&l, -2, 1)); assert(skip_list_insert_height(&l, 7, 2));
    assert(skip_list_10_extremes(&l, &lo, &hi) && lo == -2 && hi == 7); skip_list_destroy(&l);
