id: skip-list-12
titulo: Búsqueda del K-ésimo Elemento en Skip List Aumentada
tema: skip_lists_probabilisticas
bloom: 2
minutos_estimados: 15
pistas:
- Cada nodo almacena un arreglo de punteros adelante de tamaño proporcional a su altura
  generada.
- La búsqueda avanza en el nivel superior y desciende cuando el valor excede la clave
  buscada.
tags:
- skip_list
- listas_saltos
- probabilistica
- busqueda
- estructuras_datos
verificado: true
funciones:
- nombre: ejecutar_skip_list_12
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Búsqueda del K-ésimo Elemento en Skip
    List Aumentada
tests_funciones:
- nombre: test_ejecutar_skip_list_12_positivo
  funcion: ejecutar_skip_list_12
  codigo: 'int res = ejecutar_skip_list_12(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_skip_list_12_cero
  funcion: ejecutar_skip_list_12
  codigo: 'int res = ejecutar_skip_list_12(0);

    assert(res == 0);'
publicar: false
