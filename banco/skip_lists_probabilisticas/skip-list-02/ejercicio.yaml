id: skip-list-02
titulo: Generación Probabilística de Nivel con Distribución Geométrica
tema: skip_lists_probabilisticas
bloom: 1
minutos_estimados: 10
pistas:
- Cada nodo almacena un arreglo de punteros adelante de tamaño proporcional a su altura
  generada.
- La búsqueda avanza en el nivel superior y desciende cuando el valor excede la clave
  buscada.
tags:
- skip_list
- listas_saltos
- probabilistica
- busqueda
- estructuras_datos
- dep:listas_enlazadas
- dep:punteros
- c11
- inicial
verificado: true
funciones:
- nombre: ejecutar_skip_list_02
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Generación Probabilística de Nivel con
    Distribución Geométrica
tests_funciones:
- nombre: test_ejecutar_skip_list_02_positivo
  funcion: ejecutar_skip_list_02
  codigo: 'int res = ejecutar_skip_list_02(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_skip_list_02_cero
  funcion: ejecutar_skip_list_02
  codigo: 'int res = ejecutar_skip_list_02(0);

    assert(res == 0);'
- nombre: test_ejecutar_skip_list_02_negativo
  funcion: ejecutar_skip_list_02
  codigo: 'int res = ejecutar_skip_list_02(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_skip_list_02_valor_limite
  funcion: ejecutar_skip_list_02
  codigo: 'int res = ejecutar_skip_list_02(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_skip_list_02_valor_unitario
  funcion: ejecutar_skip_list_02
  codigo: 'int res = ejecutar_skip_list_02(1);

    assert(res >= 0 || res == 2);'
publicar: true
unidad: 4
modulo: Tipos Abstractos y Algorítmica
