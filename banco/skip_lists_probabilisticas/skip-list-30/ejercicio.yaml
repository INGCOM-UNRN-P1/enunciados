id: skip-list-30
titulo: TAD Completo de Lista por Saltos Genérica con Comparador
tema: skip_lists_probabilisticas
bloom: 5
minutos_estimados: 45
pistas:
- Cada nodo almacena un arreglo de punteros adelante de tamaño proporcional a su altura
  generada.
- La búsqueda avanza en el nivel superior y desciende cuando el valor excede la clave
  buscada.
tags:
- skip_list
- listas_saltos
- probabilistica
- busqueda
- estructuras_datos
- dep:listas_enlazadas
- dep:punteros
- c11
- avanzada
verificado: true
funciones:
- nombre: ejecutar_skip_list_30
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de TAD Completo de Lista por Saltos Genérica
    con Comparador
tests_funciones:
- nombre: test_ejecutar_skip_list_30_positivo
  funcion: ejecutar_skip_list_30
  codigo: 'int res = ejecutar_skip_list_30(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_skip_list_30_cero
  funcion: ejecutar_skip_list_30
  codigo: 'int res = ejecutar_skip_list_30(0);

    assert(res == 0);'
- nombre: test_ejecutar_skip_list_30_negativo
  funcion: ejecutar_skip_list_30
  codigo: 'int res = ejecutar_skip_list_30(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_skip_list_30_valor_limite
  funcion: ejecutar_skip_list_30
  codigo: 'int res = ejecutar_skip_list_30(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_skip_list_30_valor_unitario
  funcion: ejecutar_skip_list_30
  codigo: 'int res = ejecutar_skip_list_30(1);

    assert(res >= 0 || res == 2);'
publicar: true
