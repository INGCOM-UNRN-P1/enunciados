id: skip-list-24
titulo: Ajuste Dinámico de Probabilidad de Nivel p=0.5 frente a p=0.25
tema: skip_lists_probabilisticas
bloom: 4
minutos_estimados: 35
pistas:
- Cada nodo almacena un arreglo de punteros adelante de tamaño proporcional a su altura
  generada.
- La búsqueda avanza en el nivel superior y desciende cuando el valor excede la clave
  buscada.
tags:
- skip_list
- listas_saltos
- probabilistica
- busqueda
- estructuras_datos
- dep:listas_enlazadas
- dep:punteros
- c11
- intermedia
verificado: true
funciones:
- nombre: ejecutar_skip_list_24
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Ajuste Dinámico de Probabilidad de Nivel
    p=0.5 frente a p=0.25
tests_funciones:
- nombre: test_ejecutar_skip_list_24_positivo
  funcion: ejecutar_skip_list_24
  codigo: 'int res = ejecutar_skip_list_24(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_skip_list_24_cero
  funcion: ejecutar_skip_list_24
  codigo: 'int res = ejecutar_skip_list_24(0);

    assert(res == 0);'
- nombre: test_ejecutar_skip_list_24_negativo
  funcion: ejecutar_skip_list_24
  codigo: 'int res = ejecutar_skip_list_24(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_skip_list_24_valor_limite
  funcion: ejecutar_skip_list_24
  codigo: 'int res = ejecutar_skip_list_24(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_skip_list_24_valor_unitario
  funcion: ejecutar_skip_list_24
  codigo: 'int res = ejecutar_skip_list_24(1);

    assert(res >= 0 || res == 2);'
publicar: true
