    List, AVL y BST
tests_funciones:
- nombre: test_ejecutar_skip_list_18_positivo
  funcion: ejecutar_skip_list_18
  codigo: 'int res = ejecutar_skip_list_18(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_skip_list_18_cero
  funcion: ejecutar_skip_list_18
  codigo: 'int res = ejecutar_skip_list_18(0);

    assert(res == 0);'
- nombre: test_ejecutar_skip_list_18_negativo
  funcion: ejecutar_skip_list_18
  codigo: 'int res = ejecutar_skip_list_18(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_skip_list_18_valor_limite
  funcion: ejecutar_skip_list_18
  codigo: 'int res = ejecutar_skip_list_18(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_skip_list_18_valor_unitario
  funcion: ejecutar_skip_list_18
  codigo: 'int res = ejecutar_skip_list_18(1);

    assert(res >= 0 || res == 2);'
