    Saltos
tests_funciones:
- nombre: test_ejecutar_skip_list_26_positivo
  funcion: ejecutar_skip_list_26
  codigo: 'int res = ejecutar_skip_list_26(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_skip_list_26_cero
  funcion: ejecutar_skip_list_26
  codigo: 'int res = ejecutar_skip_list_26(0);

    assert(res == 0);'
- nombre: test_ejecutar_skip_list_26_negativo
  funcion: ejecutar_skip_list_26
  codigo: 'int res = ejecutar_skip_list_26(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_skip_list_26_valor_limite
  funcion: ejecutar_skip_list_26
  codigo: 'int res = ejecutar_skip_list_26(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_skip_list_26_valor_unitario
  funcion: ejecutar_skip_list_26
  codigo: 'int res = ejecutar_skip_list_26(1);

    assert(res >= 0 || res == 2);'
