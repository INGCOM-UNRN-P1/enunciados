id: skip-list-17
titulo: Skip List Determinista de 1-2 con Alturas Fijas
tema: skip_lists_probabilisticas
bloom: 3
minutos_estimados: 25
pistas:
- Cada nodo almacena un arreglo de punteros adelante de tamaño proporcional a su altura
  generada.
- La búsqueda avanza en el nivel superior y desciende cuando el valor excede la clave
  buscada.
tags:
- skip_list
- listas_saltos
- probabilistica
- busqueda
- estructuras_datos
- dep:listas_enlazadas
- dep:punteros
- c11
- intermedia
verificado: true
funciones:
- nombre: ejecutar_skip_list_17
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Skip List Determinista de 1-2 con Alturas
    Fijas
tests_funciones:
- nombre: test_ejecutar_skip_list_17_positivo
  funcion: ejecutar_skip_list_17
  codigo: 'int res = ejecutar_skip_list_17(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_skip_list_17_cero
  funcion: ejecutar_skip_list_17
  codigo: 'int res = ejecutar_skip_list_17(0);

    assert(res == 0);'
- nombre: test_ejecutar_skip_list_17_negativo
  funcion: ejecutar_skip_list_17
  codigo: 'int res = ejecutar_skip_list_17(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_skip_list_17_valor_limite
  funcion: ejecutar_skip_list_17
  codigo: 'int res = ejecutar_skip_list_17(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_skip_list_17_valor_unitario
  funcion: ejecutar_skip_list_17
  codigo: 'int res = ejecutar_skip_list_17(1);

    assert(res >= 0 || res == 2);'
publicar: true
