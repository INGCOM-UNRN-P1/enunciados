    Multinivel
tests_funciones:
- nombre: test_ejecutar_skip_list_01_positivo
  funcion: ejecutar_skip_list_01
  codigo: 'int res = ejecutar_skip_list_01(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_skip_list_01_cero
  funcion: ejecutar_skip_list_01
  codigo: 'int res = ejecutar_skip_list_01(0);

    assert(res == 0);'
- nombre: test_ejecutar_skip_list_01_negativo
  funcion: ejecutar_skip_list_01
  codigo: 'int res = ejecutar_skip_list_01(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_skip_list_01_valor_limite
  funcion: ejecutar_skip_list_01
  codigo: 'int res = ejecutar_skip_list_01(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_skip_list_01_valor_unitario
  funcion: ejecutar_skip_list_01
  codigo: 'int res = ejecutar_skip_list_01(1);

    assert(res >= 0 || res == 2);'
