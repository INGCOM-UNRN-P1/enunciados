tests_funciones:
- nombre: test_skip_list_08_principal
  funcion: skip_list_08_height_stats
  codigo: skip_list_t l; skip_list_init(&l, 1u); assert(l.head != NULL); assert(skip_list_insert_height(&l,
    10, 1)); assert(skip_list_insert_height(&l, 20, 3)); skip_height_stats_t r = skip_list_08_height_stats(&l);
    assert(r.count == 2 && r.maximum == 3 && r.average == 2.0); skip_list_destroy(&l);
