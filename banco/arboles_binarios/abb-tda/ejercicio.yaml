id: abb-tda
titulo: TDA Árbol Binario de Búsqueda
tema: arboles_binarios
bloom: 4
minutos_estimados: 45
tags: [arboles, bst, tda, memoria_dinamica, recursion]
pistas:
  - 'En abb_insertar, el caso base es cuando *raiz es NULL: ahí se crea el nodo con malloc.'
  - Al destruir el árbol recursivamente, liberá los subárboles izquierdo y derecho antes de liberar la raíz (postorden).
funciones:
  - nombre: abb_insertar
    retorno: bool
    parametros: nodo_abb_t **raiz, int clave
    descripcion: Inserta clave respetando el orden del ABB; devuelve false si ya existe o si falla malloc.
  - nombre: abb_buscar
    retorno: bool
    parametros: const nodo_abb_t *raiz, int clave
    descripcion: Devuelve true si la clave existe en el árbol; false en caso contrario.
  - nombre: abb_destruir
    retorno: void
    parametros: nodo_abb_t **raiz
    descripcion: Libera todos los nodos del árbol en postorden y asigna NULL a *raiz.
tests_funciones:
  - nombre: test_insertar_y_buscar_claves_en_ambas_ramas
    funcion: abb_insertar
    codigo: 'nodo_abb_t *raiz = NULL;

      assert(abb_insertar(&raiz, 50));

      assert(abb_insertar(&raiz, 30));

      assert(abb_insertar(&raiz, 70));

      assert(abb_insertar(&raiz, 25));

      assert(abb_insertar(&raiz, 40));

      assert(abb_buscar(raiz, 25));

      assert(abb_buscar(raiz, 70));

      assert(!abb_buscar(raiz, 99));

      abb_destruir(&raiz);

      assert(raiz == NULL);'
  - nombre: test_insertar_rechaza_duplicado_sin_modificar_arbol
    funcion: abb_insertar
    codigo: 'nodo_abb_t *raiz = NULL;

      assert(abb_insertar(&raiz, 10));

      assert(abb_insertar(&raiz, 5));

      nodo_abb_t *izquierdo = raiz->izq;

      assert(!abb_insertar(&raiz, 5));

      assert(raiz->izq == izquierdo);

      assert(abb_buscar(raiz, 5));

      abb_destruir(&raiz);'
  - nombre: test_buscar_y_destruir_arbol_vacio
    funcion: abb_destruir
    codigo: 'nodo_abb_t *raiz = NULL;

      assert(!abb_buscar(raiz, 0));

      abb_destruir(&raiz);

      assert(raiz == NULL);'
