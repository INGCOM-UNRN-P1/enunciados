verificado: true
funciones:
- nombre: reconstruir_in_pre
  retorno: nodo_arbol_18_t *
  parametros: const int *inorder, const int *preorder, size_t n
  descripcion: Construir un árbol binario a partir de recorridos inorder y preorder. Los valores son únicos
    y ambos recorridos pertenecen al mismo árbol.
- nombre: liberar_arbol_18
  retorno: void
  parametros: nodo_arbol_18_t *raiz
  descripcion: Liberar todos los nodos de un árbol construido por la función.
tests_funciones:
- nombre: test_reconstruir_in_pre_recorrido
  funcion: reconstruir_in_pre
  codigo: const int in[]={2,1,3}, rec[]={1,2,3}; nodo_arbol_18_t *r=reconstruir_in_pre(in,rec,3); assert(r
    && r->valor==1 && r->izq->valor==2 && r->der->valor==3); liberar_arbol_18(r);
- nombre: test_reconstruir_in_pre_vacio
  funcion: reconstruir_in_pre
  codigo: assert(reconstruir_in_pre(NULL,NULL,0)==NULL);
