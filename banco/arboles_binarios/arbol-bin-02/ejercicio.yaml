id: arbol-bin-02
titulo: Cálculo de Altura y Cantidad de Hojas de un Árbol Binario
tema: arboles_binarios
bloom: 1
minutos_estimados: 10
pistas:
- La altura se mide en cantidad de nodos; el árbol vacío tiene altura 0.
- Un nodo hoja tiene ambos hijos NULL.
tags:
- arboles
- arbol_binario
- altura
- hojas
- recursividad
- c11
verificado: true
funciones:
- nombre: altura_arbol
  retorno: int
  parametros: const nodo_arbol_t *n
  descripcion: Operación altura_arbol según el contrato de la consigna.
- nombre: contar_hojas
  retorno: int
  parametros: const nodo_arbol_t *n
  descripcion: Operación contar_hojas según el contrato de la consigna.
- nombre: liberar_arbol
  retorno: void
  parametros: nodo_arbol_t *n
  descripcion: Operación liberar_arbol según el contrato de la consigna.
tests_funciones:
- nombre: test_comportamiento_principal
  funcion: altura_arbol
  codigo: 'nodo_arbol_t r={1,NULL,NULL}, l={2,NULL,NULL}, d={3,NULL,NULL}; r.izq=&l;
    r.der=&d; assert(altura_arbol(&r)==2); assert(contar_hojas(&r)==2); assert(altura_arbol(NULL)==0);
    assert(contar_hojas(NULL)==0);

    '
publicar: true
unidad: 4
modulo: Tipos Abstractos y Algorítmica
dificultad: inicial
tipo: practica_guiada
prerrequisitos:
- tad
- recursividad
- punteros
subtema: arboles_binarios
