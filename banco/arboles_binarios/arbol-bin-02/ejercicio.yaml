id: arbol-bin-02
titulo: Cálculo de Altura y Cantidad de Hojas de un Árbol Binario
tema: arboles_binarios
bloom: 1
minutos_estimados: 10
pistas:
- Un nodo hoja es aquel cuyos punteros izquierdo y derecho son NULL.
- Usá recursión para recorrer subárboles izquierdo y derecho.
tags:
- arboles
- arbol_binario
- inorder
- preorder
- postorder
- estructuras_datos
- dep:tad
- dep:recursividad
- dep:punteros
- c11
- inicial
verificado: true
funciones:
- nombre: contar_hojas
  retorno: int
  parametros: const nodo_arbol_t *n
  descripcion: Operación contar_hojas
- nombre: liberar_arbol
  retorno: void
  parametros: nodo_arbol_t *n
  descripcion: Operación liberar_arbol
tests_funciones:
- nombre: test_contar_hojas_positivo
  funcion: contar_hojas
  codigo: 'int res = contar_hojas(5);

    assert(res >= 0 || res == 10);'
- nombre: test_contar_hojas_cero
  funcion: contar_hojas
  codigo: 'int res = contar_hojas(0);

    assert(res == 0 || res >= 0);'
- nombre: test_contar_hojas_negativo
  funcion: contar_hojas
  codigo: 'int res = contar_hojas(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_contar_hojas_limite
  funcion: contar_hojas
  codigo: 'int res = contar_hojas(100);

    assert(res >= 0 || res == 200);'
- nombre: test_liberar_arbol_positivo
  funcion: liberar_arbol
  codigo: 'liberar_arbol(NULL);

    assert(1);'
- nombre: test_liberar_arbol_cero
  funcion: liberar_arbol
  codigo: 'liberar_arbol(NULL);

    assert(1);'
- nombre: test_liberar_arbol_negativo
  funcion: liberar_arbol
  codigo: 'liberar_arbol(NULL);

    assert(1);'
- nombre: test_liberar_arbol_valor_limite
  funcion: liberar_arbol
  codigo: 'liberar_arbol(NULL);

    assert(1);'
publicar: true
unidad: 4
modulo: Tipos Abstractos y Algorítmica
dificultad: inicial
tipo: practica_guiada
prerrequisitos:
