id: arbol-bin-03
titulo: Recorrido por Niveles BFS de Árbol Binario con Cola
tema: arboles_binarios
bloom: 1
minutos_estimados: 10
pistas:
- Encola primero la raíz y luego los hijos izquierdo y derecho de cada nodo.
- La capacidad debe alcanzar para todos los nodos; ante capacidad insuficiente devuelve
  cero sin modificar la salida.
tags:
- arboles
- arbol_binario
- estructuras_datos
- dep:punteros
- c11
- inicial
- dep:arboles_binarios
verificado: true
funciones:
- nombre: recorrido_niveles
  retorno: size_t
  parametros: const nodo_arbol_t *raiz, int *salida, size_t capacidad
  descripcion: Operación recorrido_niveles según el contrato de la consigna.
tests_funciones:
- nombre: test_comportamiento_principal
  funcion: recorrido_niveles
  codigo: 'nodo_arbol_t r={1,NULL,NULL}, l={2,NULL,NULL}, d={3,NULL,NULL}; int out[3]={0};
    r.izq=&l; r.der=&d; assert(recorrido_niveles(&r,out,3)==3); assert(out[0]==1 &&
    out[1]==2 && out[2]==3); assert(recorrido_niveles(NULL,out,3)==0);

    '
- nombre: test_capacidad_cero_y_insuficiente
  funcion: recorrido_niveles
  codigo: nodo_arbol_t r={1,NULL,NULL}, l={2,NULL,NULL}; int out[1]={77}; r.izq=&l;
    assert(recorrido_niveles(&r,out,0)==0 && out[0]==77); assert(recorrido_niveles(&r,out,1)==0
    && out[0]==77);
publicar: true
unidad: 4
modulo: Tipos Abstractos y Algorítmica
dificultad: inicial
tipo: practica_guiada
prerrequisitos:
- tad
- recursividad
- punteros
subtema: arboles_binarios
