funciones:
- nombre: vista_lateral_22
  retorno: bool
  parametros: const nodo_arbol_bin_22_t *raiz, bool desde_izquierda, int *valores, size_t capacidad, size_t *cantidad
  descripcion: Obtiene la vista izquierda o derecha, un nodo por profundidad.
- nombre: vista_vertical_22
  retorno: bool
  parametros: const nodo_arbol_bin_22_t *raiz, bool inferior, int *valores, size_t capacidad, size_t *cantidad
  descripcion: Obtiene la vista superior o inferior, un nodo por distancia horizontal.
tests_funciones:
- nombre: test_vistas_con_colisiones_horizontal
  funcion: vista_vertical_22
  codigo: '#include <assert.h>

    #include "arbol-bin-22.h"

    nodo_arbol_bin_22_t a={7,0,0}, b={15,0,0}, l={5,0,&a}, r={20,&b,0}, root={10,&l,&r}; int v[3]; size_t n; assert(vista_vertical_22(&root,false,v,3,&n)&&n==3&&v[0]==5&&v[1]==10&&v[2]==20);
    assert(vista_vertical_22(&root,true,v,3,&n)&&n==3&&v[0]==5&&v[1]==15&&v[2]==20); assert(vista_lateral_22(&root,true,v,3,&n)&&n==3&&v[0]==10&&v[1]==5&&v[2]==7);
    assert(vista_lateral_22(&root,false,v,3,&n)&&n==3&&v[0]==10&&v[1]==20&&v[2]==15);'
