verificado: true
funciones:
- nombre: reconstruir_in_post
  retorno: nodo_arbol_19_t *
  parametros: const int *inorder, const int *postorder, size_t n
  descripcion: Construir un árbol binario a partir de recorridos inorder y postorder. Los valores son
    únicos y ambos recorridos pertenecen al mismo árbol.
- nombre: liberar_arbol_19
  retorno: void
  parametros: nodo_arbol_19_t *raiz
  descripcion: Liberar todos los nodos de un árbol construido por la función.
tests_funciones:
- nombre: test_reconstruir_in_post_recorrido
  funcion: reconstruir_in_post
  codigo: const int in[]={2,1,3}, rec[]={2,3,1}; nodo_arbol_19_t *r=reconstruir_in_post(in,rec,3); assert(r
    && r->valor==1 && r->izq->valor==2 && r->der->valor==3); liberar_arbol_19(r);
- nombre: test_reconstruir_in_post_vacio
  funcion: reconstruir_in_post
  codigo: assert(reconstruir_in_post(NULL,NULL,0)==NULL);
