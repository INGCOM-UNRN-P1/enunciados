id: arbol-bin-19
titulo: Reconstrucción desde inorder y postorder
tema: arboles_binarios
bloom: 3
minutos_estimados: 25
pistas:
- El último elemento de postorder es la raíz; su posición en inorder separa los dos subárboles.
tags:
