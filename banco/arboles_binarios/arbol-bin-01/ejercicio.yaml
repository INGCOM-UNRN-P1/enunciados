id: arbol-bin-01
titulo: Recorridos Inorder, Preorder y Postorder en Árbol Binario
tema: arboles_binarios
bloom: 1
minutos_estimados: 10
pistas:
- Un nodo hoja es aquel cuyos punteros izquierdo y derecho son NULL.
- Usá recursión para recorrer subárboles izquierdo y derecho.
tags:
- arboles
