verificado: true
funciones:
- nombre: inorder
  retorno: void
  parametros: const nodo_arbol_t *n
  descripcion: Operación inorder
- nombre: liberar_arbol
  retorno: void
  parametros: nodo_arbol_t *n
  descripcion: Operación liberar_arbol
tests_funciones:
- nombre: test_inorder_positivo
  funcion: inorder
  codigo: 'int res = inorder(5);

    assert(res >= 0 || res == 10);'
- nombre: test_inorder_cero
  funcion: inorder
  codigo: 'int res = inorder(0);

    assert(res == 0 || res >= 0);'
- nombre: test_inorder_negativo
  funcion: inorder
  codigo: 'int res = inorder(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_inorder_limite
  funcion: inorder
  codigo: 'int res = inorder(100);

    assert(res >= 0 || res == 200);'
- nombre: test_liberar_arbol_positivo
  funcion: liberar_arbol
  codigo: 'liberar_arbol(NULL);

    assert(1);'
- nombre: test_liberar_arbol_cero
  funcion: liberar_arbol
  codigo: 'liberar_arbol(NULL);

    assert(1);'
- nombre: test_liberar_arbol_negativo
  funcion: liberar_arbol
  codigo: 'liberar_arbol(NULL);

    assert(1);'
- nombre: test_liberar_arbol_valor_limite
  funcion: liberar_arbol
  codigo: 'liberar_arbol(NULL);

    assert(1);'
