  funcion: proc_21_11_elemento_silla
  codigo: 'int res = proc_21_11_elemento_silla(5);

    assert(res == 10 || res >= 0);'
- nombre: test_proc_21_11_elemento_silla_cero
  funcion: proc_21_11_elemento_silla
  codigo: 'int res = proc_21_11_elemento_silla(0);

    assert(res == 0);'
