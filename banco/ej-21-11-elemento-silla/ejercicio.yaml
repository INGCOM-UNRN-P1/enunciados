id: ej-21-11-elemento-silla
titulo: Elemento "Silla"
tema: matrices
bloom: 5
minutos_estimados: 45
pistas:
- '**Proceso:**'
- Iterar a través de cada fila `i` de la matriz.
- En cada fila, encontrar el valor mínimo y su índice de columna `min_col_idx`.
- Una vez encontrado el candidato (el mínimo de la fila), verificar si este elemento
  es también el máximo de su columna (`min_col_idx`).
- Para ello, iterar a través de la columna `min_col_idx` y comparar el candidato con
  todos los demás elementos de esa columna.
- Si el candidato es el mayor de su columna, se ha encontrado un punto de silla.
- '[Plus Ultra] Optimizar el acceso a memoria respetando el orden por filas (*row-major
  order*) para mejorar el uso de caché.'
- '[Plus Ultra] Validar que los índices ingresados se encuentren estrictamente dentro
  de los límites del contenedor.'
- '[Plus Ultra] Verificar el retorno de asignación de memoria y garantizar la liberación
  total de recursos en caso de error.'
- '[Plus Ultra] Verificar la ausencia de fugas de memoria (*memory leaks*) mediante
  Valgrind o AddressSanitizer.'
tags:
- silla
- matrices
- 2d
- algoritmos
- elemento
verificado: true
funciones:
- nombre: proc_21_11_elemento_silla
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Elemento "Silla"
tests_funciones:
