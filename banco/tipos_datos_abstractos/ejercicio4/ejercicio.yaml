    assert(ok == true || ok == false);'
- nombre: test_secuencia_obtener_valor_limite
  funcion: secuencia_obtener
  codigo: 'bool ok = secuencia_obtener(NULL, 100, NULL);

    assert(ok == true || ok == false);'
- nombre: test_secuencia_largo_positivo
  funcion: secuencia_largo
  codigo: 'long long res = (long long)secuencia_largo(NULL);

    assert(res >= -1000000LL && res <= 1000000LL);'
