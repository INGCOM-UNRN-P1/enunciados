id: ej-3-5-factorial
titulo: Factorial
tema: aritmetica
bloom: 3
minutos_estimados: 25
pistas:
- '**Entrada:** Un entero no negativo `n`.'
- '**Casos Base:** Por definición, `0! = 1`. El factorial de 1 es 1.'
- '**Proceso:** Se utiliza un lazo que itera desde 2 hasta `n`. Se necesita una variable
  `resultado` (de tipo `long long` para evitar desbordamiento rápido) inicializada
  en 1. En cada iteración, se multiplica `resultado` por el número actual del lazo.'
- '**Desbordamiento:** Los factoriales crecen muy rápido. Usar un tipo de dato grande
  como `unsigned long long` es crucial. definición interna oculta en el archivo `.c`.
  para copiar la estructura de forma segura.'
- '[Plus Ultra] Validar que n >= 0 y usar long long para retrasar el desbordamiento
  numérico.'
- '[Plus Ultra] Informar el valor máximo de n para el cual no se produce desbordamiento
  con el tipo empleado.'
tags:
- aritmetica
- factorial
- matematica
- fundamentos
verificado: true
funciones:
- nombre: ejecutar_ej_3_5_factorial
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Factorial
tests_funciones:
- nombre: test_ejecutar_ej_3_5_factorial_positivo
  funcion: ejecutar_ej_3_5_factorial
  codigo: 'int res = ejecutar_ej_3_5_factorial(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_ej_3_5_factorial_cero
  funcion: ejecutar_ej_3_5_factorial
  codigo: 'int res = ejecutar_ej_3_5_factorial(0);

    assert(res == 0);'
