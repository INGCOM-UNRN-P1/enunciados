id: trie-pref-01
titulo: Trie de Búsqueda de Prefijos y Palabras
tema: trie_arboles_prefijo
bloom: 1
minutos_estimados: 10
pistas:
- Cada nodo tiene un arreglo de punteros indexados por caracteres.
- Marcá un flag booleano cuando un nodo represente el final de una palabra.
tags:
- trie
- prefijos
- arboles
- cadenas
- estructuras_datos
- dep:arboles_binarios
- dep:cadenas
- c11
- inicial
verificado: true
funciones:
- nombre: trie_insertar
  retorno: void
  parametros: nodo_trie_t *raiz, const char *palabra
- nombre: trie_buscar_prefijo
  retorno: int
  parametros: const nodo_trie_t *raiz, const char *prefijo
- nombre: liberar_trie
  retorno: void
  parametros: nodo_trie_t *n
tests_funciones:
- nombre: prefijo_de_palabra
  funcion: trie_insertar
  codigo: nodo_trie_t r={0}; trie_insertar(&r,"Casa7"); assert(trie_buscar_prefijo(&r,"Cas")==1); assert(trie_buscar_prefijo(&r,"casa")==0);
    for(size_t i=0;i<TRIE_ALFABETO;i++) liberar_trie(r.hijos[i]);
- nombre: palabra_y_prefijo_vacio
  funcion: trie_buscar_prefijo
  codigo: nodo_trie_t r={0}; trie_insertar(&r,"red"); assert(trie_buscar_prefijo(&r,"red")==1); assert(trie_buscar_prefijo(&r,"")==1);
    assert(trie_buscar_prefijo(&r,"reds")==0); for(size_t i=0;i<TRIE_ALFABETO;i++) liberar_trie(r.hijos[i]);
- nombre: rechaza_caracter_invalido_sin_omitirlo
  funcion: trie_insertar
  codigo: nodo_trie_t r={0}; trie_insertar(&r,"ab-"); assert(trie_buscar_prefijo(&r,"ab")==0); assert(trie_buscar_prefijo(&r,"ab-")==0);
    for(size_t i=0;i<TRIE_ALFABETO;i++) liberar_trie(r.hijos[i]);
- nombre: punteros_nulos
  funcion: trie_buscar_prefijo
  codigo: assert(trie_buscar_prefijo(NULL,"a")==0); assert(trie_buscar_prefijo(NULL,NULL)==0); trie_insertar(NULL,"abc");
    liberar_trie(NULL);
publicar: true
unidad: 4
modulo: Tipos Abstractos y Algorítmica
dificultad: inicial
tipo: practica_guiada
prerrequisitos:
- arboles_binarios
- cadenas
subtema: trie_arboles_prefijo
