id: trie-pref-15
titulo: Conteo de Hojas y Nodos Totales en Árbol Trie
tema: trie_arboles_prefijo
bloom: 3
minutos_estimados: 25
pistas:
- Cada nodo tiene un arreglo de punteros indexados por caracteres.
- Marcá un flag booleano cuando un nodo represente el final de una palabra.
tags:
- trie
- prefijos
- arboles
- cadenas
- estructuras_datos
- dep:arboles_binarios
- dep:cadenas
- c11
- intermedia
verificado: false
funciones:
- nombre: trie_crear
  retorno: nodo_trie_t *
  parametros: void
  descripcion: Crea una raíz dinámica vacía.
- nombre: trie_insertar
  retorno: bool
  parametros: nodo_trie_t *raiz, const char *palabra
  descripcion: Inserta una palabra.
- nombre: trie_estadisticas
  retorno: void
  parametros: const nodo_trie_t *raiz, trie_estadisticas_t *salida
  descripcion: Cuenta nodos, hojas, palabras y aristas.
- nombre: trie_destruir
  retorno: void
  parametros: nodo_trie_t *raiz
  descripcion: Libera trie y raíz dinámica.
tests_funciones:
- nombre: test_15_1_caso_funcional
  funcion: trie_estadisticas
  codigo: nodo_trie_t *r=trie_crear(); trie_estadisticas_t s; trie_estadisticas(r,&s); assert(s.nodos==1&&s.hojas==1&&s.palabras==0);
    assert(trie_insertar(r,"ab")&&trie_insertar(r,"ac")); trie_estadisticas(r,&s); assert(s.nodos==4&&s.hojas==2&&s.palabras==2&&s.aristas==3);
    trie_destruir(r);
- nombre: test_15_2_caso_funcional
  funcion: trie_estadisticas
  codigo: trie_estadisticas_t s; trie_estadisticas(NULL,&s); assert(s.nodos==0&&s.hojas==0);
publicar: true
