id: trie-pref-06
titulo: Conteo de Palabras que Comparten un Prefijo en Trie
tema: trie_arboles_prefijo
bloom: 1
minutos_estimados: 10
pistas:
- Cada nodo tiene un arreglo de punteros indexados por caracteres.
- Marcá un flag booleano cuando un nodo represente el final de una palabra.
tags:
- trie
- prefijos
- arboles
- cadenas
- estructuras_datos
- dep:arboles_binarios
- dep:cadenas
- c11
- inicial
verificado: false
funciones:
- nombre: trie_crear
  retorno: nodo_trie_t *
  parametros: void
  descripcion: Crea una raíz dinámica.
- nombre: trie_insertar
  retorno: bool
  parametros: nodo_trie_t *raiz, const char *palabra
  descripcion: Inserta una palabra; las repeticiones no aumentan el conteo.
- nombre: trie_contar_prefijo
  retorno: size_t
  parametros: const nodo_trie_t *raiz, const char *prefijo
  descripcion: Cuenta palabras terminales bajo el prefijo vacío o indicado.
- nombre: trie_destruir
  retorno: void
  parametros: nodo_trie_t *raiz
  descripcion: Libera la trie, incluida la raíz dinámica.
tests_funciones:
- nombre: test_06_1_caso_funcional
  funcion: trie_contar_prefijo
  codigo: nodo_trie_t *r=trie_crear(); assert(trie_insertar(r,"casa")&&trie_insertar(r,"casco")&&trie_insertar(r,"sol")&&trie_insertar(r,"casa"));
    assert(trie_contar_prefijo(r,"cas")==2&&trie_contar_prefijo(r,"")==3&&trie_contar_prefijo(r,"zz")==0); trie_destruir(r);
- nombre: test_06_2_caso_funcional
  funcion: trie_contar_prefijo
  codigo: nodo_trie_t *r=trie_crear(); assert(trie_contar_prefijo(r,"")==0&&trie_contar_prefijo(NULL,"x")==0); trie_destruir(r);
publicar: true
unidad: 4
modulo: Tipos Abstractos y Algorítmica
dificultad: inicial
tipo: practica_guiada
prerrequisitos:
- arboles_binarios
- cadenas
subtema: trie_arboles_prefijo
