id: trie-pref-18
titulo: Trie con Nodos Indexados por Tablas Hash
tema: trie_arboles_prefijo
bloom: 3
minutos_estimados: 25
pistas:
- Cada nodo tiene un arreglo de punteros indexados por caracteres.
- Marcá un flag booleano cuando un nodo represente el final de una palabra.
tags:
- trie
- prefijos
- arboles
- cadenas
- estructuras_datos
- dep:arboles_binarios
- dep:cadenas
- c11
- intermedia
verificado: false
funciones:
- nombre: trie_hash_iniciar
  retorno: void
  parametros: trie_hash_t *trie
  descripcion: Inicializa tabla hash de raíz.
- nombre: trie_hash_insertar
  retorno: bool
  parametros: trie_hash_t *trie, const char *palabra
  descripcion: Inserta bytes de palabra resolviendo colisiones por encadenamiento.
- nombre: trie_hash_buscar
  retorno: bool
  parametros: const trie_hash_t *trie, const char *palabra
  descripcion: Busca palabra exacta.
- nombre: trie_hash_destruir
  retorno: void
  parametros: trie_hash_t *trie
  descripcion: Libera cadenas de colisiones, hijos y raíz.
tests_funciones:
- nombre: test_18_1_caso_funcional
  funcion: trie_hash_insertar
  codigo: trie_hash_t t={0}; trie_hash_iniciar(&t); assert(trie_hash_insertar(&t,"casa")&&trie_hash_insertar(&t,"cama")&&trie_hash_insertar(&t,"Ω"));
    assert(trie_hash_buscar(&t,"casa")&&trie_hash_buscar(&t,"cama")&&!trie_hash_buscar(&t,"cas")); trie_hash_destruir(&t);
- nombre: test_18_2_caso_funcional
  funcion: trie_hash_insertar
  codigo: trie_hash_t t={0}; assert(!trie_hash_insertar(&t,NULL)&&!trie_hash_buscar(&t,"")); trie_hash_destruir(&t);
publicar: true
unidad: 4
modulo: Tipos Abstractos y Algorítmica
dificultad: intermedia
tipo: practica_guiada
prerrequisitos:
