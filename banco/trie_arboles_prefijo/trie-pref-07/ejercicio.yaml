id: trie-pref-07
titulo: Búsqueda del Prefijo Más Largo Coincidente en Trie
tema: trie_arboles_prefijo
bloom: 2
minutos_estimados: 15
pistas:
- Cada nodo tiene un arreglo de punteros indexados por caracteres.
- Marcá un flag booleano cuando un nodo represente el final de una palabra.
tags:
- trie
- prefijos
- arboles
- cadenas
- estructuras_datos
- dep:arboles_binarios
- dep:cadenas
- c11
- inicial
verificado: false
funciones:
- nombre: trie_crear
  retorno: nodo_trie_t *
  parametros: void
  descripcion: Crea una raíz dinámica.
- nombre: trie_insertar
  retorno: bool
  parametros: nodo_trie_t *raiz, const char *palabra
  descripcion: Inserta una palabra.
- nombre: trie_prefijo_mas_largo
  retorno: size_t
  parametros: const nodo_trie_t *raiz, const char *consulta, char *salida, size_t capacidad
  descripcion: Copia el prefijo de consulta más largo que sea una palabra completa.
- nombre: trie_destruir
  retorno: void
  parametros: nodo_trie_t *raiz
  descripcion: Libera la trie, incluida la raíz dinámica.
tests_funciones:
- nombre: test_07_1_caso_funcional
  funcion: trie_prefijo_mas_largo
  codigo: nodo_trie_t *r=trie_crear(); assert(trie_insertar(r,"car")&&trie_insertar(r,"carta")); char o[32]; assert(trie_prefijo_mas_largo(r,"cartero",o,sizeof
    o)==3&&strcmp(o,"car")==0); assert(trie_prefijo_mas_largo(r,"xyz",o,sizeof o)==0&&o[0]==0); trie_destruir(r);
- nombre: test_07_2_caso_funcional
  funcion: trie_prefijo_mas_largo
  codigo: nodo_trie_t *r=trie_crear(); char o[2]; assert(trie_prefijo_mas_largo(r,"ab",o,sizeof o)==0&&o[0]==0);
    trie_destruir(r);
publicar: true
