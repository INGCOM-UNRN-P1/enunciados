verificado: true
funciones:
- nombre: trie_texto_indexar
  retorno: bool
  parametros: trie_texto_indice_t *indice, const char *texto
  descripcion: Indexa las posiciones iniciales de los tokens.
- nombre: trie_texto_buscar
  retorno: size_t
  parametros: const trie_texto_indice_t *indice, const char *palabra, size_t *posiciones, size_t capacidad
  descripcion: Copia los offsets de ocurrencia hasta capacidad.
- nombre: trie_texto_destruir
  retorno: void
  parametros: trie_texto_indice_t *indice
  descripcion: Libera y vacía el índice.
tests_funciones:
- nombre: busqueda_de_tokens_y_offsets
  funcion: trie_texto_indexar
  codigo: trie_texto_indice_t x;assert(trie_texto_indexar(&x,"sol luna sol\nsol"));size_t p[4];assert(trie_texto_buscar(&x,"sol",p,4)==3&&p[0]==0&&p[1]==9&&p[2]==13);assert(!trie_texto_buscar(&x,"lu",p,4));trie_texto_destruir(&x);
