id: trie-pref-16
titulo: Cálculo de Memoria Utilizada y Ocupación de Nodos en Trie
tema: trie_arboles_prefijo
bloom: 3
minutos_estimados: 25
pistas:
- Cada nodo tiene un arreglo de punteros indexados por caracteres.
- Marcá un flag booleano cuando un nodo represente el final de una palabra.
tags:
- trie
- prefijos
- arboles
- cadenas
- estructuras_datos
- dep:arboles_binarios
- dep:cadenas
- c11
- intermedia
verificado: false
funciones:
- nombre: trie_crear
  retorno: nodo_trie_t *
  parametros: void
  descripcion: Crea una raíz dinámica vacía.
- nombre: trie_insertar
  retorno: bool
  parametros: nodo_trie_t *raiz, const char *palabra
  descripcion: Inserta una palabra.
- nombre: trie_medir
  retorno: void
  parametros: const nodo_trie_t *raiz, trie_memoria_t *salida
  descripcion: Mide nodos, bytes solicitados y ocupación de enlaces.
- nombre: trie_destruir
  retorno: void
  parametros: nodo_trie_t *raiz
  descripcion: Libera trie y raíz dinámica.
tests_funciones:
- nombre: test_16_1_caso_funcional
  funcion: trie_medir
  codigo: nodo_trie_t *r=trie_crear(); trie_memoria_t m; trie_medir(r,&m); assert(m.nodos==1&&m.bytes>=sizeof(*r)&&m.aristas==0&&m.ocupacion==0.0);
    assert(trie_insertar(r,"a")); trie_medir(r,&m); assert(m.nodos==2&&m.bytes>sizeof(*r)&&m.aristas==1&&m.ocupacion>0.0);
    trie_destruir(r);
- nombre: test_16_2_caso_funcional
  funcion: trie_medir
  codigo: trie_memoria_t m; trie_medir(NULL,&m); assert(m.nodos==0&&m.bytes==0&&m.ocupacion==0.0);
publicar: true
unidad: 4
modulo: Tipos Abstractos y Algorítmica
dificultad: intermedia
tipo: practica_guiada
prerrequisitos:
