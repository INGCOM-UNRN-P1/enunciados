funciones:
- nombre: arbol_sufijos_crear
  retorno: bool
  parametros: arbol_sufijos_t *arbol, const char *texto
  descripcion: Construye un árbol de sufijos con aristas etiquetadas por rangos del texto.
- nombre: arbol_sufijos_contiene
  retorno: bool
  parametros: const arbol_sufijos_t *arbol, const char *subcadena
  descripcion: Busca una subcadena, incluso si termina en medio de una etiqueta.
- nombre: arbol_sufijos_destruir
  retorno: void
  parametros: arbol_sufijos_t *arbol
  descripcion: Libera nodos, aristas y texto.
