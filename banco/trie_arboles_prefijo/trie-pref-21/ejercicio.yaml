id: trie-pref-21
titulo: Detección del palíndromo más largo con árbol palindrómico
tema: trie_arboles_prefijo
bloom: 4
minutos_estimados: 35
pistas:
- Cada nodo representa un palíndromo distinto; las transiciones agregan el mismo byte en ambos extremos.
- Un enlace de sufijo apunta al palíndromo propio más largo que también es sufijo.
tags:
- trie
- prefijos
- arboles
- cadenas
- estructuras_datos
- dep:arboles_binarios
- dep:cadenas
- c11
- intermedia
verificado: true
funciones:
- nombre: trie_palindromo_mas_largo
  retorno: size_t
  parametros: const char *texto, char *salida, size_t capacidad
  descripcion: Copia la subcadena palindrómica contigua más larga.
tests_funciones:
- nombre: palindromos_con_empate_y_limites
  funcion: trie_palindromo_mas_largo
  codigo: char o[32];assert(trie_palindromo_mas_largo("abacdfgdcaba",o,sizeof o)==3&&!strcmp(o,"aba"));assert(trie_palindromo_mas_largo("forgeeksskeegfor",o,sizeof
    o)==10&&!strcmp(o,"geeksskeeg"));assert(trie_palindromo_mas_largo("aba",o,3)==0&&!o[0]);
- nombre: capacidad_segun_longitud_resultante
  funcion: trie_palindromo_mas_largo
  codigo: char o[2];assert(trie_palindromo_mas_largo("abc",o,sizeof o)==1&&!strcmp(o,"a"));
publicar: true
