id: trie-pref-05
titulo: Autocompletado de Palabras dado un Prefijo Común
tema: trie_arboles_prefijo
bloom: 1
minutos_estimados: 10
pistas:
- Cada nodo tiene un arreglo de punteros indexados por caracteres.
- Marcá un flag booleano cuando un nodo represente el final de una palabra.
tags:
- trie
- prefijos
- arboles
- cadenas
- estructuras_datos
- dep:arboles_binarios
- dep:cadenas
- c11
- inicial
verificado: false
funciones:
- nombre: trie_crear
  retorno: nodo_trie_t *
  parametros: void
  descripcion: Crea una raíz dinámica.
- nombre: trie_insertar
  retorno: bool
  parametros: nodo_trie_t *raiz, const char *palabra
  descripcion: Inserta una palabra en la trie.
- nombre: trie_autocompletar
  retorno: size_t
  parametros: const nodo_trie_t *raiz, const char *prefijo, char resultados[][256], size_t capacidad
  descripcion: Escribe extensiones completas en orden de bytes y devuelve cuántas copió.
- nombre: trie_destruir
  retorno: void
  parametros: nodo_trie_t *raiz
  descripcion: Libera la trie, incluida la raíz dinámica.
tests_funciones:
- nombre: test_05_1_caso_funcional
  funcion: trie_autocompletar
  codigo: nodo_trie_t *r=trie_crear(); assert(r&&trie_insertar(r,"casa")&&trie_insertar(r,"casco")&&trie_insertar(r,"cas"));
    char o[4][256]; size_t n=trie_autocompletar(r,"cas",o,4); assert(n==3&&strcmp(o[0],"cas")==0&&strcmp(o[1],"casa")==0&&strcmp(o[2],"casco")==0);
    trie_destruir(r);
- nombre: test_05_2_caso_funcional
  funcion: trie_autocompletar
  codigo: nodo_trie_t *r=trie_crear(); char o[1][256]; assert(trie_autocompletar(r,"x",o,1)==0&&trie_autocompletar(r,"",NULL,0)==0);
    trie_destruir(r);
publicar: true
unidad: 4
modulo: Tipos Abstractos y Algorítmica
dificultad: inicial
tipo: practica_guiada
prerrequisitos:
- arboles_binarios
- cadenas
subtema: trie_arboles_prefijo
