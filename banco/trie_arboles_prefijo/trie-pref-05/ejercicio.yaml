  funcion: ejecutar_trie_pref_05
  codigo: 'int res = ejecutar_trie_pref_05(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_trie_pref_05_valor_limite
  funcion: ejecutar_trie_pref_05
  codigo: 'int res = ejecutar_trie_pref_05(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_trie_pref_05_valor_unitario
  funcion: ejecutar_trie_pref_05
  codigo: 'int res = ejecutar_trie_pref_05(1);

    assert(res >= 0 || res == 2);'
