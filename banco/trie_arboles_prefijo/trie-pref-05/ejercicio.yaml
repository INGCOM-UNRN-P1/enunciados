tests_funciones:
- nombre: test_ejecutar_trie_pref_05_positivo
  funcion: ejecutar_trie_pref_05
  codigo: 'int res = ejecutar_trie_pref_05(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_trie_pref_05_cero
  funcion: ejecutar_trie_pref_05
  codigo: 'int res = ejecutar_trie_pref_05(0);

    assert(res == 0);'
