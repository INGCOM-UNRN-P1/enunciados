id: trie-pref-13
titulo: Corrector Ortográfico con Distancia de Levenshtein sobre Trie
tema: trie_arboles_prefijo
bloom: 4
minutos_estimados: 25
pistas:
- Cada nodo tiene un arreglo de punteros indexados por caracteres.
- Marcá un flag booleano cuando un nodo represente el final de una palabra.
tags:
- trie
- prefijos
- arboles
- cadenas
- estructuras_datos
- dep:arboles_binarios
- dep:cadenas
- c11
- intermedia
verificado: false
funciones:
- nombre: trie_crear
  retorno: nodo_trie_t *
  parametros: void
  descripcion: Crea una raíz dinámica.
- nombre: trie_insertar
  retorno: bool
  parametros: nodo_trie_t *raiz, const char *palabra
  descripcion: Inserta una palabra.
- nombre: trie_sugerir
  retorno: size_t
  parametros: const nodo_trie_t *raiz, const char *consulta, size_t distancia_maxima, char resultados[][256], size_t
    capacidad
  descripcion: Enumera palabras dentro de la distancia de Levenshtein en orden de bytes.
- nombre: trie_destruir
  retorno: void
  parametros: nodo_trie_t *raiz
  descripcion: Libera trie y raíz dinámica.
tests_funciones:
- nombre: distancia_referencia_en_ramas_hermanas
  funcion: trie_sugerir
  codigo: nodo_trie_t *r=trie_crear(); const char *words[]={"cat","bat","cut","coat","cats","dog","at"}; for(size_t
    i=0;i<7;i++) assert(trie_insertar(r,words[i])); char out[8][256]; size_t n=trie_sugerir(r,"cat",1,out,8); const
    char *expected[]={"at","bat","cat","cats","coat","cut"}; assert(n==6); for(size_t i=0;i<n;i++){assert(strcmp(out[i],expected[i])==0);
    size_t a=strlen(out[i]),b=3,dp[6][4]; for(size_t x=0;x<=a;x++)dp[x][0]=x; for(size_t y=0;y<=b;y++)dp[0][y]=y;
    for(size_t x=1;x<=a;x++)for(size_t y=1;y<=b;y++){size_t del=dp[x-1][y]+1,ins=dp[x][y-1]+1,sub=dp[x-1][y-1]+(out[i][x-1]!="cat"[y-1]);
    size_t z=del<ins?del:ins; dp[x][y]=z<sub?z:sub;} assert(dp[a][b]<=1);} trie_destruir(r);
- nombre: consulta_vacia_y_capacidad_cero
  funcion: trie_sugerir
  codigo: nodo_trie_t *r=trie_crear(); assert(trie_sugerir(r,"",0,NULL,0)==0); trie_destruir(r);
publicar: true
