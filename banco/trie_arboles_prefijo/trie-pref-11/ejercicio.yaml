id: trie-pref-11
titulo: Trie de Bits para Búsqueda de Prefijos IP y Máscaras de Subred
tema: trie_arboles_prefijo
bloom: 3
minutos_estimados: 15
pistas:
- Cada nodo tiene un arreglo de punteros indexados por caracteres.
- Marcá un flag booleano cuando un nodo represente el final de una palabra.
tags:
- trie
- prefijos
- arboles
- cadenas
- estructuras_datos
- dep:arboles_binarios
- dep:cadenas
- c11
- inicial
verificado: false
funciones:
- nombre: ip_trie_iniciar
  retorno: void
  parametros: ip_trie_t *trie
  descripcion: Inicializa el objeto de trie IPv4 vacío.
- nombre: ip_trie_insertar
  retorno: bool
  parametros: ip_trie_t *trie, uint32_t direccion, unsigned prefijo, int valor
  descripcion: Registra o reemplaza una ruta de prefijo 0 a 32.
- nombre: ip_trie_buscar
  retorno: bool
  parametros: const ip_trie_t *trie, uint32_t direccion, int *valor
  descripcion: Consulta la ruta coincidente más específica.
- nombre: ip_trie_destruir
  retorno: void
  parametros: ip_trie_t *trie
  descripcion: Libera todos los nodos y pone la raíz en NULL.
tests_funciones:
- nombre: test_11_1_caso_funcional
  funcion: ip_trie_insertar
  codigo: ip_trie_t t={0}; int v=0; assert(ip_trie_insertar(&t,0,0,7)&&ip_trie_insertar(&t,0x0a000000u,8,9)); assert(ip_trie_buscar(&t,0x0a010203u,&v)&&v==9);
    assert(ip_trie_buscar(&t,0x08080808u,&v)&&v==7); ip_trie_destruir(&t);
- nombre: test_11_2_caso_funcional
  funcion: ip_trie_insertar
  codigo: ip_trie_t t={0}; assert(!ip_trie_insertar(&t,0,33,1)&&!ip_trie_buscar(&t,0,NULL)); ip_trie_destruir(&t);
publicar: true
unidad: 4
modulo: Tipos Abstractos y Algorítmica
dificultad: inicial
tipo: practica_guiada
prerrequisitos:
