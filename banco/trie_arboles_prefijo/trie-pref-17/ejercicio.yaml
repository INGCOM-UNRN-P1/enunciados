id: trie-pref-17
titulo: Trie con Arreglos Dinámicos de Hijos para Alfabetos Grandes
tema: trie_arboles_prefijo
bloom: 3
minutos_estimados: 25
pistas:
- Cada nodo tiene un arreglo de punteros indexados por caracteres.
- Marcá un flag booleano cuando un nodo represente el final de una palabra.
tags:
- trie
- prefijos
- arboles
- cadenas
- estructuras_datos
- dep:arboles_binarios
- dep:cadenas
- c11
- intermedia
verificado: false
funciones:
- nombre: trie_dinamico_iniciar
  retorno: void
  parametros: trie_nodo_t *trie
  descripcion: Inicializa un objeto de raíz proporcionado por el llamador.
- nombre: trie_dinamico_insertar
  retorno: bool
  parametros: trie_nodo_t *trie, const char *palabra
  descripcion: Inserta bytes en un vector dinámico de hijos ordenado.
- nombre: trie_dinamico_buscar
  retorno: bool
  parametros: const trie_nodo_t *trie, const char *palabra
  descripcion: Busca una palabra exacta.
- nombre: trie_dinamico_destruir
  retorno: void
  parametros: trie_nodo_t *trie
  descripcion: Libera hijos y buffers; el objeto raíz queda reiniciado.
tests_funciones:
- nombre: test_17_1_caso_funcional
  funcion: trie_dinamico_insertar
  codigo: trie_nodo_t t={0}; assert(trie_dinamico_insertar(&t,"zorro")&&trie_dinamico_insertar(&t,"casa")&&trie_dinamico_insertar(&t,"Ω"));
    assert(trie_dinamico_buscar(&t,"zorro")&&!trie_dinamico_buscar(&t,"zor")); trie_dinamico_destruir(&t); assert(t.cantidad==0&&t.hijos==NULL);
- nombre: test_17_2_caso_funcional
  funcion: trie_dinamico_insertar
  codigo: trie_nodo_t t={0}; assert(!trie_dinamico_insertar(&t,NULL)&&!trie_dinamico_buscar(&t,"")); trie_dinamico_destruir(&t);
publicar: true
