id: trie-pref-02
titulo: Inserción y búsqueda exacta alfanumérica
tema: trie_arboles_prefijo
bloom: 1
minutos_estimados: 10
pistas:
- Cada nodo tiene un arreglo de punteros indexados por caracteres.
- Marcá un flag booleano cuando un nodo represente el final de una palabra.
tags:
- trie
- prefijos
- arboles
- cadenas
- estructuras_datos
- dep:arboles_binarios
- dep:cadenas
- c11
- inicial
verificado: true
funciones:
- nombre: trie02_insertar
  retorno: void
  parametros: trie02_nodo_t *raiz, const char *palabra
- nombre: trie02_contiene
  retorno: int
  parametros: const trie02_nodo_t *raiz, const char *palabra
- nombre: trie02_liberar
  retorno: void
  parametros: trie02_nodo_t *raiz
tests_funciones:
- nombre: inserta_palabra_y_no_confunde_prefijo
  funcion: trie02_insertar
  codigo: trie02_nodo_t r={0}; trie02_insertar(&r,"Casa9"); assert(trie02_contiene(&r,"Casa9")==1); assert(trie02_contiene(&r,"Casa")==0);
    for(size_t i=0;i<TRIE02_ALFABETO;i++) trie02_liberar(r.hijos[i]);
- nombre: prefijo_corto_no_es_palabra
  funcion: trie02_contiene
  codigo: trie02_nodo_t r={0}; trie02_insertar(&r,"arbol"); assert(trie02_contiene(&r,"arbol")==1); assert(trie02_contiene(&r,"arbo")==0);
    assert(trie02_contiene(&r,"arboles")==0); for(size_t i=0;i<TRIE02_ALFABETO;i++) trie02_liberar(r.hijos[i]);
- nombre: dos_palabras_comparten_rama
  funcion: trie02_insertar
  codigo: trie02_nodo_t r={0}; trie02_insertar(&r,"red1"); trie02_insertar(&r,"red2"); assert(trie02_contiene(&r,"red1")==1&&trie02_contiene(&r,"red2")==1&&trie02_contiene(&r,"red")==0);
    for(size_t i=0;i<TRIE02_ALFABETO;i++) trie02_liberar(r.hijos[i]);
- nombre: nulos_vacio_y_caracter_invalido
  funcion: trie02_contiene
  codigo: trie02_nodo_t r={0}; assert(trie02_contiene(NULL,"x")==0); assert(trie02_contiene(&r,"")==0); trie02_insertar(&r,"a-b");
    assert(trie02_contiene(&r,"ab")==0); for(size_t i=0;i<TRIE02_ALFABETO;i++) trie02_liberar(r.hijos[i]);
publicar: true
unidad: 4
modulo: Tipos Abstractos y Algorítmica
dificultad: inicial
tipo: practica_guiada
prerrequisitos:
- arboles_binarios
- cadenas
subtema: trie_arboles_prefijo
