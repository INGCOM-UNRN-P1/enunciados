funciones:
- nombre: trie_es_integra
  retorno: bool
  parametros: const nodo_trie_t *raiz
  descripcion: Valida capacidad, buffer, punteros e índices de hijos ordenados.
tests_funciones:
- nombre: estructura_valida_e_invalidas
  funcion: trie_es_integra
  codigo: nodo_trie_t *r=tp_nuevo();assert(trie_es_integra(r));tp_insertar(r,"casa");tp_insertar(r,"dado");assert(trie_es_integra(r));r->hijos[1].byte='a';assert(!trie_es_integra(r));tp_destruir(r);nodo_trie_t
    x={0,1,0,NULL};assert(!trie_es_integra(&x));
- nombre: rechazo_de_alias_entre_ramas
  funcion: trie_es_integra
  codigo: nodo_trie_t *r=tp_nuevo();tp_insertar(r,"casa");tp_insertar(r,"dado");nodo_trie_t *orig=r->hijos[1].nodo->hijos[0].nodo;r->hijos[1].nodo->hijos[0].nodo=r->hijos[0].nodo->hijos[0].nodo;assert(!trie_es_integra(r));r->hijos[1].nodo->hijos[0].nodo=orig;tp_destruir(r);
