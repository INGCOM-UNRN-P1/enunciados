id: trie-pref-09
titulo: Trie Ternario de Búsqueda TST Ternary Search Tree
tema: trie_arboles_prefijo
bloom: 3
minutos_estimados: 15
pistas:
- Cada nodo tiene un arreglo de punteros indexados por caracteres.
- Marcá un flag booleano cuando un nodo represente el final de una palabra.
tags:
- trie
- prefijos
- arboles
- cadenas
- estructuras_datos
- dep:arboles_binarios
- dep:cadenas
- c11
- inicial
verificado: false
funciones:
- nombre: tst_insertar
  retorno: bool
  parametros: tst_nodo_t **raiz, const char *palabra
  descripcion: Inserta una palabra en el árbol ternario.
- nombre: tst_buscar
  retorno: bool
  parametros: const tst_nodo_t *raiz, const char *palabra
  descripcion: Busca una palabra completa.
- nombre: tst_destruir
  retorno: void
  parametros: tst_nodo_t *raiz
  descripcion: Libera los enlaces menor, igual y mayor.
tests_funciones:
- nombre: test_09_1_caso_funcional
  funcion: tst_insertar
  codigo: tst_nodo_t *r=NULL; assert(tst_insertar(&r,"sol")&&tst_insertar(&r,"son")); assert(tst_buscar(r,"sol")&&tst_buscar(r,"son")&&!tst_buscar(r,"so"));
    tst_destruir(r);
- nombre: test_09_2_caso_funcional
  funcion: tst_insertar
  codigo: assert(!tst_insertar(NULL,"x")&&!tst_buscar(NULL,"x")); tst_destruir(NULL);
publicar: true
