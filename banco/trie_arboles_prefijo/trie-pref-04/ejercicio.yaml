id: trie-pref-04
titulo: Eliminación de Palabras y Poda de Nodos Huérfanos en Trie
tema: trie_arboles_prefijo
bloom: 1
minutos_estimados: 10
pistas:
- Cada nodo tiene un arreglo de punteros indexados por caracteres.
- Marcá un flag booleano cuando un nodo represente el final de una palabra.
tags:
- trie
- prefijos
- arboles
- cadenas
- estructuras_datos
- dep:arboles_binarios
- dep:cadenas
- c11
- inicial
verificado: false
funciones:
- nombre: trie_insertar
  retorno: bool
  parametros: nodo_trie_t *raiz, const char *palabra
  descripcion: Inserta una palabra no vacía.
- nombre: trie_buscar
  retorno: bool
  parametros: const nodo_trie_t *raiz, const char *palabra
  descripcion: Busca una palabra exacta.
- nombre: trie_eliminar
  retorno: bool
  parametros: nodo_trie_t *raiz, const char *palabra
  descripcion: Elimina la palabra y poda nodos que quedaron sin hijos ni marca terminal.
- nombre: trie_destruir
  retorno: void
  parametros: nodo_trie_t *raiz
  descripcion: Libera nodos y buffers hijos sin liberar el objeto raíz del llamador.
tests_funciones:
- nombre: test_04_1_caso_funcional
  funcion: trie_insertar
  codigo: nodo_trie_t r={0}; assert(trie_insertar(&r,"car")&&trie_insertar(&r,"carta")); assert(trie_buscar(&r,"car")&&trie_eliminar(&r,"car"));
    assert(!trie_buscar(&r,"car")&&trie_buscar(&r,"carta")); trie_destruir(&r);
- nombre: test_04_2_caso_funcional
  funcion: trie_insertar
  codigo: nodo_trie_t r={0}; assert(!trie_insertar(&r,"")&&!trie_eliminar(&r,"x")); trie_destruir(NULL); trie_destruir(&r);
publicar: true
unidad: 4
modulo: Tipos Abstractos y Algorítmica
dificultad: inicial
tipo: practica_guiada
prerrequisitos:
- arboles_binarios
- cadenas
subtema: trie_arboles_prefijo
