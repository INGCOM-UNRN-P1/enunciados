id: trie-pref-20
titulo: Carga Rápida de Trie desde Archivo de Diccionario
tema: trie_arboles_prefijo
bloom: 4
minutos_estimados: 25
pistas:
- Cada nodo tiene un arreglo de punteros indexados por caracteres.
- Marcá un flag booleano cuando un nodo represente el final de una palabra.
tags:
- trie
- prefijos
- arboles
- cadenas
- estructuras_datos
- dep:arboles_binarios
- dep:cadenas
- c11
- intermedia
verificado: false
funciones:
- nombre: trie_cargar_diccionario
  retorno: nodo_trie_t *
  parametros: FILE *archivo
  descripcion: Carga líneas de hasta 255 bytes desde el stream.
- nombre: trie_buscar
  retorno: bool
  parametros: const nodo_trie_t *raiz, const char *palabra
  descripcion: Busca palabra completa.
- nombre: trie_destruir
  retorno: void
  parametros: nodo_trie_t *raiz
  descripcion: Libera la raíz y el diccionario cargado.
tests_funciones:
- nombre: carga_archivo_lf_crlf_y_vacias
  funcion: trie_cargar_diccionario
  codigo: FILE *f=tmpfile(); assert(f); fputs("casa\ncasco\r\n\n",f); rewind(f); nodo_trie_t *r=trie_cargar_diccionario(f);
    assert(r&&trie_buscar(r,"casa")&&trie_buscar(r,"casco")&&!trie_buscar(r,"cas")); trie_destruir(r); fclose(f);
- nombre: limite_exactamente_255_y_rechazo_256_con_y_sin_lf
  funcion: trie_cargar_diccionario
  codigo: for(size_t len=255;len<=256;len++){for(int newline=0;newline<=1;newline++){FILE *f=tmpfile();assert(f);for(size_t
    i=0;i<len;i++)assert(fputc('x',f)=='x');if(newline)assert(fputc('\n',f)=='\n');rewind(f);nodo_trie_t *r=trie_cargar_diccionario(f);assert((len==255)==(r!=NULL));trie_destruir(r);fclose(f);}}
    assert(!trie_cargar_diccionario(NULL));
publicar: true
unidad: 4
modulo: Tipos Abstractos y Algorítmica
