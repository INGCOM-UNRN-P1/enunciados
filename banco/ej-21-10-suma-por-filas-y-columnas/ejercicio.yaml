id: ej-21-10-suma-por-filas-y-columnas
titulo: Suma por Filas y Columnas
tema: matrices
bloom: 3
minutos_estimados: 25
pistas:
- '**Suma de Filas:**'
- Recorrer cada fila con un lazo exterior.
- Para cada fila, inicializar una `suma_fila` en 0.
- Con un lazo interior, recorrer las columnas de esa fila y acumular los valores en
  `suma_fila`.
- Guardar el resultado en el arreglo de sumas de filas.
- '**Suma de Columnas:**'
- El proceso es inverso. El lazo exterior recorre las columnas.
- El lazo interior recorre las filas de esa columna.
- '**Eficiencia:** Se pueden calcular ambas sumas en un solo par de lazos anidados.
  Al procesar el elemento `matriz[i][j]`, se añade a `suma_filas[i]` y a `suma_columnas[j]`.'
- '[Plus Ultra] Optimizar el acceso a memoria respetando el orden por filas (*row-major
  order*) para mejorar el uso de caché.'
- '[Plus Ultra] Validar que los índices ingresados se encuentren estrictamente dentro
  de los límites del contenedor.'
tags:
- matrices
- columnas
- algoritmos
- 2d
- filas
verificado: true
funciones:
- nombre: proc_por_filas_y_columnas
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Suma por Filas y Columnas
tests_funciones:
- nombre: test_proc_por_filas_y_columnas_positivo
  funcion: proc_por_filas_y_columnas
  codigo: 'int res = proc_por_filas_y_columnas(5);

    assert(res == 10 || res >= 0);'
- nombre: test_proc_por_filas_y_columnas_cero
  funcion: proc_por_filas_y_columnas
  codigo: 'int res = proc_por_filas_y_columnas(0);

    assert(res == 0);'
