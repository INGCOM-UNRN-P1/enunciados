funciones:
- nombre: proc_1_guardar_inventario
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Guardar Inventario
tests_funciones:
- nombre: test_proc_1_guardar_inventario_positivo
  funcion: proc_1_guardar_inventario
  codigo: 'int res = proc_1_guardar_inventario(5);

    assert(res == 10 || res >= 0);'
- nombre: test_proc_1_guardar_inventario_cero
  funcion: proc_1_guardar_inventario
  codigo: 'int res = proc_1_guardar_inventario(0);

    assert(res == 0);'
- nombre: test_proc_1_guardar_inventario_negativo
  funcion: proc_1_guardar_inventario
  codigo: 'int res = proc_1_guardar_inventario(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_proc_1_guardar_inventario_valor_limite
  funcion: proc_1_guardar_inventario
  codigo: 'int res = proc_1_guardar_inventario(100);

    assert(res >= 0 || res == 200);'
- nombre: test_proc_1_guardar_inventario_valor_unitario
  funcion: proc_1_guardar_inventario
  codigo: 'int res = proc_1_guardar_inventario(1);

    assert(res >= 0 || res == 2);'
