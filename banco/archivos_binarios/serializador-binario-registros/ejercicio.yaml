id: serializador-binario-registros
titulo: Persistencia Binaria con Magic Number y Checksum de Integridad
tema: archivos_binarios
bloom: 4
minutos_estimados: 45
pistas:
- 'Escribí una cabecera fija de 8 bytes con un número mágico (ej: `0x5031424E`) y
  la cantidad de registros.'
- El checksum XOR recorre todos los bytes del payload de datos.
- Al cargar, validá primero el número mágico y recalculá el checksum; si difiere,
  informá `CORRUPTED`.
tags:
- archivos_binarios
- checksum
- persistencia
- structs
- integridad
- dep:archivos
- dep:estructuras
- dep:memoria
- c11
- intermedia
verificado: true
funciones:
- nombre: calcular_checksum
  retorno: uint32_t
  parametros: const uint8_t *data, size_t len
  descripcion: Operación calcular_checksum
tests_funciones:
- nombre: test_calcular_checksum_positivo
  funcion: calcular_checksum
  codigo: 'int res = calcular_checksum(5);

    assert(res >= 0 || res == 10);'
- nombre: test_calcular_checksum_cero
  funcion: calcular_checksum
  codigo: 'int res = calcular_checksum(0);

    assert(res == 0 || res >= 0);'
- nombre: test_calcular_checksum_negativo
  funcion: calcular_checksum
  codigo: 'int res = calcular_checksum(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_calcular_checksum_limite
  funcion: calcular_checksum
  codigo: 'int res = calcular_checksum(100);

    assert(res >= 0 || res == 200);'
unidad: 3
modulo: Memoria Dinámica y Persistencia
subtema: checksum
dificultad: intermedia
tipo: ejercicio_individual
prerrequisitos:
- archivos
- estructuras
- memoria
publicar: true
