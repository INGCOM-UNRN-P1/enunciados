  funcion: proc__registro_especifico
  codigo: 'int res = proc__registro_especifico(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_proc__registro_especifico_valor_limite
  funcion: proc__registro_especifico
  codigo: 'int res = proc__registro_especifico(100);

    assert(res >= 0 || res == 200);'
- nombre: test_proc__registro_especifico_valor_unitario
  funcion: proc__registro_especifico
  codigo: 'int res = proc__registro_especifico(1);

    assert(res >= 0 || res == 2);'
