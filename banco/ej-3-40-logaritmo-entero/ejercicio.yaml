pistas:
- '**Proceso:** Se puede resolver con divisiones sucesivas.'
- Inicializar `k = 0`.
- Mientras `n >= b`, dividir `n` por `b` e incrementar `k`.
- El valor final de `k` es el resultado. definición interna oculta en el archivo `.c`.
  para copiar la estructura de forma segura.
- '[Plus Ultra] Validar que el argumento sea estrictamente positivo y la base mayor
  que 1.'
- '[Plus Ultra] Calcular el logaritmo entero mediante divisiones sucesivas en un lazo.'
