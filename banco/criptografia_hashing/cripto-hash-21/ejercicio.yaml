    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_cripto_hash_21_valor_limite
  funcion: ejecutar_cripto_hash_21
  codigo: 'int res = ejecutar_cripto_hash_21(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_cripto_hash_21_valor_unitario
  funcion: ejecutar_cripto_hash_21
  codigo: 'int res = ejecutar_cripto_hash_21(1);

