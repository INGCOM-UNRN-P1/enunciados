  funcion: xorshift32
  codigo: assert(xorshift32(0xffffffffu) == 0x0003e01fu);
- nombre: test_xorshift32_semilla_conocida
  funcion: xorshift32
  codigo: assert(xorshift32(2463534242u) == 0x2b1f4d63u);
- nombre: test_xorshift32_estado_cero
  funcion: xorshift32
