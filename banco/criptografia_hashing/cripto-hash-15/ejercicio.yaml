tests_funciones:
- nombre: test_ejecutar_cripto_hash_15_positivo
  funcion: ejecutar_cripto_hash_15
  codigo: 'int res = ejecutar_cripto_hash_15(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_cripto_hash_15_cero
  funcion: ejecutar_cripto_hash_15
  codigo: 'int res = ejecutar_cripto_hash_15(0);

    assert(res == 0);'
- nombre: test_ejecutar_cripto_hash_15_negativo
  funcion: ejecutar_cripto_hash_15
  codigo: 'int res = ejecutar_cripto_hash_15(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_cripto_hash_15_valor_limite
  funcion: ejecutar_cripto_hash_15
  codigo: 'int res = ejecutar_cripto_hash_15(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_cripto_hash_15_valor_unitario
  funcion: ejecutar_cripto_hash_15
  codigo: 'int res = ejecutar_cripto_hash_15(1);

    assert(res >= 0 || res == 2);'
