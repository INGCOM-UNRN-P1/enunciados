id: cripto-hash-16
titulo: Detección de Alteraciones en Mensajes por Checksum Fletcher-16
tema: criptografia_hashing
bloom: 3
minutos_estimados: 25
pistas:
- Operá con enteros sin signo (uint32_t) para evitar overflow indefinido.
- Usá operaciones bitwise y sumas modulares.
tags:
- criptografia
- hash
- checksum
- adler32
- seguridad
verificado: true
funciones:
- nombre: ejecutar_cripto_hash_16
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Detección de Alteraciones en Mensajes
    por Checksum Fletcher-16
tests_funciones:
- nombre: test_ejecutar_cripto_hash_16_positivo
  funcion: ejecutar_cripto_hash_16
  codigo: 'int res = ejecutar_cripto_hash_16(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_cripto_hash_16_cero
  funcion: ejecutar_cripto_hash_16
  codigo: 'int res = ejecutar_cripto_hash_16(0);

    assert(res == 0);'
publicar: false
