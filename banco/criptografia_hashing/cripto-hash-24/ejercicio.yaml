tests_funciones:
- nombre: test_ejecutar_cripto_hash_24_positivo
  funcion: ejecutar_cripto_hash_24
  codigo: 'int res = ejecutar_cripto_hash_24(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_cripto_hash_24_cero
  funcion: ejecutar_cripto_hash_24
  codigo: 'int res = ejecutar_cripto_hash_24(0);

    assert(res == 0);'
- nombre: test_ejecutar_cripto_hash_24_negativo
  funcion: ejecutar_cripto_hash_24
  codigo: 'int res = ejecutar_cripto_hash_24(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_cripto_hash_24_valor_limite
  funcion: ejecutar_cripto_hash_24
  codigo: 'int res = ejecutar_cripto_hash_24(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_cripto_hash_24_valor_unitario
  funcion: ejecutar_cripto_hash_24
  codigo: 'int res = ejecutar_cripto_hash_24(1);

    assert(res >= 0 || res == 2);'
