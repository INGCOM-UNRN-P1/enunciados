id: cripto-hash-02
titulo: Cálculo de Suma de Verificación CRC-32
tema: criptografia_hashing
bloom: 1
minutos_estimados: 10
pistas:
- Procesá cada byte de menor a mayor orden de bit.
- Usá el polinomio reflejado 0xEDB88320 y operaciones con uint32_t.
tags:
- criptografia
- hash
- checksum
- crc32
- seguridad
- dep:operaciones_bits
- dep:cadenas
- c11
- inicial
verificado: false
funciones:
- nombre: crc32_ieee
  retorno: uint32_t
  parametros: const unsigned char *datos, size_t longitud
  descripcion: Calcula CRC-32/ISO-HDLC de una secuencia de bytes.
tests_funciones:
- nombre: test_crc32_vacio
  funcion: crc32_ieee
  codigo: assert(crc32_ieee(NULL, 0) == 0x00000000u);
- nombre: test_crc32_vector_conocido
  funcion: crc32_ieee
  codigo: const unsigned char datos[] = "123456789"; assert(crc32_ieee(datos, 9) ==
    0xcbf43926u);
- nombre: test_crc32_texto
  funcion: crc32_ieee
  codigo: const unsigned char datos[] = "Wikipedia"; assert(crc32_ieee(datos, 9) ==
    0xadaac02eu);
- nombre: test_crc32_bytes_binarios
  funcion: crc32_ieee
  codigo: const unsigned char datos[] = {0x00, 0x80, 0xff}; assert(crc32_ieee(datos,
    3) == 0xe9c0aed4u);
- nombre: test_crc32_longitud
  funcion: crc32_ieee
  codigo: const unsigned char datos[] = "123456789resto"; assert(crc32_ieee(datos,
    9) == 0xcbf43926u);
publicar: true
unidad: 5
modulo: Ingeniería de Software y Calidad en C
dificultad: inicial
tipo: practica_guiada
prerrequisitos:
- operaciones_bits
- cadenas
subtema: criptografia_hashing
