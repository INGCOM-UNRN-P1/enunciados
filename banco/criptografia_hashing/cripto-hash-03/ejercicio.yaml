id: cripto-hash-03
titulo: Función Hash FNV-1a para Cadenas de Texto
tema: criptografia_hashing
bloom: 1
minutos_estimados: 10
pistas:
- Procesá cada byte como unsigned char.
- Aplicá XOR antes de multiplicar y conservá los 32 bits inferiores.
tags:
- criptografia
- hash
- checksum
- fnv1a
- seguridad
- dep:operaciones_bits
- dep:cadenas
- c11
- inicial
verificado: false
funciones:
- nombre: fnv1a_32
  retorno: uint32_t
  parametros: const char *texto
  descripcion: Calcula FNV-1a de 32 bits sobre una cadena.
tests_funciones:
- nombre: test_fnv1a_vacio
  funcion: fnv1a_32
  codigo: assert(fnv1a_32("") == 0x811c9dc5u);
- nombre: test_fnv1a_una_letra
  funcion: fnv1a_32
  codigo: assert(fnv1a_32("a") == 0xe40c292cu);
- nombre: test_fnv1a_foobar
  funcion: fnv1a_32
  codigo: assert(fnv1a_32("foobar") == 0xbf9cf968u);
- nombre: test_fnv1a_bytes_altos
  funcion: fnv1a_32
  codigo: assert(fnv1a_32("\x80\xff") == 0xd1390020u);
- nombre: test_fnv1a_nul
  funcion: fnv1a_32
  codigo: const char s[] = {'a', 0, 'b', 0}; assert(fnv1a_32(s) == 0xe40c292cu);
publicar: true
