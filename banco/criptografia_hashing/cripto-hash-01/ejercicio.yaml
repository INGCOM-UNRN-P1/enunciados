id: cripto-hash-01
titulo: Cálculo de Checksum Adler-32
tema: criptografia_hashing
bloom: 1
minutos_estimados: 10
pistas:
- Operá con enteros sin signo (uint32_t) para evitar overflow indefinido.
- Usá operaciones bitwise y sumas modulares.
tags:
- criptografia
- hash
- checksum
- adler32
- seguridad
- dep:operaciones_bits
- dep:cadenas
- c11
- inicial
verificado: true
funciones:
- nombre: adler32
  retorno: uint32_t
  parametros: const char *texto
  descripcion: Calcula Adler-32 sobre los bytes de una cadena terminada en NUL.
tests_funciones:
- nombre: test_adler32_vacio
  funcion: adler32
  codigo: assert(adler32("") == 0x00000001u);
- nombre: test_adler32_palabra
  funcion: adler32
  codigo: assert(adler32("Wikipedia") == 0x11e60398u);
- nombre: test_adler32_bytes_altos
  funcion: adler32
  codigo: assert(adler32("\x80\xff") == 0x02010180u);
- nombre: test_adler32_modulo
  funcion: adler32
  codigo: char texto[1001]; for (int i = 0; i < 1000; i++) texto[i] = 'a'; texto[1000]
    = '\0'; assert(adler32(texto) == 0xf9d87af8u);
publicar: true
unidad: 5
modulo: Ingeniería de Software y Calidad en C
dificultad: inicial
tipo: practica_guiada
prerrequisitos:
- operaciones_bits
- cadenas
subtema: criptografia_hashing
