id: lista-enl-07
titulo: Conteo de Nodos y Cálculo de Longitud de Lista Enlazada
tema: listas_enlazadas
bloom: 2
minutos_estimados: 15
pistas:
- Verificá siempre el caso base de lista vacía (cabeza == NULL).
- Liberá cada nodo con free() al terminar.
tags:
- listas
- listas_enlazadas
- punteros
- nodos
- estructuras_datos
- c11
- inicial
