tests_funciones:
- nombre: test_ejecutar_lista_enl_28_positivo
  funcion: ejecutar_lista_enl_28
  codigo: 'int res = ejecutar_lista_enl_28(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_lista_enl_28_cero
  funcion: ejecutar_lista_enl_28
  codigo: 'int res = ejecutar_lista_enl_28(0);

