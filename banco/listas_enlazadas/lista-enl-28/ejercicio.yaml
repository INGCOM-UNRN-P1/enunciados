  funcion: ejecutar_lista_enl_28
  codigo: 'int res = ejecutar_lista_enl_28(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_lista_enl_28_valor_limite
  funcion: ejecutar_lista_enl_28
  codigo: 'int res = ejecutar_lista_enl_28(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_lista_enl_28_valor_unitario
  funcion: ejecutar_lista_enl_28
  codigo: 'int res = ejecutar_lista_enl_28(1);

    assert(res >= 0 || res == 2);'
