id: lista-enl-05
titulo: Búsqueda y Eliminación de Nodo por Valor en Lista Simple
tema: listas_enlazadas
bloom: 1
minutos_estimados: 10
pistas:
- Verificá siempre el caso base de lista vacía (cabeza == NULL).
- Liberá cada nodo con free() al terminar.
tags:
- listas
- listas_enlazadas
- punteros
- nodos
- estructuras_datos
- c11
- inicial
- dep:memoria_dinamica
- dep:punteros
verificado: true
funciones:
- nombre: ejecutar_lista_enl_05
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Búsqueda y Eliminación de Nodo por Valor
    en Lista Simple
tests_funciones:
- nombre: test_ejecutar_lista_enl_05_positivo
  funcion: ejecutar_lista_enl_05
  codigo: 'int res = ejecutar_lista_enl_05(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_lista_enl_05_cero
  funcion: ejecutar_lista_enl_05
  codigo: 'int res = ejecutar_lista_enl_05(0);

    assert(res == 0);'
- nombre: test_ejecutar_lista_enl_05_negativo
  funcion: ejecutar_lista_enl_05
  codigo: 'int res = ejecutar_lista_enl_05(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_lista_enl_05_valor_limite
  funcion: ejecutar_lista_enl_05
  codigo: 'int res = ejecutar_lista_enl_05(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_lista_enl_05_valor_unitario
  funcion: ejecutar_lista_enl_05
  codigo: 'int res = ejecutar_lista_enl_05(1);

    assert(res >= 0 || res == 2);'
publicar: true
