  funcion: ejecutar_lista_enl_17
  codigo: 'int res = ejecutar_lista_enl_17(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_lista_enl_17_valor_limite
  funcion: ejecutar_lista_enl_17
  codigo: 'int res = ejecutar_lista_enl_17(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_lista_enl_17_valor_unitario
  funcion: ejecutar_lista_enl_17
  codigo: 'int res = ejecutar_lista_enl_17(1);

    assert(res >= 0 || res == 2);'
