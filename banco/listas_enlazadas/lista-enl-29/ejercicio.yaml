tests_funciones:
- nombre: test_ejecutar_lista_enl_29_positivo
  funcion: ejecutar_lista_enl_29
  codigo: 'int res = ejecutar_lista_enl_29(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_lista_enl_29_cero
  funcion: ejecutar_lista_enl_29
  codigo: 'int res = ejecutar_lista_enl_29(0);

    assert(res == 0);'
- nombre: test_ejecutar_lista_enl_29_negativo
  funcion: ejecutar_lista_enl_29
  codigo: 'int res = ejecutar_lista_enl_29(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_lista_enl_29_valor_limite
  funcion: ejecutar_lista_enl_29
  codigo: 'int res = ejecutar_lista_enl_29(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_lista_enl_29_valor_unitario
  funcion: ejecutar_lista_enl_29
  codigo: 'int res = ejecutar_lista_enl_29(1);

    assert(res >= 0 || res == 2);'
