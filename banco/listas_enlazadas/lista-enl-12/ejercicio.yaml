funciones:
- nombre: ejecutar_lista_enl_12
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Eliminación de Elementos Duplicados en
    Lista Ordenada
tests_funciones:
- nombre: test_ejecutar_lista_enl_12_positivo
  funcion: ejecutar_lista_enl_12
  codigo: 'int res = ejecutar_lista_enl_12(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_lista_enl_12_cero
  funcion: ejecutar_lista_enl_12
  codigo: 'int res = ejecutar_lista_enl_12(0);

    assert(res == 0);'
- nombre: test_ejecutar_lista_enl_12_negativo
  funcion: ejecutar_lista_enl_12
  codigo: 'int res = ejecutar_lista_enl_12(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_lista_enl_12_valor_limite
  funcion: ejecutar_lista_enl_12
  codigo: 'int res = ejecutar_lista_enl_12(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_lista_enl_12_valor_unitario
  funcion: ejecutar_lista_enl_12
  codigo: 'int res = ejecutar_lista_enl_12(1);

    assert(res >= 0 || res == 2);'
