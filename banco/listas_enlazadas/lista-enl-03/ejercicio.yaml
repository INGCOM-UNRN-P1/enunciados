  funcion: ejecutar_lista_enl_03
  codigo: 'int res = ejecutar_lista_enl_03(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_lista_enl_03_valor_unitario
  funcion: ejecutar_lista_enl_03
  codigo: 'int res = ejecutar_lista_enl_03(1);

    assert(res >= 0 || res == 2);'
