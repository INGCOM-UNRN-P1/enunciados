id: tp3-seleccion-con-punteros
titulo: Ordenamiento por Selección con Aritmética de Punteros
tema: punteros
bloom: 4
minutos_estimados: 35
tags:
- tp3
- cursada-2026
- punteros
- dep:funciones
- dep:arreglos
- c11
- intermedia
verificado: true
tipo_entrega: makefile
familia: tp3-2026
rol_familia: uso
dependencias:
- tp3-libpunteros
unidad: 2
modulo: Tipos Compuestos y Direccionamiento
dificultad: intermedia
tipo: ejercicio_individual
prerrequisitos:
- funciones
- arreglos
subtema: con_punteros
publicar: true
funciones:
- nombre: buscar_puntero_minimo
  retorno: int *
  parametros: int *inicio, int *fin
  descripcion: Busca el puntero al elemento de menor valor en el rango [inicio, fin)
- nombre: ordenar_seleccion_punteros
  retorno: void
  parametros: int *arreglo, size_t cantidad
  descripcion: Ordena ascendentemente un arreglo con ordenamiento por selección y
    punteros
tests_funciones:
- nombre: test_buscar_puntero_minimo_valido
  funcion: buscar_puntero_minimo
  codigo: 'int a[] = {5, 2, 8, 1, 9};

    int *min = buscar_puntero_minimo(a, a + 5);

    assert(min == &a[3] && *min == 1);'
- nombre: test_buscar_puntero_minimo_un_elemento
  funcion: buscar_puntero_minimo
  codigo: 'int a[] = {42};

    int *min = buscar_puntero_minimo(a, a + 1);

    assert(min == &a[0]);'
- nombre: test_ordenar_seleccion_punteros_basico
  funcion: ordenar_seleccion_punteros
  codigo: 'int a[] = {4, 1, 3, 2};

    ordenar_seleccion_punteros(a, 4);

    assert(a[0] == 1 && a[1] == 2 && a[2] == 3 && a[3] == 4);'
- nombre: test_ordenar_seleccion_punteros_ya_ordenado
  funcion: ordenar_seleccion_punteros
  codigo: 'int a[] = {1, 2, 3};

    ordenar_seleccion_punteros(a, 3);

    assert(a[0] == 1 && a[2] == 3);'
