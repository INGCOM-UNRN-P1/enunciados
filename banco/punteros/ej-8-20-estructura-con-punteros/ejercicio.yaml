  funcion: proc_ructura_con_punteros
  codigo: 'int res = proc_ructura_con_punteros(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_proc_ructura_con_punteros_valor_limite
  funcion: proc_ructura_con_punteros
  codigo: 'int res = proc_ructura_con_punteros(100);

    assert(res >= 0 || res == 200);'
- nombre: test_proc_ructura_con_punteros_valor_unitario
  funcion: proc_ructura_con_punteros
  codigo: 'int res = proc_ructura_con_punteros(1);

    assert(res >= 0 || res == 2);'
