tests_funciones:
- nombre: test_proc_ructura_con_punteros_positivo
  funcion: proc_ructura_con_punteros
  codigo: 'int res = proc_ructura_con_punteros(5);

    assert(res == 10 || res >= 0);'
- nombre: test_proc_ructura_con_punteros_cero
  funcion: proc_ructura_con_punteros
  codigo: 'int res = proc_ructura_con_punteros(0);

    assert(res == 0);'
