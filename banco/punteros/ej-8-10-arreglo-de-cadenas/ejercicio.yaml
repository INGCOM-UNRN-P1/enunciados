id: ej-8-10-arreglo-de-cadenas
titulo: Arreglo de Cadenas
tema: punteros
bloom: 3
minutos_estimados: 25
pistas:
- '[Plus Ultra] Validar punteros `NULL` recibidos como parámetro para evitar fallos de segmentación.'
- '[Plus Ultra] Implementar una versión utilizando aritmética de punteros en lugar de indexación directa.'
tags:
- cadenas
- arreglo
- memoria
- punteros
- direcciones
- dep:funciones
- dep:arreglos
- c11
- intermedia
verificado: true
funciones:
- nombre: ordenar_cadenas
  retorno: void
  parametros: char **cadenas, int n
  descripcion: Ordena lexicográficamente las cadenas modificando el orden de sus punteros.
tests_funciones:
- nombre: test_ordenar_cadenas_desordenado
  funcion: ordenar_cadenas
  codigo: 'char *palabras[] = {"hola", "adios", "casa", "barco"};

    ordenar_cadenas(palabras, 4);

    assert(strcmp(palabras[0], "adios") == 0 && strcmp(palabras[1], "barco") == 0 && strcmp(palabras[2],
    "casa") == 0 && strcmp(palabras[3], "hola") == 0);'
- nombre: test_ordenar_cadenas_ya_ordenado
  funcion: ordenar_cadenas
  codigo: 'char *palabras[] = {"a", "b", "c"};

    ordenar_cadenas(palabras, 3);

    assert(strcmp(palabras[0], "a") == 0 && strcmp(palabras[1], "b") == 0 && strcmp(palabras[2], "c")
    == 0);'
- nombre: test_ordenar_cadenas_un_elemento
  funcion: ordenar_cadenas
  codigo: 'char *palabras[] = {"unica"};

    ordenar_cadenas(palabras, 1);

    assert(strcmp(palabras[0], "unica") == 0);'
unidad: 2
modulo: Tipos Compuestos y Direccionamiento
subtema: procesamiento_texto
dificultad: intermedia
tipo: practica_guiada
prerrequisitos:
- funciones
- arreglos
publicar: true
