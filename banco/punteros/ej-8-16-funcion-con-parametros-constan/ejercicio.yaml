tests_funciones:
- nombre: test_proc_n_parametros_constan_positivo
  funcion: proc_n_parametros_constan
  codigo: 'int res = proc_n_parametros_constan(5);

    assert(res == 10 || res >= 0);'
- nombre: test_proc_n_parametros_constan_cero
  funcion: proc_n_parametros_constan
  codigo: 'int res = proc_n_parametros_constan(0);

    assert(res == 0);'
- nombre: test_proc_n_parametros_constan_negativo
  funcion: proc_n_parametros_constan
  codigo: 'int res = proc_n_parametros_constan(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_proc_n_parametros_constan_valor_limite
  funcion: proc_n_parametros_constan
  codigo: 'int res = proc_n_parametros_constan(100);

    assert(res >= 0 || res == 200);'
- nombre: test_proc_n_parametros_constan_valor_unitario
  funcion: proc_n_parametros_constan
  codigo: 'int res = proc_n_parametros_constan(1);

    assert(res >= 0 || res == 2);'
