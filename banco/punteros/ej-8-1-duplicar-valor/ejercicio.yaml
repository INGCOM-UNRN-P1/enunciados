id: ej-8-1-duplicar-valor
titulo: Duplicar valor
tema: punteros
bloom: 3
minutos_estimados: 25
pistas:
- '[Plus Ultra] Validar estrictamente los datos de entrada para manejar valores fuera de rango o tipos
  inválidos.'
- '[Plus Ultra] Permitir el procesamiento interactivo continuo mediante un lazo hasta que el usuario elija
  finalizar.'
tags:
- duplicar
- memoria
- punteros
- valor
- direcciones
- dep:funciones
- dep:arreglos
- c11
- intermedia
verificado: true
funciones:
- nombre: duplicar
  retorno: void
  parametros: int *numero
  descripcion: Duplica el entero apuntado por numero.
tests_funciones:
- nombre: test_duplicar_positivo
  funcion: duplicar
  codigo: 'int valor = 5;

    duplicar(&valor);

    assert(valor == 10);'
- nombre: test_duplicar_cero
  funcion: duplicar
  codigo: 'int valor = 0;

    duplicar(&valor);

    assert(valor == 0);'
- nombre: test_duplicar_negativo
  funcion: duplicar
  codigo: 'int valor = -4;

    duplicar(&valor);

    assert(valor == -8);'
unidad: 2
modulo: Tipos Compuestos y Direccionamiento
subtema: duplicar
dificultad: intermedia
tipo: practica_guiada
prerrequisitos:
- funciones
- arreglos
publicar: true
