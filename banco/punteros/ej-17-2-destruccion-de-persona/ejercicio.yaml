tests_funciones:
- nombre: test_proc_struccion_de_persona_positivo
  funcion: proc_struccion_de_persona
  codigo: 'int res = proc_struccion_de_persona(5);

    assert(res == 10 || res >= 0);'
- nombre: test_proc_struccion_de_persona_cero
  funcion: proc_struccion_de_persona
  codigo: 'int res = proc_struccion_de_persona(0);

    assert(res == 0);'
- nombre: test_proc_struccion_de_persona_negativo
  funcion: proc_struccion_de_persona
  codigo: 'int res = proc_struccion_de_persona(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_proc_struccion_de_persona_valor_limite
  funcion: proc_struccion_de_persona
  codigo: 'int res = proc_struccion_de_persona(100);

    assert(res >= 0 || res == 200);'
- nombre: test_proc_struccion_de_persona_valor_unitario
  funcion: proc_struccion_de_persona
  codigo: 'int res = proc_struccion_de_persona(1);

    assert(res >= 0 || res == 2);'
