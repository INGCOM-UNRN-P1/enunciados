id: ej-8-4-largo-seguro-con-punteros
titulo: Largo seguro con punteros
tema: punteros
bloom: 3
minutos_estimados: 25
pistas:
- '[Plus Ultra] Validar punteros `NULL` recibidos como parámetro para evitar fallos de segmentación.'
- '[Plus Ultra] Implementar una versión utilizando aritmética de punteros en lugar de indexación directa.'
tags:
- memoria
- punteros
- seguro
- direcciones
- largo
- dep:funciones
- dep:arreglos
- c11
- intermedia
verificado: true
funciones:
- nombre: largo_seguro
  retorno: size_t
  parametros: const char *str, size_t capacidad
  descripcion: Cuenta los caracteres hasta NUL, limitado por capacidad.
tests_funciones:
- nombre: test_largo_seguro_terminador_antes_del_limite
  funcion: largo_seguro
  codigo: 'const char texto[] = "hola";

    assert(largo_seguro(texto, sizeof texto) == 4);'
- nombre: test_largo_seguro_sin_terminador_en_limite
  funcion: largo_seguro
  codigo: 'const char texto[] = {''a'', ''b'', ''c'', ''\0''};

    assert(largo_seguro(texto, 2) == 2);'
- nombre: test_largo_seguro_capacidad_cero
  funcion: largo_seguro
  codigo: 'const char texto[] = "hola";

    assert(largo_seguro(texto, 0) == 0);'
unidad: 2
modulo: Tipos Compuestos y Direccionamiento
subtema: memoria
dificultad: intermedia
tipo: practica_guiada
prerrequisitos:
- funciones
- arreglos
publicar: true
