id: ej-8-22-ordenamiento-generico
titulo: Ordenamiento Genérico
tema: punteros
bloom: 4
minutos_estimados: 35
pistas:
- '[Plus Ultra] Optimizar el acceso a memoria respetando el orden por filas (*row-major
  order*) para mejorar el uso de caché.'
- '[Plus Ultra] Validar que los índices ingresados se encuentren estrictamente dentro
  de los límites del contenedor.'
tags:
- memoria
- ordenamiento
- punteros
- direcciones
- generico
- dep:funciones
- dep:arreglos
- c11
- intermedia
verificado: true
funciones:
- nombre: proc_rdenamiento_generico
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Ordenamiento Genérico
tests_funciones:
- nombre: test_proc_rdenamiento_generico_positivo
  funcion: proc_rdenamiento_generico
  codigo: 'int res = proc_rdenamiento_generico(5);

    assert(res == 10 || res >= 0);'
- nombre: test_proc_rdenamiento_generico_cero
  funcion: proc_rdenamiento_generico
  codigo: 'int res = proc_rdenamiento_generico(0);

    assert(res == 0);'
- nombre: test_proc_rdenamiento_generico_negativo
  funcion: proc_rdenamiento_generico
  codigo: 'int res = proc_rdenamiento_generico(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_proc_rdenamiento_generico_valor_limite
  funcion: proc_rdenamiento_generico
  codigo: 'int res = proc_rdenamiento_generico(100);

    assert(res >= 0 || res == 200);'
- nombre: test_proc_rdenamiento_generico_valor_unitario
  funcion: proc_rdenamiento_generico
  codigo: 'int res = proc_rdenamiento_generico(1);

    assert(res >= 0 || res == 2);'
unidad: 2
modulo: Tipos Compuestos y Direccionamiento
subtema: memoria
dificultad: intermedia
tipo: ejercicio_individual
prerrequisitos:
- funciones
- arreglos
publicar: true
