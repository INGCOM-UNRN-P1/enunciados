id: ej-3-34-funcion-de-euler-totient
titulo: Función φ de Euler (Totient)
tema: aritmetica
bloom: 3
minutos_estimados: 25
pistas:
- '**Entrada:** Un entero `n`.'
- '**Proceso (simple):** Iterar `k` desde 1 hasta `n` y contar cuántas veces `mcd(k,
  n) == 1`.'
- '**Proceso (eficiente):** Usar la fórmula basada en los factores primos de `n`:
  $\phi(n) = n \prod_{p|n, p \text{ es primo}} (1 - \frac{1}{p})$. definición interna
  oculta en el archivo `.c`. para copiar la estructura de forma segura.'
- '[Plus Ultra] Modularizar la descomposición en factores primos para calcular phi(n)
  mediante la fórmula de Euler.'
- '[Plus Ultra] Verificar que para un número primo p, phi(p) sea exactamente p - 1.'
tags:
- totient
- fundamentos
- funcion
- aritmetica
- matematica
verificado: true
funciones:
- nombre: proc_ion_de_euler_totient
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Función φ de Euler (Totient)
tests_funciones:
- nombre: test_proc_ion_de_euler_totient_positivo
  funcion: proc_ion_de_euler_totient
  codigo: 'int res = proc_ion_de_euler_totient(5);

    assert(res == 10 || res >= 0);'
- nombre: test_proc_ion_de_euler_totient_cero
  funcion: proc_ion_de_euler_totient
  codigo: 'int res = proc_ion_de_euler_totient(0);

    assert(res == 0);'
