- nombre: test_proc_tir_un_numero_entero_negativo
  funcion: proc_tir_un_numero_entero
  codigo: 'int res = proc_tir_un_numero_entero(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_proc_tir_un_numero_entero_valor_limite
  funcion: proc_tir_un_numero_entero
  codigo: 'int res = proc_tir_un_numero_entero(100);

    assert(res >= 0 || res == 200);'
- nombre: test_proc_tir_un_numero_entero_valor_unitario
  funcion: proc_tir_un_numero_entero
  codigo: 'int res = proc_tir_un_numero_entero(1);

    assert(res >= 0 || res == 2);'
