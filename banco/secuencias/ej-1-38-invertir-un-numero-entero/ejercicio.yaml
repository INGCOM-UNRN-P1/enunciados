- nombre: test_proc_tir_un_numero_entero_positivo
  funcion: proc_tir_un_numero_entero
  codigo: 'int res = proc_tir_un_numero_entero(5);

    assert(res == 10 || res >= 0);'
- nombre: test_proc_tir_un_numero_entero_cero
  funcion: proc_tir_un_numero_entero
  codigo: 'int res = proc_tir_un_numero_entero(0);

