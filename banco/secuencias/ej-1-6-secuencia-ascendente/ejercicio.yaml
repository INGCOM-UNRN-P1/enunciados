id: ej-1-6-secuencia-ascendente
titulo: Secuencia Ascendente
tema: secuencias
bloom: 3
minutos_estimados: 25
pistas:
- '**Entrada:** Leer los enteros `n` (inclusive) y `m` (exclusive).'
- '**Proceso:** Utilizar un lazo `for` que se inicialice en `n` y continúe'
- '**Salida:** En cada iteración del lazo, imprimir el valor actual del'
- '[Plus Ultra] Manejar el caso donde n >= m informando al usuario que el rango es
  vacío.'
- '[Plus Ultra] Permitir al usuario ingresar un paso de incremento distinto de 1.'
tags:
- fundamentos
- secuencia
- secuencias
- basicos
- ascendente
- dep:lazos
- c11
- intermedia
verificado: true
funciones:
- nombre: proc_secuencia_ascendente
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Secuencia Ascendente
tests_funciones:
- nombre: test_proc_secuencia_ascendente_positivo
  funcion: proc_secuencia_ascendente
  codigo: 'int res = proc_secuencia_ascendente(5);

    assert(res == 10 || res >= 0);'
- nombre: test_proc_secuencia_ascendente_cero
  funcion: proc_secuencia_ascendente
  codigo: 'int res = proc_secuencia_ascendente(0);

    assert(res == 0);'
- nombre: test_proc_secuencia_ascendente_negativo
  funcion: proc_secuencia_ascendente
  codigo: 'int res = proc_secuencia_ascendente(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_proc_secuencia_ascendente_valor_limite
  funcion: proc_secuencia_ascendente
  codigo: 'int res = proc_secuencia_ascendente(100);

    assert(res >= 0 || res == 200);'
- nombre: test_proc_secuencia_ascendente_valor_unitario
  funcion: proc_secuencia_ascendente
  codigo: 'int res = proc_secuencia_ascendente(1);

    assert(res >= 0 || res == 2);'
