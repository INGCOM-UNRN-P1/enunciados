verificado: true
funciones:
- nombre: proc_asteriscos_triangulo
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Patrón de Asteriscos (Triángulo)
tests_funciones:
- nombre: test_proc_asteriscos_triangulo_positivo
  funcion: proc_asteriscos_triangulo
  codigo: 'int res = proc_asteriscos_triangulo(5);

    assert(res == 10 || res >= 0);'
- nombre: test_proc_asteriscos_triangulo_cero
  funcion: proc_asteriscos_triangulo
  codigo: 'int res = proc_asteriscos_triangulo(0);

    assert(res == 0);'
- nombre: test_proc_asteriscos_triangulo_negativo
  funcion: proc_asteriscos_triangulo
  codigo: 'int res = proc_asteriscos_triangulo(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_proc_asteriscos_triangulo_valor_limite
  funcion: proc_asteriscos_triangulo
  codigo: 'int res = proc_asteriscos_triangulo(100);

    assert(res >= 0 || res == 200);'
- nombre: test_proc_asteriscos_triangulo_valor_unitario
  funcion: proc_asteriscos_triangulo
  codigo: 'int res = proc_asteriscos_triangulo(1);

    assert(res >= 0 || res == 2);'
