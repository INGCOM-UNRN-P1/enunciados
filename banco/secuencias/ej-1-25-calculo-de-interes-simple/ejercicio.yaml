id: ej-1-25-calculo-de-interes-simple
titulo: Cálculo de Interés Simple
tema: secuencias
bloom: 3
minutos_estimados: 25
pistas:
- Convertí la tasa porcentual a decimal dividiéndola por 100.
- El interés simple se calcula sobre el capital inicial.
tags:
- fundamentos
- calculo
- interes
- secuencias
- basicos
- dep:lazos
- c11
- intermedia
verificado: true
funciones:
- nombre: interes_simple
  retorno: int
  parametros: double capital, double tasa_anual, double anios, double *interes, double
    *monto
  descripcion: Calcula el interés simple y el monto final.
tests_funciones:
- nombre: test_interes_normal
  funcion: interes_simple
  codigo: double interes = 0, monto = 0; assert(interes_simple(1000, 5, 2, &interes,
    &monto) == 0); assert(interes == 100 && monto == 1100);
- nombre: test_interes_cero
  funcion: interes_simple
  codigo: double interes = 7, monto = 0; assert(interes_simple(1000, 0, 2, &interes,
    &monto) == 0); assert(interes == 0 && monto == 1000);
- nombre: test_interes_fraccion
  funcion: interes_simple
  codigo: double interes = 0, monto = 0; assert(interes_simple(200, 10, 0.5, &interes,
    &monto) == 0); assert(interes == 10 && monto == 210);
- nombre: test_interes_invalido
  funcion: interes_simple
  codigo: double interes = 7, monto = 8; assert(interes_simple(-1, 5, 2, &interes,
    &monto) == -1); assert(interes == 7 && monto == 8); assert(interes_simple(1, -1,
    2, &interes, &monto) == -1); assert(interes_simple(1, 1, -1, &interes, &monto)
    == -1); assert(interes_simple(1, 1, 1, 0, &monto) == -1); assert(interes_simple(1,
    1, 1, &interes, 0) == -1);
- nombre: test_interes_salida_compartida
  funcion: interes_simple
  codigo: double salida = 7; assert(interes_simple(10, 5, 2, &salida, &salida) ==
    -1); assert(salida == 7);
- nombre: test_interes_desborde
  funcion: interes_simple
  codigo: double interes = 7, monto = 8; assert(interes_simple(1e308, 100, 10, &interes,
    &monto) == -1); assert(interes == 7 && monto == 8);
unidad: 1
modulo: Fundamentos y Estructuras de Control
subtema: fundamentos
dificultad: intermedia
tipo: practica_guiada
prerrequisitos:
- lazos
publicar: true
