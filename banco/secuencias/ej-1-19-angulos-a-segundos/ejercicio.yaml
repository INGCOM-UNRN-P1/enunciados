id: ej-1-19-angulos-a-segundos
titulo: Ángulos a Segundos
tema: secuencias
bloom: 3
minutos_estimados: 25
pistas:
- Un grado equivale a 60 minutos y un minuto equivale a 60 segundos.
- Sumá el aporte de cada componente usando un tipo entero suficientemente amplio.
tags:
- fundamentos
- angulos
- secuencias
- basicos
- segundos
- dep:lazos
- c11
- intermedia
verificado: true
funciones:
- nombre: angulo_a_segundos
  retorno: long long
  parametros: int grados, int minutos, int segundos
  descripcion: Convierte los componentes de un ángulo a segundos.
tests_funciones:
- nombre: test_cero
  funcion: angulo_a_segundos
  codigo: assert(angulo_a_segundos(0, 0, 0) == 0);
- nombre: test_grado
  funcion: angulo_a_segundos
  codigo: assert(angulo_a_segundos(1, 0, 0) == 3600);
- nombre: test_minutos_y_segundos
  funcion: angulo_a_segundos
  codigo: assert(angulo_a_segundos(0, 30, 45) == 1845);
- nombre: test_completo
  funcion: angulo_a_segundos
  codigo: assert(angulo_a_segundos(12, 34, 56) == 45296);
- nombre: test_maximo_int
  funcion: angulo_a_segundos
  codigo: assert(angulo_a_segundos(2147483647, 59, 59) == 7730941132799LL);
