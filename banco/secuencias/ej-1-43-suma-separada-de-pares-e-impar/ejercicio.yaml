id: ej-1-43-suma-separada-de-pares-e-impar
titulo: Suma Separada de Pares e Impares
tema: secuencias
bloom: 3
minutos_estimados: 25
pistas:
- Recorré el intervalo de forma inclusiva.
- Usá el resto de la división por 2 para distinguir pares de impares.
tags:
- pares
- fundamentos
- secuencias
- separada
- basicos
- dep:lazos
- c11
- intermedia
verificado: true
funciones:
- nombre: sumar_pares_impares
  retorno: void
  parametros: int n, int m, long long *pares, long long *impares
  descripcion: Suma por separado los valores pares e impares de un intervalo inclusivo.
tests_funciones:
- nombre: test_positivos
  funcion: sumar_pares_impares
  codigo: long long p, i; sumar_pares_impares(1, 5, &p, &i); assert(p == 6 && i ==
    9);
- nombre: test_negativos
  funcion: sumar_pares_impares
  codigo: long long p, i; sumar_pares_impares(-5, -1, &p, &i); assert(p == -6 && i
    == -9);
- nombre: test_cruza_cero
  funcion: sumar_pares_impares
  codigo: long long p, i; sumar_pares_impares(-2, 3, &p, &i); assert(p == 0 && i ==
    3);
- nombre: test_vacio
  funcion: sumar_pares_impares
  codigo: long long p = 7, i = 7; sumar_pares_impares(2, 1, &p, &i); assert(p == 0
    && i == 0);
- nombre: test_limite
  funcion: sumar_pares_impares
  codigo: long long p, i; sumar_pares_impares(2147483646, 2147483647, &p, &i); assert(p
    == 2147483646LL && i == 2147483647LL);
unidad: 1
modulo: Fundamentos y Estructuras de Control
subtema: pares
dificultad: intermedia
tipo: practica_guiada
prerrequisitos:
- lazos
publicar: true
