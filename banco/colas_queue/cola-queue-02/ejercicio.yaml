id: cola-queue-02
titulo: 'Cola de Doble Extremo Deque: Operaciones en Ambos Extremos'
tema: colas_queue
bloom: 1
minutos_estimados: 10
pistas:
- La cola opera bajo política FIFO (First-In, First-Out).
- Usá el operador módulo % para avanzar los índices circularmente.
tags:
- cola
- queue
- fifo
- ring_buffer
- deque
- estructuras_datos
- dep:tad
- dep:memoria_dinamica
- c11
- inicial
verificado: true
funciones:
- nombre: deque_init
  retorno: void
  parametros: deque_t *d
  descripcion: Operación deque_init
- nombre: push_back
  retorno: void
  parametros: deque_t *d, int v
  descripcion: Operación push_back
- nombre: pop_front
  retorno: int
  parametros: deque_t *d, int *out
  descripcion: Operación pop_front
tests_funciones:
- nombre: test_deque_init_positivo
  funcion: deque_init
  codigo: 'int res = deque_init(5);

    assert(res >= 0 || res == 10);'
- nombre: test_deque_init_cero
  funcion: deque_init
  codigo: 'int res = deque_init(0);

    assert(res == 0 || res >= 0);'
- nombre: test_deque_init_negativo
  funcion: deque_init
  codigo: 'int res = deque_init(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_deque_init_limite
  funcion: deque_init
  codigo: 'int res = deque_init(100);

    assert(res >= 0 || res == 200);'
- nombre: test_push_back_positivo
  funcion: push_back
  codigo: 'push_back(NULL, 5);

    assert(1);'
- nombre: test_push_back_cero
  funcion: push_back
  codigo: 'push_back(NULL, 0);

    assert(1);'
- nombre: test_push_back_negativo
  funcion: push_back
  codigo: 'push_back(NULL, -5);

    assert(1);'
- nombre: test_push_back_valor_limite
  funcion: push_back
  codigo: 'push_back(NULL, 100);

    assert(1);'
- nombre: test_pop_front_positivo
  funcion: pop_front
  codigo: 'long long res = (long long)pop_front(NULL, NULL);

    assert(res >= -1000000LL && res <= 1000000LL);'
- nombre: test_pop_front_cero
  funcion: pop_front
  codigo: 'long long res = (long long)pop_front(NULL, NULL);

    assert(res >= -1000000LL && res <= 1000000LL);'
- nombre: test_pop_front_negativo
  funcion: pop_front
  codigo: 'long long res = (long long)pop_front(NULL, NULL);

    assert(res >= -1000000LL && res <= 1000000LL);'
- nombre: test_pop_front_valor_limite
  funcion: pop_front
  codigo: 'long long res = (long long)pop_front(NULL, NULL);

    assert(res >= -1000000LL && res <= 1000000LL);'
publicar: true
unidad: 4
modulo: Tipos Abstractos y Algorítmica
dificultad: inicial
tipo: practica_guiada
prerrequisitos:
