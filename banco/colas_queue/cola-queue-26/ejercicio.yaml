    de Capacidad
tests_funciones:
- nombre: test_ejecutar_cola_queue_26_positivo
  funcion: ejecutar_cola_queue_26
  codigo: 'int res = ejecutar_cola_queue_26(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_cola_queue_26_cero
  funcion: ejecutar_cola_queue_26
  codigo: 'int res = ejecutar_cola_queue_26(0);

    assert(res == 0);'
- nombre: test_ejecutar_cola_queue_26_negativo
  funcion: ejecutar_cola_queue_26
  codigo: 'int res = ejecutar_cola_queue_26(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_cola_queue_26_valor_limite
  funcion: ejecutar_cola_queue_26
  codigo: 'int res = ejecutar_cola_queue_26(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_cola_queue_26_valor_unitario
  funcion: ejecutar_cola_queue_26
  codigo: 'int res = ejecutar_cola_queue_26(1);

    assert(res >= 0 || res == 2);'
