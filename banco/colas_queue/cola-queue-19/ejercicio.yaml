  funcion: ejecutar_cola_queue_19
  codigo: 'int res = ejecutar_cola_queue_19(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_cola_queue_19_valor_limite
  funcion: ejecutar_cola_queue_19
  codigo: 'int res = ejecutar_cola_queue_19(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_cola_queue_19_valor_unitario
  funcion: ejecutar_cola_queue_19
  codigo: 'int res = ejecutar_cola_queue_19(1);

