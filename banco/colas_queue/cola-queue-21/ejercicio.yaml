  funcion: ejecutar_cola_queue_21
  codigo: 'int res = ejecutar_cola_queue_21(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_cola_queue_21_valor_unitario
  funcion: ejecutar_cola_queue_21
