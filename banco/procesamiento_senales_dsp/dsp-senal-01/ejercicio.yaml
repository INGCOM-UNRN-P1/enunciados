id: dsp-senal-01
titulo: Filtro de Media Móvil Moving Average Filter 1D
tema: procesamiento_senales_dsp
bloom: 1
minutos_estimados: 10
pistas:
- Trabajá con ventanas de convolución discretas.
- Cuidá los efectos de borde al inicio y fin de la señal.
tags:
- dsp
- senales
- filtros
- media_movil
- muestreo
- dep:arreglos
- dep:algebra_lineal_numerica
- c11
- inicial
verificado: true
funciones:
- nombre: media_movil
  retorno: int
  parametros: const int *muestras, int n, int ventana, double *salida
  descripcion: Calcula la media de cada ventana completa de la señal.
tests_funciones:
- nombre: test_media_movil_ventanas
  funcion: media_movil
  codigo: int x[] = {1, 2, 6, -1}; double y[3]; assert(media_movil(x, 4, 2, y) ==
    3); assert(y[0] == 1.5 && y[1] == 4.0 && y[2] == 2.5);
- nombre: test_media_movil_ventana_uno
  funcion: media_movil
  codigo: int x[] = {-5, 7}; double y[2]; assert(media_movil(x, 2, 1, y) == 2); assert(y[0]
    == -5.0 && y[1] == 7.0);
- nombre: test_media_movil_ventana_completa
  funcion: media_movil
  codigo: int x[] = {3, 6, 9}; double y[1]; assert(media_movil(x, 3, 3, y) == 1);
    assert(y[0] == 6.0);
- nombre: test_media_movil_invalida
  funcion: media_movil
  codigo: int x[] = {1}; double y[] = {42}; assert(media_movil(x, 1, 0, y) == -1);
    assert(media_movil(x, 1, 2, y) == -1); assert(media_movil(0, 1, 1, y) == -1);
    assert(media_movil(x, 1, 1, 0) == -1); assert(y[0] == 42);
- nombre: test_media_movil_suma_grande
  funcion: media_movil
  codigo: int x[] = {2147483647, 2147483647}; double y[1]; assert(media_movil(x, 2,
    2, y) == 1); assert(y[0] == 2147483647.0);
publicar: true
unidad: 4
modulo: Tipos Abstractos y Algorítmica
dificultad: inicial
tipo: practica_guiada
prerrequisitos:
- arreglos
- algebra_lineal_numerica
subtema: '01'
