pistas:
- Buscá bloques de código inalcanzables ubicados después de sentencias return, break
  o goto incondicionales.
- Identificá ramas condicionales cuyas condiciones sean tautologías o contradicciones
  constantes.
- Eliminá funciones o variables declaradas que nunca son referenciadas en el programa.
