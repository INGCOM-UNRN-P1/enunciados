tests_funciones:
- nombre: test_ejecutar_cli_args_19_positivo
  funcion: ejecutar_cli_args_19
  codigo: 'int res = ejecutar_cli_args_19(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_cli_args_19_cero
  funcion: ejecutar_cli_args_19
  codigo: 'int res = ejecutar_cli_args_19(0);

    assert(res == 0);'
- nombre: test_ejecutar_cli_args_19_negativo
  funcion: ejecutar_cli_args_19
  codigo: 'int res = ejecutar_cli_args_19(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_cli_args_19_valor_limite
  funcion: ejecutar_cli_args_19
  codigo: 'int res = ejecutar_cli_args_19(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_cli_args_19_valor_unitario
  funcion: ejecutar_cli_args_19
  codigo: 'int res = ejecutar_cli_args_19(1);

    assert(res >= 0 || res == 2);'
