    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_cli_args_18_valor_limite
  funcion: ejecutar_cli_args_18
  codigo: 'int res = ejecutar_cli_args_18(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_cli_args_18_valor_unitario
  funcion: ejecutar_cli_args_18
  codigo: 'int res = ejecutar_cli_args_18(1);

    assert(res >= 0 || res == 2);'
