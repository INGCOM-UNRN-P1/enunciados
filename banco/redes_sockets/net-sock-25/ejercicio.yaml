id: net-sock-25
titulo: Cliente de Monitoreo de Red y Cálculo de Latencia RTT
tema: redes_sockets
bloom: 4
minutos_estimados: 35
pistas:
- Recordá que Big Endian transmite el byte más significativo primero.
- Validá el tamaño de los búferes de transmisión.
tags:
- redes
- sockets
- endianness
- protocolos
- tcp_udp
- dep:archivos_binarios
- dep:concurrencia_hilos
- c11
- intermedia
verificado: true
funciones:
- nombre: ejecutar_net_sock_25
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Cliente de Monitoreo de Red y Cálculo
    de Latencia RTT
tests_funciones:
- nombre: test_ejecutar_net_sock_25_positivo
  funcion: ejecutar_net_sock_25
  codigo: 'int res = ejecutar_net_sock_25(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_net_sock_25_cero
  funcion: ejecutar_net_sock_25
  codigo: 'int res = ejecutar_net_sock_25(0);

    assert(res == 0);'
- nombre: test_ejecutar_net_sock_25_negativo
  funcion: ejecutar_net_sock_25
  codigo: 'int res = ejecutar_net_sock_25(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_net_sock_25_valor_limite
  funcion: ejecutar_net_sock_25
  codigo: 'int res = ejecutar_net_sock_25(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_net_sock_25_valor_unitario
  funcion: ejecutar_net_sock_25
  codigo: 'int res = ejecutar_net_sock_25(1);

    assert(res >= 0 || res == 2);'
