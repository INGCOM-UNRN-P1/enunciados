tests_funciones:
- nombre: test_ejecutar_net_sock_10_positivo
  funcion: ejecutar_net_sock_10
  codigo: 'int res = ejecutar_net_sock_10(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_net_sock_10_cero
  funcion: ejecutar_net_sock_10
  codigo: 'int res = ejecutar_net_sock_10(0);

    assert(res == 0);'
- nombre: test_ejecutar_net_sock_10_negativo
  funcion: ejecutar_net_sock_10
  codigo: 'int res = ejecutar_net_sock_10(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_net_sock_10_valor_limite
  funcion: ejecutar_net_sock_10
  codigo: 'int res = ejecutar_net_sock_10(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_net_sock_10_valor_unitario
  funcion: ejecutar_net_sock_10
  codigo: 'int res = ejecutar_net_sock_10(1);

    assert(res >= 0 || res == 2);'
