    de Mensajes en TCP
tests_funciones:
- nombre: test_ejecutar_net_sock_15_positivo
  funcion: ejecutar_net_sock_15
  codigo: 'int res = ejecutar_net_sock_15(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_net_sock_15_cero
  funcion: ejecutar_net_sock_15
  codigo: 'int res = ejecutar_net_sock_15(0);

    assert(res == 0);'
- nombre: test_ejecutar_net_sock_15_negativo
  funcion: ejecutar_net_sock_15
  codigo: 'int res = ejecutar_net_sock_15(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_net_sock_15_valor_limite
  funcion: ejecutar_net_sock_15
  codigo: 'int res = ejecutar_net_sock_15(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_net_sock_15_valor_unitario
  funcion: ejecutar_net_sock_15
  codigo: 'int res = ejecutar_net_sock_15(1);

    assert(res >= 0 || res == 2);'
