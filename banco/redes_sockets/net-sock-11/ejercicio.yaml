    de Mensajes
tests_funciones:
- nombre: test_ejecutar_net_sock_11_positivo
  funcion: ejecutar_net_sock_11
  codigo: 'int res = ejecutar_net_sock_11(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_net_sock_11_cero
  funcion: ejecutar_net_sock_11
  codigo: 'int res = ejecutar_net_sock_11(0);

    assert(res == 0);'
- nombre: test_ejecutar_net_sock_11_negativo
  funcion: ejecutar_net_sock_11
  codigo: 'int res = ejecutar_net_sock_11(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_net_sock_11_valor_limite
  funcion: ejecutar_net_sock_11
  codigo: 'int res = ejecutar_net_sock_11(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_net_sock_11_valor_unitario
  funcion: ejecutar_net_sock_11
  codigo: 'int res = ejecutar_net_sock_11(1);

    assert(res >= 0 || res == 2);'
