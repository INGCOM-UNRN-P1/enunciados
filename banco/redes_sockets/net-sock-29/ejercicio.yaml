funciones:
- nombre: ejecutar_net_sock_29
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Simulador de Capa de Transporte con Pérdida
    de Paquetes
tests_funciones:
- nombre: test_ejecutar_net_sock_29_positivo
  funcion: ejecutar_net_sock_29
  codigo: 'int res = ejecutar_net_sock_29(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_net_sock_29_cero
  funcion: ejecutar_net_sock_29
  codigo: 'int res = ejecutar_net_sock_29(0);

    assert(res == 0);'
- nombre: test_ejecutar_net_sock_29_negativo
  funcion: ejecutar_net_sock_29
  codigo: 'int res = ejecutar_net_sock_29(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_net_sock_29_valor_limite
  funcion: ejecutar_net_sock_29
  codigo: 'int res = ejecutar_net_sock_29(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_net_sock_29_valor_unitario
  funcion: ejecutar_net_sock_29
  codigo: 'int res = ejecutar_net_sock_29(1);

    assert(res >= 0 || res == 2);'
