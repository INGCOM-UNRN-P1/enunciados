funciones:
- nombre: ejecutar_net_sock_12
  retorno: int
  parametros: int val
  descripcion: 'Procesa el flujo principal de Cliente HTTP Mínimo: Envío de Solicitud
    GET y Parseo de Respuesta'
tests_funciones:
- nombre: test_ejecutar_net_sock_12_positivo
  funcion: ejecutar_net_sock_12
  codigo: 'int res = ejecutar_net_sock_12(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_net_sock_12_cero
  funcion: ejecutar_net_sock_12
  codigo: 'int res = ejecutar_net_sock_12(0);

    assert(res == 0);'
- nombre: test_ejecutar_net_sock_12_negativo
  funcion: ejecutar_net_sock_12
  codigo: 'int res = ejecutar_net_sock_12(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_net_sock_12_valor_limite
  funcion: ejecutar_net_sock_12
  codigo: 'int res = ejecutar_net_sock_12(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_net_sock_12_valor_unitario
  funcion: ejecutar_net_sock_12
  codigo: 'int res = ejecutar_net_sock_12(1);

    assert(res >= 0 || res == 2);'
