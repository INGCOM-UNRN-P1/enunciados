funciones:
- nombre: ejecutar_net_sock_09
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Manejo de Múltiples Conexiones Concurrentes
    con Poll
tests_funciones:
- nombre: test_ejecutar_net_sock_09_positivo
  funcion: ejecutar_net_sock_09
  codigo: 'int res = ejecutar_net_sock_09(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_net_sock_09_cero
  funcion: ejecutar_net_sock_09
  codigo: 'int res = ejecutar_net_sock_09(0);

    assert(res == 0);'
- nombre: test_ejecutar_net_sock_09_negativo
  funcion: ejecutar_net_sock_09
  codigo: 'int res = ejecutar_net_sock_09(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_net_sock_09_valor_limite
  funcion: ejecutar_net_sock_09
  codigo: 'int res = ejecutar_net_sock_09(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_net_sock_09_valor_unitario
  funcion: ejecutar_net_sock_09
  codigo: 'int res = ejecutar_net_sock_09(1);

    assert(res >= 0 || res == 2);'
