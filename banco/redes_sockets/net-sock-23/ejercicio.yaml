  funcion: ejecutar_net_sock_23
  codigo: 'int res = ejecutar_net_sock_23(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_net_sock_23_valor_limite
  funcion: ejecutar_net_sock_23
  codigo: 'int res = ejecutar_net_sock_23(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_net_sock_23_valor_unitario
  funcion: ejecutar_net_sock_23
  codigo: 'int res = ejecutar_net_sock_23(1);

    assert(res >= 0 || res == 2);'
