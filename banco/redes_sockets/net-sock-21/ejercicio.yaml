funciones:
- nombre: ejecutar_net_sock_21
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Detección de Pérdida de Paquetes y Retransmisión
    ARQ
tests_funciones:
- nombre: test_ejecutar_net_sock_21_positivo
  funcion: ejecutar_net_sock_21
  codigo: 'int res = ejecutar_net_sock_21(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_net_sock_21_cero
  funcion: ejecutar_net_sock_21
  codigo: 'int res = ejecutar_net_sock_21(0);

    assert(res == 0);'
- nombre: test_ejecutar_net_sock_21_negativo
  funcion: ejecutar_net_sock_21
  codigo: 'int res = ejecutar_net_sock_21(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_net_sock_21_valor_limite
  funcion: ejecutar_net_sock_21
  codigo: 'int res = ejecutar_net_sock_21(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_net_sock_21_valor_unitario
  funcion: ejecutar_net_sock_21
  codigo: 'int res = ejecutar_net_sock_21(1);

    assert(res >= 0 || res == 2);'
