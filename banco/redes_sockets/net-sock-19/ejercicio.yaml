  funcion: ejecutar_net_sock_19
  codigo: 'int res = ejecutar_net_sock_19(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_net_sock_19_valor_unitario
  funcion: ejecutar_net_sock_19
  codigo: 'int res = ejecutar_net_sock_19(1);

