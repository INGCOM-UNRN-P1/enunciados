  funcion: ejecutar_net_sock_14
  codigo: 'int res = ejecutar_net_sock_14(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_net_sock_14_valor_unitario
  funcion: ejecutar_net_sock_14
  codigo: 'int res = ejecutar_net_sock_14(1);

