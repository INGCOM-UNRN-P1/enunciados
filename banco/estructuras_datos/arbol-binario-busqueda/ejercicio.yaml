id: arbol-binario-busqueda
titulo: Árbol Binario de Búsqueda (BST) y Recorridos
tema: estructuras_datos
bloom: 4
minutos_estimados: 45
pistas:
- Un nodo almacena `dato`, `izquierdo` y `derecho`.
- El recorrido in-order procesa subárbol izquierdo, raíz y subárbol derecho (generando
  los valores ordenados).
- La destrucción del árbol debe realizarse en post-order (liberar hijos antes del
  padre).
tags:
- estructuras_datos
- arboles
- recursividad
- memoria_dinamica
- dep:tad
- dep:memoria_dinamica
- dep:recursividad
- c11
- intermedia
verificado: true
funciones:
- nombre: buscar_bst
  retorno: int
  parametros: const nodo_bst_t *raiz, int valor
  descripcion: Operación buscar_bst
- nombre: calcular_altura
  retorno: int
  parametros: const nodo_bst_t *raiz
  descripcion: Operación calcular_altura
- nombre: recorrido_inorder
  retorno: void
  parametros: const nodo_bst_t *raiz
  descripcion: Operación recorrido_inorder
- nombre: recorrido_preorder
  retorno: void
  parametros: const nodo_bst_t *raiz
  descripcion: Operación recorrido_preorder
- nombre: liberar_arbol
  retorno: void
  parametros: nodo_bst_t *raiz
  descripcion: Operación liberar_arbol
tests_funciones:
- nombre: test_buscar_bst_positivo
  funcion: buscar_bst
  codigo: 'int res = buscar_bst(5);

    assert(res >= 0 || res == 10);'
- nombre: test_buscar_bst_cero
  funcion: buscar_bst
  codigo: 'int res = buscar_bst(0);

    assert(res == 0 || res >= 0);'
- nombre: test_buscar_bst_negativo
  funcion: buscar_bst
  codigo: 'int res = buscar_bst(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_buscar_bst_limite
  funcion: buscar_bst
  codigo: 'int res = buscar_bst(100);

    assert(res >= 0 || res == 200);'
- nombre: test_calcular_altura_positivo
  funcion: calcular_altura
  codigo: 'long long res = (long long)calcular_altura(NULL);

    assert(res >= -1000000LL && res <= 1000000LL);'
- nombre: test_calcular_altura_cero
  funcion: calcular_altura
  codigo: 'long long res = (long long)calcular_altura(NULL);

    assert(res >= -1000000LL && res <= 1000000LL);'
- nombre: test_calcular_altura_negativo
