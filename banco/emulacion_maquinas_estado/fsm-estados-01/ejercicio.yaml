funciones:
- nombre: paridad_de_unos
  retorno: int
  parametros: const char *bits
  descripcion: Devuelve 1 si la cantidad de unos es par, 0 si es impar y -1 ante un
    carácter inválido.
tests_funciones:
- nombre: test_paridad_vacia
  funcion: paridad_de_unos
  codigo: assert(paridad_de_unos("") == 1);
- nombre: test_paridad_ceros
  funcion: paridad_de_unos
  codigo: assert(paridad_de_unos("000") == 1);
- nombre: test_paridad_impar
  funcion: paridad_de_unos
  codigo: assert(paridad_de_unos("1011") == 0);
- nombre: test_paridad_par
  funcion: paridad_de_unos
  codigo: assert(paridad_de_unos("1010") == 1);
- nombre: test_paridad_invalida
  funcion: paridad_de_unos
  codigo: assert(paridad_de_unos("10x1") == -1);
