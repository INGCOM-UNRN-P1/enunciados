    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_fsm_estados_10_valor_limite
  funcion: ejecutar_fsm_estados_10
  codigo: 'int res = ejecutar_fsm_estados_10(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_fsm_estados_10_valor_unitario
  funcion: ejecutar_fsm_estados_10
  codigo: 'int res = ejecutar_fsm_estados_10(1);

    assert(res >= 0 || res == 2);'
