id: ejercicio3
titulo: 'TDA Conjunto de Enteros (conjunto_t) — Invariante de Unicidad'
tema: tipos_datos_abstractos
bloom: 4
minutos: 45
pistas:
  - 'El invariante de representación exige verificar unicidad: ningún par de elementos distintos puede ser igual.'
  - 'En conjunto_agregar, si el elemento ya pertenece, la operación retorna true de forma idempotente sin duplicar.'
  - 'En conjunto_eliminar, al hallar el elemento se realiza un corrimiento a la izquierda para mantener la contigüidad.'
  - 'El conjunto vacío es subconjunto de cualquier conjunto, cumpliendo la definición matemática de inclusión.'
tags:
  - tda
  - conjunto
  - invariantes
  - unicidad
  - idempotencia
  - encapsulamiento_opaco
verificado: true
tipo_entrega: archivos_individuales
familia: tda
rol_familia: libreria
funciones:
  - nombre: conjunto_crear
    retorno: conjunto_t *
    parametros: size_t capacidad
    descripcion: Constructor de conjunto con capacidad máxima.
  - nombre: conjunto_destruir
    retorno: void
    parametros: conjunto_t *c
    descripcion: Destructor tolerante a NULL.
  - nombre: conjunto_cardinal
    retorno: size_t
    parametros: const conjunto_t *c
    descripcion: Consultor de cantidad actual de elementos únicos.
  - nombre: conjunto_esta_vacio
    retorno: bool
    parametros: const conjunto_t *c
    descripcion: Consultor booleano de conjunto vacío.
  - nombre: conjunto_pertenece
    retorno: bool
    parametros: const conjunto_t *c, int elemento
    descripcion: Consultor de pertenencia de elemento en el conjunto.
  - nombre: conjunto_es_subconjunto
    retorno: bool
    parametros: const conjunto_t *a, const conjunto_t *b
    descripcion: Consultor de inclusión A subconjunto B.
  - nombre: conjunto_agregar
    retorno: bool
    parametros: conjunto_t *c, int elemento
    descripcion: Mutador de inserción idempotente respetando unicidad.
  - nombre: conjunto_eliminar
    retorno: bool
    parametros: conjunto_t *c, int elemento
    descripcion: Mutador de eliminación manteniendo contigüidad.
  - nombre: conjunto_union
    retorno: conjunto_t *
    parametros: const conjunto_t *a, const conjunto_t *b
    descripcion: Constructor derivado de unión de conjuntos.
  - nombre: conjunto_interseccion
    retorno: conjunto_t *
    parametros: const conjunto_t *a, const conjunto_t *b
    descripcion: Constructor derivado de intersección de conjuntos.
tests_funciones:
  - nombre: test_conjunto_crear_agregar
    funcion: conjunto_crear
    codigo: |
      conjunto_t *c = conjunto_crear(3);
      assert(c != NULL);
      assert(conjunto_esta_vacio(c));
      assert(conjunto_agregar(c, 10));
      assert(conjunto_agregar(c, 10));
      assert(conjunto_cardinal(c) == 1);
      conjunto_destruir(c);
  - nombre: test_conjunto_eliminar
    funcion: conjunto_eliminar
    codigo: |
      conjunto_t *c = conjunto_crear(3);
      assert(c != NULL);
      conjunto_agregar(c, 10);
      conjunto_agregar(c, 20);
      assert(conjunto_eliminar(c, 10));
      assert(!conjunto_pertenece(c, 10));
      assert(conjunto_cardinal(c) == 1);
      conjunto_destruir(c);
