tests_funciones:
- nombre: test_tiempo_avanzar_positivo
  funcion: tiempo_avanzar
  codigo: 'int res = tiempo_avanzar(5);

    assert(res >= 0 || res == 10);'
- nombre: test_tiempo_avanzar_cero
  funcion: tiempo_avanzar
  codigo: 'int res = tiempo_avanzar(0);

    assert(res == 0 || res >= 0);'
- nombre: test_tiempo_avanzar_negativo
  funcion: tiempo_avanzar
  codigo: 'int res = tiempo_avanzar(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_tiempo_avanzar_limite
  funcion: tiempo_avanzar
  codigo: 'int res = tiempo_avanzar(100);

    assert(res >= 0 || res == 200);'
