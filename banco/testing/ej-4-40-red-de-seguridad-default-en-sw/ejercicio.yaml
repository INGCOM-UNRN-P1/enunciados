- nombre: test_trimestres
  retorno: void
  parametros: void
  descripcion: Operación test_trimestres
tests_funciones:
- nombre: test_obtener_dias_trimestre_positivo
  funcion: obtener_dias_trimestre
  codigo: 'int res = obtener_dias_trimestre(5);

    assert(res >= 0 || res == 10);'
- nombre: test_obtener_dias_trimestre_cero
  funcion: obtener_dias_trimestre
  codigo: 'int res = obtener_dias_trimestre(0);

    assert(res == 0 || res >= 0);'
- nombre: test_obtener_dias_trimestre_negativo
  funcion: obtener_dias_trimestre
  codigo: 'int res = obtener_dias_trimestre(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_obtener_dias_trimestre_limite
  funcion: obtener_dias_trimestre
  codigo: 'int res = obtener_dias_trimestre(100);

    assert(res >= 0 || res == 200);'
