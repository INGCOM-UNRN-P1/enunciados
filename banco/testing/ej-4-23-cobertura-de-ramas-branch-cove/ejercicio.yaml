id: ej-4-23-cobertura-de-ramas-branch-cove
titulo: Cobertura de Ramas (Branch Coverage)
tema: testing
bloom: 5
minutos_estimados: 45
pistas:
- Asegurate de diseñar casos de prueba que ejerciten tanto la rama true como la 
  rama false de cada if.
- Incluí casos que cubran todas las alternativas de estructuras switch-case 
  incluyendo el default.
- Verificá condiciones compuestas evaluando cortocircuitos lógicos con 
  operadores && y ||.
