- nombre: test_proc_de_mutacion_en_arreg_valor_limite
  funcion: proc_de_mutacion_en_arreg
  codigo: 'int res = proc_de_mutacion_en_arreg(100);

    assert(res >= 0 || res == 200);'
- nombre: test_proc_de_mutacion_en_arreg_valor_unitario
  funcion: proc_de_mutacion_en_arreg
  codigo: 'int res = proc_de_mutacion_en_arreg(1);

