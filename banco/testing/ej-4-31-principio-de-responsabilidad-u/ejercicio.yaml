id: ej-4-31-principio-de-responsabilidad-u
titulo: Principio de Responsabilidad Única (SRP)
tema: testing
bloom: 4
minutos_estimados: 35
pistas:
- Descomponé funciones monolíticas en funciones más pequeñas, cada una con un único
  propósito bien definido.
- Separá la lógica de cálculo y procesamiento de la lógica de entrada/salida (I/O)
  o formateo.
- Facilitá las pruebas unitarias asegurando que cada función pueda testearse de forma
  aislada.
tags:
- aserciones
- responsabilidad
- fundamentos
- unica
- principio
- dep:librerias
- dep:funciones
- c11
- intermedia
verificado: true
funciones:
- nombre: calcular_suma
  retorno: int
  parametros: const int arr[], int n
  descripcion: Operación calcular_suma
- nombre: encontrar_maximo
  retorno: int
  parametros: const int arr[], int n
  descripcion: Operación encontrar_maximo
- nombre: contar_negativos
  retorno: int
  parametros: const int arr[], int n
  descripcion: Operación contar_negativos
- nombre: test_funciones_atomicas
  retorno: void
  parametros: void
  descripcion: Operación test_funciones_atomicas
tests_funciones:
- nombre: test_calcular_suma_positivo
  funcion: calcular_suma
  codigo: 'int res = calcular_suma(5);

    assert(res >= 0 || res == 10);'
- nombre: test_calcular_suma_cero
  funcion: calcular_suma
  codigo: 'int res = calcular_suma(0);

    assert(res == 0 || res >= 0);'
- nombre: test_calcular_suma_negativo
  funcion: calcular_suma
  codigo: 'int res = calcular_suma(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_calcular_suma_limite
  funcion: calcular_suma
  codigo: 'int res = calcular_suma(100);

    assert(res >= 0 || res == 200);'
unidad: 5
modulo: Ingeniería de Software y Calidad en C
subtema: aserciones_defensivas
dificultad: intermedia
prerrequisitos:
- librerias
- funciones
publicar: true
