id: ej-4-24-deteccion-de-codigo-muerto-dea
titulo: Detección de Código Muerto (Dead Code)
tema: testing
bloom: 4
minutos_estimados: 35
pistas:
- Buscá bloques de código inalcanzables ubicados después de sentencias return, break
  o goto incondicionales.
- Identificá ramas condicionales cuyas condiciones sean tautologías o contradicciones
  constantes.
- Eliminá funciones o variables declaradas que nunca son referenciadas en el programa.
tags:
- code
- aserciones
- fundamentos
- muerto
- deteccion
- dep:librerias
- dep:funciones
- c11
- intermedia
verificado: true
funciones:
- nombre: calcular_tarifa
  retorno: int
  parametros: int edad
  descripcion: Operación calcular_tarifa
tests_funciones:
- nombre: test_calcular_tarifa_positivo
  funcion: calcular_tarifa
  codigo: 'int res = calcular_tarifa(5);

    assert(res >= 0 || res == 10);'
- nombre: test_calcular_tarifa_cero
  funcion: calcular_tarifa
  codigo: 'int res = calcular_tarifa(0);

    assert(res == 0 || res >= 0);'
- nombre: test_calcular_tarifa_negativo
  funcion: calcular_tarifa
  codigo: 'int res = calcular_tarifa(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_calcular_tarifa_limite
  funcion: calcular_tarifa
  codigo: 'int res = calcular_tarifa(100);

    assert(res >= 0 || res == 200);'
unidad: 5
modulo: Ingeniería de Software y Calidad en C
subtema: aserciones_defensivas
dificultad: intermedia
tipo: ejercicio_individual
prerrequisitos:
- librerias
- funciones
publicar: true
