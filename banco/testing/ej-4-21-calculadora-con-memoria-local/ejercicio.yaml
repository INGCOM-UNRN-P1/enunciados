tests_funciones:
- nombre: test_calc_sumar_positivo
  funcion: calc_sumar
  codigo: 'int res = calc_sumar(5);

    assert(res >= 0 || res == 10);'
- nombre: test_calc_sumar_cero
  funcion: calc_sumar
  codigo: 'int res = calc_sumar(0);

    assert(res == 0 || res >= 0);'
- nombre: test_calc_sumar_negativo
  funcion: calc_sumar
  codigo: 'int res = calc_sumar(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_calc_sumar_limite
  funcion: calc_sumar
  codigo: 'int res = calc_sumar(100);

    assert(res >= 0 || res == 200);'
