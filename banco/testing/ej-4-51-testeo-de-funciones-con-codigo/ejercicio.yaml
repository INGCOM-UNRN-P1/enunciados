tests_funciones:
- nombre: test_calcular_velocidad_positivo
  funcion: calcular_velocidad
  codigo: 'int res = calcular_velocidad(5);

    assert(res >= 0 || res == 10);'
- nombre: test_calcular_velocidad_cero
  funcion: calcular_velocidad
  codigo: 'int res = calcular_velocidad(0);

    assert(res == 0 || res >= 0);'
- nombre: test_calcular_velocidad_negativo
  funcion: calcular_velocidad
  codigo: 'int res = calcular_velocidad(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_calcular_velocidad_limite
  funcion: calcular_velocidad
  codigo: 'int res = calcular_velocidad(100);

    assert(res >= 0 || res == 200);'
