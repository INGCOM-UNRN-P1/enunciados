id: ej-4-36-eliminacion-de-numeros-magicos
titulo: Eliminación de Números Mágicos
tema: testing
bloom: 4
minutos_estimados: 35
pistas:
- 'Reemplazá literales numéricos ''mágicos'' por constantes descriptivas con #define
  o enum.'
- Agrupá constantes relacionadas en enumeraciones para mejorar la legibilidad y seguridad
  de tipos.
- Centralizá los parámetros de configuración en la cabecera del módulo para facilitar
  su mantenimiento.
tags:
- aserciones
- fundamentos
- magicos
- eliminacion
- numeros
- dep:librerias
- dep:funciones
- c11
- intermedia
verificado: true
funciones:
- nombre: calcular_costo_envio
  retorno: double
  parametros: double peso
  descripcion: Operación calcular_costo_envio
tests_funciones:
- nombre: test_calcular_costo_envio_positivo
  funcion: calcular_costo_envio
  codigo: 'int res = calcular_costo_envio(5);

    assert(res >= 0 || res == 10);'
- nombre: test_calcular_costo_envio_cero
  funcion: calcular_costo_envio
  codigo: 'int res = calcular_costo_envio(0);

    assert(res == 0 || res >= 0);'
- nombre: test_calcular_costo_envio_negativo
  funcion: calcular_costo_envio
  codigo: 'int res = calcular_costo_envio(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_calcular_costo_envio_limite
  funcion: calcular_costo_envio
  codigo: 'int res = calcular_costo_envio(100);

    assert(res >= 0 || res == 200);'
unidad: 5
modulo: Ingeniería de Software y Calidad en C
subtema: aserciones_defensivas
dificultad: intermedia
tipo: ejercicio_individual
prerrequisitos:
