id: ej-4-10-estructura-de-runner-de-tests
titulo: Estructura de Runner de Tests sin bibliotecas
tema: testing
bloom: 1
minutos_estimados: 10
pistas:
- Diseñá una macro o función de aserción que contabilice tests aprobados y 
  fallidos sin abortar abruptamente.
- Imprimí un resumen claro con el nombre del test, estado (PASS/FAIL) y total de
  pruebas ejecutadas.
- Retorná un código de salida no nulo si al menos una prueba falló para integrar
  con pipelines CI.
tags:
- aserciones
