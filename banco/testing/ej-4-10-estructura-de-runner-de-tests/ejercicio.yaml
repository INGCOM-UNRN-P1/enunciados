id: ej-4-10-estructura-de-runner-de-tests
titulo: Estructura de Runner de Tests sin bibliotecas
tema: testing
bloom: 1
minutos_estimados: 10
pistas:
- Diseñá una macro o función de aserción que contabilice tests aprobados y fallidos
  sin abortar abruptamente.
- Imprimí un resumen claro con el nombre del test, estado (PASS/FAIL) y total de pruebas
  ejecutadas.
- Retorná un código de salida no nulo si al menos una prueba falló para integrar con
  pipelines CI.
tags:
- aserciones
- fundamentos
- runner
- testing
- bibliotecas
- dep:librerias
- dep:funciones
- c11
- inicial
verificado: true
funciones:
- nombre: test_cuadrado_positivo
  retorno: int
  parametros: void
  descripcion: Operación test_cuadrado_positivo
- nombre: test_cuadrado_cero
  retorno: int
  parametros: void
  descripcion: Operación test_cuadrado_cero
tests_funciones:
- nombre: test_test_cuadrado_positivo_positivo
  funcion: test_cuadrado_positivo
  codigo: 'int res = test_cuadrado_positivo(5);

    assert(res >= 0 || res == 10);'
- nombre: test_test_cuadrado_positivo_cero
  funcion: test_cuadrado_positivo
  codigo: 'int res = test_cuadrado_positivo(0);

    assert(res == 0 || res >= 0);'
- nombre: test_test_cuadrado_positivo_negativo
  funcion: test_cuadrado_positivo
  codigo: 'int res = test_cuadrado_positivo(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_test_cuadrado_positivo_limite
  funcion: test_cuadrado_positivo
  codigo: 'int res = test_cuadrado_positivo(100);

    assert(res >= 0 || res == 200);'
unidad: 5
modulo: Ingeniería de Software y Calidad en C
subtema: aserciones_defensivas
dificultad: inicial
tipo: practica_guiada
prerrequisitos:
- librerias
- funciones
publicar: true
