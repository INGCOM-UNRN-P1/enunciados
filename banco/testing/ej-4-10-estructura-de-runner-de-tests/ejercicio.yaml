  retorno: int
  parametros: void
  descripcion: Operación test_cuadrado_positivo
- nombre: test_cuadrado_cero
  retorno: int
  parametros: void
  descripcion: Operación test_cuadrado_cero
tests_funciones:
- nombre: test_test_cuadrado_positivo_1
  funcion: test_cuadrado_positivo
  codigo: '/* Verificación unitaria de test_cuadrado_positivo */

    int r = test_cuadrado_positivo();

    (void)r;

    assert(true);'
- nombre: test_test_cuadrado_cero_2
