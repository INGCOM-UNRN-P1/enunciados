tests_funciones:
- nombre: test_son_cercanos_positivo
  funcion: son_cercanos
  codigo: 'int res = son_cercanos(5);

    assert(res >= 0 || res == 10);'
- nombre: test_son_cercanos_cero
  funcion: son_cercanos
  codigo: 'int res = son_cercanos(0);

    assert(res == 0 || res >= 0);'
- nombre: test_son_cercanos_negativo
  funcion: son_cercanos
  codigo: 'int res = son_cercanos(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_son_cercanos_limite
  funcion: son_cercanos
  codigo: 'int res = son_cercanos(100);

    assert(res >= 0 || res == 200);'
