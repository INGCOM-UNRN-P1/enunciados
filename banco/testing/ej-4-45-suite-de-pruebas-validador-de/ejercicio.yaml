tests_funciones:
- nombre: test_es_bisiesto_aux_positivo
  funcion: es_bisiesto_aux
  codigo: 'int res = es_bisiesto_aux(5);

    assert(res >= 0 || res == 10);'
- nombre: test_es_bisiesto_aux_cero
  funcion: es_bisiesto_aux
  codigo: 'int res = es_bisiesto_aux(0);

    assert(res == 0 || res >= 0);'
