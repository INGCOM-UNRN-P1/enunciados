  funcion: es_bisiesto_aux
  codigo: 'int res = es_bisiesto_aux(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_es_bisiesto_aux_limite
  funcion: es_bisiesto_aux
  codigo: 'int res = es_bisiesto_aux(100);

    assert(res >= 0 || res == 200);'
