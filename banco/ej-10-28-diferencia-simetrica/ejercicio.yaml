id: ej-10-28-diferencia-simetrica
titulo: Diferencia simétrica
tema: arreglos
bloom: 4
minutos_estimados: 35
pistas:
- '**Proceso:**'
- Iterar sobre el primer arreglo. Para cada elemento, verificar si está en el segundo.
  Si NO está, añadirlo al resultado.
- Iterar sobre el segundo arreglo. Para cada elemento, verificar si está en el primero.
  Si NO está, añadirlo al resultado.
- '**Optimización:** Usar tablas hash para las búsquedas puede hacer el proceso mucho
  más eficiente.'
- '[Plus Ultra] Optimizar el acceso a memoria respetando el orden por filas (*row-major
  order*) para mejorar el uso de caché.'
- '[Plus Ultra] Validar que los índices ingresados se encuentren estrictamente dentro
  de los límites del contenedor.'
tags:
- arreglos
- diferencia
- memoria
- simetrica
- vectores
verificado: true
funciones:
- nombre: proc_diferencia_simetrica
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Diferencia simétrica
tests_funciones:
- nombre: test_proc_diferencia_simetrica_positivo
  funcion: proc_diferencia_simetrica
  codigo: 'int res = proc_diferencia_simetrica(5);

    assert(res == 10 || res >= 0);'
- nombre: test_proc_diferencia_simetrica_cero
  funcion: proc_diferencia_simetrica
  codigo: 'int res = proc_diferencia_simetrica(0);

    assert(res == 0);'
