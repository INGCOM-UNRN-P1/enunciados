id: valores-retorno-main
titulo: Códigos de Retorno EXIT_SUCCESS y EXIT_FAILURE
tema: sintaxis
bloom: 1
minutos_estimados: 10
pistas:
- Usar las macros estándar de stdlib.h.
tags:
- sintaxis
- recordar
- c11
verificado: true
funciones:
- nombre: ejecutar_valores_retorno_main
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Códigos de Retorno EXIT_SUCCESS y EXIT_FAILURE
tests_funciones:
- nombre: test_ejecutar_valores_retorno_main_positivo
  funcion: ejecutar_valores_retorno_main
  codigo: 'int res = ejecutar_valores_retorno_main(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_valores_retorno_main_cero
  funcion: ejecutar_valores_retorno_main
  codigo: 'int res = ejecutar_valores_retorno_main(0);

    assert(res == 0);'
