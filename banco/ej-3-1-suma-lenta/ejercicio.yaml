id: ej-3-1-suma-lenta
titulo: Suma lenta
tema: aritmetica
bloom: 2
minutos_estimados: 15
starter_code: ''
pistas:
- '**Entrada:** Dos números enteros, `n` y `m`.'
- '**Proceso:** El objetivo es llegar desde `n` al resultado `n+m` aplicando la operación
  de incremento `m` veces (si `m` es positivo) o la operación de decremento `|m|`
  veces (si `m` es negativo).'
- Se puede usar un lazo que se repita `abs(m)` veces (el valor absoluto de `m`).
- Dentro del lazo, se verifica el signo de `m`. Si `m > 0`, se incrementa el resultado.
  Si `m < 0`, se decrementa. definición interna oculta en el archivo `.c`. para copiar
  la estructura de forma segura.
- '[Plus Ultra] Validar que los operandos sean enteros no negativos antes de iniciar
  las sumas sucesivas.'
- '[Plus Ultra] Contar la cantidad total de incrementos realizados para verificar
  el costo de la operación.'
tags:
- aritmetica
- lenta
- matematica
- fundamentos
verificado: true
funciones:
- nombre: suma_lenta
  retorno: int
  parametros: int a, int b
  descripcion: Suma a y b mediante incrementos o decrementos unitarios
tests_funciones:
- nombre: test_suma_positivos
  funcion: suma_lenta
  codigo: assert(suma_lenta(3, 4) == 7);
- nombre: test_suma_negativo
  funcion: suma_lenta
  codigo: assert(suma_lenta(5, -2) == 3);
- nombre: test_suma_cero
  funcion: suma_lenta
  codigo: assert(suma_lenta(0, 0) == 0);
