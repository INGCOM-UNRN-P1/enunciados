  funcion: ejecutar_sizeof_tipos_enteros
  codigo: 'int res = ejecutar_sizeof_tipos_enteros(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_sizeof_tipos_enteros_valor_unitario
