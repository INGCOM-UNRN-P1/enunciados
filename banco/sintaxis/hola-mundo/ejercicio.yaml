tests_funciones:
- nombre: test_ejecutar_hola_mundo_positivo
  funcion: ejecutar_hola_mundo
  codigo: 'int res = ejecutar_hola_mundo(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_hola_mundo_cero
  funcion: ejecutar_hola_mundo
  codigo: 'int res = ejecutar_hola_mundo(0);

    assert(res == 0);'
- nombre: test_ejecutar_hola_mundo_negativo
  funcion: ejecutar_hola_mundo
  codigo: 'int res = ejecutar_hola_mundo(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_hola_mundo_valor_limite
  funcion: ejecutar_hola_mundo
  codigo: 'int res = ejecutar_hola_mundo(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_hola_mundo_valor_unitario
  funcion: ejecutar_hola_mundo
  codigo: 'int res = ejecutar_hola_mundo(1);

    assert(res >= 0 || res == 2);'
