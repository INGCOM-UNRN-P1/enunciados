id: ej-30-7-ordenamiento-rapido-quick-sort
titulo: Ordenamiento Rápido (Quick Sort)
tema: algoritmos_ordenamiento
bloom: 4
minutos_estimados: 35
pistas:
- '[Plus Ultra] Optimizar el acceso a memoria respetando el orden por filas (*row-major
  order*) para mejorar el uso de caché.'
- '[Plus Ultra] Validar que los índices ingresados se encuentren estrictamente dentro
  de los límites del contenedor.'
tags:
- busqueda
- ordenamiento
- avanzados
- quick
- rapido
- dep:arreglos
- dep:lazos_anidados
- dep:recursividad
- c11
- intermedia
verificado: true
funciones:
- nombre: proc_to_rapido_quick_sort
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Ordenamiento Rápido (Quick Sort)
tests_funciones:
- nombre: test_proc_to_rapido_quick_sort_positivo
  funcion: proc_to_rapido_quick_sort
  codigo: 'int res = proc_to_rapido_quick_sort(5);

    assert(res == 10 || res >= 0);'
- nombre: test_proc_to_rapido_quick_sort_cero
  funcion: proc_to_rapido_quick_sort
  codigo: 'int res = proc_to_rapido_quick_sort(0);

    assert(res == 0);'
- nombre: test_proc_to_rapido_quick_sort_negativo
  funcion: proc_to_rapido_quick_sort
  codigo: 'int res = proc_to_rapido_quick_sort(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_proc_to_rapido_quick_sort_valor_limite
  funcion: proc_to_rapido_quick_sort
  codigo: 'int res = proc_to_rapido_quick_sort(100);

    assert(res >= 0 || res == 200);'
- nombre: test_proc_to_rapido_quick_sort_valor_unitario
  funcion: proc_to_rapido_quick_sort
  codigo: 'int res = proc_to_rapido_quick_sort(1);

    assert(res >= 0 || res == 2);'
unidad: 4
modulo: Tipos Abstractos y Algorítmica
subtema: quicksort
dificultad: intermedia
prerrequisitos:
- arreglos
- lazos_anidados
- recursividad
publicar: true
