tests_funciones:
- nombre: test_proc_nto_por_fusion_merge_positivo
  funcion: proc_nto_por_fusion_merge
  codigo: 'int res = proc_nto_por_fusion_merge(5);

    assert(res == 10 || res >= 0);'
- nombre: test_proc_nto_por_fusion_merge_cero
  funcion: proc_nto_por_fusion_merge
  codigo: 'int res = proc_nto_por_fusion_merge(0);

    assert(res == 0);'
- nombre: test_proc_nto_por_fusion_merge_negativo
  funcion: proc_nto_por_fusion_merge
  codigo: 'int res = proc_nto_por_fusion_merge(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_proc_nto_por_fusion_merge_valor_limite
  funcion: proc_nto_por_fusion_merge
  codigo: 'int res = proc_nto_por_fusion_merge(100);

    assert(res >= 0 || res == 200);'
- nombre: test_proc_nto_por_fusion_merge_valor_unitario
  funcion: proc_nto_por_fusion_merge
  codigo: 'int res = proc_nto_por_fusion_merge(1);

    assert(res >= 0 || res == 2);'
