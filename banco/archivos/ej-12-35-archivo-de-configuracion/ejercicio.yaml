tests_funciones:
- nombre: test_proc_ivo_de_configuracion_positivo
  funcion: proc_ivo_de_configuracion
  codigo: 'int res = proc_ivo_de_configuracion(5);

    assert(res == 10 || res >= 0);'
- nombre: test_proc_ivo_de_configuracion_cero
  funcion: proc_ivo_de_configuracion
  codigo: 'int res = proc_ivo_de_configuracion(0);

    assert(res == 0);'
- nombre: test_proc_ivo_de_configuracion_negativo
  funcion: proc_ivo_de_configuracion
  codigo: 'int res = proc_ivo_de_configuracion(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_proc_ivo_de_configuracion_valor_limite
  funcion: proc_ivo_de_configuracion
  codigo: 'int res = proc_ivo_de_configuracion(100);

    assert(res >= 0 || res == 200);'
- nombre: test_proc_ivo_de_configuracion_valor_unitario
  funcion: proc_ivo_de_configuracion
  codigo: 'int res = proc_ivo_de_configuracion(1);

    assert(res >= 0 || res == 2);'
