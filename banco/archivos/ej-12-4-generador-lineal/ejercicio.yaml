id: ej-12-4-generador-lineal
titulo: Generador lineal
tema: archivos
bloom: 3
minutos_estimados: 25
pistas:
- '[Plus Ultra] Verificar la correcta apertura del archivo y controlar errores de
  E/S con `ferror` y `feof`.'
- '[Plus Ultra] Soportar rutas complejas y asegurar el cierre del archivo en todos
  los caminos de ejecución.'
tags:
- lineal
- generador
- io_disco
- archivos
- c11
- intermedia
verificado: true
funciones:
- nombre: generar_lineal
  retorno: int
  parametros: const char *ruta, int cantidad, int inicio, int paso
  descripcion: Escribe cantidad valores, uno por línea, comenzando en inicio y sumando
    paso; devuelve 0 si pudo escribir el archivo y -1 ante error.
tests_funciones:
- nombre: test_cantidad_y_secuencia
  funcion: generar_lineal
  codigo: extern int mkstemp(char *); extern int close(int); char ruta[]="/tmp/deckard_lineal_XXXXXX";
    int fd=mkstemp(ruta); FILE *f; char b[64]; assert(fd>=0); assert(close(fd)==0);
    assert(generar_lineal(ruta,3,10,2)==0); f=fopen(ruta,"r"); assert(f); assert(fgets(b,sizeof
    b,f)&&strcmp(b,"3\n")==0); assert(fgets(b,sizeof b,f)&&strcmp(b,"10\n")==0); assert(fgets(b,sizeof
    b,f)&&strcmp(b,"12\n")==0); assert(fgets(b,sizeof b,f)&&strcmp(b,"14\n")==0);
    assert(!fgets(b,sizeof b,f)); fclose(f); assert(remove(ruta)==0);
- nombre: test_cero_elementos
  funcion: generar_lineal
  codigo: extern int mkstemp(char *); extern int close(int); char ruta[]="/tmp/deckard_lineal_XXXXXX";
    int fd=mkstemp(ruta); FILE *f; char b[8]; assert(fd>=0); assert(close(fd)==0);
    assert(generar_lineal(ruta,0,10,2)==0); f=fopen(ruta,"r"); assert(f); assert(fgets(b,sizeof
    b,f)&&strcmp(b,"0\n")==0); assert(!fgets(b,sizeof b,f)); fclose(f); assert(remove(ruta)==0);
- nombre: test_ruta_nula
  funcion: generar_lineal
  codigo: extern int mkstemp(char *); extern int close(int); assert(generar_lineal(NULL,1,0,1)==-1);
unidad: 3
modulo: Memoria Dinámica y Persistencia
subtema: 4-generador-lineal
dificultad: intermedia
tipo: practica_guiada
prerrequisitos:
- archivos
- io_formato
publicar: true
