id: ej-12-9-comparar-archivos
titulo: Comparar Archivos
tema: archivos
bloom: 3
minutos_estimados: 25
pistas:
- '[Plus Ultra] Verificar la correcta apertura del archivo y controlar errores de
  E/S con `ferror` y `feof`.'
- '[Plus Ultra] Soportar rutas complejas y asegurar el cierre del archivo en todos
  los caminos de ejecución.'
tags:
- comparar
- io_disco
- archivos
- c11
- intermedia
verificado: true
funciones:
- nombre: comparar_archivos
  retorno: int
  parametros: const char *ruta_a, const char *ruta_b
  descripcion: 'Compara todos los bytes de dos archivos: devuelve 0 si son idénticos,
    1 si difieren y -1 ante error de apertura o lectura.'
tests_funciones:
- nombre: test_archivos_identicos
  funcion: comparar_archivos
  codigo: extern int mkstemp(char *); extern int close(int); char ra[]="/tmp/deckard_a_XXXXXX",
    rb[]="/tmp/deckard_b_XXXXXX"; int fa=mkstemp(ra), fb=mkstemp(rb); FILE *a,*b;
    assert(fa>=0&&fb>=0); assert(close(fa)==0&&close(fb)==0); a=fopen(ra,"wb"); b=fopen(rb,"wb");
    assert(a&&b); assert(fwrite("a\0b",1,3,a)==3&&fwrite("a\0b",1,3,b)==3); assert(fclose(a)==0&&fclose(b)==0);
    assert(comparar_archivos(ra,rb)==0); assert(remove(ra)==0&&remove(rb)==0);
- nombre: test_archivos_distintos
  funcion: comparar_archivos
  codigo: extern int mkstemp(char *); extern int close(int); char ra[]="/tmp/deckard_a_XXXXXX",
    rb[]="/tmp/deckard_b_XXXXXX"; int fa=mkstemp(ra), fb=mkstemp(rb); FILE *a,*b;
    assert(fa>=0&&fb>=0); assert(close(fa)==0&&close(fb)==0); a=fopen(ra,"wb"); b=fopen(rb,"wb");
    assert(a&&b); assert(fwrite("a",1,1,a)==1&&fwrite("ab",1,2,b)==2); assert(fclose(a)==0&&fclose(b)==0);
    assert(comparar_archivos(ra,rb)==1); assert(remove(ra)==0&&remove(rb)==0);
- nombre: test_archivo_inexistente
  funcion: comparar_archivos
  codigo: extern int mkstemp(char *); extern int close(int); char ruta[]="/tmp/deckard_missing_XXXXXX";
    int fd=mkstemp(ruta); assert(fd>=0); assert(close(fd)==0); assert(remove(ruta)==0);
    assert(comparar_archivos(ruta,ruta)==-1);
unidad: 3
modulo: Memoria Dinámica y Persistencia
subtema: comparar-archivos
dificultad: intermedia
tipo: practica_guiada
prerrequisitos:
- archivos
- io_formato
publicar: true
