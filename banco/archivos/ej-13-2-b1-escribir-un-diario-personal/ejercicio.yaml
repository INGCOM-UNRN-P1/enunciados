id: ej-13-2-b1-escribir-un-diario-personal
titulo: Escribir un diario personal
tema: archivos
bloom: 1
minutos_estimados: 10
pistas:
- Usá fopen() con modo 'a' para agregar entradas al final o 'w' para 
  sobreescribir el diario.
- Validá siempre que el puntero FILE* no sea NULL antes de escribir con 
  fprintf() o fputs().
- No olvides cerrar el archivo con fclose() para asegurar la persistencia de los
  datos en disco.
