id: heap-prio-30
titulo: Cola de prioridad genérica con comparador
tema: colas_prioridad_heaps
bloom: 5
minutos_estimados: 45
pistas:
- Un nodo en el índice i tiene hijos en 2*i + 1 y 2*i + 2.
- El padre de un nodo i está en (i - 1) / 2.
tags:
- heap
- min_heap
- max_heap
- cola_prioridad
- estructuras_datos
- dep:colas_queue
- dep:arboles_binarios
- c11
- avanzada
verificado: true
funciones:
- nombre: generic_int_compare
  retorno: int
  parametros: const void*a,const void*b
  descripcion: Comparador auxiliar de enteros para ejercitar la interfaz genérica.
- nombre: generic_heap_init
  retorno: bool
  parametros: generic_heap_t*h,size_t width,heap_compare_fn cmp
  descripcion: Implementá un min-heap genérico de elementos de tamaño fijo, comparador estilo qsort (negativo
    si a precede b), almacenamiento propiedad de la cola, push, peek, pop y destroy. Copia bytes de elementos;
    callback y tamaño son obligatorios. Devuelve false en error, capacidad insuficiente no aplica pues
    crece dinámicamente.
- nombre: generic_heap_push
  retorno: bool
  parametros: generic_heap_t*h,const void*item
  descripcion: Implementá un min-heap genérico de elementos de tamaño fijo, comparador estilo qsort (negativo
    si a precede b), almacenamiento propiedad de la cola, push, peek, pop y destroy. Copia bytes de elementos;
    callback y tamaño son obligatorios. Devuelve false en error, capacidad insuficiente no aplica pues
    crece dinámicamente.
- nombre: generic_heap_peek
  retorno: bool
  parametros: const generic_heap_t*h,void*out
  descripcion: Implementá un min-heap genérico de elementos de tamaño fijo, comparador estilo qsort (negativo
    si a precede b), almacenamiento propiedad de la cola, push, peek, pop y destroy. Copia bytes de elementos;
    callback y tamaño son obligatorios. Devuelve false en error, capacidad insuficiente no aplica pues
    crece dinámicamente.
- nombre: generic_heap_pop
  retorno: bool
  parametros: generic_heap_t*h,void*out
  descripcion: Implementá un min-heap genérico de elementos de tamaño fijo, comparador estilo qsort (negativo
    si a precede b), almacenamiento propiedad de la cola, push, peek, pop y destroy. Copia bytes de elementos;
    callback y tamaño son obligatorios. Devuelve false en error, capacidad insuficiente no aplica pues
    crece dinámicamente.
- nombre: generic_heap_destroy
  retorno: void
  parametros: generic_heap_t*h
  descripcion: Implementá un min-heap genérico de elementos de tamaño fijo, comparador estilo qsort (negativo
    si a precede b), almacenamiento propiedad de la cola, push, peek, pop y destroy. Copia bytes de elementos;
    callback y tamaño son obligatorios. Devuelve false en error, capacidad insuficiente no aplica pues
    crece dinámicamente.
tests_funciones:
- nombre: test_generic_comparador
  funcion: generic_heap_init
  codigo: generic_heap_t h;int x;assert(generic_heap_init(&h,sizeof(int),generic_int_compare));int a[]={5,-2,3};for(size_t
    i=0;i<3;i++)assert(generic_heap_push(&h,&a[i]));assert(generic_heap_pop(&h,&x)&&x==-2);assert(generic_heap_pop(&h,&x)&&x==3);generic_heap_destroy(&h);
- nombre: test_generic_config_invalida
  funcion: generic_heap_init
  codigo: generic_heap_t h;assert(!generic_heap_init(&h,0,NULL));
publicar: true
unidad: 4
modulo: Tipos Abstractos y Algorítmica
dificultad: avanzada
prerrequisitos:
- colas_queue
- arboles_binarios
subtema: colas_prioridad_heaps
