id: heap-prio-15
titulo: Fusión de montículos binomiales
tema: colas_prioridad_heaps
bloom: 3
minutos_estimados: 25
pistas:
- Un nodo en el índice i tiene hijos en 2*i + 1 y 2*i + 2.
- El padre de un nodo i está en (i - 1) / 2.
tags:
- heap
- min_heap
- max_heap
- cola_prioridad
- estructuras_datos
- dep:colas_queue
- dep:arboles_binarios
- c11
- intermedia
verificado: true
funciones:
- nombre: binomial_union
  retorno: bool
  parametros: binomial_heap_t *destino,binomial_heap_t *origen
  descripcion: Fusión de montículos binomiales
tests_funciones:
- nombre: test_15_resultado_funcional
  funcion: binomial_union
  codigo: binomial_heap_t a,b; binomial_init(&a); binomial_init(&b); for(int i=30;i>=16;i--)
    assert(binomial_insert(&a,i)); for(int i=15;i>=0;i--) assert(binomial_insert(&b,i));
    assert(binomial_union(&a,&b)); assert(binomial_empty(&b)); int x; for(int i=0;i<31;i++)
    assert(binomial_extract_min(&a,&x)&&x==i); assert(!binomial_extract_min(&a,&x));
    binomial_destroy(&a); binomial_destroy(&b);
publicar: true
