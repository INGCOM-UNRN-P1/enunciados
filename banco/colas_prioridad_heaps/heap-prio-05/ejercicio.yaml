id: heap-prio-05
titulo: Decrease-key en min-heap
tema: colas_prioridad_heaps
bloom: 1
minutos_estimados: 10
pistas:
- Un nodo en el índice i tiene hijos en 2*i + 1 y 2*i + 2.
- El padre de un nodo i está en (i - 1) / 2.
tags:
- heap
- min_heap
- max_heap
- cola_prioridad
- estructuras_datos
- dep:colas_queue
- dep:arboles_binarios
- c11
- inicial
verificado: true
funciones:
- nombre: min_heap_decrease_key
  retorno: bool
  parametros: int *heap, size_t n, size_t indice, int nuevo_valor
  descripcion: Decrease-key en min-heap
tests_funciones:
- nombre: test_05_resultado_funcional
  funcion: min_heap_decrease_key
  codigo: int h[]={2,5,8,9,7}; assert(es_min_heap(h,5)); assert(min_heap_decrease_key(h,5,3,1));
    assert(h[0]==1 && es_min_heap(h,5)); assert(!min_heap_decrease_key(h,5,1,10));
    assert(!min_heap_decrease_key(h,5,9,0)); assert(!min_heap_decrease_key(NULL,5,0,0));
