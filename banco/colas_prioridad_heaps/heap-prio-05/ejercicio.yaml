id: heap-prio-05
titulo: Actualización de Prioridad Decrease-Key en Min-Heap
tema: colas_prioridad_heaps
bloom: 1
minutos_estimados: 10
pistas:
- Un nodo en el índice i tiene hijos en 2*i + 1 y 2*i + 2.
- El padre de un nodo i está en (i - 1) / 2.
tags:
- heap
- min_heap
- max_heap
- cola_prioridad
- estructuras_datos
- dep:colas_queue
- dep:arboles_binarios
- c11
- inicial
verificado: true
funciones:
- nombre: ejecutar_heap_prio_05
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Actualización de Prioridad Decrease-Key
    en Min-Heap
tests_funciones:
- nombre: test_ejecutar_heap_prio_05_positivo
  funcion: ejecutar_heap_prio_05
  codigo: 'int res = ejecutar_heap_prio_05(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_heap_prio_05_cero
  funcion: ejecutar_heap_prio_05
  codigo: 'int res = ejecutar_heap_prio_05(0);

    assert(res == 0);'
- nombre: test_ejecutar_heap_prio_05_negativo
  funcion: ejecutar_heap_prio_05
  codigo: 'int res = ejecutar_heap_prio_05(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_heap_prio_05_valor_limite
  funcion: ejecutar_heap_prio_05
  codigo: 'int res = ejecutar_heap_prio_05(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_heap_prio_05_valor_unitario
  funcion: ejecutar_heap_prio_05
  codigo: 'int res = ejecutar_heap_prio_05(1);

    assert(res >= 0 || res == 2);'
publicar: true
unidad: 4
modulo: Tipos Abstractos y Algorítmica
dificultad: inicial
tipo: practica_guiada
prerrequisitos:
- colas_queue
- arboles_binarios
subtema: colas_prioridad_heaps
