id: heap-prio-10
titulo: K-ésimo menor con heap de tamaño k
tema: colas_prioridad_heaps
bloom: 2
minutos_estimados: 15
pistas:
- Un nodo en el índice i tiene hijos en 2*i + 1 y 2*i + 2.
- El padre de un nodo i está en (i - 1) / 2.
tags:
- heap
- min_heap
- max_heap
- cola_prioridad
- estructuras_datos
- dep:colas_queue
- dep:arboles_binarios
- c11
- inicial
verificado: true
funciones:
- nombre: kth_smallest
  retorno: bool
  parametros: const int *a,size_t n,size_t k,int *resultado
  descripcion: K-ésimo menor con heap de tamaño k
tests_funciones:
- nombre: test_10_resultado_funcional
  funcion: kth_smallest
  codigo: int a[]={100,90,80,70,60,60,101,50}; int x=123; assert(kth_smallest(a,8,4,&x)&&x==70);
    assert(kth_smallest(a,8,3,&x)&&x==60); assert(kth_smallest(a,8,1,&x)&&x==50);
    assert(kth_smallest(a,8,8,&x)&&x==101); x=123; assert(!kth_smallest(a,8,0,&x)&&x==123);
    assert(!kth_smallest(a,8,9,&x)&&x==123); assert(!kth_smallest(NULL,8,1,&x)); assert(!kth_smallest(a,8,1,NULL));
publicar: true
unidad: 4
modulo: Tipos Abstractos y Algorítmica
dificultad: inicial
tipo: practica_guiada
