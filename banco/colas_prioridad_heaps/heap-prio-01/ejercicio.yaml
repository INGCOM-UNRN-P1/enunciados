id: heap-prio-01
titulo: 'Montículo Binario Min-Heap: Inserción y Extracción del Mínimo'
tema: colas_prioridad_heaps
bloom: 1
minutos_estimados: 10
pistas:
- Un nodo en el índice i tiene hijos en 2*i + 1 y 2*i + 2.
- El padre de un nodo i está en (i - 1) / 2.
tags:
- heap
- min_heap
- max_heap
- cola_prioridad
- estructuras_datos
- dep:colas_queue
- dep:arboles_binarios
- c11
- inicial
verificado: true
funciones:
- nombre: heap_init
  retorno: void
  parametros: min_heap_t *h
  descripcion: Operación heap_init
- nombre: heap_push
  retorno: void
  parametros: min_heap_t *h, int val
  descripcion: Operación heap_push
- nombre: heap_pop
  retorno: int
  parametros: min_heap_t *h, int *out
  descripcion: Operación heap_pop
tests_funciones:
- nombre: test_heap_init_positivo
  funcion: heap_init
  codigo: 'int res = heap_init(5);

    assert(res >= 0 || res == 10);'
- nombre: test_heap_init_cero
  funcion: heap_init
  codigo: 'int res = heap_init(0);

    assert(res == 0 || res >= 0);'
- nombre: test_heap_init_negativo
  funcion: heap_init
  codigo: 'int res = heap_init(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_heap_init_limite
  funcion: heap_init
  codigo: 'int res = heap_init(100);

    assert(res >= 0 || res == 200);'
- nombre: test_heap_push_positivo
  funcion: heap_push
  codigo: 'heap_push(NULL, 5);

    assert(1);'
- nombre: test_heap_push_cero
  funcion: heap_push
  codigo: 'heap_push(NULL, 0);

    assert(1);'
- nombre: test_heap_push_negativo
  funcion: heap_push
  codigo: 'heap_push(NULL, -5);

    assert(1);'
- nombre: test_heap_push_valor_limite
  funcion: heap_push
  codigo: 'heap_push(NULL, 100);

    assert(1);'
- nombre: test_heap_pop_positivo
  funcion: heap_pop
  codigo: 'long long res = (long long)heap_pop(NULL, NULL);

    assert(res >= -1000000LL && res <= 1000000LL);'
- nombre: test_heap_pop_cero
  funcion: heap_pop
  codigo: 'long long res = (long long)heap_pop(NULL, NULL);

    assert(res >= -1000000LL && res <= 1000000LL);'
- nombre: test_heap_pop_negativo
  funcion: heap_pop
  codigo: 'long long res = (long long)heap_pop(NULL, NULL);

    assert(res >= -1000000LL && res <= 1000000LL);'
- nombre: test_heap_pop_valor_limite
  funcion: heap_pop
  codigo: 'long long res = (long long)heap_pop(NULL, NULL);

    assert(res >= -1000000LL && res <= 1000000LL);'
publicar: true
unidad: 4
modulo: Tipos Abstractos y Algorítmica
dificultad: inicial
tipo: practica_guiada
prerrequisitos:
- colas_queue
- arboles_binarios
subtema: colas_prioridad_heaps
