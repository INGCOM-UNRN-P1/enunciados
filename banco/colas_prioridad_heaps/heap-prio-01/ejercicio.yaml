id: heap-prio-01
titulo: 'Min-Heap binario: inserción y extracción'
tema: colas_prioridad_heaps
bloom: 1
minutos_estimados: 10
pistas:
- Un nodo en el índice i tiene hijos en 2*i + 1 y 2*i + 2.
- El padre de un nodo i está en (i - 1) / 2.
tags:
- heap
- min_heap
- max_heap
- cola_prioridad
- estructuras_datos
- dep:colas_queue
- dep:arboles_binarios
- c11
- inicial
verificado: true
funciones:
- nombre: heap_init
  retorno: void
  parametros: min_heap_t *h
  descripcion: 'Min-Heap binario: inserción y extracción'
- nombre: heap_push
  retorno: void
  parametros: min_heap_t *h, int val
  descripcion: 'Min-Heap binario: inserción y extracción'
- nombre: heap_pop
  retorno: int
  parametros: min_heap_t *h, int *salida
  descripcion: Libera el arreglo dinámico del heap y reinicia sus campos
- nombre: heap_destroy
  retorno: void
  parametros: min_heap_t *h
  descripcion: Libera toda la memoria reservada por el heap
tests_funciones:
- nombre: test_min_heap_dinamico_mas_de_128
  funcion: heap_init
  codigo: min_heap_t h; heap_init(&h); heap_push(&h, 7); heap_push(&h, -2); heap_push(&h,
    4); int x; assert(heap_pop(&h,&x) && x==-2); assert(heap_pop(&h,&x) && x==4);
    assert(heap_pop(&h,&x) && x==7); assert(!heap_pop(&h,&x)); for (int i=200;i>=0;i--)
    heap_push(&h,i); assert(h.tamano==201 && h.capacidad>=201); for(int i=0;i<=200;i++)
    assert(heap_pop(&h,&x) && x==i); assert(!heap_pop(NULL,&x)); assert(!heap_pop(&h,NULL));
    heap_push(NULL,99); heap_destroy(NULL); heap_destroy(&h); assert(h.datos==NULL
    && h.tamano==0 && h.capacidad==0);
publicar: true
unidad: 4
modulo: Tipos Abstractos y Algorítmica
dificultad: inicial
tipo: practica_guiada
prerrequisitos:
- colas_queue
- arboles_binarios
subtema: colas_prioridad_heaps
