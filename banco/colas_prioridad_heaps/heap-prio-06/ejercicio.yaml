id: heap-prio-06
titulo: Increase-key en max-heap
tema: colas_prioridad_heaps
bloom: 1
minutos_estimados: 10
pistas:
- Un nodo en el índice i tiene hijos en 2*i + 1 y 2*i + 2.
- El padre de un nodo i está en (i - 1) / 2.
tags:
- heap
- min_heap
- max_heap
- cola_prioridad
- estructuras_datos
- dep:colas_queue
- dep:arboles_binarios
- c11
- inicial
verificado: true
funciones:
- nombre: max_heap_increase_key
  retorno: bool
  parametros: int *heap, size_t n, size_t indice, int nuevo_valor
  descripcion: Increase-key en max-heap
tests_funciones:
- nombre: test_06_resultado_funcional
  funcion: max_heap_increase_key
  codigo: int h[]={10,8,9,2,5}; assert(es_max_heap(h,5)); assert(max_heap_increase_key(h,5,3,20));
    assert(h[0]==20 && es_max_heap(h,5)); assert(!max_heap_increase_key(h,5,1,1));
    assert(!max_heap_increase_key(h,5,8,99)); assert(!max_heap_increase_key(NULL,5,0,0));
