id: heap-prio-17
titulo: Montículo oblicuo skew autoajustable
tema: colas_prioridad_heaps
bloom: 3
minutos_estimados: 25
pistas:
- Un nodo en el índice i tiene hijos en 2*i + 1 y 2*i + 2.
- El padre de un nodo i está en (i - 1) / 2.
tags:
- heap
- min_heap
- max_heap
- cola_prioridad
- estructuras_datos
- dep:colas_queue
- dep:arboles_binarios
- c11
- intermedia
verificado: true
funciones:
- nombre: skew_init
  retorno: void
  parametros: skew_heap_t *h
  descripcion: Montículo oblicuo skew autoajustable
- nombre: skew_insert
  retorno: bool
  parametros: skew_heap_t *h,int valor
  descripcion: Montículo oblicuo skew autoajustable
- nombre: skew_merge
  retorno: bool
  parametros: skew_heap_t *destino,skew_heap_t *origen
  descripcion: Montículo oblicuo skew autoajustable
- nombre: skew_extract_min
  retorno: bool
  parametros: skew_heap_t *h,int *salida
  descripcion: Montículo oblicuo skew autoajustable
- nombre: skew_destroy
  retorno: void
  parametros: skew_heap_t *h
  descripcion: Montículo oblicuo skew autoajustable
tests_funciones:
- nombre: test_17_resultado_funcional
  funcion: skew_init
  codigo: skew_heap_t a,b; skew_init(&a); skew_init(&b); for(int i=39;i>=20;i--) assert(skew_insert(&a,i));
    for(int i=19;i>=0;i--) assert(skew_insert(&b,i)); assert(skew_merge(&a,&b)); assert(b.root==NULL);
    int x; for(int i=0;i<40;i++) assert(skew_extract_min(&a,&x)&&x==i); assert(!skew_extract_min(&a,&x));
    skew_destroy(&a); skew_destroy(&b);
publicar: true
unidad: 4
modulo: Tipos Abstractos y Algorítmica
dificultad: intermedia
tipo: practica_guiada
prerrequisitos:
