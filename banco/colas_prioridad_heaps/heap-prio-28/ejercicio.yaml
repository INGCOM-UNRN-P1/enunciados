id: heap-prio-28
titulo: Búsqueda de Rango en Montículos Binarios
tema: colas_prioridad_heaps
bloom: 5
minutos_estimados: 45
pistas:
- Un nodo en el índice i tiene hijos en 2*i + 1 y 2*i + 2.
- El padre de un nodo i está en (i - 1) / 2.
tags:
- heap
- min_heap
- max_heap
- cola_prioridad
- estructuras_datos
- dep:colas_queue
- dep:arboles_binarios
- c11
- avanzada
verificado: true
funciones:
- nombre: ejecutar_heap_prio_28
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Búsqueda de Rango en Montículos Binarios
tests_funciones:
- nombre: test_ejecutar_heap_prio_28_positivo
  funcion: ejecutar_heap_prio_28
  codigo: 'int res = ejecutar_heap_prio_28(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_heap_prio_28_cero
  funcion: ejecutar_heap_prio_28
  codigo: 'int res = ejecutar_heap_prio_28(0);

    assert(res == 0);'
- nombre: test_ejecutar_heap_prio_28_negativo
  funcion: ejecutar_heap_prio_28
  codigo: 'int res = ejecutar_heap_prio_28(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_heap_prio_28_valor_limite
  funcion: ejecutar_heap_prio_28
  codigo: 'int res = ejecutar_heap_prio_28(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_heap_prio_28_valor_unitario
  funcion: ejecutar_heap_prio_28
  codigo: 'int res = ejecutar_heap_prio_28(1);

    assert(res >= 0 || res == 2);'
publicar: true
unidad: 4
modulo: Tipos Abstractos y Algorítmica
dificultad: avanzada
tipo: ejercicio_individual
prerrequisitos:
