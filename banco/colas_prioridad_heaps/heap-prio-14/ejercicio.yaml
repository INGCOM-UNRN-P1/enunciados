id: heap-prio-14
titulo: 'Montículo Binomial: Estructura de Árboles Binomiales'
tema: colas_prioridad_heaps
bloom: 3
minutos_estimados: 25
pistas:
- Un nodo en el índice i tiene hijos en 2*i + 1 y 2*i + 2.
- El padre de un nodo i está en (i - 1) / 2.
tags:
- heap
- min_heap
- max_heap
- cola_prioridad
- estructuras_datos
- dep:colas_queue
- dep:arboles_binarios
- c11
- intermedia
verificado: true
funciones:
- nombre: ejecutar_heap_prio_14
  retorno: int
  parametros: int val
  descripcion: 'Procesa el flujo principal de Montículo Binomial: Estructura de Árboles
    Binomiales'
tests_funciones:
- nombre: test_ejecutar_heap_prio_14_positivo
  funcion: ejecutar_heap_prio_14
  codigo: 'int res = ejecutar_heap_prio_14(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_heap_prio_14_cero
  funcion: ejecutar_heap_prio_14
  codigo: 'int res = ejecutar_heap_prio_14(0);

    assert(res == 0);'
- nombre: test_ejecutar_heap_prio_14_negativo
  funcion: ejecutar_heap_prio_14
  codigo: 'int res = ejecutar_heap_prio_14(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_heap_prio_14_valor_limite
  funcion: ejecutar_heap_prio_14
  codigo: 'int res = ejecutar_heap_prio_14(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_heap_prio_14_valor_unitario
  funcion: ejecutar_heap_prio_14
  codigo: 'int res = ejecutar_heap_prio_14(1);

    assert(res >= 0 || res == 2);'
publicar: true
