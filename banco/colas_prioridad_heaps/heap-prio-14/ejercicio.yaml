id: heap-prio-14
titulo: 'Montículo binomial: árboles binomiales'
tema: colas_prioridad_heaps
bloom: 3
minutos_estimados: 25
pistas:
- Un nodo en el índice i tiene hijos en 2*i + 1 y 2*i + 2.
- El padre de un nodo i está en (i - 1) / 2.
tags:
- heap
- min_heap
- max_heap
- cola_prioridad
- estructuras_datos
- dep:colas_queue
- dep:arboles_binarios
- c11
- intermedia
verificado: true
funciones:
- nombre: binomial_init
  retorno: void
  parametros: binomial_heap_t *h
  descripcion: 'Montículo binomial: árboles binomiales'
- nombre: binomial_insert
  retorno: bool
  parametros: binomial_heap_t *h,int valor
  descripcion: 'Montículo binomial: árboles binomiales'
- nombre: binomial_extract_min
  retorno: bool
  parametros: binomial_heap_t *h,int *salida
  descripcion: 'Montículo binomial: árboles binomiales'
- nombre: binomial_destroy
  retorno: void
  parametros: binomial_heap_t *h
  descripcion: 'Montículo binomial: árboles binomiales'
tests_funciones:
- nombre: test_14_resultado_funcional
  funcion: binomial_init
  codigo: binomial_heap_t h; binomial_init(&h); assert(!binomial_extract_min(&h,NULL));
    for(int i=38;i>=0;i--) assert(binomial_insert(&h,i%13-6)); int x; for(int i=-6;i<=6;i++)
    for(int j=0;j<3;j++) assert(binomial_extract_min(&h,&x)&&x==i); assert(!binomial_extract_min(&h,&x));
    binomial_destroy(&h);
publicar: true
unidad: 4
modulo: Tipos Abstractos y Algorítmica
dificultad: intermedia
tipo: practica_guiada
