id: heap-prio-12
titulo: Mediana de flujo con dos heaps
tema: colas_prioridad_heaps
bloom: 2
minutos_estimados: 15
pistas:
- Un nodo en el índice i tiene hijos en 2*i + 1 y 2*i + 2.
- El padre de un nodo i está en (i - 1) / 2.
tags:
- heap
- min_heap
- max_heap
- cola_prioridad
- estructuras_datos
- dep:colas_queue
- dep:arboles_binarios
- c11
- inicial
verificado: true
funciones:
- nombre: median_init
  retorno: void
  parametros: median_stream_t *s
  descripcion: Mediana de flujo con dos heaps
- nombre: median_add
  retorno: bool
  parametros: median_stream_t *s,int valor
  descripcion: Mediana de flujo con dos heaps
- nombre: median_get
  retorno: bool
  parametros: const median_stream_t *s,double *mediana
  descripcion: Mediana de flujo con dos heaps
tests_funciones:
- nombre: test_12_resultado_funcional
  funcion: median_init
  codigo: median_stream_t s; median_init(&s); double m; assert(!median_get(&s,&m));
    median_add(&s,1); median_add(&s,9); assert(median_get(&s,&m)&&m==5.0); median_add(&s,3);
    assert(median_get(&s,&m)&&m==3.0);
publicar: true
unidad: 4
modulo: Tipos Abstractos y Algorítmica
dificultad: inicial
tipo: practica_guiada
prerrequisitos:
- colas_queue
- arboles_binarios
subtema: colas_prioridad_heaps
