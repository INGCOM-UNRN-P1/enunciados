id: heap-prio-21
titulo: 'Algoritmo de Dijkstra: Cola de Prioridad para Distancias Mínimas'
tema: colas_prioridad_heaps
bloom: 4
minutos_estimados: 35
pistas:
- Un nodo en el índice i tiene hijos en 2*i + 1 y 2*i + 2.
- El padre de un nodo i está en (i - 1) / 2.
tags:
- heap
- min_heap
- max_heap
- cola_prioridad
- estructuras_datos
- dep:colas_queue
- dep:arboles_binarios
- c11
- intermedia
verificado: true
funciones:
- nombre: ejecutar_heap_prio_21
  retorno: int
  parametros: int val
  descripcion: 'Procesa el flujo principal de Algoritmo de Dijkstra: Cola de Prioridad
    para Distancias Mínimas'
tests_funciones:
- nombre: test_ejecutar_heap_prio_21_positivo
  funcion: ejecutar_heap_prio_21
  codigo: 'int res = ejecutar_heap_prio_21(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_heap_prio_21_cero
  funcion: ejecutar_heap_prio_21
  codigo: 'int res = ejecutar_heap_prio_21(0);

    assert(res == 0);'
- nombre: test_ejecutar_heap_prio_21_negativo
  funcion: ejecutar_heap_prio_21
  codigo: 'int res = ejecutar_heap_prio_21(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_heap_prio_21_valor_limite
  funcion: ejecutar_heap_prio_21
  codigo: 'int res = ejecutar_heap_prio_21(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_heap_prio_21_valor_unitario
  funcion: ejecutar_heap_prio_21
  codigo: 'int res = ejecutar_heap_prio_21(1);

    assert(res >= 0 || res == 2);'
publicar: true
unidad: 4
modulo: Tipos Abstractos y Algorítmica
dificultad: intermedia
tipo: ejercicio_individual
prerrequisitos:
- colas_queue
- arboles_binarios
subtema: colas_prioridad_heaps
