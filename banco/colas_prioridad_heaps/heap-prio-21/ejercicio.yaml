id: heap-prio-21
titulo: Cola de prioridad para Dijkstra
tema: colas_prioridad_heaps
bloom: 4
minutos_estimados: 35
pistas:
- Un nodo en el índice i tiene hijos en 2*i + 1 y 2*i + 2.
- El padre de un nodo i está en (i - 1) / 2.
tags:
- heap
- min_heap
- max_heap
- cola_prioridad
- estructuras_datos
- dep:colas_queue
- dep:arboles_binarios
- c11
- intermedia
verificado: true
funciones:
- nombre: dijkstra_shortest_paths
  retorno: bool
  parametros: size_t vertices,const graph_edge_t *edges,size_t edge_count,size_t source,uint64_t *distances,size_t
    *predecessors
  descripcion: Calcula caminos mínimos desde un origen en grafo dirigido ponderado no negativo; entrega
    distancias UINT64_MAX para inalcanzables y predecesores SIZE_MAX. Detecta vértices inválidos y evita
    overflow de suma.
tests_funciones:
- nombre: test_21_graph
  funcion: dijkstra_shortest_paths
  codigo: graph_edge_t e[]={{0,1,4},{0,2,1},{2,1,2},{1,3,1},{2,3,5},{3,4,3}};uint64_t d[5];size_t p[5];assert(dijkstra_shortest_paths(5,e,6,0,d,p));assert(d[0]==0&&d[1]==3&&d[2]==1&&d[3]==4&&d[4]==7);assert(p[4]==3&&p[1]==2);
- nombre: test_21_unreachable_and_invalid
  funcion: dijkstra_shortest_paths
  codigo: graph_edge_t e[]={{0,4,1}};uint64_t d[3];size_t p[3];assert(!dijkstra_shortest_paths(3,e,1,0,d,p));assert(dijkstra_shortest_paths(3,NULL,0,1,d,p)&&d[0]==UINT64_MAX&&d[1]==0&&p[0]==SIZE_MAX);
publicar: true
unidad: 4
modulo: Tipos Abstractos y Algorítmica
dificultad: intermedia
prerrequisitos:
- colas_queue
- arboles_binarios
subtema: colas_prioridad_heaps
