id: heap-prio-07
titulo: Cola de prioridad de tareas
tema: colas_prioridad_heaps
bloom: 2
minutos_estimados: 15
pistas:
- Un nodo en el índice i tiene hijos en 2*i + 1 y 2*i + 2.
- El padre de un nodo i está en (i - 1) / 2.
tags:
- heap
- min_heap
- max_heap
- cola_prioridad
- estructuras_datos
- dep:colas_queue
- dep:arboles_binarios
- c11
- inicial
verificado: true
funciones:
- nombre: cola_init
  retorno: void
  parametros: cola_t *c
  descripcion: Cola de prioridad de tareas
- nombre: cola_push
  retorno: bool
  parametros: cola_t *c, tarea_t tarea
  descripcion: Cola de prioridad de tareas
- nombre: cola_pop
  retorno: bool
  parametros: cola_t *c, tarea_t *salida
  descripcion: Cola de prioridad de tareas
tests_funciones:
- nombre: test_07_resultado_funcional
  funcion: cola_init
  codigo: cola_t c; cola_init(&c); cola_push(&c,(tarea_t){2,10}); cola_push(&c,(tarea_t){5,20});
    cola_push(&c,(tarea_t){5,21}); tarea_t t; assert(cola_pop(&c,&t)&&t.id==20); assert(cola_pop(&c,&t)&&t.id==21);
    assert(cola_pop(&c,&t)&&t.id==10);
publicar: true
unidad: 4
modulo: Tipos Abstractos y Algorítmica
dificultad: inicial
tipo: practica_guiada
prerrequisitos:
