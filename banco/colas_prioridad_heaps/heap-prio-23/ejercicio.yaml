id: heap-prio-23
titulo: Heap dinámico de eventos
tema: colas_prioridad_heaps
bloom: 4
minutos_estimados: 35
pistas:
- Un nodo en el índice i tiene hijos en 2*i + 1 y 2*i + 2.
- El padre de un nodo i está en (i - 1) / 2.
tags:
- heap
- min_heap
- max_heap
- cola_prioridad
- estructuras_datos
- dep:colas_queue
- dep:arboles_binarios
- c11
- intermedia
verificado: true
funciones:
- nombre: event_heap_init
  retorno: void
  parametros: event_heap_t*q
  descripcion: Implementá un min-heap dinámico de eventos (instante uint64_t, id int), con inserción,
    extracción y liberación. Ordená por instante y luego id para desempatar determinísticamente. La capacidad
    aumenta geométricamente, con comprobación de desbordamiento y operaciones seguras para heap vacío.
- nombre: event_heap_push
  retorno: bool
  parametros: event_heap_t*q,event_t v
  descripcion: Implementá un min-heap dinámico de eventos (instante uint64_t, id int), con inserción,
    extracción y liberación. Ordená por instante y luego id para desempatar determinísticamente. La capacidad
    aumenta geométricamente, con comprobación de desbordamiento y operaciones seguras para heap vacío.
- nombre: event_heap_pop
  retorno: bool
  parametros: event_heap_t*q,event_t*out
  descripcion: Implementá un min-heap dinámico de eventos (instante uint64_t, id int), con inserción,
    extracción y liberación. Ordená por instante y luego id para desempatar determinísticamente. La capacidad
    aumenta geométricamente, con comprobación de desbordamiento y operaciones seguras para heap vacío.
- nombre: event_heap_destroy
  retorno: void
  parametros: event_heap_t*q
  descripcion: Implementá un min-heap dinámico de eventos (instante uint64_t, id int), con inserción,
    extracción y liberación. Ordená por instante y luego id para desempatar determinísticamente. La capacidad
    aumenta geométricamente, con comprobación de desbordamiento y operaciones seguras para heap vacío.
tests_funciones:
- nombre: test_events_orden
  funcion: event_heap_init
  codigo: event_heap_t q;event_t x;event_heap_init(&q);assert(event_heap_push(&q,(event_t){5,2}));assert(event_heap_push(&q,(event_t){3,9}));assert(event_heap_push(&q,(event_t){3,1}));assert(event_heap_pop(&q,&x)&&x.time==3&&x.id==1);event_heap_destroy(&q);
publicar: true
unidad: 4
modulo: Tipos Abstractos y Algorítmica
dificultad: intermedia
prerrequisitos:
- colas_queue
- arboles_binarios
subtema: colas_prioridad_heaps
