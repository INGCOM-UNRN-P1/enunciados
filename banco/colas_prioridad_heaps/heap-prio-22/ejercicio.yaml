id: heap-prio-22
titulo: Cola de prioridad de aristas para Prim
tema: colas_prioridad_heaps
bloom: 4
minutos_estimados: 35
pistas:
- Un nodo en el índice i tiene hijos en 2*i + 1 y 2*i + 2.
- El padre de un nodo i está en (i - 1) / 2.
tags:
- heap
- min_heap
- max_heap
- cola_prioridad
- estructuras_datos
- dep:colas_queue
- dep:arboles_binarios
- c11
- intermedia
verificado: true
funciones:
- nombre: prim_minimum_spanning_tree
  retorno: bool
  parametros: size_t vertices,const prim_edge_t *edges,size_t edge_count,size_t root,size_t *parent,uint64_t
    *total_weight
  descripcion: Calcula árbol de expansión mínima de grafo no dirigido ponderado mediante Prim y cola de
    prioridad; devuelve padre de cada vértice, raíz con SIZE_MAX y peso total. Retorna false en grafo
    desconectado, índices inválidos u overflow.
tests_funciones:
- nombre: test_22_graph
  funcion: prim_minimum_spanning_tree
  codigo: prim_edge_t e[]={{0,1,4},{0,2,3},{1,2,1},{1,3,2},{2,3,4},{3,4,2},{2,4,5}};size_t p[5];uint64_t
    w;assert(prim_minimum_spanning_tree(5,e,7,0,p,&w));assert(w==8&&p[2]==0&&p[1]==2&&p[3]==1&&p[4]==3);
- nombre: test_22_disconnected
  funcion: prim_minimum_spanning_tree
  codigo: prim_edge_t e[]={{0,1,2}};size_t p[3];uint64_t w;assert(!prim_minimum_spanning_tree(3,e,1,0,p,&w));
- nombre: test_22_peso_maximo
  funcion: prim_minimum_spanning_tree
  codigo: prim_edge_t e[]={{0,1,UINT64_MAX}};size_t p[2];uint64_t w;assert(prim_minimum_spanning_tree(2,e,1,0,p,&w));assert(w==UINT64_MAX&&p[1]==0);
publicar: true
unidad: 4
modulo: Tipos Abstractos y Algorítmica
dificultad: intermedia
prerrequisitos:
- colas_queue
- arboles_binarios
subtema: colas_prioridad_heaps
