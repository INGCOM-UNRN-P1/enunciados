id: heap-prio-16
titulo: 'Montículo de Fibonacci: inserción y unión'
tema: colas_prioridad_heaps
bloom: 3
minutos_estimados: 25
pistas:
- Un nodo en el índice i tiene hijos en 2*i + 1 y 2*i + 2.
- El padre de un nodo i está en (i - 1) / 2.
tags:
- heap
- min_heap
- max_heap
- cola_prioridad
- estructuras_datos
- dep:colas_queue
- dep:arboles_binarios
- c11
- intermedia
verificado: true
funciones:
- nombre: fib_init
  retorno: void
  parametros: fib_heap_t *h
  descripcion: 'Montículo de Fibonacci: inserción y unión'
- nombre: fib_insert
  retorno: bool
  parametros: fib_heap_t *h,int valor
  descripcion: 'Montículo de Fibonacci: inserción y unión'
- nombre: fib_union
  retorno: bool
  parametros: fib_heap_t *destino,fib_heap_t *origen
  descripcion: 'Montículo de Fibonacci: inserción y unión'
- nombre: fib_extract_min
  retorno: bool
  parametros: fib_heap_t *h,int *salida
  descripcion: 'Montículo de Fibonacci: inserción y unión'
- nombre: fib_destroy
  retorno: void
  parametros: fib_heap_t *h
  descripcion: 'Montículo de Fibonacci: inserción y unión'
tests_funciones:
- nombre: test_16_resultado_funcional
  funcion: fib_init
  codigo: fib_heap_t a,b; fib_init(&a); fib_init(&b); for(int i=39;i>=20;i--) assert(fib_insert(&a,i));
    for(int i=19;i>=0;i--) assert(fib_insert(&b,i)); assert(fib_union(&a,&b)); assert(b.min==NULL
    && b.n==0); int x; for(int i=0;i<40;i++) assert(fib_extract_min(&a,&x)&&x==i);
    assert(!fib_extract_min(&a,&x)); fib_destroy(&a); fib_destroy(&b);
publicar: true
unidad: 4
modulo: Tipos Abstractos y Algorítmica
dificultad: intermedia
tipo: practica_guiada
prerrequisitos:
- colas_queue
- arboles_binarios
subtema: colas_prioridad_heaps
