id: heap-prio-27
titulo: Cola de Prioridad Resiliente con Bloqueos para Concurrencia
tema: colas_prioridad_heaps
bloom: 5
minutos_estimados: 45
pistas:
- Un nodo en el índice i tiene hijos en 2*i + 1 y 2*i + 2.
- El padre de un nodo i está en (i - 1) / 2.
tags:
- heap
- min_heap
- max_heap
- cola_prioridad
- estructuras_datos
- dep:colas_queue
- dep:arboles_binarios
- c11
- avanzada
verificado: true
funciones:
- nombre: ejecutar_heap_prio_27
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Cola de Prioridad Resiliente con Bloqueos
    para Concurrencia
tests_funciones:
- nombre: test_ejecutar_heap_prio_27_positivo
  funcion: ejecutar_heap_prio_27
  codigo: 'int res = ejecutar_heap_prio_27(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_heap_prio_27_cero
  funcion: ejecutar_heap_prio_27
  codigo: 'int res = ejecutar_heap_prio_27(0);

    assert(res == 0);'
- nombre: test_ejecutar_heap_prio_27_negativo
  funcion: ejecutar_heap_prio_27
  codigo: 'int res = ejecutar_heap_prio_27(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_heap_prio_27_valor_limite
  funcion: ejecutar_heap_prio_27
  codigo: 'int res = ejecutar_heap_prio_27(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_heap_prio_27_valor_unitario
  funcion: ejecutar_heap_prio_27
  codigo: 'int res = ejecutar_heap_prio_27(1);

    assert(res >= 0 || res == 2);'
publicar: true
unidad: 4
modulo: Tipos Abstractos y Algorítmica
dificultad: avanzada
tipo: ejercicio_individual
prerrequisitos:
- colas_queue
- arboles_binarios
subtema: colas_prioridad_heaps
