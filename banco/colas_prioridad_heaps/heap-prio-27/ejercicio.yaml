id: heap-prio-27
titulo: Cola de prioridad concurrente y segura
tema: colas_prioridad_heaps
bloom: 5
minutos_estimados: 45
pistas:
- Un nodo en el índice i tiene hijos en 2*i + 1 y 2*i + 2.
- El padre de un nodo i está en (i - 1) / 2.
tags:
- heap
- min_heap
- max_heap
- cola_prioridad
- estructuras_datos
- dep:colas_queue
- dep:arboles_binarios
- c11
- avanzada
verificado: true
funciones:
- nombre: concurrent_pq_init
  retorno: bool
  parametros: concurrent_pq_t*q
  descripcion: 'Implementá una cola de prioridad min de enteros protegida por mutex C11 threads (mtx_t).
    API: init, push, try_pop, destroy. Cada operación concurrente es linealizable; try_pop retorna false
    en vacío sin tocar la salida. Documentá que no se admite operación concurrente con destroy.'
- nombre: concurrent_pq_push
  retorno: bool
  parametros: concurrent_pq_t*q,int v
  descripcion: 'Implementá una cola de prioridad min de enteros protegida por mutex C11 threads (mtx_t).
    API: init, push, try_pop, destroy. Cada operación concurrente es linealizable; try_pop retorna false
    en vacío sin tocar la salida. Documentá que no se admite operación concurrente con destroy.'
- nombre: concurrent_pq_try_pop
  retorno: bool
  parametros: concurrent_pq_t*q,int*out
  descripcion: 'Implementá una cola de prioridad min de enteros protegida por mutex C11 threads (mtx_t).
    API: init, push, try_pop, destroy. Cada operación concurrente es linealizable; try_pop retorna false
    en vacío sin tocar la salida. Documentá que no se admite operación concurrente con destroy.'
- nombre: concurrent_pq_destroy
  retorno: void
  parametros: concurrent_pq_t*q
  descripcion: 'Implementá una cola de prioridad min de enteros protegida por mutex C11 threads (mtx_t).
    API: init, push, try_pop, destroy. Cada operación concurrente es linealizable; try_pop retorna false
    en vacío sin tocar la salida. Documentá que no se admite operación concurrente con destroy.'
tests_funciones:
- nombre: test_concurrent_prioridad
  funcion: concurrent_pq_init
  codigo: concurrent_pq_t q;int x=88;assert(concurrent_pq_init(&q));assert(concurrent_pq_push(&q,4)&&concurrent_pq_push(&q,-1));assert(concurrent_pq_try_pop(&q,&x)&&x==-1);assert(concurrent_pq_try_pop(&q,&x)&&x==4);assert(!concurrent_pq_try_pop(&q,&x)&&x==4);concurrent_pq_destroy(&q);
publicar: true
unidad: 4
modulo: Tipos Abstractos y Algorítmica
dificultad: avanzada
prerrequisitos:
- colas_queue
- arboles_binarios
subtema: colas_prioridad_heaps
