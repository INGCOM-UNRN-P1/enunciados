tests_funciones:
- nombre: test_leftist_vacio
  funcion: leftist_heap_init
  codigo: leftist_heap_t h; int x=77; leftist_heap_init(&h); assert(!leftist_heap_pop(&h,&x)); assert(x==77);
    leftist_heap_destroy(&h);
- nombre: test_leftist_orden_y_meld
  funcion: leftist_heap_init
  codigo: leftist_heap_t a,b; int x; leftist_heap_init(&a);leftist_heap_init(&b);assert(leftist_heap_insert(&a,8));assert(leftist_heap_insert(&a,-2));assert(leftist_heap_insert(&b,3));assert(leftist_heap_meld(&a,&b));assert(b.root==NULL);assert(leftist_heap_pop(&a,&x)&&x==-2);assert(leftist_heap_pop(&a,&x)&&x==3);assert(leftist_heap_pop(&a,&x)&&x==8);leftist_heap_destroy(&a);
