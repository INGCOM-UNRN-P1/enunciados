id: heap-prio-18
titulo: Montículo leftist de mínimos con distancia nula
tema: colas_prioridad_heaps
bloom: 3
minutos_estimados: 25
pistas:
- Un nodo en el índice i tiene hijos en 2*i + 1 y 2*i + 2.
- El padre de un nodo i está en (i - 1) / 2.
tags:
- heap
- min_heap
- max_heap
- cola_prioridad
- estructuras_datos
- dep:colas_queue
- dep:arboles_binarios
- c11
- intermedia
verificado: true
funciones:
- nombre: leftist_heap_init
  retorno: void
  parametros: leftist_heap_t *h
  descripcion: 'Implementá un leftist heap min con rango nulo (NPL). La API permite inicializar, insertar,
    consultar y extraer el mínimo, fusionar dos heaps y liberar nodos. La fusión consume el segundo heap
    y lo deja vacío. Operaciones: init, insert, peek, pop, meld, destroy. NULL y heap vacío se manejan
    sin desreferencias; insert devuelve false si no puede reservar memoria.'
- nombre: leftist_heap_insert
  retorno: bool
  parametros: leftist_heap_t *h,int key
  descripcion: 'Implementá un leftist heap min con rango nulo (NPL). La API permite inicializar, insertar,
    consultar y extraer el mínimo, fusionar dos heaps y liberar nodos. La fusión consume el segundo heap
    y lo deja vacío. Operaciones: init, insert, peek, pop, meld, destroy. NULL y heap vacío se manejan
    sin desreferencias; insert devuelve false si no puede reservar memoria.'
