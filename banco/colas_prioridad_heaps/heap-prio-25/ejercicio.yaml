- dep:arboles_binarios
- c11
- intermedia
verificado: true
funciones:
- nombre: is_min_heap
  retorno: bool
  parametros: const int*a,size_t n
  descripcion: Validación de heap sobre arreglo
- nombre: is_max_heap
  retorno: bool
  parametros: const int*a,size_t n
  descripcion: Validación de heap sobre arreglo
tests_funciones:
- nombre: test_25_significativos
  funcion: is_min_heap
  codigo: int a[]={-3,-3,0,8,9,4};int b[]={9,8,7,1,2,6};assert(is_min_heap(a,6)&&!is_max_heap(a,6));assert(is_max_heap(b,6)&&!is_min_heap(b,6));assert(is_min_heap(NULL,0)&&is_max_heap(NULL,0));assert(!is_min_heap(NULL,1));
