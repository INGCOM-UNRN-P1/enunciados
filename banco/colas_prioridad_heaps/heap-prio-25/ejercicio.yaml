id: heap-prio-25
titulo: Verificación de Invariante de Montículo sobre Arreglo Arbitrario
tema: colas_prioridad_heaps
bloom: 4
minutos_estimados: 35
pistas:
- Un nodo en el índice i tiene hijos en 2*i + 1 y 2*i + 2.
- El padre de un nodo i está en (i - 1) / 2.
tags:
- heap
- min_heap
- max_heap
- cola_prioridad
- estructuras_datos
- dep:colas_queue
- dep:arboles_binarios
- c11
- intermedia
verificado: true
funciones:
- nombre: ejecutar_heap_prio_25
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Verificación de Invariante de Montículo
    sobre Arreglo Arbitrario
tests_funciones:
- nombre: test_ejecutar_heap_prio_25_positivo
  funcion: ejecutar_heap_prio_25
  codigo: 'int res = ejecutar_heap_prio_25(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_heap_prio_25_cero
  funcion: ejecutar_heap_prio_25
  codigo: 'int res = ejecutar_heap_prio_25(0);

    assert(res == 0);'
- nombre: test_ejecutar_heap_prio_25_negativo
  funcion: ejecutar_heap_prio_25
  codigo: 'int res = ejecutar_heap_prio_25(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_heap_prio_25_valor_limite
  funcion: ejecutar_heap_prio_25
  codigo: 'int res = ejecutar_heap_prio_25(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_heap_prio_25_valor_unitario
  funcion: ejecutar_heap_prio_25
  codigo: 'int res = ejecutar_heap_prio_25(1);

    assert(res >= 0 || res == 2);'
publicar: true
unidad: 4
modulo: Tipos Abstractos y Algorítmica
dificultad: intermedia
prerrequisitos:
- colas_queue
- arboles_binarios
subtema: colas_prioridad_heaps
