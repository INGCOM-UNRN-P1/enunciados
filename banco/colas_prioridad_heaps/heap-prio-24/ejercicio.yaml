tests_funciones:
- nombre: test_24_invariantes
  funcion: minmax_valid
  codigo: minmax_heap_t h;int x;minmax_init(&h);int v[]={10,3,7,1,8,14,2,9,6,12,4,11,5,13,0};for(size_t
    i=0;i<15;i++){assert(minmax_insert(&h,v[i]));assert(minmax_valid(&h));}for(int k=0;k<7;k++){assert(minmax_pop_min(&h,&x)&&x==k);assert(minmax_valid(&h));assert(minmax_pop_max(&h,&x)&&x==14-k);assert(minmax_valid(&h));}assert(minmax_pop_min(&h,&x)&&x==7);minmax_destroy(&h);
- nombre: test_24_duplicados
  funcion: minmax_valid
  codigo: minmax_heap_t h;int x;minmax_init(&h);for(int i=0;i<20;i++)assert(minmax_insert(&h,5));assert(minmax_valid(&h));assert(minmax_min(&h,&x)&&x==5);assert(minmax_max(&h,&x)&&x==5);for(int
    i=0;i<20;i++){assert(minmax_pop_max(&h,&x)&&x==5);assert(minmax_valid(&h));}assert(!minmax_pop_min(&h,&x));minmax_destroy(&h);
- nombre: test_24_stress_determinista_referencia
  funcion: minmax_valid
  codigo: minmax_heap_t h;int ref[256],n=0,x;unsigned state=0xC0FFEEu;minmax_init(&h);for(int step=0;step<2000;step++){state=state*1664525u+1013904223u;unsigned
    op=(state>>16)%4u;if(n==0||op==0){state=state*1664525u+1013904223u;int v=(int)(state%2001u)-1000;assert(n<256&&minmax_insert(&h,v));ref[n++]=v;}else{for(int
    a=0;a<n;a++)for(int b=a+1;b<n;b++)if(ref[a]>ref[b]){int t=ref[a];ref[a]=ref[b];ref[b]=t;}if(op==1){assert(minmax_pop_min(&h,&x)&&x==ref[0]);for(int
    j=1;j<n;j++)ref[j-1]=ref[j];n--;}else if(op==2){assert(minmax_pop_max(&h,&x)&&x==ref[n-1]);n--;}else{assert(minmax_min(&h,&x)&&x==ref[0]);assert(minmax_max(&h,&x)&&x==ref[n-1]);}}assert(minmax_valid(&h));for(int
    a=0;a<n;a++)for(int b=a+1;b<n;b++)if(ref[a]>ref[b]){int z=ref[a];ref[a]=ref[b];ref[b]=z;}assert(h.n==(size_t)n);if(n){assert(minmax_min(&h,&x)&&x==ref[0]);assert(minmax_max(&h,&x)&&x==ref[n-1]);}}while(n){assert(minmax_pop_min(&h,&x)&&x==ref[0]);for(int
    j=1;j<n;j++)ref[j-1]=ref[j];n--;assert(minmax_valid(&h));}minmax_destroy(&h);
