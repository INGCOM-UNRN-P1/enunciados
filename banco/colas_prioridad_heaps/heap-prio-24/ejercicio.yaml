id: heap-prio-24
titulo: Min-max heap de doble extremo
tema: colas_prioridad_heaps
bloom: 4
minutos_estimados: 35
pistas:
- Un nodo en el índice i tiene hijos en 2*i + 1 y 2*i + 2.
- El padre de un nodo i está en (i - 1) / 2.
tags:
- heap
- min_heap
- max_heap
- cola_prioridad
- estructuras_datos
- dep:colas_queue
- dep:arboles_binarios
- c11
- intermedia
verificado: true
funciones:
- nombre: minmax_init
  retorno: void
  parametros: minmax_heap_t*h
  descripcion: 'Implementa min-max heap auténtico: consulta de extremos O(1), inserción y extracciones
    O(log n). La validadora comprueba relación de cada nodo con hijos y nietos; acepta duplicados y maneja
    heap vacío.'
