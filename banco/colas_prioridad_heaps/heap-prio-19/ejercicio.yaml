id: heap-prio-19
titulo: Planificador de tareas con min-heap
tema: colas_prioridad_heaps
bloom: 3
minutos_estimados: 25
pistas:
- Un nodo en el índice i tiene hijos en 2*i + 1 y 2*i + 2.
- El padre de un nodo i está en (i - 1) / 2.
tags:
- heap
- min_heap
- max_heap
- cola_prioridad
- estructuras_datos
- dep:colas_queue
- dep:arboles_binarios
- c11
- intermedia
verificado: true
funciones:
- nombre: scheduler_init
  retorno: void
  parametros: scheduler_t*q
  descripcion: Implementá una cola de tareas en arreglo dinámico, ordenada por prioridad ascendente y
    FIFO entre prioridades iguales. Cada tarea tiene prioridad entera y secuencia de inserción. Proveer
    inicialización, inserción, extracción y destrucción; extracción informa false cuando está vacía. La
    capacidad crece geométricamente y se detecta overflow de tamaños.
- nombre: scheduler_push
  retorno: bool
  parametros: scheduler_t*q,int priority
  descripcion: Implementá una cola de tareas en arreglo dinámico, ordenada por prioridad ascendente y
    FIFO entre prioridades iguales. Cada tarea tiene prioridad entera y secuencia de inserción. Proveer
    inicialización, inserción, extracción y destrucción; extracción informa false cuando está vacía. La
    capacidad crece geométricamente y se detecta overflow de tamaños.
- nombre: scheduler_pop
  retorno: bool
  parametros: scheduler_t*q,task_t*out
  descripcion: Implementá una cola de tareas en arreglo dinámico, ordenada por prioridad ascendente y
    FIFO entre prioridades iguales. Cada tarea tiene prioridad entera y secuencia de inserción. Proveer
    inicialización, inserción, extracción y destrucción; extracción informa false cuando está vacía. La
    capacidad crece geométricamente y se detecta overflow de tamaños.
- nombre: scheduler_destroy
  retorno: void
  parametros: scheduler_t*q
  descripcion: Implementá una cola de tareas en arreglo dinámico, ordenada por prioridad ascendente y
    FIFO entre prioridades iguales. Cada tarea tiene prioridad entera y secuencia de inserción. Proveer
    inicialización, inserción, extracción y destrucción; extracción informa false cuando está vacía. La
    capacidad crece geométricamente y se detecta overflow de tamaños.
tests_funciones:
- nombre: test_scheduler_prioridad_fifo
  funcion: scheduler_init
  codigo: scheduler_t q;task_t t;scheduler_init(&q);assert(scheduler_push(&q,3));assert(scheduler_push(&q,1));assert(scheduler_push(&q,1));assert(scheduler_pop(&q,&t)&&t.priority==1&&t.seq==1);assert(scheduler_pop(&q,&t)&&t.priority==1&&t.seq==2);assert(scheduler_pop(&q,&t)&&t.priority==3);scheduler_destroy(&q);
- nombre: test_scheduler_vacio
  funcion: scheduler_init
  codigo: scheduler_t q;task_t t;scheduler_init(&q);assert(!scheduler_pop(&q,&t));scheduler_destroy(&q);
publicar: true
unidad: 4
modulo: Tipos Abstractos y Algorítmica
dificultad: intermedia
tipo: practica_guiada
prerrequisitos:
- colas_queue
- arboles_binarios
subtema: colas_prioridad_heaps
