id: heap-prio-02
titulo: 'Max-Heap binario: inserción y extracción del máximo'
tema: colas_prioridad_heaps
bloom: 1
minutos_estimados: 10
pistas:
- Un nodo en el índice i tiene hijos en 2*i + 1 y 2*i + 2.
- El padre de un nodo i está en (i - 1) / 2.
tags:
- heap
- min_heap
- max_heap
- cola_prioridad
- estructuras_datos
- dep:colas_queue
- dep:arboles_binarios
- c11
- inicial
verificado: true
funciones:
- nombre: max_heap_push
  retorno: bool
  parametros: max_heap_t *h, int valor
  descripcion: 'Max-Heap binario: inserción y extracción del máximo'
- nombre: max_heap_pop
  retorno: bool
  parametros: max_heap_t *h, int *salida
  descripcion: 'Max-Heap binario: inserción y extracción del máximo'
tests_funciones:
- nombre: test_02_resultado_funcional
  funcion: max_heap_push
  codigo: max_heap_t h; max_heap_init(&h); max_heap_push(&h,3); max_heap_push(&h,9); max_heap_push(&h,-1); int x;
    assert(max_heap_pop(&h,&x)&&x==9); assert(max_heap_pop(&h,&x)&&x==3); assert(max_heap_pop(&h,&x)&&x==-1);
publicar: true
unidad: 4
modulo: Tipos Abstractos y Algorítmica
dificultad: inicial
tipo: practica_guiada
prerrequisitos:
- colas_queue
- arboles_binarios
subtema: colas_prioridad_heaps
