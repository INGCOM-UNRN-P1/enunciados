id: heap-prio-29
titulo: Serialización y reconstrucción de min-heap
tema: colas_prioridad_heaps
bloom: 5
minutos_estimados: 45
pistas:
- Un nodo en el índice i tiene hijos en 2*i + 1 y 2*i + 2.
- El padre de un nodo i está en (i - 1) / 2.
tags:
- heap
- min_heap
- max_heap
- cola_prioridad
- estructuras_datos
- dep:colas_queue
- dep:arboles_binarios
- c11
- avanzada
verificado: true
funciones:
- nombre: min_heap_serialize
  retorno: bool
  parametros: const int32_t*a,size_t n,char*out,size_t cap,size_t*needed
  descripcion: 'Implementá serialización binaria portable lógica de un min-heap de int32_t: formato textual
    decimal separado por espacios y reconstrucción desde texto en buffer terminado en NUL. Serializar
    debe rechazar capacidad insuficiente, reconstruir valida todos los tokens y la propiedad min-heap.
    Formato vacío es cadena vacía.'
- nombre: min_heap_parse
  retorno: bool
  parametros: const char*text,int32_t*out,size_t cap,size_t*n
  descripcion: 'Implementá serialización binaria portable lógica de un min-heap de int32_t: formato textual
    decimal separado por espacios y reconstrucción desde texto en buffer terminado en NUL. Serializar
    debe rechazar capacidad insuficiente, reconstruir valida todos los tokens y la propiedad min-heap.
    Formato vacío es cadena vacía.'
tests_funciones:
- nombre: test_serialize_roundtrip
  funcion: min_heap_serialize
  codigo: int32_t a[]={-2,0,3,9};char b[64];size_t need,n;int32_t x[4];assert(min_heap_serialize(a,4,b,sizeof(b),&need));assert(min_heap_parse(b,x,4,&n)&&n==4);for(size_t
    i=0;i<4;i++)assert(a[i]==x[i]);
- nombre: test_serialize_invalidos
  funcion: min_heap_serialize
  codigo: int32_t x[3];size_t n;assert(!min_heap_parse("1 0 2",x,3,&n));char b[1];size_t need;int32_t
    a[]={1,2};assert(!min_heap_serialize(a,2,b,1,&need));
publicar: true
unidad: 4
modulo: Tipos Abstractos y Algorítmica
dificultad: avanzada
prerrequisitos:
- colas_queue
- arboles_binarios
subtema: colas_prioridad_heaps
