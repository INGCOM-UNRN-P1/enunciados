id: heap-prio-11
titulo: K-ésimo mayor con heap de tamaño k
tema: colas_prioridad_heaps
bloom: 2
minutos_estimados: 15
pistas:
- Un nodo en el índice i tiene hijos en 2*i + 1 y 2*i + 2.
- El padre de un nodo i está en (i - 1) / 2.
tags:
- heap
- min_heap
- max_heap
- cola_prioridad
- estructuras_datos
- dep:colas_queue
- dep:arboles_binarios
- c11
- inicial
verificado: true
funciones:
- nombre: kth_largest
  retorno: bool
  parametros: const int *a,size_t n,size_t k,int *resultado
  descripcion: K-ésimo mayor con heap de tamaño k
tests_funciones:
- nombre: test_11_resultado_funcional
  funcion: kth_largest
  codigo: int a[]={1,2,3,4,100,100,0,90}; int x=123; assert(kth_largest(a,8,4,&x)&&x==4);
    assert(kth_largest(a,8,3,&x)&&x==90); assert(kth_largest(a,8,1,&x)&&x==100); assert(kth_largest(a,8,8,&x)&&x==0);
    x=123; assert(!kth_largest(a,8,0,&x)&&x==123); assert(!kth_largest(a,8,9,&x)&&x==123);
    assert(!kth_largest(NULL,8,1,&x)); assert(!kth_largest(a,8,1,NULL));
publicar: true
unidad: 4
modulo: Tipos Abstractos y Algorítmica
dificultad: inicial
tipo: practica_guiada
