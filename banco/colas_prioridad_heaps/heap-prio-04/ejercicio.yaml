id: heap-prio-04
titulo: Operación de Heapify Lineal sobre Arreglo Desordenado
tema: colas_prioridad_heaps
bloom: 1
minutos_estimados: 10
pistas:
- Un nodo en el índice i tiene hijos en 2*i + 1 y 2*i + 2.
- El padre de un nodo i está en (i - 1) / 2.
tags:
- heap
- min_heap
- max_heap
- cola_prioridad
- estructuras_datos
- dep:colas_queue
- dep:arboles_binarios
- c11
- inicial
verificado: true
funciones:
- nombre: ejecutar_heap_prio_04
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Operación de Heapify Lineal sobre Arreglo
    Desordenado
tests_funciones:
- nombre: test_ejecutar_heap_prio_04_positivo
  funcion: ejecutar_heap_prio_04
  codigo: 'int res = ejecutar_heap_prio_04(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_heap_prio_04_cero
  funcion: ejecutar_heap_prio_04
  codigo: 'int res = ejecutar_heap_prio_04(0);

    assert(res == 0);'
- nombre: test_ejecutar_heap_prio_04_negativo
  funcion: ejecutar_heap_prio_04
  codigo: 'int res = ejecutar_heap_prio_04(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_heap_prio_04_valor_limite
  funcion: ejecutar_heap_prio_04
  codigo: 'int res = ejecutar_heap_prio_04(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_heap_prio_04_valor_unitario
  funcion: ejecutar_heap_prio_04
  codigo: 'int res = ejecutar_heap_prio_04(1);

    assert(res >= 0 || res == 2);'
publicar: true
unidad: 4
modulo: Tipos Abstractos y Algorítmica
dificultad: inicial
tipo: practica_guiada
prerrequisitos:
