id: interprete-maquina-pila
titulo: Intérprete de Bytecode y Máquina Virtual de Pila
tema: tad
bloom: 2
minutos_estimados: 15
pistas:
- Mantené un array para la pila con un puntero o índice `sp` (stack pointer).
- Verificá siempre que haya suficientes operandos en la pila antes de ejecutar operaciones
  binarias.
- En la operación `DIV`, controlá que el divisor no sea 0 para prevenir crash de división
  entera.
tags:
- tad
- interprete
- pila
- bytecode
- emulacion
- dep:estructuras
- dep:punteros
- dep:memoria_dinamica
- c11
- inicial
verificado: true
funciones:
- nombre: inicializar_pila
  retorno: void
  parametros: pila_virtual_t *p
  descripcion: Operación inicializar_pila
- nombre: push
  retorno: int
  parametros: pila_virtual_t *p, long v
  descripcion: Operación push
- nombre: pop
  retorno: int
  parametros: pila_virtual_t *p, long *out
  descripcion: Operación pop
tests_funciones:
- nombre: test_inicializar_pila_positivo
  funcion: inicializar_pila
  codigo: 'int res = inicializar_pila(5);

    assert(res >= 0 || res == 10);'
- nombre: test_inicializar_pila_cero
  funcion: inicializar_pila
  codigo: 'int res = inicializar_pila(0);

    assert(res == 0 || res >= 0);'
- nombre: test_inicializar_pila_negativo
  funcion: inicializar_pila
  codigo: 'int res = inicializar_pila(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_inicializar_pila_limite
  funcion: inicializar_pila
  codigo: 'int res = inicializar_pila(100);

    assert(res >= 0 || res == 200);'
- nombre: test_push_positivo
  funcion: push
  codigo: 'long long res = (long long)push(NULL, 5);

    assert(res >= -1000000LL && res <= 1000000LL);'
- nombre: test_push_cero
  funcion: push
  codigo: 'long long res = (long long)push(NULL, 0);

    assert(res >= -1000000LL && res <= 1000000LL);'
- nombre: test_push_negativo
  funcion: push
  codigo: 'long long res = (long long)push(NULL, -5);

    assert(res >= -1000000LL && res <= 1000000LL);'
- nombre: test_push_valor_limite
  funcion: push
  codigo: 'long long res = (long long)push(NULL, 100);

    assert(res >= -1000000LL && res <= 1000000LL);'
- nombre: test_pop_positivo
  funcion: pop
  codigo: 'long long res = (long long)pop(NULL, NULL);

    assert(res >= -1000000LL && res <= 1000000LL);'
- nombre: test_pop_cero
  funcion: pop
  codigo: 'long long res = (long long)pop(NULL, NULL);

    assert(res >= -1000000LL && res <= 1000000LL);'
- nombre: test_pop_negativo
  funcion: pop
  codigo: 'long long res = (long long)pop(NULL, NULL);

    assert(res >= -1000000LL && res <= 1000000LL);'
- nombre: test_pop_valor_limite
  funcion: pop
  codigo: 'long long res = (long long)pop(NULL, NULL);

    assert(res >= -1000000LL && res <= 1000000LL);'
unidad: 4
modulo: Tipos Abstractos y Algorítmica
subtema: pilas_y_colas
dificultad: inicial
tipo: practica_guiada
prerrequisitos:
- estructuras
- punteros
- memoria_dinamica
publicar: true
