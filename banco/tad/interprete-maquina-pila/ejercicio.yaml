id: interprete-maquina-pila
titulo: Intérprete de Bytecode y Máquina Virtual de Pila
tema: tad
bloom: 2
minutos_estimados: 15
pistas:
- Mantené un array para la pila con un puntero o índice `sp` (stack pointer).
- Verificá siempre que haya suficientes operandos en la pila antes de ejecutar 
  operaciones binarias.
- En la operación `DIV`, controlá que el divisor no sea 0 para prevenir crash de
  división entera.
