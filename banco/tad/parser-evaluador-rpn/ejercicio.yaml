id: parser-evaluador-rpn
titulo: Evaluador de Expresiones en Notación Polaca Inversa (RPN)
tema: tad
bloom: 1
minutos_estimados: 10
pistas:
- Tokenizá la entrada por espacios.
- Si el token es un operador (+, -, *, /), desapilá dos operandos, calculá op(b,
  a) y apilá el resultado.
- Si es un número, convertilo con strtol() o atoi() y apilalo en la pila de 
  evaluación.
