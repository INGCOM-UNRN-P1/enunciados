id: geom-comp-26
titulo: Segmentación Voronoi y Asignación de Puntos al Sitio Más Cercano
tema: geometria_computacional
bloom: 4
minutos_estimados: 35
pistas:
- Buscá el sitio mínimo por cada punto.
- Actualizá solo si la distancia es estrictamente menor.
tags:
- geometria
- vectores
- puntos
- interseccion
- dep:estructuras
- dep:aritmetica
- c11
- intermedia
verificado: false
funciones:
- nombre: asignar_sitios
  retorno: bool
  parametros: const punto2d_t*,size_t,const punto2d_t*,size_t,size_t*
  descripcion: Asigna cada punto al sitio de menor distancia; empates al índice menor; falso sin sitios.
tests_funciones:
- nombre: asigna_y_empata
  funcion: asignar_sitios
  codigo: punto2d_t p[]={{0,0},{9,0},{5,0}},s[]={{0,0},{10,0}}; size_t o[3]; assert(asignar_sitios(p,3,s,2,o)&&o[0]==0&&o[1]==1&&o[2]==0);
- nombre: un_sitio
  funcion: asignar_sitios
  codigo: punto2d_t p[]={{-1,4},{8,2}},s={0,0}; size_t o[2]; assert(asignar_sitios(p,2,&s,1,o)&&o[0]==0&&o[1]==0);
- nombre: sin_sitios
  funcion: asignar_sitios
  codigo: punto2d_t p={0,0}; size_t o; assert(!asignar_sitios(&p,1,NULL,0,&o));
publicar: true
unidad: 4
modulo: Tipos Abstractos y Algorítmica
dificultad: intermedia
prerrequisitos:
- estructuras
- aritmetica
subtema: '26'
