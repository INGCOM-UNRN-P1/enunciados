id: geom-comp-22
titulo: Cálculo del Perímetro de Polígonos Irregulares
tema: geometria_computacional
bloom: 4
minutos_estimados: 35
pistas:
- Sumá lados consecutivos y cerrá al primero.
- Usá hypot para cada longitud.
tags:
- geometria
- vectores
- puntos
- interseccion
- dep:estructuras
- dep:aritmetica
- c11
- intermedia
verificado: false
funciones:
- nombre: perimetro_poligono
  retorno: double
  parametros: const punto2d_t*,size_t
  descripcion: Suma longitudes de lados consecutivos y el lado de cierre; 0 para menos de dos puntos.
tests_funciones:
- nombre: cuadrado
  funcion: perimetro_poligono
  codigo: punto2d_t p[]={{0,0},{2,0},{2,2},{0,2}}; assert(fabs(perimetro_poligono(p,4)-8)<1e-9);
- nombre: triangulo
  funcion: perimetro_poligono
  codigo: punto2d_t p[]={{0,0},{3,0},{0,4}}; assert(fabs(perimetro_poligono(p,3)-12)<1e-9);
- nombre: vacio
  funcion: perimetro_poligono
  codigo: assert(perimetro_poligono(NULL,0)==0);
publicar: true
unidad: 4
modulo: Tipos Abstractos y Algorítmica
dificultad: intermedia
prerrequisitos:
- estructuras
- aritmetica
subtema: '22'
