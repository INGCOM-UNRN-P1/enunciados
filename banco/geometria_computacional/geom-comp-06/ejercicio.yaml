id: geom-comp-06
titulo: Distancia de un Punto a un Segmento de Recta
tema: geometria_computacional
bloom: 1
minutos_estimados: 10
pistas:
- Aplicá fórmulas algebraicas de vectores.
- Cuidá el redondeo en cálculos de punto flotante.
tags:
- geometria
- vectores
- puntos
- interseccion
- dep:estructuras
- dep:aritmetica
- c11
- inicial
verificado: true
funciones:
- nombre: distancia_punto_segmento
  retorno: double
  parametros: punto2d_t p, punto2d_t a, punto2d_t b
  descripcion: Distancia de punto a segmento
tests_funciones:
- nombre: proyeccion_interior
  funcion: distancia_punto_segmento
  codigo: assert(fabs(distancia_punto_segmento((punto2d_t){2,3},(punto2d_t){0,0},(punto2d_t){4,0})-3)<1e-9);
- nombre: proyeccion_recortada
  funcion: distancia_punto_segmento
  codigo: assert(fabs(distancia_punto_segmento((punto2d_t){-1,0},(punto2d_t){0,0},(punto2d_t){4,0})-1)<1e-9);
- nombre: segmento_degenerado
  funcion: distancia_punto_segmento
  codigo: assert(fabs(distancia_punto_segmento((punto2d_t){3,4},(punto2d_t){0,0},(punto2d_t){0,0})-5)<1e-9);
publicar: true
unidad: 4
modulo: Tipos Abstractos y Algorítmica
dificultad: inicial
tipo: practica_guiada
prerrequisitos:
