id: geom-comp-04
titulo: Punto Medio y Distancia Manhattan entre Puntos
tema: geometria_computacional
bloom: 1
minutos_estimados: 10
pistas:
- Aplicá fórmulas algebraicas de vectores.
- Cuidá el redondeo en cálculos de punto flotante.
tags:
- geometria
- vectores
- puntos
- interseccion
- dep:estructuras
- dep:aritmetica
- c11
- inicial
verificado: true
funciones:
- nombre: punto_medio
  retorno: punto2d_t
  parametros: punto2d_t a, punto2d_t b
  descripcion: Punto medio y distancia Manhattan
- nombre: distancia_manhattan
  retorno: double
  parametros: punto2d_t a, punto2d_t b
  descripcion: Punto medio y distancia Manhattan
tests_funciones:
- nombre: punto_medio
  funcion: punto_medio
  codigo: punto2d_t m=punto_medio((punto2d_t){-2,4},(punto2d_t){4,0}); assert(fabs(m.x-1)<1e-9&&fabs(m.y-2)<1e-9);
- nombre: manhattan
  funcion: distancia_manhattan
  codigo: assert(distancia_manhattan((punto2d_t){-2,4},(punto2d_t){4,0})==10);
- nombre: manhattan_cero
  funcion: distancia_manhattan
  codigo: punto2d_t p={2.5,-3}; assert(distancia_manhattan(p,p)==0);
publicar: true
