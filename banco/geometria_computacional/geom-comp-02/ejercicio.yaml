id: geom-comp-02
titulo: Producto escalar y ángulo entre dos vectores
tema: geometria_computacional
bloom: 1
minutos_estimados: 10
pistas:
- Aplicá fórmulas algebraicas de vectores.
- Cuidá el redondeo en cálculos de punto flotante.
tags:
- geometria
- vectores
- puntos
- interseccion
- dep:estructuras
- dep:aritmetica
- c11
- inicial
verificado: true
funciones:
- nombre: producto_escalar
  retorno: double
  parametros: vector2d_t a, vector2d_t b
  descripcion: Producto escalar y ángulo entre vectores
- nombre: angulo_entre_vectores
  retorno: bool
  parametros: vector2d_t a, vector2d_t b, double *radianes
  descripcion: Producto escalar y ángulo entre vectores
tests_funciones:
- nombre: producto_ortogonal
  funcion: producto_escalar
  codigo: vector2d_t x={1,0}, y={0,1}; assert(producto_escalar(x,y)==0.0);
- nombre: angulo_recto
  funcion: angulo_entre_vectores
  codigo: vector2d_t x={1,0}, y={0,1}; double r; assert(angulo_entre_vectores(x,y,&r)); assert(fabs(r-acos(-1.0)/2)<1e-9);
- nombre: angulo_opuesto
  funcion: angulo_entre_vectores
  codigo: vector2d_t x={1,0}, y={-1,0}; double r; assert(angulo_entre_vectores(x,y,&r)); assert(fabs(r-acos(-1.0))<1e-9);
- nombre: vector_nulo
  funcion: angulo_entre_vectores
  codigo: vector2d_t x={0,0}, y={1,0}; double r; assert(!angulo_entre_vectores(x,y,&r));
publicar: true
unidad: 4
modulo: Tipos Abstractos y Algorítmica
dificultad: inicial
tipo: practica_guiada
prerrequisitos:
- estructuras
- aritmetica
subtema: '02'
