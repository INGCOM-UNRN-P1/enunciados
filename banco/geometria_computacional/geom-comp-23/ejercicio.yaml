id: geom-comp-23
titulo: Detección de Autointersección en Polilíneas
tema: geometria_computacional
bloom: 4
minutos_estimados: 35
pistas:
- Comprobá alternancia de orientaciones.
- Incluí casos colineales y contacto.
tags:
- geometria
- vectores
- puntos
- interseccion
- dep:estructuras
- dep:aritmetica
- c11
- intermedia
verificado: false
funciones:
- nombre: polilinea_autointersecta
  retorno: bool
  parametros: const punto2d_t*,size_t
  descripcion: Detecta cruces o contactos entre segmentos no adyacentes de una polilínea abierta.
tests_funciones:
- nombre: cruzada
  funcion: polilinea_autointersecta
  codigo: punto2d_t p[]={{0,0},{2,2},{0,2},{2,0}}; assert(polilinea_autointersecta(p,4));
- nombre: limpia
  funcion: polilinea_autointersecta
  codigo: punto2d_t p[]={{0,0},{1,0},{1,1},{2,1}}; assert(!polilinea_autointersecta(p,4));
- nombre: contacto
  funcion: polilinea_autointersecta
  codigo: punto2d_t p[]={{0,0},{2,0},{2,2},{1,0}}; assert(polilinea_autointersecta(p,4));
publicar: true
unidad: 4
modulo: Tipos Abstractos y Algorítmica
dificultad: intermedia
prerrequisitos:
- estructuras
- aritmetica
subtema: '23'
