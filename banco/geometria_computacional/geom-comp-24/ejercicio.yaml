id: geom-comp-24
titulo: Proyección Ortogonal de un Punto sobre una Recta
tema: geometria_computacional
bloom: 4
minutos_estimados: 35
pistas:
- Usá el producto punto para hallar el parámetro.
- No limites t al segmento.
tags:
- geometria
- vectores
- puntos
- interseccion
- dep:estructuras
- dep:aritmetica
- c11
- intermedia
verificado: false
funciones:
- nombre: proyectar_punto_recta
  retorno: bool
  parametros: punto2d_t,punto2d_t,punto2d_t,punto2d_t*
  descripcion: Proyección ortogonal sobre recta infinita AB; falso si A=B.
tests_funciones:
- nombre: horizontal
  funcion: proyectar_punto_recta
  codigo: punto2d_t r; assert(proyectar_punto_recta((punto2d_t){2,3},(punto2d_t){0,0},(punto2d_t){4,0},&r)&&r.x==2&&r.y==0);
- nombre: afuera
  funcion: proyectar_punto_recta
  codigo: punto2d_t r; assert(proyectar_punto_recta((punto2d_t){3,1},(punto2d_t){0,0},(punto2d_t){1,0},&r)&&r.x==3&&r.y==0);
- nombre: degenerada
  funcion: proyectar_punto_recta
  codigo: punto2d_t r; assert(!proyectar_punto_recta((punto2d_t){1,2},(punto2d_t){0,0},(punto2d_t){0,0},&r));
publicar: true
unidad: 4
modulo: Tipos Abstractos y Algorítmica
dificultad: intermedia
prerrequisitos:
- estructuras
- aritmetica
subtema: '24'
