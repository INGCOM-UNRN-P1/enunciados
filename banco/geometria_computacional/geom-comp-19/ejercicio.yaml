id: geom-comp-19
titulo: Escalamiento y Traslación de Polígonos 2D
tema: geometria_computacional
bloom: 3
minutos_estimados: 25
pistas:
- Escalá antes de trasladar.
- La escala cero aplana ese eje.
tags:
- geometria
- vectores
- puntos
- interseccion
- dep:estructuras
- dep:aritmetica
- c11
- intermedia
verificado: false
funciones:
- nombre: escalar_trasladar
  retorno: bool
  parametros: punto2d_t*,size_t,double,double,punto2d_t
  descripcion: Escala independientemente por eje y luego traslada in situ.
tests_funciones:
- nombre: transforma
  funcion: escalar_trasladar
  codigo: punto2d_t p[]={{1,2},{-1,1}}; assert(escalar_trasladar(p,2,2,3,(punto2d_t){4,-1})&&p[0].x==6&&p[0].y==5&&p[1].x==2&&p[1].y==2);
- nombre: cero
  funcion: escalar_trasladar
  codigo: punto2d_t p={3,-2}; assert(escalar_trasladar(&p,1,0,0,(punto2d_t){1,1})&&p.x==1&&p.y==1);
- nombre: vacio
  funcion: escalar_trasladar
  codigo: assert(escalar_trasladar(NULL,0,1,1,(punto2d_t){0,0}));
publicar: true
unidad: 4
modulo: Tipos Abstractos y Algorítmica
dificultad: intermedia
tipo: practica_guiada
prerrequisitos:
- estructuras
- aritmetica
subtema: '19'
