id: geom-comp-05
titulo: Intersección de Dos Segmentos de Recta en 2D
tema: geometria_computacional
bloom: 1
minutos_estimados: 10
pistas:
- Aplicá fórmulas algebraicas de vectores.
- Cuidá el redondeo en cálculos de punto flotante.
tags:
- geometria
- vectores
- puntos
- interseccion
- dep:estructuras
- dep:aritmetica
- c11
- inicial
verificado: true
funciones:
- nombre: segmentos_intersectan
  retorno: bool
  parametros: punto2d_t a, punto2d_t b, punto2d_t c, punto2d_t d
  descripcion: Intersección de dos segmentos 2D
tests_funciones:
- nombre: cruce_propio
  funcion: segmentos_intersectan
  codigo: assert(segmentos_intersectan((punto2d_t){0,0},(punto2d_t){4,4},(punto2d_t){0,4},(punto2d_t){4,0}));
- nombre: solapamiento_colineal
  funcion: segmentos_intersectan
  codigo: assert(segmentos_intersectan((punto2d_t){0,0},(punto2d_t){4,0},(punto2d_t){2,0},(punto2d_t){6,0}));
- nombre: segmentos_separados
  funcion: segmentos_intersectan
  codigo: assert(!segmentos_intersectan((punto2d_t){0,0},(punto2d_t){1,0},(punto2d_t){2,0},(punto2d_t){3,0}));
publicar: true
unidad: 4
