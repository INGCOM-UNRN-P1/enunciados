id: geom-comp-11
titulo: Envolvente Convexa por Algoritmo de Jarvis Gift Wrapping
tema: geometria_computacional
bloom: 2
minutos_estimados: 15
pistas:
- Aplicá fórmulas algebraicas de vectores.
- Cuidá el redondeo en cálculos de punto flotante.
tags:
- geometria
- vectores
- puntos
- interseccion
- dep:estructuras
- dep:aritmetica
- c11
- inicial
verificado: false
funciones:
- nombre: envolvente_convexa_jarvis
  retorno: size_t
  parametros: const punto2d_t *puntos, size_t n, punto2d_t *salida, size_t capacidad
  descripcion: Envolvente convexa antihoraria mediante Jarvis gift wrapping; no repite inicio.
tests_funciones:
- nombre: cuadrado_con_interior
  funcion: envolvente_convexa_jarvis
  codigo: punto2d_t p[]={{0,0},{2,0},{2,2},{0,2},{1,1}}, h[5]; size_t n=envolvente_convexa_jarvis(p,5,h,5);
    assert(n==4);
- nombre: colineales_conserva_extremos
  funcion: envolvente_convexa_jarvis
  codigo: punto2d_t p[]={{0,0},{1,0},{3,0},{0,2},{0,1}}, h[5]; size_t n=envolvente_convexa_jarvis(p,5,h,5);
    assert(n==3);
- nombre: capacidad_insuficiente_no_escribe_resultado
  funcion: envolvente_convexa_jarvis
  codigo: punto2d_t p[]={{0,0},{2,0},{2,2},{0,2}}, h[3]={{9,9},{9,9},{9,9}}; assert(envolvente_convexa_jarvis(p,4,h,3)==0);
    assert(h[0].x==9);
- nombre: triangulo_antihorario
  funcion: envolvente_convexa_jarvis
  codigo: punto2d_t p[]={{0,0},{2,0},{1,1}}, h[3]; size_t n=envolvente_convexa_jarvis(p,3,h,3); assert(n==3);
    assert(h[0].x==0&&h[0].y==0); assert(h[1].x==2&&h[1].y==0); assert(h[2].x==1&&h[2].y==1);
publicar: true
unidad: 4
modulo: Tipos Abstractos y Algorítmica
dificultad: inicial
tipo: practica_guiada
prerrequisitos:
- estructuras
- aritmetica
subtema: '11'
