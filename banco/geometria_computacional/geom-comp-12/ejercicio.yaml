id: geom-comp-12
titulo: Par de Puntos Más Cercanos en el Plano 2D
tema: geometria_computacional
bloom: 2
minutos_estimados: 15
pistas:
- Recorré pares i<j.
- Compará distancias al cuadrado para evitar raíces.
tags:
- geometria
- vectores
- puntos
- interseccion
- dep:estructuras
- dep:aritmetica
- c11
- inicial
verificado: false
funciones:
- nombre: par_mas_cercano
  retorno: bool
  parametros: const punto2d_t *puntos, size_t n, size_t *indice_a, size_t *indice_b
  descripcion: Guarda índices del par de menor distancia cuadrada; falso si n<2 o punteros inválidos.
tests_funciones:
- nombre: elige_minimo
  funcion: par_mas_cercano
  codigo: punto2d_t p[]={{0,0},{4,0},{1,0}}; size_t a,b; assert(par_mas_cercano(p,3,&a,&b)&&a==0&&b==2);
- nombre: duplicados
  funcion: par_mas_cercano
  codigo: punto2d_t p[]={{2,3},{2,3}}; size_t a,b; assert(par_mas_cercano(p,2,&a,&b)&&a==0&&b==1);
- nombre: menos_de_dos
  funcion: par_mas_cercano
  codigo: punto2d_t p={0,0}; size_t a,b; assert(!par_mas_cercano(&p,1,&a,&b));
publicar: true
unidad: 4
modulo: Tipos Abstractos y Algorítmica
dificultad: inicial
tipo: practica_guiada
prerrequisitos:
