id: geom-comp-17
titulo: Centroide y Centro de Masa de un Conjunto de Puntos
tema: geometria_computacional
bloom: 3
minutos_estimados: 25
pistas:
- El centroide usa pesos iguales.
- El centro de masa divide coordenadas ponderadas por masa total.
tags:
- geometria
- vectores
- puntos
- interseccion
- dep:estructuras
- dep:aritmetica
- c11
- intermedia
verificado: false
funciones:
- nombre: centroide_puntos
  retorno: bool
  parametros: const punto2d_t *puntos, size_t n, punto2d_t *salida
  descripcion: Calcula promedio aritmético de coordenadas; falso para entrada vacía.
- nombre: centro_masa
  retorno: bool
  parametros: const particula2d_t *particulas, size_t n, punto2d_t *salida
  descripcion: Calcula centro ponderado por masas no negativas; falso si la masa total es cero.
tests_funciones:
- nombre: centroide_simple
  funcion: centroide_puntos
  codigo: punto2d_t p[]={{0,0},{2,4}}; punto2d_t c; assert(centroide_puntos(p,2,&c)&&c.x==1&&c.y==2);
- nombre: centroide_vacio
  funcion: centroide_puntos
  codigo: punto2d_t c; assert(!centroide_puntos(NULL,0,&c));
- nombre: masa_ponderada
  funcion: centro_masa
  codigo: particula2d_t p[]={{{0,0},3},{{4,0},1}}; punto2d_t c; assert(centro_masa(p,2,&c)&&c.x==1&&c.y==0);
- nombre: masa_total_cero
  funcion: centro_masa
  codigo: particula2d_t p[]={{{0,0},0}}; punto2d_t c; assert(!centro_masa(p,1,&c));
publicar: true
unidad: 4
modulo: Tipos Abstractos y Algorítmica
dificultad: intermedia
tipo: practica_guiada
prerrequisitos:
- estructuras
- aritmetica
subtema: '17'
