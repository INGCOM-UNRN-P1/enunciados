id: geom-comp-16
titulo: Intersección entre Segmento de Recta y Círculo
tema: geometria_computacional
bloom: 3
minutos_estimados: 25
pistas:
- Proyectá y limitá t entre 0 y 1.
- Considerá el segmento degenerado.
tags:
- geometria
- vectores
- puntos
- interseccion
- dep:estructuras
- dep:aritmetica
- c11
- intermedia
verificado: false
funciones:
- nombre: segmento_circulo_intersecta
  retorno: bool
  parametros: punto2d_t,punto2d_t,circulo2d_t
  descripcion: Indica si el segmento intersecta el disco cerrado (interior o circunferencia); radio negativo inválido.
tests_funciones:
- nombre: cruza
  funcion: segmento_circulo_intersecta
  codigo: circulo2d_t c={{0,0},1}; assert(segmento_circulo_intersecta((punto2d_t){-2,0},(punto2d_t){2,0},c));
- nombre: fuera
  funcion: segmento_circulo_intersecta
  codigo: circulo2d_t c={{0,0},1}; assert(!segmento_circulo_intersecta((punto2d_t){2,2},(punto2d_t){3,2},c));
- nombre: punto
  funcion: segmento_circulo_intersecta
  codigo: circulo2d_t c={{0,0},1}; assert(segmento_circulo_intersecta((punto2d_t){0,0},(punto2d_t){0,0},c));
- nombre: segmento_dentro_del_disco
  funcion: segmento_circulo_intersecta
  codigo: circulo2d_t c={{0,0},2}; assert(segmento_circulo_intersecta((punto2d_t){-0.5,0},(punto2d_t){0.5,0},c));
publicar: true
unidad: 4
modulo: Tipos Abstractos y Algorítmica
dificultad: intermedia
tipo: practica_guiada
prerrequisitos:
- estructuras
- aritmetica
subtema: '16'
