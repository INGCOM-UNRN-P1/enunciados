id: geom-comp-21
titulo: Triangulación Simple de Polígonos Convexos
tema: geometria_computacional
bloom: 4
minutos_estimados: 35
pistas:
- La diagonal desde el primer vértice triangula el polígono convexo.
- Se necesitan n-2 triángulos.
tags:
- geometria
- vectores
- puntos
- interseccion
- dep:estructuras
- dep:aritmetica
- c11
- intermedia
verificado: false
funciones:
- nombre: triangular_fan_convexo
  retorno: size_t
  parametros: const punto2d_t*,size_t,triangulo2d_t*,size_t
  descripcion: Descompone un polígono convexo en n-2 triángulos en fan desde el primer vértice.
tests_funciones:
- nombre: cuadrado
  funcion: triangular_fan_convexo
  codigo: punto2d_t p[]={{0,0},{2,0},{2,2},{0,2}}; triangulo2d_t t[2]; assert(triangular_fan_convexo(p,4,t,2)==2&&t[0].b.x==2&&t[1].c.y==2);
- nombre: triangulo
  funcion: triangular_fan_convexo
  codigo: punto2d_t p[]={{0,0},{1,0},{0,1}}; triangulo2d_t t; assert(triangular_fan_convexo(p,3,&t,1)==1);
- nombre: capacidad
  funcion: triangular_fan_convexo
  codigo: punto2d_t p[]={{0,0},{1,0},{1,1},{0,1}}; triangulo2d_t t; assert(triangular_fan_convexo(p,4,&t,1)==0);
publicar: true
unidad: 4
modulo: Tipos Abstractos y Algorítmica
dificultad: intermedia
prerrequisitos:
- estructuras
- aritmetica
subtema: '21'
