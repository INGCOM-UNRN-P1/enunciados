id: geom-comp-20
titulo: Reflexión de Puntos respecto a un Eje Arbitrario
tema: geometria_computacional
bloom: 3
minutos_estimados: 25
pistas:
- Calculá la proyección sobre la recta.
- La reflexión duplica el vector hacia la proyección.
tags:
- geometria
- vectores
- puntos
- interseccion
- dep:estructuras
- dep:aritmetica
- c11
- intermedia
verificado: false
funciones:
- nombre: reflejar_punto_recta
  retorno: bool
  parametros: punto2d_t,punto2d_t,punto2d_t,punto2d_t*
  descripcion: Refleja respecto de la recta AB; falla si A=B.
tests_funciones:
- nombre: eje_x
  funcion: reflejar_punto_recta
  codigo: punto2d_t r; assert(reflejar_punto_recta((punto2d_t){2,3},(punto2d_t){0,0},(punto2d_t){1,0},&r)&&r.x==2&&r.y==-3);
- nombre: diagonal
  funcion: reflejar_punto_recta
  codigo: punto2d_t r; assert(reflejar_punto_recta((punto2d_t){1,0},(punto2d_t){0,0},(punto2d_t){1,1},&r)&&fabs(r.x)<1e-9&&fabs(r.y-1)<1e-9);
- nombre: degenerada
  funcion: reflejar_punto_recta
  codigo: punto2d_t r; assert(!reflejar_punto_recta((punto2d_t){1,2},(punto2d_t){0,0},(punto2d_t){0,0},&r));
publicar: true
unidad: 4
modulo: Tipos Abstractos y Algorítmica
dificultad: intermedia
tipo: practica_guiada
prerrequisitos:
- estructuras
- aritmetica
subtema: '20'
