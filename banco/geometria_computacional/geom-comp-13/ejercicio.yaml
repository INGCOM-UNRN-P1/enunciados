id: geom-comp-13
titulo: Cálculo de Bounding Box Alineada a los Ejes AABB
tema: geometria_computacional
bloom: 3
minutos_estimados: 25
pistas:
- Inicializá extremos con el primer punto.
- Actualizá mínimos y máximos por coordenada.
tags:
- geometria
- vectores
- puntos
- interseccion
- dep:estructuras
- dep:aritmetica
- c11
- intermedia
verificado: false
funciones:
- nombre: calcular_aabb
  retorno: bool
  parametros: const punto2d_t*,size_t,caja2d_t*
  descripcion: Calcula extremos AABB inclusivos; falso para entrada vacía.
tests_funciones:
- nombre: extremos
  funcion: calcular_aabb
  codigo: punto2d_t p[]={{2,-1},{-3,4},{1,2}}; caja2d_t c; assert(calcular_aabb(p,3,&c)&&c.min_x==-3&&c.max_x==2&&c.min_y==-1&&c.max_y==4);
- nombre: un_punto
  funcion: calcular_aabb
  codigo: punto2d_t p={7,8}; caja2d_t c; assert(calcular_aabb(&p,1,&c)&&c.min_x==c.max_x);
- nombre: vacio
  funcion: calcular_aabb
  codigo: caja2d_t c; assert(!calcular_aabb(NULL,0,&c));
publicar: true
unidad: 4
modulo: Tipos Abstractos y Algorítmica
dificultad: intermedia
tipo: practica_guiada
prerrequisitos:
- estructuras
- aritmetica
subtema: '13'
