id: geom-comp-10
titulo: Envolvente Convexa por Algoritmo de Convex Hull Graham Scan
tema: geometria_computacional
bloom: 2
minutos_estimados: 15
pistas:
- Aplicá fórmulas algebraicas de vectores.
- Cuidá el redondeo en cálculos de punto flotante.
tags:
- geometria
- vectores
- puntos
- interseccion
- dep:estructuras
- dep:aritmetica
- c11
- inicial
verificado: true
funciones:
- nombre: envolvente_convexa_graham
  retorno: size_t
  parametros: const punto2d_t *puntos, size_t n, punto2d_t *salida, size_t capacidad
  descripcion: Envolvente convexa con Graham scan
tests_funciones:
- nombre: envolvente_cuadrado_con_interior
  funcion: envolvente_convexa_graham
  codigo: punto2d_t p[]={{0,0},{2,0},{2,2},{0,2},{1,1},{1,0}}, h[6]; size_t n=envolvente_convexa_graham(p,6,h,6);
    assert(n==4);
- nombre: envolvente_contiene_esquinas
  funcion: envolvente_convexa_graham
  codigo: punto2d_t p[]={{0,0},{2,0},{2,2},{0,2},{1,1}}, h[5]; size_t n=envolvente_convexa_graham(p,5,h,5); assert(n==4);
    for(size_t i=0;i<n;i++) assert((h[i].x==0||h[i].x==2)&&(h[i].y==0||h[i].y==2));
- nombre: capacidad_insuficiente
  funcion: envolvente_convexa_graham
  codigo: punto2d_t p[]={{0,0},{2,0},{2,2},{0,2},{1,1}}, h[3]; assert(envolvente_convexa_graham(p,5,h,3)==0);
- nombre: desbordamiento_tamano
  funcion: envolvente_convexa_graham
  codigo: punto2d_t p={0,0}, salida; assert(envolvente_convexa_graham(&p,SIZE_MAX,&salida,SIZE_MAX)==0);
publicar: true
unidad: 4
modulo: Tipos Abstractos y Algorítmica
dificultad: inicial
tipo: practica_guiada
prerrequisitos:
- estructuras
- aritmetica
subtema: '10'
