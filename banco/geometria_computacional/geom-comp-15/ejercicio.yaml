id: geom-comp-15
titulo: Detección de Colisión entre Círculos en 2D
tema: geometria_computacional
bloom: 3
minutos_estimados: 25
pistas:
- La suma de radios es el límite para el contacto.
- Compará cuadrados de distancias.
tags:
- geometria
- vectores
- puntos
- interseccion
- dep:estructuras
- dep:aritmetica
- c11
- intermedia
verificado: false
funciones:
- nombre: circulos_intersectan
  retorno: bool
  parametros: circulo2d_t,circulo2d_t
  descripcion: Colisión inclusiva de círculos; radios negativos inválidos.
tests_funciones:
- nombre: solape
  funcion: circulos_intersectan
  codigo: circulo2d_t a={{0,0},2},b={{3,0},1}; assert(circulos_intersectan(a,b));
- nombre: tangencia
  funcion: circulos_intersectan
  codigo: circulo2d_t a={{0,0},1},b={{2,0},1}; assert(circulos_intersectan(a,b));
- nombre: disjuntos
  funcion: circulos_intersectan
  codigo: circulo2d_t a={{0,0},1},b={{2.1,0},1}; assert(!circulos_intersectan(a,b));
publicar: true
unidad: 4
modulo: Tipos Abstractos y Algorítmica
dificultad: intermedia
tipo: practica_guiada
prerrequisitos:
- estructuras
- aritmetica
subtema: '15'
