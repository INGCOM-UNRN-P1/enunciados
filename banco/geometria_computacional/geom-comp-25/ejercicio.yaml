id: geom-comp-25
titulo: Distancia de Hausdorff entre Dos Conjuntos de Puntos
tema: geometria_computacional
bloom: 4
minutos_estimados: 35
pistas:
- Calculá ambas distancias dirigidas.
- Tomá el máximo, no el promedio.
tags:
- geometria
- vectores
- puntos
- interseccion
- dep:estructuras
- dep:aritmetica
- c11
- intermedia
verificado: false
funciones:
- nombre: hausdorff_discreta
  retorno: double
  parametros: const punto2d_t*,size_t,const punto2d_t*,size_t
  descripcion: Hausdorff discreta simétrica entre conjuntos finitos; INFINITY si alguno está vacío.
tests_funciones:
- nombre: iguales
  funcion: hausdorff_discreta
  codigo: punto2d_t a[]={{0,0},{2,0}},b[]={{2,0},{0,0}}; assert(hausdorff_discreta(a,2,b,2)==0);
- nombre: no_promedio
  funcion: hausdorff_discreta
  codigo: punto2d_t a[]={{0,0},{10,0}},b[]={{1,0}}; assert(hausdorff_discreta(a,2,b,1)==9);
- nombre: vacio
  funcion: hausdorff_discreta
  codigo: punto2d_t a={0,0}; assert(isinf(hausdorff_discreta(&a,1,NULL,0)));
publicar: true
unidad: 4
modulo: Tipos Abstractos y Algorítmica
dificultad: intermedia
prerrequisitos:
- estructuras
- aritmetica
subtema: '25'
