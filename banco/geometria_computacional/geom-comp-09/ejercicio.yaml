id: geom-comp-09
titulo: Verificación de Polígono Convexo vs Cóncavo
tema: geometria_computacional
bloom: 2
minutos_estimados: 15
pistas:
- Aplicá fórmulas algebraicas de vectores.
- Cuidá el redondeo en cálculos de punto flotante.
tags:
- geometria
- vectores
- puntos
- interseccion
- dep:estructuras
- dep:aritmetica
- c11
- inicial
verificado: true
funciones:
- nombre: poligono_es_convexo
  retorno: bool
  parametros: const punto2d_t *vertices, size_t n
  descripcion: Verificar polígono convexo o cóncavo
tests_funciones:
- nombre: convexo
  funcion: poligono_es_convexo
  codigo: punto2d_t p[]={{0,0},{4,0},{4,3},{0,3}}; assert(poligono_es_convexo(p,4));
- nombre: convexo_sentido_inverso
  funcion: poligono_es_convexo
  codigo: punto2d_t p[]={{0,3},{4,3},{4,0},{0,0}}; assert(poligono_es_convexo(p,4));
- nombre: concavo
  funcion: poligono_es_convexo
  codigo: punto2d_t p[]={{0,0},{4,0},{2,1},{4,4},{0,4}}; assert(!poligono_es_convexo(p,5));
- nombre: degenerado
  funcion: poligono_es_convexo
  codigo: punto2d_t p[]={{0,0},{1,0},{2,0}}; assert(!poligono_es_convexo(p,3));
publicar: true
unidad: 4
modulo: Tipos Abstractos y Algorítmica
dificultad: inicial
tipo: practica_guiada
prerrequisitos:
- estructuras
- aritmetica
subtema: 09
