id: geom-comp-30
titulo: Consultas espaciales 2D por rango
tema: geometria_computacional
bloom: 5
minutos_estimados: 45
pistas:
- Aplicá fórmulas algebraicas de vectores.
- Cuidá el redondeo en cálculos de punto flotante.
tags:
- geometria
- vectores
- puntos
- interseccion
- dep:estructuras
- dep:aritmetica
- c11
- avanzada
verificado: true
funciones:
- nombre: kd_build
  retorno: bool
  parametros: kd_tree_t *t,const kd_point_t *p,size_t n
  descripcion: Implementá un índice KD-tree estático balanceado para puntos 2D y consulta de caja axis-aligned
    inclusiva. API de construcción desde arreglo, consulta que escribe índices originales hasta capacidad
    dada y reporta total encontrado, destrucción. Validá finitud, capacidad y overflow; resultados en
    orden ascendente de índice.
- nombre: kd_query
  retorno: bool
  parametros: const kd_tree_t *t,double xmin,double ymin,double xmax,double ymax,size_t *indices,size_t
    cap,size_t *total
  descripcion: Implementá un índice KD-tree estático balanceado para puntos 2D y consulta de caja axis-aligned
    inclusiva. API de construcción desde arreglo, consulta que escribe índices originales hasta capacidad
    dada y reporta total encontrado, destrucción. Validá finitud, capacidad y overflow; resultados en
    orden ascendente de índice.
- nombre: kd_destroy
  retorno: void
  parametros: kd_tree_t *t
  descripcion: Implementá un índice KD-tree estático balanceado para puntos 2D y consulta de caja axis-aligned
    inclusiva. API de construcción desde arreglo, consulta que escribe índices originales hasta capacidad
    dada y reporta total encontrado, destrucción. Validá finitud, capacidad y overflow; resultados en
    orden ascendente de índice.
tests_funciones:
- nombre: test_kd_query
  funcion: kd_build
  codigo: 'kd_point_t p[]={{0,0},{1,1},{2,2},{1,0}};kd_tree_t t;size_t ix[4],n;assert(kd_build(&t,p,4));assert(kd_query(&t,0,0,1,1,ix,4,&n)&&n==3);assert(ix[0]==0&&ix[1]==1&&ix[2]==3);kd_destroy(&t);

    kd_point_t copy[]={{0,0},{2,2}};kd_tree_t independent;assert(kd_build(&independent,copy,2));copy[1].x=99;size_t
    one[2],count;assert(kd_query(&independent,0,0,2,2,one,2,&count)&&count==2);kd_destroy(&independent);'
- nombre: test_kd_capacity
  funcion: kd_build
  codigo: kd_point_t p[]={{0,0},{1,1}};kd_tree_t t;size_t ix[1],n;assert(kd_build(&t,p,2));assert(kd_query(&t,0,0,2,2,ix,1,&n)&&n==2);kd_destroy(&t);
publicar: true
unidad: 4
modulo: Tipos Abstractos y Algorítmica
dificultad: avanzada
prerrequisitos:
- estructuras
- aritmetica
subtema: '30'
