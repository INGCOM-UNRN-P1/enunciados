id: geom-comp-18
titulo: Rotación 2D de Puntos Alrededor del Origen y Pivote
tema: geometria_computacional
bloom: 3
minutos_estimados: 25
pistas:
- Trasladá el pivote al origen.
- Aplicá seno y coseno y deshacé la traslación.
tags:
- geometria
- vectores
- puntos
- interseccion
- dep:estructuras
- dep:aritmetica
- c11
- intermedia
verificado: false
funciones:
- nombre: rotar_punto
  retorno: punto2d_t
  parametros: punto2d_t,punto2d_t,double
  descripcion: Rota alrededor del pivote en sentido antihorario; ángulo en radianes.
tests_funciones:
- nombre: origen
  funcion: rotar_punto
  codigo: punto2d_t r=rotar_punto((punto2d_t){1,0},(punto2d_t){0,0},acos(-1)/2); assert(fabs(r.x)<1e-9&&fabs(r.y-1)<1e-9);
- nombre: pivote
  funcion: rotar_punto
  codigo: punto2d_t r=rotar_punto((punto2d_t){2,1},(punto2d_t){1,1},acos(-1)/2); assert(fabs(r.x-1)<1e-9&&fabs(r.y-2)<1e-9);
- nombre: cero
  funcion: rotar_punto
  codigo: punto2d_t p={-2,3},r=rotar_punto(p,(punto2d_t){4,5},0); assert(r.x==-2&&r.y==3);
publicar: true
unidad: 4
modulo: Tipos Abstractos y Algorítmica
dificultad: intermedia
tipo: practica_guiada
prerrequisitos:
- estructuras
- aritmetica
subtema: '18'
