id: geom-comp-08
titulo: Verificación de Punto Dentro de Polígono Método Ray Casting
tema: geometria_computacional
bloom: 2
minutos_estimados: 15
pistas:
- Aplicá fórmulas algebraicas de vectores.
- Cuidá el redondeo en cálculos de punto flotante.
tags:
- geometria
- vectores
- puntos
- interseccion
- dep:estructuras
- dep:aritmetica
- c11
- inicial
verificado: true
funciones:
- nombre: punto_en_poligono
  retorno: bool
  parametros: punto2d_t p, const punto2d_t *vertices, size_t n
  descripcion: 'Ray casting: punto dentro de polígono'
tests_funciones:
- nombre: punto_interior
  funcion: punto_en_poligono
  codigo: punto2d_t p[]={{0,0},{4,0},{4,4},{0,4}}; assert(punto_en_poligono((punto2d_t){2,2},p,4));
- nombre: punto_exterior
  funcion: punto_en_poligono
  codigo: punto2d_t p[]={{0,0},{4,0},{4,4},{0,4}}; assert(!punto_en_poligono((punto2d_t){5,2},p,4));
- nombre: borde_incluido
  funcion: punto_en_poligono
  codigo: punto2d_t p[]={{0,0},{4,0},{4,4},{0,4}}; assert(punto_en_poligono((punto2d_t){4,2},p,4));
- nombre: poligono_insuficiente
  funcion: punto_en_poligono
  codigo: punto2d_t p[]={{0,0},{1,1}}; assert(!punto_en_poligono((punto2d_t){0,0},p,2));
publicar: true
unidad: 4
modulo: Tipos Abstractos y Algorítmica
dificultad: inicial
tipo: practica_guiada
prerrequisitos:
- estructuras
- aritmetica
subtema: 08
