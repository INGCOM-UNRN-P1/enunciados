id: geom-comp-07
titulo: Cálculo del Área de un Polígono por la Fórmula del Cordón
tema: geometria_computacional
bloom: 2
minutos_estimados: 15
pistas:
- Aplicá fórmulas algebraicas de vectores.
- Cuidá el redondeo en cálculos de punto flotante.
tags:
- geometria
- vectores
- puntos
- interseccion
- dep:estructuras
- dep:aritmetica
- c11
- inicial
verificado: true
funciones:
- nombre: area_poligono
  retorno: double
  parametros: const punto2d_t *vertices, size_t n
  descripcion: Área de polígono por fórmula del cordón
tests_funciones:
- nombre: area_rectangulo
  funcion: area_poligono
  codigo: punto2d_t p[]={{0,0},{4,0},{4,3},{0,3}}; assert(fabs(area_poligono(p,4)-12)<1e-9);
- nombre: area_sentido_inverso
  funcion: area_poligono
  codigo: punto2d_t p[]={{0,3},{4,3},{4,0},{0,0}}; assert(fabs(area_poligono(p,4)-12)<1e-9);
- nombre: poligono_insuficiente
  funcion: area_poligono
  codigo: punto2d_t p[]={{0,0},{1,1}}; assert(area_poligono(p,2)==0.0);
publicar: true
