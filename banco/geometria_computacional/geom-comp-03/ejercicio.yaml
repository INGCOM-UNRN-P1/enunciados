tests_funciones:
- nombre: producto_vectorial
  funcion: producto_vectorial_2d
  codigo: assert(producto_vectorial_2d((punto2d_t){1,0},(punto2d_t){0,1})==1.0);
- nombre: orientacion_positiva
  funcion: orientacion
  codigo: assert(orientacion((punto2d_t){0,0},(punto2d_t){2,0},(punto2d_t){1,1})==GIRO_ANTIHORARIO);
- nombre: orientacion_colineal
  funcion: orientacion
  codigo: assert(orientacion((punto2d_t){0,0},(punto2d_t){2,0},(punto2d_t){3,0})==COLINEAL);
