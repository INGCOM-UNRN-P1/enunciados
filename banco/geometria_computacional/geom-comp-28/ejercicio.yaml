id: geom-comp-28
titulo: Intersección de rectas paramétricas
tema: geometria_computacional
bloom: 5
minutos_estimados: 45
pistas:
- Aplicá fórmulas algebraicas de vectores.
- Cuidá el redondeo en cálculos de punto flotante.
tags:
- geometria
- vectores
- puntos
- interseccion
- dep:estructuras
- dep:aritmetica
- c11
- avanzada
verificado: true
funciones:
- nombre: intersect_parametric_lines
  retorno: line_result_t
  parametros: point2d_t p,point2d_t r,point2d_t q,point2d_t s,double eps,point2d_t *out
  descripcion: Representá puntos y vectores 2D con double. Implementá intersección de p+t*r y q+u*s. Clasificá
    como única, paralela distinta o coincidente usando tolerancia epsilon y entrega el punto sólo cuando
    hay solución única. Rechazá punteros nulos, epsilon negativo/no finito y entradas no finitas.
tests_funciones:
- nombre: test_line_tipos_de_interseccion
  funcion: intersect_parametric_lines
  codigo: point2d_t o;assert(intersect_parametric_lines((point2d_t){0,0},(point2d_t){1,0},(point2d_t){2,-1},(point2d_t){0,1},1e-9,&o)==LINE_UNIQUE);assert(fabs(o.x-2)<1e-9&&fabs(o.y)<1e-9);assert(intersect_parametric_lines((point2d_t){0,0},(point2d_t){1,0},(point2d_t){0,1},(point2d_t){1,0},1e-9,&o)==LINE_PARALLEL);assert(intersect_parametric_lines((point2d_t){0,0},(point2d_t){1,0},(point2d_t){2,0},(point2d_t){3,0},1e-9,&o)==LINE_COINCIDENT);
- nombre: test_line_invalidos
  funcion: intersect_parametric_lines
  codigo: point2d_t o;assert(intersect_parametric_lines((point2d_t){0,0},(point2d_t){1,0},(point2d_t){0,1},(point2d_t){0,1},-1,&o)==LINE_INVALID);
publicar: true
unidad: 4
modulo: Tipos Abstractos y Algorítmica
dificultad: avanzada
prerrequisitos:
- estructuras
- aritmetica
subtema: '28'
