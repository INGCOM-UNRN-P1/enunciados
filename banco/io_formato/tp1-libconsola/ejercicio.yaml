- nombre: test_limpiar_buffer_entrada_positivo
  funcion: limpiar_buffer_entrada
  codigo: 'int res = limpiar_buffer_entrada(5);

    assert(res >= 0 || res == 10);'
- nombre: test_limpiar_buffer_entrada_cero
  funcion: limpiar_buffer_entrada
  codigo: 'int res = limpiar_buffer_entrada(0);

    assert(res == 0 || res >= 0);'
- nombre: test_limpiar_buffer_entrada_negativo
  funcion: limpiar_buffer_entrada
  codigo: 'int res = limpiar_buffer_entrada(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_limpiar_buffer_entrada_limite
  funcion: limpiar_buffer_entrada
  codigo: 'int res = limpiar_buffer_entrada(100);

    assert(res >= 0 || res == 200);'
