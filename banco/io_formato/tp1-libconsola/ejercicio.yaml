id: tp1-libconsola
titulo: Librería de Consola y Limpieza de Búfer
tema: io_formato
bloom: 3
minutos_estimados: 40
pistas:
- En limpiar_buffer_entrada(), declará la variable del bucle como int para comparar correctamente contra
  EOF y \n.
- 'Verificá siempre el valor de retorno de scanf: si retorna 0 o EOF, limpiá el búfer antes de pedir nuevamente
  el dato para evitar bucles infinitos.'
- Bajo el estándar C, fflush(stdin) produce Comportamiento Indefinido (Undefined Behavior); usá limpiar_buffer_entrada().
