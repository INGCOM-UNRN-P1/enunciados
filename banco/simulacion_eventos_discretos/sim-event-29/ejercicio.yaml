id: sim-event-29
titulo: Simulación de Procesamiento por Lotes en Cluster de Cómputo
tema: simulacion_eventos_discretos
bloom: 5
minutos_estimados: 45
pistas:
- Mantené una cola de eventos ordenada por tiempo de ocurrencia.
- Avanzá el reloj de simulación al tiempo del próximo evento.
tags:
- simulacion
- eventos_discretos
- colas
- planificacion
- dep:colas_prioridad_heaps
- dep:tad
- c11
- avanzada
verificado: true
funciones:
- nombre: ejecutar_sim_event_29
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Simulación de Procesamiento por Lotes
    en Cluster de Cómputo
tests_funciones:
- nombre: test_ejecutar_sim_event_29_positivo
  funcion: ejecutar_sim_event_29
  codigo: 'int res = ejecutar_sim_event_29(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_sim_event_29_cero
  funcion: ejecutar_sim_event_29
  codigo: 'int res = ejecutar_sim_event_29(0);

    assert(res == 0);'
- nombre: test_ejecutar_sim_event_29_negativo
  funcion: ejecutar_sim_event_29
  codigo: 'int res = ejecutar_sim_event_29(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_sim_event_29_valor_limite
  funcion: ejecutar_sim_event_29
  codigo: 'int res = ejecutar_sim_event_29(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_sim_event_29_valor_unitario
  funcion: ejecutar_sim_event_29
  codigo: 'int res = ejecutar_sim_event_29(1);

    assert(res >= 0 || res == 2);'
publicar: true
unidad: 5
