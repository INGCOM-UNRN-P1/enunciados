id: sim-event-07
titulo: Planificador de Procesos por Menor Tiempo Restante SRTF
tema: simulacion_eventos_discretos
bloom: 2
minutos_estimados: 15
pistas:
- Mantené una cola de eventos ordenada por tiempo de ocurrencia.
- Avanzá el reloj de simulación al tiempo del próximo evento.
tags:
- simulacion
- eventos_discretos
- colas
- planificacion
- dep:colas_prioridad_heaps
- dep:tad
- c11
- inicial
verificado: true
funciones:
- nombre: ejecutar_sim_event_07
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Planificador de Procesos por Menor Tiempo
    Restante SRTF
tests_funciones:
- nombre: test_ejecutar_sim_event_07_positivo
  funcion: ejecutar_sim_event_07
  codigo: 'int res = ejecutar_sim_event_07(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_sim_event_07_cero
  funcion: ejecutar_sim_event_07
  codigo: 'int res = ejecutar_sim_event_07(0);

    assert(res == 0);'
- nombre: test_ejecutar_sim_event_07_negativo
  funcion: ejecutar_sim_event_07
  codigo: 'int res = ejecutar_sim_event_07(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_sim_event_07_valor_limite
  funcion: ejecutar_sim_event_07
  codigo: 'int res = ejecutar_sim_event_07(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_sim_event_07_valor_unitario
  funcion: ejecutar_sim_event_07
  codigo: 'int res = ejecutar_sim_event_07(1);

    assert(res >= 0 || res == 2);'
publicar: true
unidad: 5
modulo: Ingeniería de Software y Calidad en C
dificultad: inicial
tipo: practica_guiada
prerrequisitos:
- colas_prioridad_heaps
- tad
