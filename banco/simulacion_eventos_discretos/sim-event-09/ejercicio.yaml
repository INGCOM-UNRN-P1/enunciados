    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_sim_event_09_valor_limite
  funcion: ejecutar_sim_event_09
  codigo: 'int res = ejecutar_sim_event_09(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_sim_event_09_valor_unitario
  funcion: ejecutar_sim_event_09
  codigo: 'int res = ejecutar_sim_event_09(1);

    assert(res >= 0 || res == 2);'
