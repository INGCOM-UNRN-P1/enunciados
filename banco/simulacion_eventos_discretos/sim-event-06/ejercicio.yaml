id: sim-event-06
titulo: Planificador de Procesos por Prioridad No Expropiativo
tema: simulacion_eventos_discretos
bloom: 1
minutos_estimados: 10
pistas:
- Mantené una cola de eventos ordenada por tiempo de ocurrencia.
- Avanzá el reloj de simulación al tiempo del próximo evento.
tags:
- simulacion
- eventos_discretos
- colas
- planificacion
- dep:colas_prioridad_heaps
- dep:tad
- c11
- inicial
verificado: true
funciones:
- nombre: ejecutar_sim_event_06
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Planificador de Procesos por Prioridad
    No Expropiativo
tests_funciones:
- nombre: test_ejecutar_sim_event_06_positivo
  funcion: ejecutar_sim_event_06
  codigo: 'int res = ejecutar_sim_event_06(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_sim_event_06_cero
  funcion: ejecutar_sim_event_06
  codigo: 'int res = ejecutar_sim_event_06(0);

    assert(res == 0);'
- nombre: test_ejecutar_sim_event_06_negativo
  funcion: ejecutar_sim_event_06
  codigo: 'int res = ejecutar_sim_event_06(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_sim_event_06_valor_limite
  funcion: ejecutar_sim_event_06
  codigo: 'int res = ejecutar_sim_event_06(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_sim_event_06_valor_unitario
  funcion: ejecutar_sim_event_06
  codigo: 'int res = ejecutar_sim_event_06(1);

    assert(res >= 0 || res == 2);'
publicar: true
unidad: 5
