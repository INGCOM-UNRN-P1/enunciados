    Órdenes de Compra y Venta
tests_funciones:
- nombre: test_ejecutar_sim_event_27_positivo
  funcion: ejecutar_sim_event_27
  codigo: 'int res = ejecutar_sim_event_27(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_sim_event_27_cero
  funcion: ejecutar_sim_event_27
  codigo: 'int res = ejecutar_sim_event_27(0);

    assert(res == 0);'
- nombre: test_ejecutar_sim_event_27_negativo
  funcion: ejecutar_sim_event_27
  codigo: 'int res = ejecutar_sim_event_27(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_sim_event_27_valor_limite
  funcion: ejecutar_sim_event_27
  codigo: 'int res = ejecutar_sim_event_27(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_sim_event_27_valor_unitario
  funcion: ejecutar_sim_event_27
  codigo: 'int res = ejecutar_sim_event_27(1);

    assert(res >= 0 || res == 2);'
