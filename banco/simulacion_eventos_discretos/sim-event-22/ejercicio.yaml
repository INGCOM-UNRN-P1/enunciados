id: sim-event-22
titulo: Simulación de Asignación de Recursos con Detección de Inanición
tema: simulacion_eventos_discretos
bloom: 4
minutos_estimados: 35
pistas:
- Mantené una cola de eventos ordenada por tiempo de ocurrencia.
- Avanzá el reloj de simulación al tiempo del próximo evento.
tags:
- simulacion
- eventos_discretos
- colas
- planificacion
- dep:colas_prioridad_heaps
- dep:tad
- c11
- intermedia
verificado: true
funciones:
- nombre: ejecutar_sim_event_22
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Simulación de Asignación de Recursos
    con Detección de Inanición
tests_funciones:
- nombre: test_ejecutar_sim_event_22_positivo
  funcion: ejecutar_sim_event_22
  codigo: 'int res = ejecutar_sim_event_22(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_sim_event_22_cero
  funcion: ejecutar_sim_event_22
  codigo: 'int res = ejecutar_sim_event_22(0);

    assert(res == 0);'
- nombre: test_ejecutar_sim_event_22_negativo
  funcion: ejecutar_sim_event_22
  codigo: 'int res = ejecutar_sim_event_22(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_sim_event_22_valor_limite
  funcion: ejecutar_sim_event_22
  codigo: 'int res = ejecutar_sim_event_22(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_sim_event_22_valor_unitario
  funcion: ejecutar_sim_event_22
  codigo: 'int res = ejecutar_sim_event_22(1);

    assert(res >= 0 || res == 2);'
publicar: true
unidad: 5
modulo: Ingeniería de Software y Calidad en C
