id: sim-event-12
titulo: Simulación de Red de Servidores con Pérdida por Saturación
tema: simulacion_eventos_discretos
bloom: 2
minutos_estimados: 15
pistas:
- Mantené una cola de eventos ordenada por tiempo de ocurrencia.
- Avanzá el reloj de simulación al tiempo del próximo evento.
tags:
- simulacion
- eventos_discretos
- colas
- planificacion
- dep:colas_prioridad_heaps
- dep:tad
- c11
- inicial
verificado: true
funciones:
- nombre: ejecutar_sim_event_12
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Simulación de Red de Servidores con Pérdida
    por Saturación
tests_funciones:
- nombre: test_ejecutar_sim_event_12_positivo
  funcion: ejecutar_sim_event_12
  codigo: 'int res = ejecutar_sim_event_12(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_sim_event_12_cero
  funcion: ejecutar_sim_event_12
  codigo: 'int res = ejecutar_sim_event_12(0);

    assert(res == 0);'
- nombre: test_ejecutar_sim_event_12_negativo
  funcion: ejecutar_sim_event_12
  codigo: 'int res = ejecutar_sim_event_12(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_sim_event_12_valor_limite
  funcion: ejecutar_sim_event_12
  codigo: 'int res = ejecutar_sim_event_12(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_sim_event_12_valor_unitario
  funcion: ejecutar_sim_event_12
  codigo: 'int res = ejecutar_sim_event_12(1);

    assert(res >= 0 || res == 2);'
publicar: true
