id: sim-event-26
titulo: Simulación de Caché Multinivel L1 L2 con Políticas de Reemplazo
tema: simulacion_eventos_discretos
bloom: 4
minutos_estimados: 35
pistas:
- Mantené una cola de eventos ordenada por tiempo de ocurrencia.
- Avanzá el reloj de simulación al tiempo del próximo evento.
tags:
- simulacion
- eventos_discretos
- colas
- planificacion
- dep:colas_prioridad_heaps
- dep:tad
- c11
- intermedia
verificado: true
funciones:
- nombre: ejecutar_sim_event_26
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Simulación de Caché Multinivel L1 L2
    con Políticas de Reemplazo
tests_funciones:
- nombre: test_ejecutar_sim_event_26_positivo
  funcion: ejecutar_sim_event_26
  codigo: 'int res = ejecutar_sim_event_26(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_sim_event_26_cero
  funcion: ejecutar_sim_event_26
  codigo: 'int res = ejecutar_sim_event_26(0);

    assert(res == 0);'
- nombre: test_ejecutar_sim_event_26_negativo
  funcion: ejecutar_sim_event_26
  codigo: 'int res = ejecutar_sim_event_26(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_sim_event_26_valor_limite
  funcion: ejecutar_sim_event_26
  codigo: 'int res = ejecutar_sim_event_26(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_sim_event_26_valor_unitario
  funcion: ejecutar_sim_event_26
  codigo: 'int res = ejecutar_sim_event_26(1);

    assert(res >= 0 || res == 2);'
publicar: true
unidad: 5
modulo: Ingeniería de Software y Calidad en C
dificultad: intermedia
tipo: ejercicio_individual
prerrequisitos:
- colas_prioridad_heaps
- tad
