verificado: true
funciones:
- nombre: ejecutar_sim_event_21
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Simulación de Concurrencia de Usuarios
    en Servidor Web
tests_funciones:
- nombre: test_ejecutar_sim_event_21_positivo
  funcion: ejecutar_sim_event_21
  codigo: 'int res = ejecutar_sim_event_21(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_sim_event_21_cero
  funcion: ejecutar_sim_event_21
  codigo: 'int res = ejecutar_sim_event_21(0);

    assert(res == 0);'
- nombre: test_ejecutar_sim_event_21_negativo
  funcion: ejecutar_sim_event_21
  codigo: 'int res = ejecutar_sim_event_21(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_sim_event_21_valor_limite
  funcion: ejecutar_sim_event_21
  codigo: 'int res = ejecutar_sim_event_21(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_sim_event_21_valor_unitario
  funcion: ejecutar_sim_event_21
  codigo: 'int res = ejecutar_sim_event_21(1);

    assert(res >= 0 || res == 2);'
