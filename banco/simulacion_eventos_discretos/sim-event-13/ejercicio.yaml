  funcion: ejecutar_sim_event_13
  codigo: 'int res = ejecutar_sim_event_13(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_sim_event_13_valor_unitario
  funcion: ejecutar_sim_event_13
  codigo: 'int res = ejecutar_sim_event_13(1);

