  funcion: ejecutar_sim_event_28
  codigo: 'int res = ejecutar_sim_event_28(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_sim_event_28_valor_unitario
  funcion: ejecutar_sim_event_28
  codigo: 'int res = ejecutar_sim_event_28(1);

    assert(res >= 0 || res == 2);'
