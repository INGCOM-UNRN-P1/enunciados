funciones:
- nombre: ejecutar_sim_event_10
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Simulación de Ascensor con Solicitudes
    en Tiempo Real
tests_funciones:
- nombre: test_ejecutar_sim_event_10_positivo
  funcion: ejecutar_sim_event_10
  codigo: 'int res = ejecutar_sim_event_10(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_sim_event_10_cero
  funcion: ejecutar_sim_event_10
  codigo: 'int res = ejecutar_sim_event_10(0);

    assert(res == 0);'
- nombre: test_ejecutar_sim_event_10_negativo
  funcion: ejecutar_sim_event_10
  codigo: 'int res = ejecutar_sim_event_10(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_sim_event_10_valor_limite
  funcion: ejecutar_sim_event_10
  codigo: 'int res = ejecutar_sim_event_10(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_sim_event_10_valor_unitario
  funcion: ejecutar_sim_event_10
  codigo: 'int res = ejecutar_sim_event_10(1);

    assert(res >= 0 || res == 2);'
