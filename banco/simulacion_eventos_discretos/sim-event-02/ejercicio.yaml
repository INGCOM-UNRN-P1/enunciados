    Cola de Prioridad
tests_funciones:
- nombre: test_ejecutar_sim_event_02_positivo
  funcion: ejecutar_sim_event_02
  codigo: 'int res = ejecutar_sim_event_02(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_sim_event_02_cero
  funcion: ejecutar_sim_event_02
