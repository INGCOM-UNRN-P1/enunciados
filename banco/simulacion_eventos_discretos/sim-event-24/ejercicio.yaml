id: sim-event-24
titulo: Simulación de Enrutamiento por Estado de Enlace
tema: simulacion_eventos_discretos
bloom: 4
minutos_estimados: 35
pistas:
- Mantené una cola de eventos ordenada por tiempo de ocurrencia.
- Avanzá el reloj de simulación al tiempo del próximo evento.
tags:
- simulacion
- eventos_discretos
- colas
- planificacion
- dep:colas_prioridad_heaps
- dep:tad
- c11
- intermedia
verificado: true
funciones:
- nombre: ejecutar_sim_event_24
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Simulación de Enrutamiento por Estado
    de Enlace
tests_funciones:
- nombre: test_ejecutar_sim_event_24_positivo
  funcion: ejecutar_sim_event_24
  codigo: 'int res = ejecutar_sim_event_24(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_sim_event_24_cero
  funcion: ejecutar_sim_event_24
  codigo: 'int res = ejecutar_sim_event_24(0);

    assert(res == 0);'
- nombre: test_ejecutar_sim_event_24_negativo
  funcion: ejecutar_sim_event_24
  codigo: 'int res = ejecutar_sim_event_24(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_sim_event_24_valor_limite
  funcion: ejecutar_sim_event_24
  codigo: 'int res = ejecutar_sim_event_24(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_sim_event_24_valor_unitario
  funcion: ejecutar_sim_event_24
  codigo: 'int res = ejecutar_sim_event_24(1);

    assert(res >= 0 || res == 2);'
publicar: true
unidad: 5
modulo: Ingeniería de Software y Calidad en C
dificultad: intermedia
prerrequisitos:
- colas_prioridad_heaps
- tad
subtema: simulacion_eventos_discretos
