id: sim-event-15
titulo: Simulación de Cajero Automático con Tiempo de Operación Variable
tema: simulacion_eventos_discretos
bloom: 3
minutos_estimados: 25
pistas:
- Mantené una cola de eventos ordenada por tiempo de ocurrencia.
- Avanzá el reloj de simulación al tiempo del próximo evento.
tags:
- simulacion
- eventos_discretos
- colas
- planificacion
- dep:colas_prioridad_heaps
- dep:tad
- c11
- intermedia
verificado: true
funciones:
- nombre: ejecutar_sim_event_15
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Simulación de Cajero Automático con Tiempo
    de Operación Variable
tests_funciones:
- nombre: test_ejecutar_sim_event_15_positivo
  funcion: ejecutar_sim_event_15
  codigo: 'int res = ejecutar_sim_event_15(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_sim_event_15_cero
  funcion: ejecutar_sim_event_15
  codigo: 'int res = ejecutar_sim_event_15(0);

    assert(res == 0);'
- nombre: test_ejecutar_sim_event_15_negativo
  funcion: ejecutar_sim_event_15
  codigo: 'int res = ejecutar_sim_event_15(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_sim_event_15_valor_limite
  funcion: ejecutar_sim_event_15
  codigo: 'int res = ejecutar_sim_event_15(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_sim_event_15_valor_unitario
  funcion: ejecutar_sim_event_15
  codigo: 'int res = ejecutar_sim_event_15(1);

    assert(res >= 0 || res == 2);'
publicar: true
unidad: 5
modulo: Ingeniería de Software y Calidad en C
dificultad: intermedia
tipo: practica_guiada
prerrequisitos:
- colas_prioridad_heaps
- tad
