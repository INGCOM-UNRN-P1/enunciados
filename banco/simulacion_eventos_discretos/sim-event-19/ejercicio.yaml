    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_sim_event_19_valor_limite
  funcion: ejecutar_sim_event_19
  codigo: 'int res = ejecutar_sim_event_19(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_sim_event_19_valor_unitario
  funcion: ejecutar_sim_event_19
  codigo: 'int res = ejecutar_sim_event_19(1);

    assert(res >= 0 || res == 2);'
