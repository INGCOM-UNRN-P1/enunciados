  funcion: ejecutar_comp_datos_16
  codigo: 'int res = ejecutar_comp_datos_16(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_comp_datos_16_valor_unitario
  funcion: ejecutar_comp_datos_16
  codigo: 'int res = ejecutar_comp_datos_16(1);

