id: secuencia-ascendente
titulo: Secuencia Ascendente
tema: lazos
bloom: 3
minutos_estimados: 25
pistas:
- 'El intervalo [n, m) es semiabierto: incluye n y excluye m.'
- Si la condición inicial n < m no se cumple, el bucle no debe iterar.
tags:
- lazos
- for
- secuencias
verificado: true
funciones:
- nombre: ejecutar_secuencia_ascendente
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Secuencia Ascendente
tests_funciones:
- nombre: test_ejecutar_secuencia_ascendente_positivo
  funcion: ejecutar_secuencia_ascendente
  codigo: 'int res = ejecutar_secuencia_ascendente(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_secuencia_ascendente_cero
  funcion: ejecutar_secuencia_ascendente
  codigo: 'int res = ejecutar_secuencia_ascendente(0);

    assert(res == 0);'
