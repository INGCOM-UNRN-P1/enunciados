id: bitmap-operaciones-bits
titulo: Estructura de Bitmap Compacto y Operaciones Bitwise
tema: operaciones_bits
bloom: 4
minutos_estimados: 40
pistas:
- Para un bit $n$, el byte que lo contiene es `n / 8` y la posición dentro del byte
  es `n % 8`.
- 'Para encender el bit: `buffer[n / 8] |= (1 << (n % 8))`.'
- 'Para apagar el bit: `buffer[n / 8] &= ~(1 << (n % 8))`.'
- 'Para consultar el bit: `(buffer[n / 8] & (1 << (n % 8))) != 0`.'
