  parametros: TablaHash *tabla
  descripcion: Operación inicializar_tabla
- nombre: insertar_o_actualizar
  retorno: void
  parametros: TablaHash *tabla, const char *clave, int valor
  descripcion: Operación insertar_o_actualizar
- nombre: buscar_clave
  retorno: void
  parametros: const TablaHash *tabla, const char *clave
  descripcion: Operación buscar_clave
- nombre: eliminar_clave
  retorno: void
  parametros: TablaHash *tabla, const char *clave
  descripcion: Operación eliminar_clave
- nombre: destruir_tabla
  retorno: void
  parametros: TablaHash *tabla
  descripcion: Operación destruir_tabla
