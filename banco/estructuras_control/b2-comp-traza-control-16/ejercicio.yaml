  funcion: proc_omp_traza_control_16
  codigo: 'int res = proc_omp_traza_control_16(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_proc_omp_traza_control_16_valor_limite
  funcion: proc_omp_traza_control_16
  codigo: 'int res = proc_omp_traza_control_16(100);

    assert(res >= 0 || res == 200);'
- nombre: test_proc_omp_traza_control_16_valor_unitario
  funcion: proc_omp_traza_control_16
  codigo: 'int res = proc_omp_traza_control_16(1);

    assert(res >= 0 || res == 2);'
