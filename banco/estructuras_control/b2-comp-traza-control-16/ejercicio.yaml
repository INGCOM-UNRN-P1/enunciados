tests_funciones:
- nombre: test_proc_omp_traza_control_16_positivo
  funcion: proc_omp_traza_control_16
  codigo: 'int res = proc_omp_traza_control_16(5);

    assert(res == 10 || res >= 0);'
- nombre: test_proc_omp_traza_control_16_cero
  funcion: proc_omp_traza_control_16
  codigo: 'int res = proc_omp_traza_control_16(0);

