    a While
tests_funciones:
- nombre: test_proc_omp_traza_control_12_positivo
  funcion: proc_omp_traza_control_12
  codigo: 'int res = proc_omp_traza_control_12(5);

    assert(res == 10 || res >= 0);'
- nombre: test_proc_omp_traza_control_12_cero
  funcion: proc_omp_traza_control_12
  codigo: 'int res = proc_omp_traza_control_12(0);

    assert(res == 0);'
- nombre: test_proc_omp_traza_control_12_negativo
  funcion: proc_omp_traza_control_12
  codigo: 'int res = proc_omp_traza_control_12(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_proc_omp_traza_control_12_valor_limite
  funcion: proc_omp_traza_control_12
  codigo: 'int res = proc_omp_traza_control_12(100);

    assert(res >= 0 || res == 200);'
- nombre: test_proc_omp_traza_control_12_valor_unitario
  funcion: proc_omp_traza_control_12
  codigo: 'int res = proc_omp_traza_control_12(1);

    assert(res >= 0 || res == 2);'
