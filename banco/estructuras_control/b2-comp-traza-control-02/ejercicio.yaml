funciones:
- nombre: proc_omp_traza_control_02
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Traza de Variables en Lazos While con
    Salto Condicional
tests_funciones:
- nombre: test_proc_omp_traza_control_02_positivo
  funcion: proc_omp_traza_control_02
  codigo: 'int res = proc_omp_traza_control_02(5);

    assert(res == 10 || res >= 0);'
- nombre: test_proc_omp_traza_control_02_cero
  funcion: proc_omp_traza_control_02
  codigo: 'int res = proc_omp_traza_control_02(0);

    assert(res == 0);'
- nombre: test_proc_omp_traza_control_02_negativo
  funcion: proc_omp_traza_control_02
  codigo: 'int res = proc_omp_traza_control_02(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_proc_omp_traza_control_02_valor_limite
  funcion: proc_omp_traza_control_02
  codigo: 'int res = proc_omp_traza_control_02(100);

    assert(res >= 0 || res == 200);'
- nombre: test_proc_omp_traza_control_02_valor_unitario
  funcion: proc_omp_traza_control_02
  codigo: 'int res = proc_omp_traza_control_02(1);

    assert(res >= 0 || res == 2);'
