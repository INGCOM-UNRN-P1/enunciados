  funcion: proc_omp_traza_control_35
  codigo: 'int res = proc_omp_traza_control_35(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_proc_omp_traza_control_35_valor_limite
  funcion: proc_omp_traza_control_35
  codigo: 'int res = proc_omp_traza_control_35(100);

    assert(res >= 0 || res == 200);'
- nombre: test_proc_omp_traza_control_35_valor_unitario
  funcion: proc_omp_traza_control_35
  codigo: 'int res = proc_omp_traza_control_35(1);

    assert(res >= 0 || res == 2);'
