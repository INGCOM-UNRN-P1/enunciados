id: ej-4-39-numeros-primos-en-rango
titulo: Números Primos en Rango
tema: estructuras_control
bloom: 2
minutos_estimados: 15
pistas:
- '[Plus Ultra] Validar que los límites del rango sean positivos.'
- '[Plus Ultra] Mostrar la cantidad de primos por cada decena en el rango.'
tags:
- rango
- control
- lazos
- fundamentos
- primos
- dep:condicionales
- dep:lazos
- c11
- inicial
verificado: true
funciones:
- nombre: contar_primos_en_rango
  retorno: int
  parametros: int inicio, int fin
  descripcion: Cuenta los primos del intervalo inclusivo; devuelve -1 para límites inválidos.
tests_funciones:
- nombre: test_intervalo_unitario_primo
  funcion: contar_primos_en_rango
  codigo: assert(contar_primos_en_rango(2, 2) == 1);
- nombre: test_primos_incluye_extremos
  funcion: contar_primos_en_rango
  codigo: assert(contar_primos_en_rango(2, 10) == 4);
- nombre: test_intervalo_sin_primos
  funcion: contar_primos_en_rango
  codigo: assert(contar_primos_en_rango(14, 16) == 0);
- nombre: test_limites_invalidos
  funcion: contar_primos_en_rango
  codigo: assert(contar_primos_en_rango(0, 10) == -1); assert(contar_primos_en_rango(10, 2) == -1);
