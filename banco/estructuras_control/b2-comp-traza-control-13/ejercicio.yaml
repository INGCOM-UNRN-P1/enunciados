  codigo: 'int res = proc_omp_traza_control_13(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_proc_omp_traza_control_13_valor_limite
  funcion: proc_omp_traza_control_13
  codigo: 'int res = proc_omp_traza_control_13(100);

    assert(res >= 0 || res == 200);'
- nombre: test_proc_omp_traza_control_13_valor_unitario
  funcion: proc_omp_traza_control_13
  codigo: 'int res = proc_omp_traza_control_13(1);

    assert(res >= 0 || res == 2);'
