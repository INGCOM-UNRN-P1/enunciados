verificado: true
funciones:
- nombre: proc_omp_traza_control_50
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Traza de Algoritmo de Burbujeo Paso a
    Paso
tests_funciones:
- nombre: test_proc_omp_traza_control_50_positivo
  funcion: proc_omp_traza_control_50
  codigo: 'int res = proc_omp_traza_control_50(5);

    assert(res == 10 || res >= 0);'
- nombre: test_proc_omp_traza_control_50_cero
  funcion: proc_omp_traza_control_50
  codigo: 'int res = proc_omp_traza_control_50(0);

    assert(res == 0);'
- nombre: test_proc_omp_traza_control_50_negativo
  funcion: proc_omp_traza_control_50
  codigo: 'int res = proc_omp_traza_control_50(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_proc_omp_traza_control_50_valor_limite
  funcion: proc_omp_traza_control_50
  codigo: 'int res = proc_omp_traza_control_50(100);

    assert(res >= 0 || res == 200);'
- nombre: test_proc_omp_traza_control_50_valor_unitario
  funcion: proc_omp_traza_control_50
  codigo: 'int res = proc_omp_traza_control_50(1);

    assert(res >= 0 || res == 2);'
