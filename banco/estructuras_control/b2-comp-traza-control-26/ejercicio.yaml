tests_funciones:
- nombre: test_proc_omp_traza_control_26_positivo
  funcion: proc_omp_traza_control_26
  codigo: 'int res = proc_omp_traza_control_26(5);

    assert(res == 10 || res >= 0);'
- nombre: test_proc_omp_traza_control_26_cero
  funcion: proc_omp_traza_control_26
  codigo: 'int res = proc_omp_traza_control_26(0);

