- nombre: test_proc_omp_traza_control_26_negativo
  funcion: proc_omp_traza_control_26
  codigo: 'int res = proc_omp_traza_control_26(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_proc_omp_traza_control_26_valor_limite
  funcion: proc_omp_traza_control_26
  codigo: 'int res = proc_omp_traza_control_26(100);

    assert(res >= 0 || res == 200);'
- nombre: test_proc_omp_traza_control_26_valor_unitario
  funcion: proc_omp_traza_control_26
  codigo: 'int res = proc_omp_traza_control_26(1);

    assert(res >= 0 || res == 2);'
