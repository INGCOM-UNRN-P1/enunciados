    dentro del Lazo
tests_funciones:
- nombre: test_proc_omp_traza_control_07_positivo
  funcion: proc_omp_traza_control_07
  codigo: 'int res = proc_omp_traza_control_07(5);

    assert(res == 10 || res >= 0);'
- nombre: test_proc_omp_traza_control_07_cero
  funcion: proc_omp_traza_control_07
  codigo: 'int res = proc_omp_traza_control_07(0);

    assert(res == 0);'
- nombre: test_proc_omp_traza_control_07_negativo
  funcion: proc_omp_traza_control_07
  codigo: 'int res = proc_omp_traza_control_07(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_proc_omp_traza_control_07_valor_limite
  funcion: proc_omp_traza_control_07
  codigo: 'int res = proc_omp_traza_control_07(100);

    assert(res >= 0 || res == 200);'
- nombre: test_proc_omp_traza_control_07_valor_unitario
  funcion: proc_omp_traza_control_07
  codigo: 'int res = proc_omp_traza_control_07(1);

    assert(res >= 0 || res == 2);'
