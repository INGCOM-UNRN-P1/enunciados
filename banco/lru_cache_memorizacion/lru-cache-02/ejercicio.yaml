id: lru-cache-02
titulo: Inicialización de Caché LRU con Capacidad Fija y Nodos Centinela
tema: lru_cache_memorizacion
bloom: 1
minutos_estimados: 10
pistas:
- El elemento más recientemente usado se mueve al frente o final.
- Al exceder la capacidad, desinstalá el elemento menos consultado.
tags:
- lru
- cache
- memorizacion
- tablas_hash
- estructuras_datos
- dep:tad
- dep:listas_enlazadas
- c11
- inicial
verificado: true
funciones:
- nombre: ejecutar_lru_cache_02
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Inicialización de Caché LRU con Capacidad
    Fija y Nodos Centinela
tests_funciones:
- nombre: test_ejecutar_lru_cache_02_positivo
  funcion: ejecutar_lru_cache_02
  codigo: 'int res = ejecutar_lru_cache_02(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_lru_cache_02_cero
  funcion: ejecutar_lru_cache_02
  codigo: 'int res = ejecutar_lru_cache_02(0);

    assert(res == 0);'
- nombre: test_ejecutar_lru_cache_02_negativo
  funcion: ejecutar_lru_cache_02
  codigo: 'int res = ejecutar_lru_cache_02(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_lru_cache_02_valor_limite
  funcion: ejecutar_lru_cache_02
  codigo: 'int res = ejecutar_lru_cache_02(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_lru_cache_02_valor_unitario
  funcion: ejecutar_lru_cache_02
  codigo: 'int res = ejecutar_lru_cache_02(1);

    assert(res >= 0 || res == 2);'
publicar: true
unidad: 4
modulo: Tipos Abstractos y Algorítmica
dificultad: inicial
tipo: practica_guiada
prerrequisitos:
