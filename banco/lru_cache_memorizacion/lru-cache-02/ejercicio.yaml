id: lru-cache-02
titulo: Inicialización de Caché LRU con Capacidad Fija y Nodos Centinela
tema: lru_cache_memorizacion
bloom: 1
minutos_estimados: 10
pistas:
- El elemento más recientemente usado se mueve al frente o final.
- Al exceder la capacidad, desinstalá el elemento menos consultado.
tags:
