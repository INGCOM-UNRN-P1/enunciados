    Fija y Nodos Centinela
tests_funciones:
- nombre: test_ejecutar_lru_cache_02_positivo
  funcion: ejecutar_lru_cache_02
  codigo: 'int res = ejecutar_lru_cache_02(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_lru_cache_02_cero
  funcion: ejecutar_lru_cache_02
