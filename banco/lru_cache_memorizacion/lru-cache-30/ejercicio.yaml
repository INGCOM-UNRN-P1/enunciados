  funcion: ejecutar_lru_cache_30
  codigo: 'int res = ejecutar_lru_cache_30(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_lru_cache_30_valor_unitario
  funcion: ejecutar_lru_cache_30
