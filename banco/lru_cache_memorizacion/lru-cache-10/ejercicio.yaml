    y Desempate por Recencia
tests_funciones:
- nombre: test_ejecutar_lru_cache_10_positivo
  funcion: ejecutar_lru_cache_10
  codigo: 'int res = ejecutar_lru_cache_10(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_lru_cache_10_cero
  funcion: ejecutar_lru_cache_10
