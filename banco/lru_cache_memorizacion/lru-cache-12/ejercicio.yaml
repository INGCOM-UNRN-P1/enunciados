tests_funciones:
- nombre: test_ejecutar_lru_cache_12_positivo
  funcion: ejecutar_lru_cache_12
  codigo: 'int res = ejecutar_lru_cache_12(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_lru_cache_12_cero
  funcion: ejecutar_lru_cache_12
  codigo: 'int res = ejecutar_lru_cache_12(0);

    assert(res == 0);'
- nombre: test_ejecutar_lru_cache_12_negativo
  funcion: ejecutar_lru_cache_12
  codigo: 'int res = ejecutar_lru_cache_12(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_lru_cache_12_valor_limite
  funcion: ejecutar_lru_cache_12
  codigo: 'int res = ejecutar_lru_cache_12(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_lru_cache_12_valor_unitario
  funcion: ejecutar_lru_cache_12
  codigo: 'int res = ejecutar_lru_cache_12(1);

    assert(res >= 0 || res == 2);'
