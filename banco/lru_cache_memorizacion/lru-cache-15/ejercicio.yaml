verificado: true
funciones:
- nombre: ejecutar_lru_cache_15
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Limpieza Periódica de Elementos Expirados
    por TTL
tests_funciones:
- nombre: test_ejecutar_lru_cache_15_positivo
  funcion: ejecutar_lru_cache_15
  codigo: 'int res = ejecutar_lru_cache_15(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_lru_cache_15_cero
  funcion: ejecutar_lru_cache_15
  codigo: 'int res = ejecutar_lru_cache_15(0);

    assert(res == 0);'
- nombre: test_ejecutar_lru_cache_15_negativo
  funcion: ejecutar_lru_cache_15
  codigo: 'int res = ejecutar_lru_cache_15(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_lru_cache_15_valor_limite
  funcion: ejecutar_lru_cache_15
  codigo: 'int res = ejecutar_lru_cache_15(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_lru_cache_15_valor_unitario
  funcion: ejecutar_lru_cache_15
  codigo: 'int res = ejecutar_lru_cache_15(1);

    assert(res >= 0 || res == 2);'
