id: lru-cache-15
titulo: Limpieza Periódica de Elementos Expirados por TTL
tema: lru_cache_memorizacion
bloom: 3
minutos_estimados: 25
pistas:
- El elemento más recientemente usado se mueve al frente o final.
- Al exceder la capacidad, desinstalá el elemento menos consultado.
tags:
- lru
- cache
- memorizacion
- tablas_hash
- estructuras_datos
verificado: true
funciones:
- nombre: ejecutar_lru_cache_15
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Limpieza Periódica de Elementos Expirados
    por TTL
tests_funciones:
- nombre: test_ejecutar_lru_cache_15_positivo
  funcion: ejecutar_lru_cache_15
  codigo: 'int res = ejecutar_lru_cache_15(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_lru_cache_15_cero
  funcion: ejecutar_lru_cache_15
  codigo: 'int res = ejecutar_lru_cache_15(0);

    assert(res == 0);'
publicar: false
