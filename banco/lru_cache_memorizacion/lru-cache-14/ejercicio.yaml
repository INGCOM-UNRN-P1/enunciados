tests_funciones:
- nombre: test_ejecutar_lru_cache_14_positivo
  funcion: ejecutar_lru_cache_14
  codigo: 'int res = ejecutar_lru_cache_14(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_lru_cache_14_cero
  funcion: ejecutar_lru_cache_14
  codigo: 'int res = ejecutar_lru_cache_14(0);

    assert(res == 0);'
- nombre: test_ejecutar_lru_cache_14_negativo
  funcion: ejecutar_lru_cache_14
  codigo: 'int res = ejecutar_lru_cache_14(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_lru_cache_14_valor_limite
  funcion: ejecutar_lru_cache_14
  codigo: 'int res = ejecutar_lru_cache_14(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_lru_cache_14_valor_unitario
  funcion: ejecutar_lru_cache_14
  codigo: 'int res = ejecutar_lru_cache_14(1);

    assert(res >= 0 || res == 2);'
