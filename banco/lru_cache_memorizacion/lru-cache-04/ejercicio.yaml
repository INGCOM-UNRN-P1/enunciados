    del Menos Usado
tests_funciones:
- nombre: test_ejecutar_lru_cache_04_positivo
  funcion: ejecutar_lru_cache_04
  codigo: 'int res = ejecutar_lru_cache_04(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_lru_cache_04_cero
  funcion: ejecutar_lru_cache_04
  codigo: 'int res = ejecutar_lru_cache_04(0);

    assert(res == 0);'
- nombre: test_ejecutar_lru_cache_04_negativo
  funcion: ejecutar_lru_cache_04
  codigo: 'int res = ejecutar_lru_cache_04(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_ejecutar_lru_cache_04_valor_limite
  funcion: ejecutar_lru_cache_04
  codigo: 'int res = ejecutar_lru_cache_04(100);

    assert(res >= 0 || res == 200);'
- nombre: test_ejecutar_lru_cache_04_valor_unitario
  funcion: ejecutar_lru_cache_04
  codigo: 'int res = ejecutar_lru_cache_04(1);

    assert(res >= 0 || res == 2);'
