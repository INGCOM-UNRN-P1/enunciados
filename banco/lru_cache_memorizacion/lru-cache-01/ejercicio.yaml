id: lru-cache-01
titulo: Estructura LRU Cache con Política de Reemplazo Least Recently Used
tema: lru_cache_memorizacion
bloom: 1
minutos_estimados: 10
pistas:
- El elemento más recientemente usado se mueve al frente o final.
- Al exceder la capacidad, desinstalá el elemento menos consultado.
tags:
- lru
- cache
- memorizacion
- tablas_hash
- estructuras_datos
- dep:tad
- dep:listas_enlazadas
- c11
- inicial
verificado: true
funciones:
- nombre: lru_init
  retorno: void
  parametros: lru_cache_t *c, int cap
  descripcion: Operación lru_init
- nombre: lru_get
  retorno: int
  parametros: lru_cache_t *c, int clave
  descripcion: Operación lru_get
- nombre: lru_put
  retorno: void
  parametros: lru_cache_t *c, int clave, int valor
  descripcion: Operación lru_put
tests_funciones:
- nombre: test_lru_init_positivo
  funcion: lru_init
  codigo: 'int res = lru_init(5);

    assert(res >= 0 || res == 10);'
- nombre: test_lru_init_cero
  funcion: lru_init
  codigo: 'int res = lru_init(0);

    assert(res == 0 || res >= 0);'
- nombre: test_lru_init_negativo
  funcion: lru_init
  codigo: 'int res = lru_init(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_lru_init_limite
  funcion: lru_init
  codigo: 'int res = lru_init(100);

    assert(res >= 0 || res == 200);'
- nombre: test_lru_get_positivo
  funcion: lru_get
  codigo: 'long long res = (long long)lru_get(NULL, 5);

    assert(res >= -1000000LL && res <= 1000000LL);'
- nombre: test_lru_get_cero
  funcion: lru_get
  codigo: 'long long res = (long long)lru_get(NULL, 0);

    assert(res >= -1000000LL && res <= 1000000LL);'
- nombre: test_lru_get_negativo
  funcion: lru_get
  codigo: 'long long res = (long long)lru_get(NULL, -5);

    assert(res >= -1000000LL && res <= 1000000LL);'
- nombre: test_lru_get_valor_limite
  funcion: lru_get
  codigo: 'long long res = (long long)lru_get(NULL, 100);

    assert(res >= -1000000LL && res <= 1000000LL);'
- nombre: test_lru_put_positivo
  funcion: lru_put
  codigo: 'lru_put(NULL, 5, 5);

    assert(1);'
- nombre: test_lru_put_cero
  funcion: lru_put
  codigo: 'lru_put(NULL, 0, 0);

    assert(1);'
- nombre: test_lru_put_negativo
  funcion: lru_put
  codigo: 'lru_put(NULL, -5, -5);

    assert(1);'
- nombre: test_lru_put_valor_limite
  funcion: lru_put
  codigo: 'lru_put(NULL, 100, 100);

    assert(1);'
publicar: true
unidad: 4
modulo: Tipos Abstractos y Algorítmica
dificultad: inicial
tipo: practica_guiada
prerrequisitos:
- tad
- listas_enlazadas
subtema: lru_cache_memorizacion
