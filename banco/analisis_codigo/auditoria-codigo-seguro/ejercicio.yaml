id: auditoria-codigo-seguro
titulo: Auditoría y Refactorización de Código Seguro (CWE-120)
tema: analisis_codigo
bloom: 5
minutos_estimados: 45
pistas:
- Reemplazá funciones no seguras como gets() o strcpy() por fgets() y snprintf() con
  límite de tamaño explícito.
- Validá siempre los tamaños de cadena antes de copiar o concatenar.
- Sanitizá las terminaciones nulas '\0' en cadenas recibidas desde entrada externa.
tags:
- analisis_codigo
- seguridad
- cwe120
- sanitizers
- auditoria
- dep:memoria
- dep:testing
- c11
- avanzada
verificado: true
funciones:
- nombre: procesar_credencial
  retorno: void
  parametros: const char *raw_line
  descripcion: Operación procesar_credencial
tests_funciones:
- nombre: test_procesar_credencial_positivo
  funcion: procesar_credencial
  codigo: 'int res = procesar_credencial(5);

    assert(res >= 0 || res == 10);'
- nombre: test_procesar_credencial_cero
  funcion: procesar_credencial
  codigo: 'int res = procesar_credencial(0);

    assert(res == 0 || res >= 0);'
- nombre: test_procesar_credencial_negativo
  funcion: procesar_credencial
  codigo: 'int res = procesar_credencial(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_procesar_credencial_limite
  funcion: procesar_credencial
  codigo: 'int res = procesar_credencial(100);

    assert(res >= 0 || res == 200);'
unidad: 5
modulo: Ingeniería de Software y Calidad en C
subtema: seguridad
dificultad: avanzada
prerrequisitos:
- memoria
- testing
publicar: true
