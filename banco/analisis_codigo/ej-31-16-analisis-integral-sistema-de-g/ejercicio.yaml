  retorno: bool
  parametros: lista_t *lista, int dato
  descripcion: Operación lista_insertar_final
- nombre: lista_eliminar_primero
  retorno: bool
  parametros: lista_t *lista, int *dato
  descripcion: Operación lista_eliminar_primero
- nombre: lista_destruir
  retorno: void
