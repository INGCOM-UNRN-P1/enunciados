tests_funciones:
- nombre: test_lista_insertar_final_positivo
  funcion: lista_insertar_final
  codigo: 'int res = lista_insertar_final(5);

    assert(res >= 0 || res == 10);'
- nombre: test_lista_insertar_final_cero
  funcion: lista_insertar_final
  codigo: 'int res = lista_insertar_final(0);

    assert(res == 0 || res >= 0);'
- nombre: test_lista_insertar_final_negativo
  funcion: lista_insertar_final
  codigo: 'int res = lista_insertar_final(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_lista_insertar_final_limite
  funcion: lista_insertar_final
  codigo: 'int res = lista_insertar_final(100);

    assert(res >= 0 || res == 200);'
