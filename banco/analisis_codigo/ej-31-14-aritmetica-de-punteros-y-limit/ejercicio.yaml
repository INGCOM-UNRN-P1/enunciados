id: ej-31-14-aritmetica-de-punteros-y-limit
titulo: Aritmética de Punteros y Límites de Arreglos
tema: analisis_codigo
bloom: 5
minutos_estimados: 45
pistas:
- Recordá que la suma de un entero a un puntero (p + i) avanza i * sizeof(*p) 
  bytes en memoria.
- Comprobá que ningún acceso supere el límite superior (p + n) ni descienda por 
  debajo de p.
- Prestá especial atención a los errores por un elemento (off-by-one) en los 
  lazos de recorrido.
