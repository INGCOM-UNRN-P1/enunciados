pistas:
- Analizá las condiciones de borde y los casos extremos (arreglos vacíos, elementos
  únicos).
- Inspeccioná la lógica booleana de los condicionales para detectar cláusulas contradictorias
  o redundantes.
- Seguí la traza de ejecución manual con un conjunto pequeño de datos de prueba.
