tests_funciones:
- nombre: test_segundo_maximo_positivo
  funcion: segundo_maximo
  codigo: 'int res = segundo_maximo(5);

    assert(res >= 0 || res == 10);'
- nombre: test_segundo_maximo_cero
  funcion: segundo_maximo
  codigo: 'int res = segundo_maximo(0);

    assert(res == 0 || res >= 0);'
- nombre: test_segundo_maximo_negativo
  funcion: segundo_maximo
  codigo: 'int res = segundo_maximo(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_segundo_maximo_limite
  funcion: segundo_maximo
  codigo: 'int res = segundo_maximo(100);

    assert(res >= 0 || res == 200);'
