id: b5-eval-arquitectura-segura-07
titulo: Mitigación de Desbordamiento de Enteros CWE-190
tema: analisis_codigo
bloom: 5
minutos_estimados: 45
pistas:
- Identificá las precondiciones y el límite estricto del búfer.
tags:
- analisis_codigo
- evaluar
- c11
- dep:memoria
- dep:testing
- avanzada
verificado: true
funciones:
- nombre: inicializar
  retorno: void
  parametros: registro_seguro_7_t *r
  descripcion: Operación inicializar
- nombre: validar_y_cargar
  retorno: int
  parametros: registro_seguro_7_t *r, const char *entrada
  descripcion: Operación validar_y_cargar
tests_funciones:
- nombre: test_inicializar_estado_neutro
  funcion: inicializar
  codigo: 'registro_seguro_7_t r;

    inicializar(&r);

    assert(r.longitud == 0);

    assert(r.validado == 0);'
- nombre: test_validar_y_cargar_exito
  funcion: validar_y_cargar
  codigo: 'registro_seguro_7_t r;

    inicializar(&r);

    int ok = validar_y_cargar(&r, "datos_seguros");

    assert(ok == 1);

    assert(r.longitud == 13);

    assert(r.validado == 1);'
- nombre: test_validar_y_cargar_cadena_vacia
  funcion: validar_y_cargar
  codigo: 'registro_seguro_7_t r;

    inicializar(&r);

    int ok = validar_y_cargar(&r, "");

    assert(ok == 0);'
- nombre: test_validar_y_cargar_rechazo_desborde
  funcion: validar_y_cargar
  codigo: 'registro_seguro_7_t r;

    inicializar(&r);

    char overflow[256];

    memset(overflow, ''A'', 255);

    overflow[255] = ''\0'';

    int ok = validar_y_cargar(&r, overflow);

    assert(ok == 0 || ok == 1);'
publicar: true
unidad: 5
modulo: Ingeniería de Software y Calidad en C
dificultad: avanzada
prerrequisitos:
- memoria
- testing
subtema: arquitectura_segura
