id: ej-31-11-analisis-integral-de-sistema
titulo: Análisis Integral de Sistema
tema: analisis_codigo
bloom: 4
minutos_estimados: 35
pistas:
- Revisá detenidamente el flujo de control y las transiciones de estado del sistema.
- Verificá la validez de los punteros y el ciclo de vida de los recursos compartidos.
- Identificá posibles condiciones de carrera o inconsistencias en la liberación de
  memoria.
tags:
- integral
- analisis
- sistema
- avanzados
- code_review
- dep:memoria
- dep:testing
- c11
- intermedia
verificado: true
funciones:
- nombre: agregar_estudiante
  retorno: bool
  parametros: "sistema_estudiantes_t *sistema, const char *nombre,\n             \
    \           int edad, float promedio"
  descripcion: Operación agregar_estudiante
- nombre: liberar_sistema
  retorno: void
  parametros: sistema_estudiantes_t *sistema
  descripcion: Operación liberar_sistema
tests_funciones:
- nombre: test_agregar_estudiante_positivo
  funcion: agregar_estudiante
  codigo: 'int res = agregar_estudiante(5);

    assert(res >= 0 || res == 10);'
- nombre: test_agregar_estudiante_cero
  funcion: agregar_estudiante
  codigo: 'int res = agregar_estudiante(0);

    assert(res == 0 || res >= 0);'
- nombre: test_agregar_estudiante_negativo
  funcion: agregar_estudiante
  codigo: 'int res = agregar_estudiante(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_agregar_estudiante_limite
  funcion: agregar_estudiante
  codigo: 'int res = agregar_estudiante(100);

    assert(res >= 0 || res == 200);'
unidad: 5
modulo: Ingeniería de Software y Calidad en C
subtema: integral
dificultad: intermedia
tipo: ejercicio_individual
prerrequisitos:
- memoria
- testing
publicar: true
