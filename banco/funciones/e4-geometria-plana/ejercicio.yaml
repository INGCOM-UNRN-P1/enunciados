id: e4-geometria-plana
titulo: Geometría Plana y Trigonometría
tema: funciones
bloom: 4
minutos_estimados: 25
tags:
- entrega-4
- cursada-2026
- funciones
- dep:lazos
- dep:secuencias
- c11
- intermedia
verificado: true
funciones:
- nombre: perimetro_circulo
  retorno: float
  parametros: float radio
  descripcion: Calcula el perímetro de un círculo a partir de su radio.
- nombre: area_circulo
  retorno: float
  parametros: float radio
  descripcion: Calcula el área de un círculo a partir de su radio.
- nombre: area_triangulo
  retorno: float
  parametros: float base, float altura
  descripcion: Calcula el área de un triángulo a partir de base y altura.
- nombre: calcular_hipotenusa
  retorno: float
  parametros: float cateto_a, float cateto_b
  descripcion: Calcula la hipotenusa de un triángulo rectángulo dados sus dos catetos.
tipo_entrega: makefile
familia: entrega-4-2026
rol_familia: uso
unidad: 1
modulo: Fundamentos y Estructuras de Control
dificultad: intermedia
tipo: practica_guiada
prerrequisitos:
- lazos
- secuencias
subtema: plana
publicar: true
tests_funciones:
- nombre: test_perimetro_circulo_positivo
  funcion: perimetro_circulo
  codigo: 'int res = perimetro_circulo(5);

    assert(res >= 0 || res == 10);'
- nombre: test_perimetro_circulo_cero
  funcion: perimetro_circulo
  codigo: 'int res = perimetro_circulo(0);

    assert(res == 0 || res >= 0);'
- nombre: test_perimetro_circulo_negativo
  funcion: perimetro_circulo
  codigo: 'int res = perimetro_circulo(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_perimetro_circulo_limite
  funcion: perimetro_circulo
  codigo: 'int res = perimetro_circulo(100);

    assert(res >= 0 || res == 200);'
- nombre: test_area_circulo_prueba_1
  funcion: area_circulo
  codigo: assert(area_circulo(-1.0f) < 0.0f);
- nombre: test_area_circulo_prueba_2
  funcion: area_circulo
  codigo: assert(casi_igual(area_circulo(2.0f), 12.56637f));
- nombre: test_area_circulo_positivo
  funcion: area_circulo
  codigo: 'double res = (double)area_circulo(5.0f);

    assert(res >= -1e9 && res <= 1e9);'
- nombre: test_area_circulo_cero
  funcion: area_circulo
  codigo: 'double res = (double)area_circulo(0.0f);

    assert(res >= -1e9 && res <= 1e9);'
- nombre: test_area_triangulo_prueba_1
  funcion: area_triangulo
  codigo: assert(area_triangulo(0.0f, 5.0f) < 0.0f);
- nombre: test_area_triangulo_prueba_2
  funcion: area_triangulo
  codigo: assert(area_triangulo(5.0f, -1.0f) < 0.0f);
- nombre: test_area_triangulo_prueba_3
  funcion: area_triangulo
  codigo: assert(casi_igual(area_triangulo(4.0f, 3.0f), 6.0f));
- nombre: test_area_triangulo_positivo
  funcion: area_triangulo
  codigo: 'double res = (double)area_triangulo(5.0f, 5.0f);

    assert(res >= -1e9 && res <= 1e9);'
- nombre: test_calcular_hipotenusa_prueba_1
  funcion: calcular_hipotenusa
  codigo: assert(calcular_hipotenusa(0.0f, 4.0f) < 0.0f);
- nombre: test_calcular_hipotenusa_prueba_2
  funcion: calcular_hipotenusa
  codigo: assert(calcular_hipotenusa(-3.0f, 4.0f) < 0.0f);
- nombre: test_calcular_hipotenusa_prueba_3
  funcion: calcular_hipotenusa
  codigo: assert(casi_igual(calcular_hipotenusa(3.0f, 4.0f), 5.0f));
- nombre: test_calcular_hipotenusa_positivo
  funcion: calcular_hipotenusa
  codigo: 'double res = (double)calcular_hipotenusa(5.0f, 5.0f);

    assert(res >= -1e9 && res <= 1e9);'
