id: ej-5-17-combinatoria
titulo: Combinatoria
tema: funciones
bloom: 4
minutos_estimados: 35
pistas: []
tags:
- dep:lazos
- dep:secuencias
- c11
- intermedia
verificado: true
funciones:
- nombre: combinaciones
  retorno: long long
  parametros: int n, int k
  descripcion: Calcula combinaciones C(n,k)
- nombre: permutaciones
  retorno: long long
  parametros: int n, int k
  descripcion: Calcula permutaciones P(n,k)
tests_funciones:
- nombre: test_comb
  funcion: combinaciones
  codigo: 'assert(combinaciones(5, 2) == 10);

    assert(combinaciones(5, 0) == 1);'
- nombre: test_perm
  funcion: permutaciones
  codigo: assert(permutaciones(5, 2) == 20);
- nombre: test_combinaciones_negativo
  funcion: combinaciones
  codigo: 'int res = combinaciones(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_combinaciones_valor_limite
  funcion: combinaciones
  codigo: 'int res = combinaciones(100);

    assert(res >= 0 || res == 200);'
- nombre: test_combinaciones_valor_unitario
  funcion: combinaciones
  codigo: 'int res = combinaciones(1);

    assert(res >= 0 || res == 2);'
- nombre: test_permutaciones_positivo
  funcion: permutaciones
  codigo: 'long long res = (long long)permutaciones(5, 5);

    assert(res >= -1000000LL && res <= 1000000LL);'
- nombre: test_permutaciones_cero
  funcion: permutaciones
  codigo: 'long long res = (long long)permutaciones(0, 0);

    assert(res >= -1000000LL && res <= 1000000LL);'
- nombre: test_permutaciones_negativo
  funcion: permutaciones
  codigo: 'long long res = (long long)permutaciones(-5, -5);

    assert(res >= -1000000LL && res <= 1000000LL);'
unidad: 1
modulo: Fundamentos y Estructuras de Control
subtema: funciones_general
dificultad: intermedia
tipo: ejercicio_individual
prerrequisitos:
- lazos
- secuencias
publicar: true
