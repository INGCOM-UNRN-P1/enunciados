- c11
- inicial
verificado: true
funciones:
- nombre: sumar
  retorno: double
  parametros: double a, double b
  descripcion: Devuelve la suma de a y b
- nombre: restar
  retorno: double
  parametros: double a, double b
  descripcion: Devuelve la diferencia a menos b
- nombre: multiplicar
  retorno: double
  parametros: double a, double b
  descripcion: Devuelve el producto de a y b
- nombre: dividir
  retorno: double
  parametros: double a, double b
  descripcion: Devuelve a dividido por b o NAN si b es cero
tests_funciones:
- nombre: test_suma
  funcion: sumar
  codigo: assert(sumar(1.5, 2.0) == 3.5);
- nombre: test_resta
  funcion: restar
  codigo: assert(restar(2.0, 5.0) == -3.0);
- nombre: test_multiplicacion
  funcion: multiplicar
  codigo: assert(multiplicar(-2.0, 3.0) == -6.0);
- nombre: test_division
  funcion: dividir
  codigo: 'assert(dividir(7.0, 2.0) == 3.5);

    assert(dividir(1.0, 0.0) != dividir(1.0, 0.0));'
