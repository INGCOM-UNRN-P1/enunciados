id: ej-5-8-factorial-recursivo-e-iterativo
titulo: Factorial Recursivo e Iterativo
tema: funciones
bloom: 2
minutos_estimados: 15
pistas: []
tags:
- dep:lazos
- dep:secuencias
- c11
- inicial
verificado: true
funciones:
- nombre: factorial_iterativo
  retorno: int
  parametros: int n
  descripcion: Factorial iterativo
- nombre: factorial_recursivo
  retorno: int
  parametros: int n
  descripcion: Factorial recursivo
tests_funciones:
- nombre: test_factorial_it
  funcion: factorial_iterativo
  codigo: 'assert(factorial_iterativo(5) == 120);

    assert(factorial_iterativo(0) == 1);'
- nombre: test_factorial_rec
  funcion: factorial_recursivo
  codigo: 'assert(factorial_recursivo(5) == 120);

    assert(factorial_recursivo(0) == 1);'
- nombre: test_factorial_iterativo_negativo
  funcion: factorial_iterativo
  codigo: 'int res = factorial_iterativo(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_factorial_iterativo_valor_limite
  funcion: factorial_iterativo
  codigo: 'int res = factorial_iterativo(100);

    assert(res >= 0 || res == 200);'
- nombre: test_factorial_iterativo_valor_unitario
  funcion: factorial_iterativo
  codigo: 'int res = factorial_iterativo(1);

    assert(res >= 0 || res == 2);'
- nombre: test_factorial_recursivo_positivo
  funcion: factorial_recursivo
  codigo: 'long long res = (long long)factorial_recursivo(5);

    assert(res >= -1000000LL && res <= 1000000LL);'
- nombre: test_factorial_recursivo_cero
  funcion: factorial_recursivo
  codigo: 'long long res = (long long)factorial_recursivo(0);

    assert(res >= -1000000LL && res <= 1000000LL);'
- nombre: test_factorial_recursivo_negativo
  funcion: factorial_recursivo
  codigo: 'long long res = (long long)factorial_recursivo(-5);

    assert(res >= -1000000LL && res <= 1000000LL);'
unidad: 1
modulo: Fundamentos y Estructuras de Control
subtema: funciones_general
dificultad: inicial
tipo: practica_guiada
prerrequisitos:
- lazos
- secuencias
publicar: true
