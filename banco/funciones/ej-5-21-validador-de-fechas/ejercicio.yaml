id: ej-5-21-validador-de-fechas
titulo: Validador de Fechas
tema: funciones
bloom: 4
minutos_estimados: 35
pistas: []
tags:
- dep:lazos
- dep:secuencias
- c11
- intermedia
verificado: true
funciones:
- nombre: es_bisiesto
  retorno: bool
  parametros: int anio
  descripcion: Indica si el año gregoriano es bisiesto.
- nombre: dias_del_mes
  retorno: int
  parametros: int mes, int anio
  descripcion: Devuelve la cantidad de días del mes.
- nombre: es_fecha_valida
  retorno: bool
  parametros: int dia, int mes, int anio
  descripcion: Indica si existe la fecha en el calendario gregoriano.
- nombre: dia_del_anio
  retorno: int
  parametros: int dia, int mes, int anio
  descripcion: Devuelve el ordinal del día en el año.
tests_funciones:
- nombre: test_es_bisiesto_comun
  funcion: es_bisiesto
  codigo: assert(!es_bisiesto(2023)); assert(!es_bisiesto(1900));
- nombre: test_es_bisiesto_bisiesto
  funcion: es_bisiesto
  codigo: assert(es_bisiesto(2024)); assert(es_bisiesto(2000));
- nombre: test_es_bisiesto_invalido
  funcion: es_bisiesto
  codigo: assert(!es_bisiesto(0)); assert(!es_bisiesto(-400));
- nombre: test_dias_del_mes_febrero
  funcion: dias_del_mes
  codigo: assert(dias_del_mes(2, 2024) == 29); assert(dias_del_mes(2, 1900) == 28);
- nombre: test_dias_del_mes_duraciones
  funcion: dias_del_mes
  codigo: assert(dias_del_mes(4, 2024) == 30); assert(dias_del_mes(12, 2024) == 31);
- nombre: test_dias_del_mes_invalido
  funcion: dias_del_mes
  codigo: assert(dias_del_mes(0, 2024) == 0); assert(dias_del_mes(13, 2024) == 0);
    assert(dias_del_mes(1, 0) == 0);
- nombre: test_es_fecha_valida_valida
  funcion: es_fecha_valida
  codigo: assert(es_fecha_valida(29, 2, 2024)); assert(es_fecha_valida(31, 12, 2000));
- nombre: test_es_fecha_valida_invalida
  funcion: es_fecha_valida
  codigo: assert(!es_fecha_valida(29, 2, 1900)); assert(!es_fecha_valida(31, 4, 2024));
    assert(!es_fecha_valida(0, 1, 2024));
- nombre: test_dia_del_anio_inicio
  funcion: dia_del_anio
  codigo: assert(dia_del_anio(1, 1, 2024) == 1);
- nombre: test_dia_del_anio_bisiesto
  funcion: dia_del_anio
  codigo: assert(dia_del_anio(1, 3, 2024) == 61); assert(dia_del_anio(31, 12, 2024)
    == 366);
- nombre: test_dia_del_anio_comun
  funcion: dia_del_anio
  codigo: assert(dia_del_anio(1, 3, 2023) == 60); assert(dia_del_anio(31, 12, 2023)
    == 365);
- nombre: test_dia_del_anio_invalido
  funcion: dia_del_anio
  codigo: assert(dia_del_anio(29, 2, 1900) == 0);
unidad: 1
modulo: Fundamentos y Estructuras de Control
subtema: funciones_general
dificultad: intermedia
prerrequisitos:
- lazos
- secuencias
publicar: true
