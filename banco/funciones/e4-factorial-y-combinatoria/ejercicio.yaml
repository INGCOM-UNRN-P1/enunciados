verificado: true
funciones:
- nombre: factorial
  retorno: long long
  parametros: int n
  descripcion: Calcula el factorial de un número entero no negativo (n!).
- nombre: combinatorio
  retorno: long long
  parametros: int n, int k
  descripcion: Calcula el número combinatorio C(n, k) = n! / (k! * (n - k)!).
tipo_entrega: makefile
familia: entrega-4-2026
rol_familia: uso
