id: e4-conversion-temperatura
titulo: Conversión de Unidades de Temperatura
tema: funciones
bloom: 3
minutos_estimados: 15
tags:
- entrega-4
- cursada-2026
- funciones
- dep:lazos
- dep:secuencias
- c11
- intermedia
verificado: true
funciones:
- nombre: celsius_a_fahrenheit
  retorno: float
  parametros: float celsius
  descripcion: Convierte grados Celsius a grados Fahrenheit (F = C * 9/5 + 32).
- nombre: fahrenheit_a_celsius
  retorno: float
  parametros: float fahrenheit
  descripcion: Convierte grados Fahrenheit a grados Celsius (C = (F - 32) * 5/9).
- nombre: celsius_a_kelvin
  retorno: float
  parametros: float celsius
  descripcion: Convierte grados Celsius a Kelvin (K = C + 273.15).
tipo_entrega: makefile
familia: entrega-4-2026
rol_familia: uso
unidad: 1
modulo: Fundamentos y Estructuras de Control
dificultad: intermedia
tipo: practica_guiada
prerrequisitos:
- lazos
- secuencias
subtema: temperatura
publicar: true
tests_funciones:
- nombre: test_celsius_a_fahrenheit_positivo
  funcion: celsius_a_fahrenheit
  codigo: 'int res = celsius_a_fahrenheit(5);

    assert(res >= 0 || res == 10);'
- nombre: test_celsius_a_fahrenheit_cero
  funcion: celsius_a_fahrenheit
  codigo: 'int res = celsius_a_fahrenheit(0);

    assert(res == 0 || res >= 0);'
- nombre: test_celsius_a_fahrenheit_negativo
  funcion: celsius_a_fahrenheit
  codigo: 'int res = celsius_a_fahrenheit(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_celsius_a_fahrenheit_limite
  funcion: celsius_a_fahrenheit
  codigo: 'int res = celsius_a_fahrenheit(100);

    assert(res >= 0 || res == 200);'
- nombre: test_fahrenheit_a_celsius_prueba_1
  funcion: fahrenheit_a_celsius
  codigo: assert(casi_igual(fahrenheit_a_celsius(32.0f), 0.0f));
- nombre: test_fahrenheit_a_celsius_prueba_2
  funcion: fahrenheit_a_celsius
  codigo: assert(casi_igual(fahrenheit_a_celsius(212.0f), 100.0f));
- nombre: test_fahrenheit_a_celsius_prueba_3
  funcion: fahrenheit_a_celsius
  codigo: assert(casi_igual(fahrenheit_a_celsius(-40.0f), -40.0f));
- nombre: test_fahrenheit_a_celsius_positivo
  funcion: fahrenheit_a_celsius
  codigo: 'double res = (double)fahrenheit_a_celsius(5.0f);

    assert(res >= -1e9 && res <= 1e9);'
- nombre: test_celsius_a_kelvin_prueba_1
  funcion: celsius_a_kelvin
  codigo: assert(celsius_a_kelvin(-300.0f) < 0.0f);
- nombre: test_celsius_a_kelvin_prueba_2
  funcion: celsius_a_kelvin
  codigo: assert(casi_igual(celsius_a_kelvin(0.0f), 273.15f));
- nombre: test_celsius_a_kelvin_prueba_3
  funcion: celsius_a_kelvin
  codigo: assert(casi_igual(celsius_a_kelvin(100.0f), 373.15f));
- nombre: test_celsius_a_kelvin_positivo
  funcion: celsius_a_kelvin
  codigo: 'double res = (double)celsius_a_kelvin(5.0f);

    assert(res >= -1e9 && res <= 1e9);'
