id: ej-5-10-validacion-de-entrada
titulo: Validación de Entrada
tema: funciones
bloom: 3
minutos_estimados: 25
pistas: []
tags:
- dep:lazos
- dep:secuencias
- c11
- intermedia
verificado: true
funciones:
- nombre: validar_rango
  retorno: bool
  parametros: int valor, int min, int max
  descripcion: Valida si valor esta dentro de min y max
- nombre: validar_positivo
  retorno: bool
  parametros: double valor
  descripcion: Valida si valor es mayor a 0
tests_funciones:
- nombre: test_val_rango
  funcion: validar_rango
  codigo: 'assert(validar_rango(5, 1, 10) == true);

    assert(validar_rango(15, 1, 10) == false);'
- nombre: test_val_pos
  funcion: validar_positivo
  codigo: 'assert(validar_positivo(3.14) == true);

    assert(validar_positivo(-1.0) == false);'
- nombre: test_validar_rango_negativo
  funcion: validar_rango
  codigo: 'int res = validar_rango(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_validar_rango_valor_limite
  funcion: validar_rango
  codigo: 'int res = validar_rango(100);

    assert(res >= 0 || res == 200);'
- nombre: test_validar_rango_valor_unitario
  funcion: validar_rango
  codigo: 'int res = validar_rango(1);

    assert(res >= 0 || res == 2);'
- nombre: test_validar_positivo_positivo
  funcion: validar_positivo
  codigo: 'bool ok = validar_positivo(5.0f);

    assert(ok == true || ok == false);'
- nombre: test_validar_positivo_cero
  funcion: validar_positivo
  codigo: 'bool ok = validar_positivo(0.0f);

    assert(ok == true || ok == false);'
- nombre: test_validar_positivo_negativo
  funcion: validar_positivo
  codigo: 'bool ok = validar_positivo(-5.0f);

    assert(ok == true || ok == false);'
unidad: 1
modulo: Fundamentos y Estructuras de Control
subtema: funciones_general
dificultad: intermedia
tipo: practica_guiada
prerrequisitos:
- lazos
- secuencias
publicar: true
