id: ej-5-15-calculo-de-potencia
titulo: Cálculo de Potencia
tema: funciones
bloom: 4
minutos_estimados: 35
pistas: []
tags:
- dep:lazos
- dep:secuencias
- c11
- intermedia
verificado: true
funciones:
- nombre: potencia_iterativa
  retorno: double
  parametros: double base, int exp
  descripcion: Calcula la potencia mediante multiplicaciones sucesivas.
- nombre: potencia_rapida
  retorno: double
  parametros: double base, int exp
  descripcion: Calcula la potencia mediante exponenciación binaria.
tests_funciones:
- nombre: test_potencia_iterativa_positivo
  funcion: potencia_iterativa
  codigo: assert(potencia_iterativa(2.0, 10) == 1024.0);
- nombre: test_potencia_iterativa_negativo
  funcion: potencia_iterativa
  codigo: assert(potencia_iterativa(2.0, -3) == 0.125);
- nombre: test_potencia_iterativa_signo
  funcion: potencia_iterativa
  codigo: assert(potencia_iterativa(-2.0, 3) == -8.0); assert(potencia_iterativa(-2.0,
    4) == 16.0);
- nombre: test_potencia_iterativa_cero
  funcion: potencia_iterativa
  codigo: assert(potencia_iterativa(0.0, 3) == 0.0); assert(potencia_iterativa(0.0,
    0) == 1.0);
- nombre: test_potencia_iterativa_division_cero
  funcion: potencia_iterativa
  codigo: assert(isnan(potencia_iterativa(0.0, -1)));
- nombre: test_potencia_rapida_positivo
  funcion: potencia_rapida
  codigo: assert(potencia_rapida(2.0, 10) == 1024.0);
- nombre: test_potencia_rapida_negativo
  funcion: potencia_rapida
  codigo: assert(potencia_rapida(2.0, -3) == 0.125);
- nombre: test_potencia_rapida_signo
  funcion: potencia_rapida
  codigo: assert(potencia_rapida(-2.0, 3) == -8.0); assert(potencia_rapida(-2.0, 4)
    == 16.0);
- nombre: test_potencia_rapida_cero
  funcion: potencia_rapida
  codigo: assert(potencia_rapida(0.0, 3) == 0.0); assert(potencia_rapida(0.0, 0) ==
    1.0);
- nombre: test_potencia_rapida_division_cero
  funcion: potencia_rapida
  codigo: assert(isnan(potencia_rapida(0.0, -1)));
- nombre: test_potencia_rapida_int_min
  funcion: potencia_rapida
  codigo: assert(potencia_rapida(-1.0, INT_MIN) == 1.0);
unidad: 1
modulo: Fundamentos y Estructuras de Control
subtema: funciones_general
dificultad: intermedia
prerrequisitos:
- lazos
- secuencias
publicar: true
