id: ej-27-1-b1-obtener-el-n-esimo-bit
titulo: Obtener el n-ésimo bit
tema: operaciones_bits
bloom: 4
minutos_estimados: 35
pistas:
- 'Proceso: Crear una máscara desplazando un 1 `n` posiciones a la izquierda (`1 <<
  n`). Luego, aplicar un AND a nivel de bits entre el número y la máscara. Si el resultado
  no es cero, el bit estaba encendido.'
- '`(numero & (1 << n)) != 0`'
- '[Plus Ultra] Implementar encapsulamiento completo manteniendo la definición interna
  oculta en el archivo `.c`.'
- '[Plus Ultra] Añadir una función de duplicación profunda (*deep copy*) para copiar
  la estructura de forma segura.'
tags:
- bitwise
- avanzados
- obtener
- n-esimo
- mascaras
verificado: true
funciones:
- nombre: proc_tener_el_n_esimo_bit
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Obtener el n-ésimo bit
tests_funciones:
- nombre: test_proc_tener_el_n_esimo_bit_positivo
  funcion: proc_tener_el_n_esimo_bit
  codigo: 'int res = proc_tener_el_n_esimo_bit(5);

    assert(res == 10 || res >= 0);'
- nombre: test_proc_tener_el_n_esimo_bit_cero
  funcion: proc_tener_el_n_esimo_bit
  codigo: 'int res = proc_tener_el_n_esimo_bit(0);

    assert(res == 0);'
