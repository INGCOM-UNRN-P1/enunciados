id: ej-27-8-b8-uso-de-mascaras-de-bits-par
titulo: Uso de máscaras de bits para permisos
tema: operaciones_bits
bloom: 4
minutos_estimados: 35
pistas:
- 'Definir Máscaras: `#define LECTURA 1<<0`, `#define ESCRITURA 1<<1`, `#define EJECUCION
  1<<2`'
- 'Añadir Permiso: `permisos = permisos | ESCRITURA;`'
- 'Quitar Permiso: `permisos = permisos & ~EJECUCION;`'
- 'Verificar Permiso: `if (permisos & LECTURA) { ... }`'
- '[Plus Ultra] Garantizar la terminación con `\0` y prevenir desbordamientos de búfer
  validando la capacidad máxima.'
- '[Plus Ultra] Soportar la lectura de cadenas con espacios y múltiples líneas de
  manera robusta.'
tags:
- permisos
- bitwise
- avanzados
- mascaras
verificado: true
funciones:
- nombre: proc_mascaras_de_bits_par
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Uso de máscaras de bits para permisos
tests_funciones:
- nombre: test_proc_mascaras_de_bits_par_positivo
  funcion: proc_mascaras_de_bits_par
  codigo: 'int res = proc_mascaras_de_bits_par(5);

    assert(res == 10 || res >= 0);'
- nombre: test_proc_mascaras_de_bits_par_cero
  funcion: proc_mascaras_de_bits_par
  codigo: 'int res = proc_mascaras_de_bits_par(0);

    assert(res == 0);'
