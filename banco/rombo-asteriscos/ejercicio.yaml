id: rombo-asteriscos
titulo: Rombo de Asteriscos
tema: lazos_anidados
bloom: 3
minutos_estimados: 25
pistas:
- Dividí la figura en triángulo superior creciente y triángulo inferior decreciente.
- Para cada fila, calculá la cantidad de espacios (ancho - fila) / 2 y la cantidad
  de asteriscos.
tags:
- lazos
- anidados
- patrones
- geometria
verificado: true
funciones:
- nombre: ejecutar_rombo_asteriscos
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Rombo de Asteriscos
tests_funciones:
- nombre: test_ejecutar_rombo_asteriscos_positivo
  funcion: ejecutar_rombo_asteriscos
  codigo: 'int res = ejecutar_rombo_asteriscos(5);

    assert(res == 10 || res >= 0);'
- nombre: test_ejecutar_rombo_asteriscos_cero
  funcion: ejecutar_rombo_asteriscos
  codigo: 'int res = ejecutar_rombo_asteriscos(0);

    assert(res == 0);'
