id: ej-3-10-numeros-primos
titulo: Números Primos
tema: aritmetica
bloom: 3
minutos_estimados: 25
pistas:
- '**Entrada:** Un entero `n`.'
- '**Casos Base:** Números menores o iguales a 1 no son primos. 2 es el único primo
  par.'
- '**Proceso:** Para verificar si `n` es primo, basta con comprobar si es divisible
  por algún número desde 2 hasta la raíz cuadrada de `n` ($\sqrt{n}$). Si se encuentra
  un divisor en ese rango, el número no es primo. error e informar el resultado mediante
  parámetros de salida. especificando precondiciones y postcondiciones.'
- '[Plus Ultra] Optimizar el lazo comprobando divisores solo hasta sqrt(n).'
- '[Plus Ultra] Contar la cantidad de números primos dentro de un rango dado por el
  usuario.'
