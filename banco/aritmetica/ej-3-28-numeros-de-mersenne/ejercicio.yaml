id: ej-3-28-numeros-de-mersenne
titulo: Números de Mersenne
tema: aritmetica
bloom: 3
minutos_estimados: 25
pistas:
- '**Proceso:**'
- Generar números primos `p` (usando la criba o la función `es_primo`).
- Para cada primo `p`, calcular $M_p = 2^p - 1$.
- Verificar si el $M_p$ resultante es también primo. error e informar el 
  resultado mediante parámetros de salida. especificando precondiciones y 
  postcondiciones.
- '[Plus Ultra] Validar si el exponente p es primo antes de calcular 2^p - 1.'
- '[Plus Ultra] Verificar si el número de Mersenne obtenido es primo para valores
  pequeños de p.'
tags:
- fundamentos
- mersenne
- aritmetica
- numeros
- matematica
- dep:tipos_datos
verificado: true
funciones:
- nombre: proc__numeros_de_mersenne
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Números de Mersenne
tests_funciones:
- nombre: test_proc__numeros_de_mersenne_positivo
  funcion: proc__numeros_de_mersenne
  codigo: 'int res = proc__numeros_de_mersenne(5);

    assert(res == 10 || res >= 0);'
- nombre: test_proc__numeros_de_mersenne_cero
  funcion: proc__numeros_de_mersenne
  codigo: 'int res = proc__numeros_de_mersenne(0);

    assert(res == 0);'
unidad: 1
modulo: Fundamentos y Estructuras de Control
subtema: fundamentos
dificultad: intermedia
tipo: practica_guiada
prerrequisitos:
- tipos_datos
