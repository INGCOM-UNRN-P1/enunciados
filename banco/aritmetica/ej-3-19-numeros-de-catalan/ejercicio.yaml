id: ej-3-19-numeros-de-catalan
titulo: Números de Catalan
tema: aritmetica
bloom: 3
minutos_estimados: 25
pistas:
- '**Entrada:** Un entero no negativo `n`.'
- '**Fórmula:** La fórmula más directa es $C_n = \frac{1}{n+1} \binom{2n}{n}$. Para
  calcularla, se necesita una función para el coeficiente binomial $\binom{n}{k}$.'
- '**Coeficiente Binomial:** $\binom{n}{k}$ se puede calcular como $\frac{n!}{k!(n-k)!}$.
  Sin embargo, calcular los factoriales directamente puede causar desbordamiento muy
  rápido. Una forma más segura es calcularlo iterativamente: $\binom{n}{k} = \prod_{i=1}^{k}
  \frac{n-i+1}{i}$.'
- '**Proceso:**'
- Implementar una función `coeficiente_binomial(n, k)`.
- La función `numero_catalan(n)` llamará a `coeficiente_binomial(2*n, n)` y 
  dividirá el resultado por `n+1`. definición interna oculta en el archivo `.c`.
  para copiar la estructura de forma segura.
- '[Plus Ultra] Calcular el n-ésimo número de Catalan simplificando factores para
  evitar desbordamiento temprano.'
- '[Plus Ultra] Mostrar los primeros N términos de la secuencia de Catalan.'
