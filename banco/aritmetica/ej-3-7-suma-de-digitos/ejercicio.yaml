id: ej-3-7-suma-de-digitos
titulo: Suma de dígitos
tema: aritmetica
bloom: 3
minutos_estimados: 25
pistas:
- '**Entrada:** Un entero positivo `n`.'
- '**Proceso:** Se utiliza un lazo que se repite mientras `n` sea mayor que 0.'
- '**Obtener último dígito:** `digito = n % 10`.'
- '**Sumar dígito:** `suma = suma + digito`.'
- '**Eliminar último dígito:** `n = n / 10` (división entera). error e informar el
  resultado mediante parámetros de salida. especificando precondiciones y postcondiciones.'
- '[Plus Ultra] Manejar números negativos considerando sus dígitos como positivos.'
- '[Plus Ultra] Repetir la suma de dígitos hasta obtener un valor de un solo dígito
  (raíz digital).'
