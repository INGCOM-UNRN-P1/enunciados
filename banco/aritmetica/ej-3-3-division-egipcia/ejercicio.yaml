id: ej-3-3-division-egipcia
titulo: División egipcia
tema: aritmetica
bloom: 1
minutos_estimados: 10
pistas:
- Construí duplicaciones del divisor y de 1 sin exceder el dividendo; luego recorré las duplicaciones
  de mayor a menor.
- Guardá el dividendo restante en `*resto`; devolvé -1 si el dividendo es negativo, el divisor no es positivo
  o `resto` es nulo.
tags:
- egipcia
- fundamentos
- aritmetica
- matematica
- division
- dep:tipos_datos
- c11
- inicial
verificado: true
funciones:
- nombre: division_egipcia
  retorno: int
  parametros: int dividendo, int divisor, int *resto_salida
  descripcion: Implementa División egipcia.
tests_funciones:
- nombre: test_division_egipcia_division_exacta
  funcion: division_egipcia
  codigo: int resto; assert(division_egipcia(20, 4, &resto) == 5); assert(resto == 0);
- nombre: test_division_egipcia_resto
  funcion: division_egipcia
  codigo: int resto; assert(division_egipcia(22, 4, &resto) == 5); assert(resto == 2);
- nombre: test_division_egipcia_dividendo_menor
  funcion: division_egipcia
  codigo: int resto; assert(division_egipcia(3, 8, &resto) == 0); assert(resto == 3);
- nombre: test_division_egipcia_divisor_cero
  funcion: division_egipcia
  codigo: int resto; assert(division_egipcia(4, 0, &resto) == -1);
- nombre: test_division_egipcia_resto_nulo
  funcion: division_egipcia
  codigo: assert(division_egipcia(4, 2, NULL) == -1);
unidad: 1
modulo: Fundamentos y Estructuras de Control
