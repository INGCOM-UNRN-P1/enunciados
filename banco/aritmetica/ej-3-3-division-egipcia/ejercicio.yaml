id: ej-3-3-division-egipcia
titulo: División egipcia
tema: aritmetica
bloom: 1
minutos_estimados: 10
pistas:
- '**Entrada:** Un dividendo y un divisor.'
- '**Proceso:**'
- '**Tabla de Duplicación:** Crear dos columnas. La primera empieza en 1 y la segunda
  en el `divisor`. En cada paso, duplicar el valor de la fila anterior en ambas columnas.
  Detenerse cuando el siguiente valor en la columna del divisor supere al `dividendo`.'
- '**Búsqueda y Suma:** Recorrer la tabla de abajo hacia arriba. Para cada fila, si
  el valor en la columna del divisor es menor o igual al `dividendo` restante, se
  resta ese valor del `dividendo` y se suma el valor correspondiente de la primera
  columna al `cociente`.'
- '**Salida:** El `cociente` acumulado y el `dividendo` final (que es el resto). filas
  (*row-major order*) para mejorar el uso de caché. estrictamente dentro de los límites
  del contenedor.'
- '[Plus Ultra] Validar que el divisor sea distinto de cero e imprimir el paso a paso
  de las duplicaciones sucesivas.'
- '[Plus Ultra] Comparar la cantidad de operaciones requeridas por la división egipcia
  frente a la división por restas.'
