id: ej-3-14-conjetura-de-collatz
titulo: Conjetura de Collatz
tema: aritmetica
bloom: 1
minutos_estimados: 10
pistas:
- Imprimí el término inicial y cada término obtenido hasta incluir el 1. Devolvé la cantidad de transformaciones
  realizadas.
- Antes de calcular 3*n+1, comprobá que el producto y la suma caben en el tipo usado.
- La función devuelve -1 para entradas no positivas o si alcanza el límite defensivo de iteraciones.
tags:
- fundamentos
- collatz
- conjetura
- aritmetica
- matematica
- dep:tipos_datos
- c11
- inicial
verificado: true
funciones:
- nombre: longitud_collatz
  retorno: int
  parametros: int n
  descripcion: Imprime la secuencia de Collatz desde n hasta 1 y devuelve la cantidad de pasos; devuelve
    -1 para entrada no positiva o si no puede continuar sin overflow.
tests_funciones:
- nombre: test_longitud_collatz_uno
  funcion: longitud_collatz
  codigo: assert(longitud_collatz(1) == 0);
- nombre: test_longitud_collatz_tres
  funcion: longitud_collatz
  codigo: assert(longitud_collatz(3) == 7);
- nombre: test_longitud_collatz_seis
  funcion: longitud_collatz
  codigo: assert(longitud_collatz(6) == 8);
- nombre: test_longitud_collatz_invalido
  funcion: longitud_collatz
  codigo: assert(longitud_collatz(0) == -1);
unidad: 1
modulo: Fundamentos y Estructuras de Control
subtema: fundamentos
dificultad: inicial
tipo: practica_guiada
prerrequisitos:
- tipos_datos
publicar: true
