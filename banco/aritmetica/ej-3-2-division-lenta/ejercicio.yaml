id: ej-3-2-division-lenta
titulo: División lenta
tema: aritmetica
bloom: 2
minutos_estimados: 15
starter_code: ''
pistas:
- '**Entrada:** Dos enteros positivos, `dividendo` y `divisor`.'
- '**Proceso:** Se resta el `divisor` del `dividendo` de forma repetida hasta que
  el `dividendo` sea menor que el `divisor`. Se necesita un contador (`cociente`)
  que se incrementa en cada resta exitosa.'
- El lazo (preferiblemente `while`) se ejecuta mientras `dividendo >= divisor`.
- '**Salida:** El valor final del contador es el cociente, y el valor final del `dividendo`
  (lo que sobra) es el resto. definición interna oculta en el archivo `.c`. para copiar
  la estructura de forma segura.'
- '[Plus Ultra] Validar que el divisor sea estrictamente mayor que cero retornando
  un código de error si es cero.'
- '[Plus Ultra] Calcular simultáneamente el cociente y el resto sin usar los operadores
  / ni %.'
tags:
