id: ej-3-27-numeros-de-lucas
titulo: Números de Lucas
tema: aritmetica
bloom: 3
minutos_estimados: 25
pistas:
- '**Definición:** $L_n = L_{n-1} + L_{n-2}$ con $L_0 = 2$ y $L_1 = 1$.'
- '**Proceso:** La implementación es casi idéntica a la de Fibonacci, solo cambian
  los valores iniciales. valores fuera de rango o tipos inválidos. un lazo hasta que
  el usuario elija finalizar.'
- '[Plus Ultra] Generar los primeros N términos de la secuencia de Lucas usando tipos
  enteros amplios.'
- '[Plus Ultra] Verificar la relación entre los números de Lucas y los números de
  Fibonacci.'
