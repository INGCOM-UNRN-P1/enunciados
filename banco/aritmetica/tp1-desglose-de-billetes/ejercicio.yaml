id: tp1-desglose-de-billetes
titulo: Desglose de Billetes de Cajero Automático
tema: aritmetica
bloom: 3
minutos_estimados: 35
pistas:
- Para determinar cuántos billetes de un valor facial entregar, usá la división entera monto / denominacion.
- Para calcular el saldo remanente a cubrir con denominaciones menores, usá el operador residuo monto
  % denominacion.
- 'Recorré las denominaciones en orden estrictamente descendente: 20000, 10000, 5000, 2000, 1000, 500,
  200 y 100.'
