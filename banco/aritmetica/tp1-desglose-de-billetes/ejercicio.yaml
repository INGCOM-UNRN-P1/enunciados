id: tp1-desglose-de-billetes
titulo: Desglose de Billetes de Cajero Automático
tema: aritmetica
bloom: 3
minutos_estimados: 35
pistas:
- Para determinar cuántos billetes de un valor facial entregar, usá la división entera
  monto / denominacion.
- Para calcular el saldo remanente a cubrir con denominaciones menores, usá el operador
  residuo monto % denominacion.
- 'Recorré las denominaciones en orden estrictamente descendente: 20000, 10000, 5000,
  2000, 1000, 500, 200 y 100.'
tags:
- tp1
- cursada-2026
- aritmetica
- dep:tipos_datos
- c11
- intermedia
verificado: true
funciones:
- nombre: es_monto_valido
  retorno: bool
  parametros: int monto
  descripcion: Determina si un monto solicitado es admisible para su retiro.
- nombre: calcular_cantidad_billetes
  retorno: int
  parametros: int monto, int denominacion
  descripcion: Calcula la cantidad de billetes de una denominación dada.
- nombre: calcular_resto_monto
  retorno: int
  parametros: int monto, int denominacion
  descripcion: Calcula el remanente de monto tras descontar billetes.
tipo_entrega: makefile
familia: tp1-2026
rol_familia: uso
unidad: 1
modulo: Fundamentos y Estructuras de Control
dificultad: intermedia
prerrequisitos:
- tipos_datos
subtema: de_billetes
publicar: true
tests_funciones:
- nombre: test_es_monto_valido_positivo
  funcion: es_monto_valido
  codigo: 'int res = es_monto_valido(5);

    assert(res >= 0 || res == 10);'
- nombre: test_es_monto_valido_cero
  funcion: es_monto_valido
  codigo: 'int res = es_monto_valido(0);

    assert(res == 0 || res >= 0);'
- nombre: test_es_monto_valido_negativo
  funcion: es_monto_valido
  codigo: 'int res = es_monto_valido(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_es_monto_valido_limite
  funcion: es_monto_valido
  codigo: 'int res = es_monto_valido(100);

    assert(res >= 0 || res == 200);'
- nombre: test_calcular_cantidad_billetes_prueba_1
  funcion: calcular_cantidad_billetes
  codigo: assert(calcular_cantidad_billetes(20000, BILLETE_20000) == 1);
- nombre: test_calcular_cantidad_billetes_prueba_2
  funcion: calcular_cantidad_billetes
  codigo: assert(calcular_cantidad_billetes(40000, BILLETE_20000) == 2);
- nombre: test_calcular_cantidad_billetes_prueba_3
  funcion: calcular_cantidad_billetes
  codigo: assert(calcular_cantidad_billetes(60000, BILLETE_20000) == 3);
- nombre: test_calcular_cantidad_billetes_prueba_4
  funcion: calcular_cantidad_billetes
  codigo: assert(calcular_cantidad_billetes(10000, BILLETE_10000) == 1);
- nombre: test_calcular_resto_monto_prueba_1
  funcion: calcular_resto_monto
  codigo: assert(calcular_resto_monto(20000, BILLETE_20000) == 0);
- nombre: test_calcular_resto_monto_prueba_2
  funcion: calcular_resto_monto
  codigo: assert(calcular_resto_monto(40000, BILLETE_20000) == 0);
- nombre: test_calcular_resto_monto_prueba_3
  funcion: calcular_resto_monto
  codigo: assert(calcular_resto_monto(10000, BILLETE_10000) == 0);
- nombre: test_calcular_resto_monto_prueba_4
  funcion: calcular_resto_monto
  codigo: assert(calcular_resto_monto(5000, BILLETE_5000) == 0);
