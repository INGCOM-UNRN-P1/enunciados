id: tp1-conversor-temperatura
titulo: Conversor de Temperatura Celsius y Fahrenheit
tema: aritmetica
bloom: 2
minutos_estimados: 20
pistas:
- 'Recordá la fórmula de conversión: F = C * (9.0 / 5.0) + 32.0 y C = (F - 32.0) *
  (5.0 / 9.0).'
- 'Cuidá la división entera en C: 9 / 5 trunca a 1; usá literales float como 9.0f
  / 5.0f.'
- Para formatear números flotantes a dos decimales con printf usá %.2f.
tags:
- tp1
- cursada-2026
- aritmetica
- dep:tipos_datos
- c11
- inicial
verificado: true
funciones:
- nombre: celsius_a_fahrenheit
  retorno: float
  parametros: float celsius
  descripcion: Convierte una temperatura en grados Celsius a grados Fahrenheit.
- nombre: fahrenheit_a_celsius
  retorno: float
  parametros: float fahrenheit
  descripcion: Convierte una temperatura en grados Fahrenheit a grados Celsius.
tipo_entrega: makefile
familia: tp1-2026
rol_familia: uso
unidad: 1
modulo: Fundamentos y Estructuras de Control
dificultad: inicial
tipo: practica_guiada
prerrequisitos:
- tipos_datos
subtema: temperatura
publicar: true
tests_funciones:
- nombre: test_celsius_a_fahrenheit_positivo
  funcion: celsius_a_fahrenheit
  codigo: 'int res = celsius_a_fahrenheit(5);

    assert(res >= 0 || res == 10);'
- nombre: test_celsius_a_fahrenheit_cero
  funcion: celsius_a_fahrenheit
  codigo: 'int res = celsius_a_fahrenheit(0);

    assert(res == 0 || res >= 0);'
- nombre: test_celsius_a_fahrenheit_negativo
  funcion: celsius_a_fahrenheit
  codigo: 'int res = celsius_a_fahrenheit(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_celsius_a_fahrenheit_limite
  funcion: celsius_a_fahrenheit
  codigo: 'int res = celsius_a_fahrenheit(100);

    assert(res >= 0 || res == 200);'
- nombre: test_fahrenheit_a_celsius_prueba_1
  funcion: fahrenheit_a_celsius
  codigo: assert(son_cercanos(fahrenheit_a_celsius(CERO_C_EN_F), CERO_C));
- nombre: test_fahrenheit_a_celsius_prueba_2
  funcion: fahrenheit_a_celsius
  codigo: assert(son_cercanos(fahrenheit_a_celsius(CIEN_C_EN_F), CIEN_C));
- nombre: test_fahrenheit_a_celsius_prueba_3
  funcion: fahrenheit_a_celsius
  codigo: assert(son_cercanos(fahrenheit_a_celsius(MENOS_CUARENTA), MENOS_CUARENTA));
- nombre: test_fahrenheit_a_celsius_prueba_4
  funcion: fahrenheit_a_celsius
  codigo: assert(son_cercanos(fahrenheit_a_celsius(c1), TEMP_TEST_1));
