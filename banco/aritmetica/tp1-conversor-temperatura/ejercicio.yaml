  descripcion: Convierte una temperatura en grados Celsius a grados Fahrenheit.
- nombre: fahrenheit_a_celsius
  retorno: float
  parametros: float fahrenheit
  descripcion: Convierte una temperatura en grados Fahrenheit a grados Celsius.
