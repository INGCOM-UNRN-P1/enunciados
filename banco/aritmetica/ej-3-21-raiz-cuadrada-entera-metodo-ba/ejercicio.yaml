id: ej-3-21-raiz-cuadrada-entera-metodo-ba
titulo: Raíz Cuadrada Entera (Método Babilónico)
tema: aritmetica
bloom: 1
minutos_estimados: 10
pistas:
- '**Entrada:** Un número no negativo `n`.'
- '**Proceso:** Es un algoritmo de aproximaciones sucesivas.'
- Se elige una estimación inicial `x` (por ejemplo, `x = n`).
- 'Se repite un número fijo de veces o hasta que la estimación converja: `x = (x +
  n / x) / 2`.'
- '**Salida:** El resultado es la parte entera de la estimación final `x`. definición
  interna oculta en el archivo `.c`. para copiar la estructura de forma segura.'
- '[Plus Ultra] Mostrar la cantidad de iteraciones requeridas hasta alcanzar la convergencia.'
- '[Plus Ultra] Validar que el número sea no negativo.'
tags:
- babilonico
- fundamentos
- cuadrada
- metodo
- aritmetica
- dep:tipos_datos
- c11
- inicial
verificado: true
funciones:
- nombre: raiz_cuadrada_entera
  retorno: int
  parametros: int n, unsigned *iteraciones
  descripcion: Calcula floor(sqrt(n)) por Herón y opcionalmente informa las iteraciones
tests_funciones:
- nombre: test_raiz_cuadrada_entera_casos_basicos
  funcion: raiz_cuadrada_entera
  codigo: |-
    unsigned pasos = 99U;
    assert(raiz_cuadrada_entera(0, &pasos) == 0 && pasos == 0U);
    assert(raiz_cuadrada_entera(1, &pasos) == 1 && pasos == 0U);
    assert(raiz_cuadrada_entera(5, &pasos) == 2 && pasos > 0U);
    assert(raiz_cuadrada_entera(16, &pasos) == 4);
- nombre: test_raiz_cuadrada_entera_limites_y_puntero_opcional
  funcion: raiz_cuadrada_entera
  codigo: |-
    unsigned pasos = 7U;
    assert(raiz_cuadrada_entera(-1, &pasos) == -1 && pasos == 0U);
    assert(raiz_cuadrada_entera(2147395600, NULL) == 46340);
unidad: 1
modulo: Fundamentos y Estructuras de Control
subtema: babilonico
dificultad: inicial
tipo: practica_guiada
prerrequisitos:
