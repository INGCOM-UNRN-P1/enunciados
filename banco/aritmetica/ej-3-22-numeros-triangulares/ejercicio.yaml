id: ej-3-22-numeros-triangulares
titulo: Números Triangulares
tema: aritmetica
bloom: 3
minutos_estimados: 25
pistas:
- '**Entrada:** Un entero `n` para la detección o una cantidad y un arreglo de salida
  para la generación.'
- '**Detección:** `n` es triangular si es igual a la suma de los primeros `k`
  enteros positivos para algún `k`; `0` corresponde a `T_0` y es triangular.'
- '**Generación:** Producir los primeros `N` términos desde `T_1 = 1`, en orden.'
- '**Límites:** Rechazar capacidad insuficiente, puntero nulo para cantidad positiva
  y cualquier cantidad cuyo término exceda `INT64_MAX`, sin modificar la salida.'
tags:
- triangulares
- fundamentos
- aritmetica
- numeros
- matematica
- dep:tipos_datos
- c11
- intermedia
verificado: true
funciones:
- nombre: es_triangular
  retorno: bool
  parametros: int64_t n
  descripcion: Determina si n es un número triangular, considerando 0 triangular
- nombre: generar_triangulares
  retorno: bool
  parametros: size_t cantidad, int64_t *salida, size_t capacidad
  descripcion: Genera los primeros términos y falla sin escribir si no caben
tests_funciones:
- nombre: test_es_triangular
  funcion: es_triangular
  codigo: |-
    assert(es_triangular(0));
    assert(es_triangular(1));
    assert(es_triangular(10));
    assert(!es_triangular(8));
    assert(!es_triangular(-1));
- nombre: test_generar_triangulares
  funcion: generar_triangulares
  codigo: |-
    int64_t valores[5] = {0};
    assert(generar_triangulares(5U, valores, 5U));
    assert(valores[0] == 1 && valores[1] == 3 && valores[2] == 6);
    assert(valores[3] == 10 && valores[4] == 15);
    assert(!generar_triangulares(2U, valores, 1U));
    assert(!generar_triangulares(1U, NULL, 1U));
    assert(generar_triangulares(0U, NULL, 0U));
unidad: 1
modulo: Fundamentos y Estructuras de Control
subtema: triangulares
dificultad: intermedia
tipo: practica_guiada
prerrequisitos:
- tipos_datos
publicar: true
