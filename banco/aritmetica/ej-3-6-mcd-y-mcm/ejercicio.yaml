id: ej-3-6-mcd-y-mcm
titulo: MCD y MCM
tema: aritmetica
bloom: 3
minutos_estimados: 25
pistas:
- '**MCD (Algoritmo de Euclides):** Es el método más eficiente. Mientras `b` no sea
  cero, se calcula el resto `r = a % b`, luego se actualiza `a = b` y `b = r`. El
  MCD es el último valor no nulo de `a`.'
- '**MCM:** Se puede calcular fácilmente una vez que se tiene el MCD, usando la fórmula:
  $MCM(a, b) = \frac{|a \cdot b|}{MCD(a, b)}$. error e informar el resultado mediante
  parámetros de salida. especificando precondiciones y postcondiciones.'
- '[Plus Ultra] Validar que al menos uno de los números sea distinto de cero.'
- '[Plus Ultra] Implementar el algoritmo de Euclides de forma iterativa y verificar
  que mcd(a,b)*mcm(a,b) == a*b.'
