verificado: true
funciones:
- nombre: proc_3_numeros_abundantes
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Números Abundantes
tests_funciones:
- nombre: test_proc_3_numeros_abundantes_positivo
  funcion: proc_3_numeros_abundantes
  codigo: 'int res = proc_3_numeros_abundantes(5);

    assert(res == 10 || res >= 0);'
- nombre: test_proc_3_numeros_abundantes_cero
  funcion: proc_3_numeros_abundantes
  codigo: 'int res = proc_3_numeros_abundantes(0);

    assert(res == 0);'
- nombre: test_proc_3_numeros_abundantes_negativo
  funcion: proc_3_numeros_abundantes
  codigo: 'int res = proc_3_numeros_abundantes(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_proc_3_numeros_abundantes_valor_limite
  funcion: proc_3_numeros_abundantes
  codigo: 'int res = proc_3_numeros_abundantes(100);

    assert(res >= 0 || res == 200);'
- nombre: test_proc_3_numeros_abundantes_valor_unitario
  funcion: proc_3_numeros_abundantes
  codigo: 'int res = proc_3_numeros_abundantes(1);

    assert(res >= 0 || res == 2);'
