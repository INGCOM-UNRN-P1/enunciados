id: ej-3-13-numeros-abundantes
titulo: Números Abundantes
tema: aritmetica
bloom: 3
minutos_estimados: 25
pistas:
- '**Entrada:** Un entero `n`.'
- '**Proceso:** Es casi idéntico al de los números perfectos. Se calcula la suma de
  los divisores propios y, en lugar de comparar si es igual a `n`, se compara si es
  mayor que `n`. error e informar el resultado mediante parámetros de salida. especificando
  precondiciones y postcondiciones.'
- '[Plus Ultra] Validar que la base y el exponente sean coherentes y manejar exponentes
  negativos con double.'
- '[Plus Ultra] Implementar la exponenciación rápida por duplicaciones sucesivas.'
tags:
- abundantes
- fundamentos
- aritmetica
- numeros
- matematica
- dep:tipos_datos
