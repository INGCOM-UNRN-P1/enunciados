id: ej-3-26-calculo-de-pi-serie-de-leibniz
titulo: Cálculo de Pi (Serie de Leibniz)
tema: aritmetica
bloom: 3
minutos_estimados: 25
pistas:
- '**Fórmula:** $\pi = 4 \sum_{k=0}^{\infty} \frac{(-1)^k}{2k+1} = 4 (1 - \frac{1}{3}
  + \frac{1}{5} - \frac{1}{7} + \dots)$'
- '**Proceso:**'
- Inicializar una variable `suma` a 0.
- Iterar `k` desde 0 hasta el número de términos deseado.
- En cada iteración, calcular el término $\frac{(-1)^k}{2k+1}$ y añadirlo a 
  `suma`.
- El resultado final es `4 * suma`. definición interna oculta en el archivo 
  `.c`. para copiar la estructura de forma segura.
- '[Plus Ultra] Permitir al usuario ingresar la cantidad de términos o la precisión
  deseada.'
- '[Plus Ultra] Comparar el valor aproximado con M_PI de math.h y mostrar el error
  relativo.'
