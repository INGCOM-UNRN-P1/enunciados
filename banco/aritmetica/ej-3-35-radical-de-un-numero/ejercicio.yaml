id: ej-3-35-radical-de-un-numero
titulo: Radical de un Número
tema: aritmetica
bloom: 1
minutos_estimados: 10
pistas:
- '**Entrada:** Un entero `n`.'
- '**Proceso:** Similar a la descomposición en factores primos, pero en lugar de contar
  potencias, simplemente se multiplica cada factor primo distinto encontrado a una
  variable `resultado`. definición interna oculta en el archivo `.c`. para copiar
  la estructura de forma segura.'
- '[Plus Ultra] Calcular el radical como el producto de los factores primos distintos
  del número.'
- '[Plus Ultra] Validar que n sea mayor que 1.'
