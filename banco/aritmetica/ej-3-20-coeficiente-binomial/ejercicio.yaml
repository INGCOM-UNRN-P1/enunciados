id: ej-3-20-coeficiente-binomial
titulo: Coeficiente Binomial
tema: aritmetica
bloom: 3
minutos_estimados: 25
pistas:
- '**Entrada:** Dos enteros no negativos, `n` y `k`.'
- '**Proceso:** Como se mencionó en el ejercicio anterior, calcularlo mediante la
  fórmula iterativa $\prod_{i=1}^{k} \frac{n-i+1}{i}$ es numéricamente más estable
  que usar factoriales. Es importante realizar la multiplicación antes de la división
  en cada paso para mantener la precisión y evitar divisiones prematuras.'
- '**Optimización:** Dado que $\binom{n}{k} = \binom{n}{n-k}$, se puede elegir el
  valor más pequeño entre `k` y `n-k` para reducir el número de iteraciones. definición
  interna oculta en el archivo `.c`. para copiar la estructura de forma segura.'
- '[Plus Ultra] Optimizar el cálculo de C(n, k) usando la propiedad C(n, k) = C(n,
  n-k).'
- '[Plus Ultra] Validar que 0 <= k <= n.'
tags:
