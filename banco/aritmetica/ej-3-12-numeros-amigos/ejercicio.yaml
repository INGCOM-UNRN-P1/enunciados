id: ej-3-12-numeros-amigos
titulo: Números Amigos
tema: aritmetica
bloom: 3
minutos_estimados: 25
pistas:
- '**Entrada:** Dos enteros positivos, `a` y `b`.'
- '**Reutilización de Código:** Este problema se simplifica si ya se tiene una función
  que calcula la suma de los divisores propios de un número (como la usada en el ejercicio
  de "Números Perfectos").'
- '**Proceso:**'
- Calcular la suma de los divisores propios de `a`. Llamémosla `suma_div_a`.
- Calcular la suma de los divisores propios de `b`. Llamémosla `suma_div_b`.
- 'Verificar si se cumplen las dos condiciones: `suma_div_a == b` Y `suma_div_b ==
  a`.'
- '**Caso Especial:** Asegurarse de que `a` y `b` no sean el mismo número (un número
  perfecto es amigo de sí mismo, lo que a veces se excluye de la definición de números
  amigos). error e informar el resultado mediante parámetros de salida. especificando
  precondiciones y postcondiciones.'
- '[Plus Ultra] Validar que n sea positivo y mostrar los divisores de ambos números
  para verificar la suma.'
- '[Plus Ultra] Encontrar todos los pares de números amigos menores a un límite dado.'
