id: ej-3-25-identidad-de-bezout
titulo: Identidad de Bézout
tema: aritmetica
bloom: 3
minutos_estimados: 25
pistas:
- '**Algoritmo Extendido de Euclides:** Es una modificación del algoritmo de Euclides
  que mantiene un registro de los coeficientes `x` e `y` en cada paso. Es inherentemente
  recursivo.'
- '**Proceso:** La implementación recursiva es más intuitiva. La llamada recursiva
  devuelve el MCD y los coeficientes para los números más pequeños, y la llamada actual
  los ajusta para los números originales. desbordamientos de búfer validando la capacidad
  máxima. líneas de manera robusta.'
- '[Plus Ultra] Validar que los coeficientes satisfagan la igualdad a*x + b*y == mcd(a,
  b).'
- '[Plus Ultra] Modularizar la versión extendida del algoritmo de Euclides.'
