id: lista-doble-ordenada
titulo: Lista Doblemente Enlazada con Inserción Ordenada
tema: estructuras_datos
bloom: 3
minutos_estimados: 25
pistas:
- Cada nodo debe tener punteros `siguiente` y `anterior`.
- Al insertar un nodo, actualizá los enlaces de los nodos adyacentes manteniendo la
  cabeza y cola si corresponde.
- Recorré en ambos sentidos (ASC y DESC) para verificar la consistencia de los punteros
  dobles.
