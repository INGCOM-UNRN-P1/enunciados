id: ej-10-37-lideres-en-un-arreglo
titulo: Líderes en un arreglo
tema: arreglos
bloom: 3
minutos_estimados: 25
pistas:
- '**Proceso (recorrido inverso):** La forma más eficiente es recorrer el arreglo
  de derecha a izquierda.'
- El último elemento siempre es un líder. Guardarlo como `maximo_derecha`.
- Iterar desde el penúltimo elemento hacia el principio.
- Si el elemento actual es mayor que `maximo_derecha`, es un nuevo líder. Imprimirlo
  y actualizar `maximo_derecha`.
- '[Plus Ultra] Optimizar el acceso a memoria respetando el orden por filas (*row-major
  order*) para mejorar el uso de caché.'
- '[Plus Ultra] Validar que los índices ingresados se encuentren estrictamente dentro
  de los límites del contenedor.'
tags:
- arreglo
- lideres
- arreglos
- memoria
- vectores
verificado: true
funciones:
- nombre: proc_ideres_en_un_arreglo
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Líderes en un arreglo
tests_funciones:
- nombre: test_proc_ideres_en_un_arreglo_positivo
  funcion: proc_ideres_en_un_arreglo
  codigo: 'int res = proc_ideres_en_un_arreglo(5);

    assert(res == 10 || res >= 0);'
- nombre: test_proc_ideres_en_un_arreglo_cero
  funcion: proc_ideres_en_un_arreglo
  codigo: 'int res = proc_ideres_en_un_arreglo(0);

    assert(res == 0);'
