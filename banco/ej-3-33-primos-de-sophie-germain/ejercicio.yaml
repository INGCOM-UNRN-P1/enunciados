id: ej-3-33-primos-de-sophie-germain
titulo: Primos de Sophie Germain
tema: aritmetica
bloom: 3
minutos_estimados: 25
pistas:
- '**Entrada:** Un límite superior $N$.'
- '**Proceso:**'
- Iterar con un número `p` desde 2 hasta $N$.
- En cada iteración, verificar si `p` es primo.
- Si `p` es primo, calcular `q = 2*p + 1` y verificar si `q` también es primo.
- Si ambos son primos, `p` es un primo de Sophie Germain. valores fuera de rango o
  tipos inválidos. un lazo hasta que el usuario elija finalizar.
- '[Plus Ultra] Validar que tanto p como 2p + 1 sean números primos.'
- '[Plus Ultra] Listar todos los primos de Sophie Germain menores a un límite dado.'
tags:
- fundamentos
- sophie
- germain
- aritmetica
- primos
verificado: true
funciones:
- nombre: proc_os_de_sophie_germain
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Primos de Sophie Germain
tests_funciones:
- nombre: test_proc_os_de_sophie_germain_positivo
  funcion: proc_os_de_sophie_germain
  codigo: 'int res = proc_os_de_sophie_germain(5);

    assert(res == 10 || res >= 0);'
- nombre: test_proc_os_de_sophie_germain_cero
  funcion: proc_os_de_sophie_germain
  codigo: 'int res = proc_os_de_sophie_germain(0);

    assert(res == 0);'
