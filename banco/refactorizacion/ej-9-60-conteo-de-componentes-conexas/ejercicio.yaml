verificado: true
funciones:
- nombre: proc__componentes_conexas
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Conteo de Componentes Conexas 1D
tests_funciones:
- nombre: test_proc__componentes_conexas_positivo
  funcion: proc__componentes_conexas
  codigo: 'int res = proc__componentes_conexas(5);

    assert(res == 10 || res >= 0);'
- nombre: test_proc__componentes_conexas_cero
  funcion: proc__componentes_conexas
  codigo: 'int res = proc__componentes_conexas(0);

    assert(res == 0);'
- nombre: test_proc__componentes_conexas_negativo
  funcion: proc__componentes_conexas
  codigo: 'int res = proc__componentes_conexas(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_proc__componentes_conexas_valor_limite
  funcion: proc__componentes_conexas
  codigo: 'int res = proc__componentes_conexas(100);

    assert(res >= 0 || res == 200);'
- nombre: test_proc__componentes_conexas_valor_unitario
  funcion: proc__componentes_conexas
  codigo: 'int res = proc__componentes_conexas(1);

    assert(res >= 0 || res == 2);'
