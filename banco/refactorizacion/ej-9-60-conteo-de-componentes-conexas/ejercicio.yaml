id: ej-9-60-conteo-de-componentes-conexas
titulo: Conteo de Componentes Conexas 1D
tema: refactorizacion
bloom: 4
minutos_estimados: 35
pistas:
- Utilizá una bandera booleana en_segmento_positivo para rastrear cuándo se transita
  un componente.
- Incrementá el contador únicamente al entrar a un nuevo segmento positivo.
- 'Validá casos de borde: arreglo vacío (n=0), todos números positivos y todos números
  negativos.'
tags:
- conexas
