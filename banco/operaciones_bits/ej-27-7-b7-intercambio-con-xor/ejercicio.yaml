tests_funciones:
- nombre: test_positivos
  funcion: swap
  codigo: int a = 1, b = 42; swap(&a, &b); assert(a == 42 && b == 1);
- nombre: test_negativos
  funcion: swap
  codigo: int a = -1, b = 0; swap(&a, &b); assert(a == 0 && b == -1);
- nombre: test_iguales
  funcion: swap
  codigo: int a = 42, b = 42; swap(&a, &b); assert(a == 42 && b == 42);
- nombre: test_misma_variable
  funcion: swap
  codigo: int a = 37; swap(&a, &a); assert(a == 37);
