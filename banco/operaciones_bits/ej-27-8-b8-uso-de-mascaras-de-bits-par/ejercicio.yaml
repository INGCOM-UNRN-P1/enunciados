id: ej-27-8-b8-uso-de-mascaras-de-bits-par
titulo: Uso de máscaras de bits para permisos
tema: operaciones_bits
bloom: 4
minutos_estimados: 35
pistas:
- 'Definir Máscaras: `#define LECTURA 1<<0`, `#define ESCRITURA 1<<1`, `#define EJECUCION
  1<<2`'
- 'Añadir Permiso: `permisos = permisos | ESCRITURA;`'
- 'Quitar Permiso: `permisos = permisos & ~EJECUCION;`'
- 'Verificar Permiso: `if (permisos & LECTURA) { ... }`'
tags:
- permisos
- bitwise
- avanzados
- mascaras
- dep:tipos_datos
- dep:aritmetica
- c11
- intermedia
verificado: true
funciones:
- nombre: conceder
  retorno: unsigned char
  parametros: unsigned char permisos, unsigned char mascara
  descripcion: Agrega los permisos indicados.
- nombre: revocar
  retorno: unsigned char
  parametros: unsigned char permisos, unsigned char mascara
  descripcion: Quita los permisos indicados.
- nombre: tiene_permisos
  retorno: int
  parametros: unsigned char permisos, unsigned char mascara
  descripcion: Indica si están todos los permisos indicados.
tests_funciones:
- nombre: test_conceder
  funcion: conceder
  codigo: assert(conceder(1, 2) == 3); assert(conceder(7, 2) == 7);
- nombre: test_revocar
  funcion: revocar
  codigo: assert(revocar(7, 4) == 3); assert(revocar(1, 2) == 1);
- nombre: test_consultar
  funcion: tiene_permisos
  codigo: assert(tiene_permisos(7, 3) == 1); assert(tiene_permisos(1, 3) == 0);
- nombre: test_mascara_vacia
  funcion: tiene_permisos
  codigo: assert(tiene_permisos(0, 0) == 1);
- nombre: test_preserva_bits
  funcion: revocar
  codigo: assert(revocar(0x80, 1) == 0x80); assert(conceder(0x80, 4) == 0x84);
unidad: 5
modulo: Ingeniería de Software y Calidad en C
subtema: operaciones_bits
dificultad: intermedia
prerrequisitos:
- tipos_datos
- aritmetica
publicar: true
