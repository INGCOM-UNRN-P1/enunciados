id: ej-27-6-b6-verificar-si-es-potencia-de
titulo: Verificar si es potencia de dos
tema: operaciones_bits
bloom: 4
minutos_estimados: 35
pistas:
- 'Propiedad: Un número `n` que es potencia de dos tiene exactamente un bit encendido
  en su representación binaria. El número `n-1` tendrá todos los bits a la derecha
  de ese bit encendidos. Por lo tanto, `n & (n - 1)` será siempre cero.'
- 'Condición: `n > 0 && (n & (n - 1)) == 0`'
tags:
- potencia
- verificar
- bitwise
- avanzados
- mascaras
- dep:tipos_datos
- dep:aritmetica
- c11
- intermedia
verificado: true
funciones:
- nombre: es_potencia_de_dos
  retorno: int
  parametros: int numero
  descripcion: Devuelve 1 si numero es una potencia de dos y 0 en caso contrario.
tests_funciones:
- nombre: test_es_potencia_de_dos_1
  funcion: es_potencia_de_dos
  codigo: assert(es_potencia_de_dos(1) == 1);
- nombre: test_es_potencia_de_dos_2
  funcion: es_potencia_de_dos
  codigo: assert(es_potencia_de_dos(2) == 1);
- nombre: test_es_potencia_de_dos_3
  funcion: es_potencia_de_dos
  codigo: assert(es_potencia_de_dos(1024) == 1);
- nombre: test_es_potencia_de_dos_4
  funcion: es_potencia_de_dos
  codigo: assert(es_potencia_de_dos(0) == 0);
- nombre: test_es_potencia_de_dos_5
  funcion: es_potencia_de_dos
  codigo: assert(es_potencia_de_dos(-2147483647 - 1) == 0);
- nombre: test_es_potencia_de_dos_6
  funcion: es_potencia_de_dos
  codigo: assert(es_potencia_de_dos(3) == 0);
unidad: 5
modulo: Ingeniería de Software y Calidad en C
subtema: operaciones_bits
dificultad: intermedia
prerrequisitos:
- tipos_datos
- aritmetica
publicar: true
