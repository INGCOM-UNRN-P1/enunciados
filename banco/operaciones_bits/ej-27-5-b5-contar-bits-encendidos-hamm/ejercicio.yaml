id: ej-27-5-b5-contar-bits-encendidos-hamm
titulo: Contar bits encendidos (Hamming Weight)
tema: operaciones_bits
bloom: 4
minutos_estimados: 35
pistas:
- 'Algoritmo de Brian Kernighan: En un lazo, mientras el número no sea cero, aplicar
  la operación `n = n & (n - 1)`. Esta operación apaga el bit encendido menos significativo
  en cada iteración. El número de iteraciones es el número de bits encendidos.'
tags:
- contar
- encendidos
- hamming
- bitwise
- avanzados
- dep:tipos_datos
- dep:aritmetica
- c11
- intermedia
verificado: true
funciones:
- nombre: contar_bits
  retorno: int
  parametros: unsigned int numero
  descripcion: Cuenta los bits encendidos de la representación de numero.
tests_funciones:
- nombre: test_contar_bits_1
  funcion: contar_bits
  codigo: assert(contar_bits(0u) == 0);
- nombre: test_contar_bits_2
  funcion: contar_bits
  codigo: assert(contar_bits(1u) == 1);
- nombre: test_contar_bits_3
  funcion: contar_bits
  codigo: assert(contar_bits(0x55u) == 4);
- nombre: test_contar_bits_4
  funcion: contar_bits
  codigo: assert(contar_bits(0xffu) == 8);
unidad: 5
modulo: Ingeniería de Software y Calidad en C
