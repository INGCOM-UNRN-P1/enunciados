verificado: true
funciones:
- nombre: proc_ador_de_reproduccion
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Controlador de reproducción
tests_funciones:
- nombre: test_proc_ador_de_reproduccion_positivo
  funcion: proc_ador_de_reproduccion
  codigo: 'int res = proc_ador_de_reproduccion(5);

    assert(res == 10 || res >= 0);'
- nombre: test_proc_ador_de_reproduccion_cero
  funcion: proc_ador_de_reproduccion
  codigo: 'int res = proc_ador_de_reproduccion(0);

    assert(res == 0);'
- nombre: test_proc_ador_de_reproduccion_negativo
  funcion: proc_ador_de_reproduccion
  codigo: 'int res = proc_ador_de_reproduccion(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_proc_ador_de_reproduccion_valor_limite
  funcion: proc_ador_de_reproduccion
  codigo: 'int res = proc_ador_de_reproduccion(100);

    assert(res >= 0 || res == 200);'
- nombre: test_proc_ador_de_reproduccion_valor_unitario
  funcion: proc_ador_de_reproduccion
  codigo: 'int res = proc_ador_de_reproduccion(1);

    assert(res >= 0 || res == 2);'
unidad: 2
