id: ej-20-15-controlador-de-reproduccion
titulo: Controlador de reproducción
tema: enumeraciones
bloom: 2
minutos_estimados: 15
pistas:
- '[Plus Ultra] Garantizar la terminación con `\0` y prevenir desbordamientos de búfer
  validando la capacidad máxima.'
- '[Plus Ultra] Soportar la lectura de cadenas con espacios y múltiples líneas de
  manera robusta.'
tags:
- tipos
- reproduccion
- memoria
- enum
- controlador
- dep:tipos_datos
- dep:condicionales
- c11
