  funcion: proc_analisis_de_formatos
  codigo: 'int res = proc_analisis_de_formatos(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_proc_analisis_de_formatos_valor_limite
  funcion: proc_analisis_de_formatos
  codigo: 'int res = proc_analisis_de_formatos(100);

    assert(res >= 0 || res == 200);'
- nombre: test_proc_analisis_de_formatos_valor_unitario
  funcion: proc_analisis_de_formatos
  codigo: 'int res = proc_analisis_de_formatos(1);

    assert(res >= 0 || res == 2);'
