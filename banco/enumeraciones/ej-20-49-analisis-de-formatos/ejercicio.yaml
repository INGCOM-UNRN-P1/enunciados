- nombre: test_proc_analisis_de_formatos_positivo
  funcion: proc_analisis_de_formatos
  codigo: 'int res = proc_analisis_de_formatos(5);

    assert(res == 10 || res >= 0);'
- nombre: test_proc_analisis_de_formatos_cero
  funcion: proc_analisis_de_formatos
  codigo: 'int res = proc_analisis_de_formatos(0);

    assert(res == 0);'
