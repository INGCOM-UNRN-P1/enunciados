tests_funciones:
- nombre: test_31_pausa_reanuda
  funcion: pausar_juego
  codigo: juego_t j={JUEGO_JUGANDO,DIFICULTAD_NORMAL,0,1,3}; pausar_juego(&j); assert(j.estado==JUEGO_PAUSADO);
    reanudar_juego(&j); assert(j.estado==JUEGO_JUGANDO);
- nombre: test_31_pierde_ultima_vida
  funcion: perder_vida
  codigo: juego_t j={JUEGO_JUGANDO,DIFICULTAD_NORMAL,0,1,1}; perder_vida(&j); assert(j.vidas==0&&j.estado==JUEGO_GAME_OVER);
- nombre: test_31_sube_nivel
  funcion: ganar_nivel
  codigo: juego_t j={JUEGO_JUGANDO,DIFICULTAD_NORMAL,0,1,3}; ganar_nivel(&j); assert(j.nivel==2&&j.puntuacion==100);
