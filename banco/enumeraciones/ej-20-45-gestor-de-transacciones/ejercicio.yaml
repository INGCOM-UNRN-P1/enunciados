funciones:
- nombre: iniciar_transaccion
  retorno: transaccion_t
  parametros: enum tipo_aislamiento aislamiento
  descripcion: API funcional de Gestor de transacciones
- nombre: commit_transaccion
  retorno: bool
  parametros: transaccion_t *tx
  descripcion: API funcional de Gestor de transacciones
- nombre: rollback_transaccion
  retorno: bool
  parametros: transaccion_t *tx
  descripcion: API funcional de Gestor de transacciones
- nombre: puede_hacer_commit
  retorno: bool
  parametros: const transaccion_t *tx
  descripcion: API funcional de Gestor de transacciones
tests_funciones:
- nombre: test_45_commit_rollback
  funcion: bool
  codigo: '{ transaccion_t t=iniciar_transaccion(AISLAMIENTO_READ_COMMITTED); assert(t.id&&t.estado==TX_ACTIVA&&puede_hacer_commit(&t));
    assert(commit_transaccion(&t)&&t.estado==TX_COMPROMETIDA); assert(!rollback_transaccion(&t)); }'
- nombre: test_45_invalido
  funcion: bool
  codigo: '{ transaccion_t t=iniciar_transaccion((enum tipo_aislamiento)99); assert(t.id==0&&!puede_hacer_commit(&t)); }'
