tests_funciones:
- nombre: test_proc_ritmos_de_compresion_positivo
  funcion: proc_ritmos_de_compresion
  codigo: 'int res = proc_ritmos_de_compresion(5);

    assert(res == 10 || res >= 0);'
- nombre: test_proc_ritmos_de_compresion_cero
  funcion: proc_ritmos_de_compresion
  codigo: 'int res = proc_ritmos_de_compresion(0);

    assert(res == 0);'
- nombre: test_proc_ritmos_de_compresion_negativo
  funcion: proc_ritmos_de_compresion
  codigo: 'int res = proc_ritmos_de_compresion(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_proc_ritmos_de_compresion_valor_limite
  funcion: proc_ritmos_de_compresion
  codigo: 'int res = proc_ritmos_de_compresion(100);

    assert(res >= 0 || res == 200);'
- nombre: test_proc_ritmos_de_compresion_valor_unitario
  funcion: proc_ritmos_de_compresion
  codigo: 'int res = proc_ritmos_de_compresion(1);

    assert(res >= 0 || res == 2);'
