  codigo: 'int res = proc_alisis_de_compresion(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_proc_alisis_de_compresion_valor_limite
  funcion: proc_alisis_de_compresion
  codigo: 'int res = proc_alisis_de_compresion(100);

    assert(res >= 0 || res == 200);'
- nombre: test_proc_alisis_de_compresion_valor_unitario
  funcion: proc_alisis_de_compresion
  codigo: 'int res = proc_alisis_de_compresion(1);

