tests_funciones:
- nombre: test_proc_tados_de_transaccion_positivo
  funcion: proc_tados_de_transaccion
  codigo: 'int res = proc_tados_de_transaccion(5);

    assert(res == 10 || res >= 0);'
- nombre: test_proc_tados_de_transaccion_cero
  funcion: proc_tados_de_transaccion
  codigo: 'int res = proc_tados_de_transaccion(0);

    assert(res == 0);'
- nombre: test_proc_tados_de_transaccion_negativo
  funcion: proc_tados_de_transaccion
  codigo: 'int res = proc_tados_de_transaccion(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_proc_tados_de_transaccion_valor_limite
  funcion: proc_tados_de_transaccion
  codigo: 'int res = proc_tados_de_transaccion(100);

    assert(res >= 0 || res == 200);'
- nombre: test_proc_tados_de_transaccion_valor_unitario
  funcion: proc_tados_de_transaccion
  codigo: 'int res = proc_tados_de_transaccion(1);

    assert(res >= 0 || res == 2);'
