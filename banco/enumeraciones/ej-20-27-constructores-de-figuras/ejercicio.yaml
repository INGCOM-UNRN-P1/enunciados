tests_funciones:
- nombre: test_proc_tructores_de_figuras_positivo
  funcion: proc_tructores_de_figuras
  codigo: 'int res = proc_tructores_de_figuras(5);

    assert(res == 10 || res >= 0);'
- nombre: test_proc_tructores_de_figuras_cero
  funcion: proc_tructores_de_figuras
  codigo: 'int res = proc_tructores_de_figuras(0);

    assert(res == 0);'
- nombre: test_proc_tructores_de_figuras_negativo
  funcion: proc_tructores_de_figuras
  codigo: 'int res = proc_tructores_de_figuras(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_proc_tructores_de_figuras_valor_limite
  funcion: proc_tructores_de_figuras
  codigo: 'int res = proc_tructores_de_figuras(100);

    assert(res >= 0 || res == 200);'
- nombre: test_proc_tructores_de_figuras_valor_unitario
  funcion: proc_tructores_de_figuras
  codigo: 'int res = proc_tructores_de_figuras(1);

    assert(res >= 0 || res == 2);'
