id: ej-20-25-menu-interactivo-completo
titulo: Menú interactivo completo
tema: enumeraciones
bloom: 2
minutos_estimados: 15
pistas: []
tags:
- enumeraciones
- menu
- bucle
- entrada-salida
- c11
verificado: true
funciones:
- nombre: ejecutar_menu
  retorno: int
  parametros: FILE *entrada, FILE *salida
  descripcion: Muestra el menú, procesa entradas hasta MENU_SALIR y retorna la cantidad de entradas procesadas
    (o -1 si un flujo es nulo).
tests_funciones:
- nombre: test_25_muestra_menu_repite_y_termina
  funcion: ejecutar_menu
  codigo: 'FILE *i=tmpfile(),*o=tmpfile(); char b[512]={0}; fputs("x\n9\n1\n5\n",i); rewind(i); assert(ejecutar_menu(i,o)==3);
    rewind(o); assert(fread(b,1,sizeof b-1,o)>0); assert(strcmp(b,"1. Nuevo\n2. Abrir\n3. Guardar\n4.
    Cerrar\n5. Salir\nOpcion: invalido\n1. Nuevo\n2. Abrir\n3. Guardar\n4. Cerrar\n5. Salir\nOpcion: invalido\n1.
    Nuevo\n2. Abrir\n3. Guardar\n4. Cerrar\n5. Salir\nOpcion: nuevo\n1. Nuevo\n2. Abrir\n3. Guardar\n4.
    Cerrar\n5. Salir\nOpcion: salir\n")==0); fclose(i); fclose(o);'
- nombre: test_25_salida_inmediata_muestra_menu
  funcion: ejecutar_menu
  codigo: 'FILE *i=tmpfile(),*o=tmpfile(); char b[256]={0}; fputs("5\n",i); rewind(i); assert(ejecutar_menu(i,o)==0);
    rewind(o); assert(fread(b,1,sizeof b-1,o)>0); assert(strstr(b,"1. Nuevo\n2. Abrir\n3. Guardar\n4.
    Cerrar\n5. Salir\nOpcion: salir\n")!=NULL); fclose(i); fclose(o);'
- nombre: test_25_rechaza_flujos_nulos
  funcion: ejecutar_menu
  codigo: assert(ejecutar_menu(NULL,NULL)==-1);
unidad: 2
modulo: Tipos Compuestos y Direccionamiento
subtema: mapeo_estados
dificultad: inicial
tipo: practica_guiada
prerrequisitos:
- tipos_datos
- condicionales
publicar: true
