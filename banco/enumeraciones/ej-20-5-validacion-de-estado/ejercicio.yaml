  codigo: if (!(estado_valido(ERROR_AUTH))) abort();
- nombre: test_estado_valido_3
  funcion: estado_valido
  codigo: if (!(!estado_valido(-1))) abort();
- nombre: test_estado_valido_4
  funcion: estado_valido
  codigo: if (!(!estado_valido(_ESTADO_MAX))) abort();
- nombre: test_estado_valido_5
  funcion: estado_valido
