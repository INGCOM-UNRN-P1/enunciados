tests_funciones:
- nombre: test_43_ciclo
  funcion: enum estado_semaforo
  codigo: assert(siguiente_estado(SEMAFORO_ROJO)==SEMAFORO_VERDE); assert(siguiente_estado(SEMAFORO_VERDE)==SEMAFORO_AMARILLO); assert(siguiente_estado(SEMAFORO_AMARILLO)==SEMAFORO_ROJO);
- nombre: test_43_paso
  funcion: bool
  codigo: semaforo_t s={SEMAFORO_VERDE,DIR_ESTE_OESTE,0}; assert(puede_pasar(&s,DIR_ESTE_OESTE)); assert(!puede_pasar(&s,DIR_NORTE_SUR));
    s.direccion_activa=DIR_TODAS; assert(!puede_pasar(&s,DIR_NORTE_SUR));
