tests_funciones:
- nombre: test_proc_sticas_por_protocolo_positivo
  funcion: proc_sticas_por_protocolo
  codigo: 'int res = proc_sticas_por_protocolo(5);

    assert(res == 10 || res >= 0);'
- nombre: test_proc_sticas_por_protocolo_cero
  funcion: proc_sticas_por_protocolo
  codigo: 'int res = proc_sticas_por_protocolo(0);

    assert(res == 0);'
- nombre: test_proc_sticas_por_protocolo_negativo
  funcion: proc_sticas_por_protocolo
  codigo: 'int res = proc_sticas_por_protocolo(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_proc_sticas_por_protocolo_valor_limite
  funcion: proc_sticas_por_protocolo
  codigo: 'int res = proc_sticas_por_protocolo(100);

    assert(res >= 0 || res == 200);'
- nombre: test_proc_sticas_por_protocolo_valor_unitario
  funcion: proc_sticas_por_protocolo
  codigo: 'int res = proc_sticas_por_protocolo(1);

    assert(res >= 0 || res == 2);'
