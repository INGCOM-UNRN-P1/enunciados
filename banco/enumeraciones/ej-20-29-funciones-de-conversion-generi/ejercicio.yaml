tests_funciones:
- nombre: test_proc_de_conversion_generi_positivo
  funcion: proc_de_conversion_generi
  codigo: 'int res = proc_de_conversion_generi(5);

    assert(res == 10 || res >= 0);'
- nombre: test_proc_de_conversion_generi_cero
  funcion: proc_de_conversion_generi
  codigo: 'int res = proc_de_conversion_generi(0);

    assert(res == 0);'
- nombre: test_proc_de_conversion_generi_negativo
  funcion: proc_de_conversion_generi
  codigo: 'int res = proc_de_conversion_generi(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_proc_de_conversion_generi_valor_limite
  funcion: proc_de_conversion_generi
  codigo: 'int res = proc_de_conversion_generi(100);

    assert(res >= 0 || res == 200);'
- nombre: test_proc_de_conversion_generi_valor_unitario
  funcion: proc_de_conversion_generi
  codigo: 'int res = proc_de_conversion_generi(1);

    assert(res >= 0 || res == 2);'
