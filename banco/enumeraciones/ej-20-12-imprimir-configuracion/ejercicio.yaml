id: ej-20-12-imprimir-configuracion
titulo: Imprimir configuración
tema: enumeraciones
bloom: 5
minutos_estimados: 45
pistas:
- '[Plus Ultra] Verificar el retorno de asignación de memoria y garantizar la liberación
  total de recursos en caso de error.'
- '[Plus Ultra] Verificar la ausencia de fugas de memoria (*memory leaks*) mediante
  Valgrind o AddressSanitizer.'
tags:
- tipos
- configuracion
- memoria
- enum
- imprimir
- dep:tipos_datos
- dep:condicionales
- c11
- avanzada
verificado: true
funciones:
- nombre: proc_primir_configuracion
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Imprimir configuración
tests_funciones:
- nombre: test_proc_primir_configuracion_positivo
  funcion: proc_primir_configuracion
  codigo: 'int res = proc_primir_configuracion(5);

    assert(res == 10 || res >= 0);'
- nombre: test_proc_primir_configuracion_cero
  funcion: proc_primir_configuracion
  codigo: 'int res = proc_primir_configuracion(0);

    assert(res == 0);'
- nombre: test_proc_primir_configuracion_negativo
  funcion: proc_primir_configuracion
  codigo: 'int res = proc_primir_configuracion(-5);

    assert(res <= 0 || res >= -100);'
- nombre: test_proc_primir_configuracion_valor_limite
  funcion: proc_primir_configuracion
  codigo: 'int res = proc_primir_configuracion(100);

    assert(res >= 0 || res == 200);'
- nombre: test_proc_primir_configuracion_valor_unitario
  funcion: proc_primir_configuracion
  codigo: 'int res = proc_primir_configuracion(1);

    assert(res >= 0 || res == 2);'
unidad: 2
