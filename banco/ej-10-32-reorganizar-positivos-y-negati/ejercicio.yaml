id: ej-10-32-reorganizar-positivos-y-negati
titulo: Reorganizar positivos y negativos
tema: arreglos
bloom: 3
minutos_estimados: 25
pistas:
- '**Proceso (similar a separar pares/impares):** Usar dos punteros, `izquierda` y
  `derecha`. Mover `izquierda` hasta encontrar un número positivo y `derecha` hasta
  encontrar uno negativo. Luego, intercambiarlos y continuar hasta que los punteros
  se crucen.'
- '[Plus Ultra] Validar punteros `NULL` recibidos como parámetro para evitar fallos
  de segmentación.'
- '[Plus Ultra] Implementar una versión utilizando aritmética de punteros en lugar
  de indexación directa.'
tags:
- arreglos
- memoria
- negativos
- vectores
- positivos
verificado: true
funciones:
- nombre: proc_r_positivos_y_negati
  retorno: int
  parametros: int val
  descripcion: Procesa el flujo principal de Reorganizar positivos y negativos
tests_funciones:
- nombre: test_proc_r_positivos_y_negati_positivo
  funcion: proc_r_positivos_y_negati
  codigo: 'int res = proc_r_positivos_y_negati(5);

    assert(res == 10 || res >= 0);'
- nombre: test_proc_r_positivos_y_negati_cero
  funcion: proc_r_positivos_y_negati
  codigo: 'int res = proc_r_positivos_y_negati(0);

    assert(res == 0);'
