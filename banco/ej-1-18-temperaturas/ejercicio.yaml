id: ej-1-18-temperaturas
titulo: Temperaturas
tema: secuencias
bloom: 3
minutos_estimados: 25
pistas:
- '**Entrada:** Solicitar al usuario el valor de la temperatura y la escala'
- '**Proceso:** Aplicar la fórmula de conversión correspondiente:'
- 'Celsius a Fahrenheit: $F = (C \times 9/5) + 32$'
- 'Fahrenheit a Celsius: $C = (F - 32) \times 5/9$'
- 'Celsius a Kelvin: $K = C + 273.15$'
- '**Precisión:** Al trabajar con divisiones como 9/5, es importante usar'
- '[Plus Ultra] Validar que la temperatura en Celsius no sea inferior al cero absoluto
  (-273.15 °C).'
- '[Plus Ultra] Presentar una tabla comparativa de temperaturas en pasos de 10 grados
  dentro de un rango.'
tags:
