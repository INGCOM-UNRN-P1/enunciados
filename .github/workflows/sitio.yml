# Sitio del banco: deckard genera desde banco/, guias/ y temas.yaml las páginas MyST,
# el TOC de myst.yml, un .ripkg por ejercicio y paquetes/catalogo.json; nada de eso se versiona.
name: Sitio

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo despliegue a la vez; no se cancela el que está en curso.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # deckard fijado a un commit publicado (nunca por nombre en PyPI).
  DECKARD: git+https://github.com/INGCOM-UNRN/deckard@5287b3f7aac1f67d11b6c6ea80c354de2db5bf80
  BASE_URL: /${{ github.event.repository.name }}

jobs:
  construir:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # El apunte (público): sus páginas, para los slugs exactos de los enlaces y el lint de trazabilidad.
      - uses: actions/checkout@v7
        with:
          repository: INGCOM-UNRN-P1/INGCOM-UNRN-P1.github.io
          path: .apunte

      - name: Instalar uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      # Ejercicios, temario, guías y trazabilidad con el apunte; falla si hay errores.
      - name: Lint del banco
        run: uvx --from "$DECKARD" deckard lint --apunte .apunte --max 100

      # Falla si hay ejercicios inválidos, un paquete no se puede armar o no pasa la verificación.
      - name: Páginas, TOC, paquetes .ripkg y catálogo
        run: uvx --from "$DECKARD" deckard export myst --apunte .apunte

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Instalar MyST
        run: npm install -g mystmd

      - name: Construir el HTML
        run: myst build --html

      # Los paquetes y el catálogo con URL estable (<sitio>/paquetes/catalogo.json),
      # además de las copias que MyST enlaza desde cada página.
      - name: Publicar paquetes y catálogo
        run: cp -r sitio/paquetes _build/html/paquetes

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

  desplegar:
    if: github.event_name != 'pull_request'
    needs: construir
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
